experiment_id: WP-PWD01
protocol_version: v0.4
status: PRE_SCORE_VALIDATION_ACTIVE
scored_runs_authorized: false

controlled_rf_profile:
  selected_profile: srslte-controlled-rf
  selected_profile_revision: a6da96560b6526dc6816761282722c996418fd8c
  rat: LTE
  selection_status: FROZEN_AFTER_G4_G5_NON_SCORED_QUALIFICATION
  binding_rule: verify live logical-to-physical bindings for every new experiment; never assume prior G4/G5 bindings
  rf_path_attenuation_ids: [1, 33, 2, 34]
  attenuation_rule: change all four IDs together
  rejected_profile:
    name: PowderTeam/srs-rf-matrix
    reason: current topology requires n310; WellPulse entitlement is 0 and unchanged resubmission is not viable
  superseded_feasibility_candidate:
    name: PowderProfiles/srsran-handover
    role: historical feasibility candidate only; not the frozen conducted-RF profile

randomization:
  paired_blocks: true
  seed: 26082401
  unit_of_analysis: run
  frozen_order_file: experiments/WP-PWD01/randomization-plan.csv
  rule: use the pre-generated B1/W1 order within each paired block; reserve pairs 4-5 execute only under the precision rule

matched_mqtt_transport:
  implementation: PahoQoS1Session
  package: paho-mqtt==2.1.0
  protocol: MQTTv311
  qos: 1
  tls_scored_path: true
  clean_session: false
  keepalive_s: 60
  reconnect_min_delay_s: 1
  reconnect_max_delay_s: 8
  max_queued_messages: 4096
  max_inflight_messages: 20
  application_level_persistence: false
  matching_rule: identical low-level session for B1 and W1; only W1 adds application-level disk durability/reconciliation

modes:
  B1_MQTT_QOS1:
    role: PRIMARY_COMPARATOR
    description: Frozen matched Paho MQTTv311 QoS1 session with automatic reconnect and bounded volatile queue; no application-level disk durability/reconciliation
  W1_OFFLINE_FIRST:
    role: TREATMENT
    description: Same frozen Paho session plus WellPulse durable SQLite queue, record identity/checksum, replay and idempotent reconciliation
  B0_PUBLISH_ONLY:
    role: LEGACY_SANITY_ONLY
    description: Historical non-durable lower-bound baseline; excluded from primary POWDER scored matrix
  B2_MQTT_DURABLE_CLIENT:
    role: CANDIDATE_SENSITIVITY_COMPARATOR
    status: PRE_SCORE_SEMANTICS_GATE_OPEN
    scope_if_qualified: compact S2/S3 sensitivity only; exact amendment must be frozen before scoring

rf_states:
  authority: experiments/WP-PWD01/RF_CALIBRATION_FREEZE_v1.md
  Q0:
    meaning: strong/stable
    numeric_setting_db: 0
    observed_radio_context: RSRP about -60 dBm; DL SNR about 40-45 dB; clean user-plane PASS
  Q1:
    meaning: degraded_but_continuously_connected_characterization_only
    numeric_setting_db: 40
    observed_radio_context: RSRP about -100 dBm; DL SNR about 18-19 dB; continuous user-plane delivery
  Q2:
    meaning: near_threshold_intermittent
    numeric_setting_db: 52
    observed_radio_context: clean isolated 20 s window produced 6 replies and 12 misses; clean Q0 recovery
  Q3:
    meaning: effective_application_data_outage
    numeric_setting_db: 55
    observed_radio_context: valid isolated approximately 20 s application-data outage with recovery after Q0 reset
  readiness_rule: every scientific/non-scored calibration or scored run begins at Q0 with explicit LTE user-plane PASS; attach/IP alone is insufficient
  further_attenuation_hunting_authorized: false

workload:
  telemetry_rate_hz: 1
  generation_must_not_block_on_puback: true
  generation_continues_during_recovery_horizon: true
  warmup_duration_s: 30
  pre_impairment_q0_s: 60
  impairment_window_s: 120
  recovery_horizon_s: TBD_AFTER_NON_SCORED_H_CALIBRATION
  recovery_horizon_rule: max(120s, ceil_to_30s(2*p95_W1_backlog_drain_calibration)); stop_and_investigate_if_over_300s
  h_calibration_plan: experiments/WP-PWD01/H_CALIBRATION_PLAN_v1.md

primary_cohort:
  cutoff: final_Q0_restoration_after_impairment
  s0_cutoff: pseudo_restoration_after_first_180s
  manifest_field: cohort_cutoff_utc
  horizon_field: horizon_end_utc
  inclusion: generated_ts_utc <= cohort_cutoff_utc
  observation: received_ts_utc <= horizon_end_utc
  post_cutoff_generation: retained_as_realistic_load_but_excluded_from_primary_denominator

scenarios:
  S0_HEALTHY:
    scored_schedule: "Q0 60s -> Q0 120s -> Q0 H"
    paired_blocks_min: 3
    paired_blocks_max: 3
    purpose: healthy integrity and overhead control
  S1_INTERMITTENT:
    scored_schedule: "Q0 60s -> [Q2 20s / Q0 20s] x3 -> Q0 H"
    paired_blocks_min: 3
    paired_blocks_max: 5
    purpose: repeated RF-caused near-threshold disruption and recovery
  S2_HARD_OUTAGE:
    scored_schedule: "Q0 60s -> Q3 120s -> Q0 H"
    paired_blocks_min: 3
    paired_blocks_max: 5
    purpose: deterministic RF-induced outage and recovery
  S3_OUTAGE_RESTART:
    scored_schedule: "Q0 60s -> Q3 120s -> Q0 H"
    restart_event: "gateway process restart 60s into Q3; not node reboot"
    paired_blocks_min: 3
    paired_blocks_max: 5
    purpose: volatile MQTT state versus durable application state under compound failure

precision_stopping_rule:
  applies_to: [S1_INTERMITTENT, S2_HARD_OUTAGE, S3_OUTAGE_RESTART]
  evaluate_after_valid_pairs: 3
  estimand: paired_run_level_unique_completeness_difference_W1_minus_B1
  interval: two_sided_95_percent_t_interval
  stop_if_ci_half_width_percentage_points_le: 2
  additional_pairs_if_not_precise: 2
  maximum_pairs: 5
  forbidden_basis_for_stopping: [effect_direction, p_value, favorable_result]

planned_conducted_scored_runs:
  minimum: 24
  maximum: 36

primary_endpoint:
  name: unique_primary_cohort_telemetry_completeness_at_H
  formula: unique_valid_primary_cohort_records_received_by_horizon_end_utc / primary_cohort_generated_records
  integrity_requirement: record_identity_and_checksum_match
  reference_implementation: wellpulse.powder_analysis.reconstruct_primary_endpoint

secondary_endpoints:
  - permanent_missing_rate
  - duplicate_attempt_and_final_duplicate_rate
  - checksum_mismatch_count
  - unexpected_record_attempt_count
  - out_of_order_rate
  - reconnect_time_s
  - first_successful_post_recovery_delivery_s
  - backlog_drain_time_s
  - reconciliation_completion_time_s
  - latency_p50_p95_p99_when_valid
  - cpu_utilization
  - rss_memory
  - durable_queue_occupancy_and_disk_bytes
  - network_bytes_packets_and_retransmission_indicators
  - radio_metrics_when_exposed

ota_replication:
  required_after_conducted_gate: true
  scenarios: [S1_INTERMITTENT, S2_HARD_OUTAGE]
  paired_blocks_per_scenario: 3
  scored_runs: 12
  do_not_repeat: S3_OUTAGE_RESTART
  rat_matching_preference: use same RAT as conducted layer when a scientifically adequate current OTA profile is executable

pre_score_gate_status:
  controlled_physical_rf_profile_and_numeric_states: PASS
  q0_user_plane_readiness_rule: PASS_FROZEN
  recovery_horizon_H: OPEN_ACTIVE_GATE
  remote_paho_runtime_reproduction: OPEN
  experimental_radio_path_verification_for_mqtt: OPEN
  record_identity_checksum_preservation: OPEN
  b1_w1_implementation_matching: OPEN
  evidence_capture_clock_alignment: OPEN
  deterministic_non_scored_analysis_reconstruction: OPEN
  b2_comparator_decision: OPEN
  automated_powder_ssh_private_key_path: KNOWN_BAD_REPAIR_OR_BYPASS_REQUIRED

freeze_requirements:
  - Use frozen srslte-controlled-rf profile revision and verify live bindings every experiment
  - Reproduce pinned Paho 2.1.0 transport settings in remote runtime manifest
  - Verify payload traverses experimental cellular data path rather than POWDER control network
  - Preserve frozen Q0-Q3 values and mandatory Q0 user-plane readiness gate
  - Freeze recovery horizon H and verify cohort_cutoff_utc/horizon_end_utc timing
  - Audit B1/W1 matching
  - Verify evidence capture and clock alignment
  - Verify analysis reconstructs primary endpoint from a non-scored pilot bundle
  - Close B2 durable-client decision/amendment
  - Repair or bypass known-bad automated POWDER SSH private-key path before scored automation is trusted
  - Set scored_runs_authorized true only after all gates close
