experiment_id: WP-PWD01
protocol_version: v0.6.1
status: PRE_GOLDEN_AUDIT_R1_RECONCILED
scored_runs_authorized: false

pre_score_amendments:
  consortium_review: docs/CONSORTIUM_PRE_WP3_REVIEW_2026-08-26.md
  p0_amendment: experiments/WP-PWD01/PRE_SCORE_P0_AMENDMENT_2026-08-26.md
  p0_status: IMPLEMENTED_LOCAL_PREFLIGHT_PASS_PHYSICAL_GATES_OPEN
  p1_amendment: experiments/WP-PWD01/PRE_SCORE_P1_AMENDMENT_2026-08-26.md
  p1_status: FROZEN_PRE_SCORE_PHYSICAL_AND_IMPLEMENTATION_GATES_OPEN
  recovery_semantics_amendment: experiments/WP-PWD01/RECOVERY_SEMANTICS_AMENDMENT_v1.md
  recovery_semantics_status: FROZEN_PROSPECTIVE_H_APP_300_FROM_T_SERVICE_READY

scientific_interpretation:
  primary_question: when_durable_application_record_semantics_add_value_beyond_correctly_configured_mqtt
  S0: healthy_path_integrity_equivalence_and_overhead_sanity
  S1: network_only_integrity_primary_recovery_overhead_secondary
  S2: network_only_integrity_primary_recovery_overhead_secondary_volatile_process_state_survives
  S3: primary_process_state_durability_integrity_stress
  cross_testbed_term: cross_testbed_consistency_or_triangulation
  prohibited_term_for_primary_cross_layer_claim: transportability
  workload_claim_boundary: low_rate_1_hz_telemetry

controlled_rf_profile:
  selected_profile: srslte-controlled-rf
  selected_profile_revision: a6da96560b6526dc6816761282722c996418fd8c
  rat: LTE
  selection_status: FROZEN_AFTER_G4_G5_NON_SCORED_QUALIFICATION
  binding_rule: verify live logical-to-physical bindings for every new experiment; never assume prior G4/G5 bindings
  rf_path_attenuation_ids: [1, 33, 2, 34]
  attenuation_rule: change all four IDs together
  rejected_profile:
    name: PowderTeam/srs-rf-matrix
    reason: current topology requires n310; WellPulse entitlement is 0 and unchanged resubmission is not viable
  superseded_feasibility_candidate:
    name: PowderProfiles/srsran-handover
    role: historical feasibility candidate only; not the frozen conducted-RF profile

randomization:
  paired_blocks: true
  seed: 26082401
  unit_of_analysis: run
  frozen_order_file: experiments/WP-PWD01/randomization-plan.csv
  p1_s0_amendment: S0_pair_2_counterbalanced_W1_then_B1_before_any_scored_data
  rule: use the pre-generated B1/W1 order within each paired block; reserve pairs 4-5 execute only under the precision rule
  b2_sensitivity_order_file: experiments/WP-PWD01/b2-sensitivity-plan.csv

matched_mqtt_transport:
  implementation: PahoQoS1Session
  package: paho-mqtt==2.1.0
  protocol: MQTTv311
  qos: 1
  tls_scored_path: true
  clean_session: false
  keepalive_s: 60
  reconnect_min_delay_s: 1
  reconnect_max_delay_s: 8
  max_queued_messages: 4096
  max_inflight_messages: 20
  application_level_persistence: false
  matching_rule: identical low-level session for B1 and W1; only W1 adds application-level disk durability/reconciliation
  accepted_message_instrumentation:
    total_publish_calls: recorded
    accepted_publish_calls: recorded_including_disconnected_qos1_submissions
    puback_callbacks: recorded
    accepted_but_unacknowledged_ids: recorded
    exact_internal_paho_queue_occupancy_claim: prohibited
  run_isolation:
    publisher_client_id: deterministic_run_unique
    receiver_client_id: deterministic_run_unique
    topic_namespace: deterministic_run_unique
    fresh_run_initial_session_present: false_required
    independent_run_client_identity_reuse: prohibited
    s3_intra_run_gateway_client_identity_reuse: required

modes:
  B1_MQTT_QOS1:
    role: PRIMARY_COMPARATOR
    description: Frozen matched Paho MQTTv311 QoS1 session with automatic reconnect and bounded volatile client state; no application-level disk durability/reconciliation and no process-durable client state
  W1_OFFLINE_FIRST:
    role: TREATMENT
    description: Same frozen Paho session plus WellPulse durable SQLite queue, record identity/checksum, replay and idempotent reconciliation
    identity_collision_rule: exact duplicate is idempotent; same record_id with different payload/checksum is a hard integrity error
  B0_PUBLISH_ONLY:
    role: LEGACY_SANITY_ONLY
    description: Historical non-durable lower-bound baseline; excluded from primary POWDER scored matrix
  B2_MQTT_DURABLE_CLIENT:
    role: SECONDARY_SENSITIVITY_COMPARATOR
    status: LOCAL_SEMANTICS_PASS_REMOTE_IMPLEMENTATION_OPEN
    semantics_plan: experiments/WP-PWD01/B2_SEMANTICS_GATE_v1.md
    semantics_evidence: evidence/local/wp2-b2-semantics-latest.md
    implementation: Eclipse_Paho_Java_1_2_5
    protocol: MQTTv311
    qos: 1
    clean_session: false
    file_persistence: MqttDefaultFilePersistence
    disconnected_buffer_enabled: true
    disconnected_buffer_size: 4096
    persist_disconnected_buffer: true
    delete_oldest_messages: false
    scope: exactly_3_S2_plus_3_S3_runs_only
    adaptive_replication: prohibited
    order_file: experiments/WP-PWD01/b2-sensitivity-plan.csv
    interpretation: non_primary_sensitivity_due_runtime_client_difference

rf_states:
  authority: experiments/WP-PWD01/RF_CALIBRATION_FREEZE_v1.md
  Q0:
    meaning: strong/stable
    numeric_setting_db: 0
    observed_radio_context: RSRP about -60 dBm; DL SNR about 40-45 dB; clean user-plane PASS
  Q1:
    meaning: degraded_but_continuously_connected_characterization_only
    numeric_setting_db: 40
    observed_radio_context: RSRP about -100 dBm; DL SNR about 18-19 dB; continuous user-plane delivery
  Q2:
    meaning: near_threshold_intermittent
    numeric_setting_db: 52
    observed_radio_context: clean isolated 20 s window produced 6 replies and 12 misses; clean Q0 recovery
  Q3:
    meaning: effective_application_data_outage
    numeric_setting_db: 55
    observed_radio_context: valid isolated approximately 20 s application-data outage with recovery after Q0 reset
  readiness_rule: every scientific/non-scored calibration or scored run begins at Q0 with explicit LTE user-plane PASS; attach/IP alone is insufficient
  further_attenuation_hunting_authorized: false

recovery_semantics:
  authority: experiments/WP-PWD01/RECOVERY_SEMANTICS_AMENDMENT_v1.md
  t_rf_restore: exact_physical_Q3_to_Q0_restoration_timestamp
  t_service_ready: first_architecture_blind_end_to_end_service_ready_timestamp_after_clean_ordered_LTE_restoration
  t_app_complete: first_timestamp_primary_cohort_application_recovery_is_complete_when_observed
  h_app_s: 300
  h_app_anchor: t_service_ready
  outcome_derived_h_calibration: prohibited
  w1_only_h_reestimation: prohibited
  scored_outcome_h_reestimation: prohibited
  s2_s3_clean_restore_order: stop_UE_then_EPC_then_eNB_then_fresh_UE_then_architecture_blind_probe
  service_ready_gate_bound_s: 120
  service_ready_gate_failure: technical_invalidity_fail_closed

workload:
  telemetry_rate_hz: 1
  claim_boundary: low_rate_telemetry_only
  generation_must_not_block_on_puback: true
  generation_continues_during_recovery_horizon: true
  warmup_duration_s: 30
  pre_impairment_q0_s: 60
  impairment_window_s: 120
  application_observation_horizon_s: 300
  application_observation_anchor: t_service_ready
  application_observation_rule: fixed_prospectively_before_Golden_and_scored_results
  historical_h_calibration_plan: experiments/WP-PWD01/H_CALIBRATION_PLAN_v1.md
  historical_h_calibration_status: SUPERSEDED_PROVENANCE_ONLY_DO_NOT_EXECUTE
  h_interpretation: common_operational_application_observation_window_not_effect_optimized
  h_same_for_all_arms_and_scenarios: required
  h_reestimation_after_scoring: prohibited

primary_cohort:
  cutoff_clock: t_rf_restore
  cutoff_definition: exact_final_physical_Q3_to_Q0_restoration_after_impairment
  s0_cutoff: prospectively_emitted_equivalent_t_rf_restore_marker_after_first_180s
  manifest_field: t_rf_restore_utc
  service_ready_field: t_service_ready_utc
  app_complete_field: t_app_complete_utc
  h_app_s_field: h_app_s
  horizon_end_formula: t_service_ready_utc_plus_300_seconds
  inclusion: generated_ts_utc <= t_rf_restore_utc
  observation: received_ts_utc <= t_service_ready_utc_plus_300_seconds
  post_cutoff_generation: retained_as_realistic_load_but_excluded_from_primary_denominator

scenarios:
  S0_HEALTHY:
    scored_schedule: "Q0 60s -> Q0 120s -> emit t_rf_restore/t_service_ready -> observe 300s"
    paired_blocks_min: 3
    paired_blocks_max: 3
    purpose: healthy integrity equivalence and overhead sanity
  S1_INTERMITTENT:
    scored_schedule: "Q0 60s -> [Q2 20s / Q0 20s] x3 -> emit final t_rf_restore -> service-ready gate -> observe 300s"
    paired_blocks_min: 3
    paired_blocks_max: 5
    purpose: repeated RF-caused near-threshold network-only integrity; recovery/overhead secondary
  S2_HARD_OUTAGE:
    scored_schedule: "Q0 60s -> Q3 120s -> t_rf_restore -> clean ordered LTE restore -> t_service_ready -> observe 300s"
    paired_blocks_min: 3
    paired_blocks_max: 5
    purpose: deterministic network-only RF outage integrity while volatile gateway process state survives; recovery/overhead secondary
    b2_sensitivity_runs: 3
  S3_OUTAGE_RESTART:
    scored_schedule: "Q0 60s -> Q3 120s -> t_rf_restore -> clean ordered LTE restore -> t_service_ready -> observe 300s"
    restart_event: "gateway process restart 60s into Q3; not node reboot"
    paired_blocks_min: 3
    paired_blocks_max: 5
    purpose: primary durability/integrity stress under destruction of volatile gateway client state
    b2_sensitivity_runs: 3
    restart_domain:
      telemetry_generator_outside_restart_domain: required
      generation_continues_at_1_hz: required
      gateway_client_process_only: required
      w1_durable_state_survives_restart: required
      b1_same_run_client_identity_reused_after_restart: required
      b2_same_run_client_identity_and_file_persistence_reused_after_restart: required
      source_sequence_continuity: required
      restart_timestamps_and_downtime: required
      node_reboot_or_power_cycle: prohibited

precision_stopping_rule:
  applies_to: [S1_INTERMITTENT, S2_HARD_OUTAGE, S3_OUTAGE_RESTART]
  evaluate_after_valid_pairs: 3
  estimand: paired_run_level_completeness_300_difference_W1_minus_B1
  interval: two_sided_95_percent_t_interval
  stop_if_ci_half_width_percentage_points_le: 2
  additional_pairs_if_not_precise: 2
  maximum_pairs: 5
  forbidden_basis_for_stopping: [effect_direction, p_value, favorable_result]
  p1_resolution: completeness_only_confirmatory_precision_rule_retained
  recovery_metrics_role: predeclared_secondary_engineering_characterization_not_separately_powered
  confirmatory_recovery_advantage_claim: prohibited

planned_conducted_scored_runs:
  primary_b1_w1_minimum: 24
  primary_b1_w1_maximum: 36
  b2_fixed_sensitivity: 6
  total_minimum_if_all_gates_authorized: 30
  total_maximum_if_all_gates_authorized: 42

primary_endpoint:
  name: completeness_300
  formula: unique_valid_primary_cohort_records_received_by_t_service_ready_plus_300s / primary_cohort_generated_records_at_t_rf_restore
  integrity_requirement: record_identity_and_checksum_match
  reference_implementation: wellpulse.powder_analysis.reconstruct_primary_endpoint
  prospective_horizon_s: 300
  horizon_anchor: t_service_ready

secondary_endpoints:
  - T_service_s
  - T_app_s
  - T_total_s
  - permanent_missing_rate
  - duplicate_attempt_and_final_duplicate_rate
  - checksum_mismatch_count
  - unexpected_record_attempt_count
  - out_of_order_rate
  - reconnect_time_s
  - first_successful_post_recovery_delivery_s
  - backlog_drain_time_s
  - reconciliation_completion_time_s
  - latency_p50_p95_p99_when_valid
  - cpu_utilization
  - rss_memory
  - durable_queue_occupancy_and_disk_bytes
  - network_bytes_packets_and_retransmission_indicators
  - radio_metrics_when_exposed

inter_run_washout_readiness:
  q0_end_to_end_user_plane_window: required
  experimental_tunnel_route: required
  run_unique_mqtt_namespace: required
  architecture_state_fresh_or_empty: required
  unresolved_prior_broker_session_residue: prohibited
  q0_radio_metrics_within_calibrated_envelope: required
  frozen_runtime_version_config_match: required
  clock_evidence_capture_healthy: required
  failure_classification: predefined_technical_invalidity_only

ota_replication:
  required_after_conducted_gate: true
  scenarios: [S1_INTERMITTENT, S2_HARD_OUTAGE]
  paired_blocks_per_scenario: 3
  scored_runs: 12
  do_not_repeat: S3_OUTAGE_RESTART
  rat_matching_preference: use same RAT as conducted layer when a scientifically adequate current OTA profile is executable
  cross_layer_statistical_pooling: prohibited
  interpretation_term: external_replication_for_OTA_only

pre_score_snapshot:
  required_before_scored_runs_authorized_true: true
  must_include:
    - protocol_and_all_pre_score_amendments
