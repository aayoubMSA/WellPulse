  controlled_physical_rf_profile_and_numeric_states: PASS
  q0_user_plane_readiness_rule: PASS_FROZEN
  recovery_semantics_amendment: PASS_FROZEN_H_APP_300
  historical_h_calibration: SUPERSEDED_CLOSED_DO_NOT_RERUN
  mqtt_run_session_isolation_implementation: PASS_LOCAL_PHYSICAL_VERIFICATION_OPEN
  remote_paho_runtime_reproduction: OPEN
  experimental_radio_path_verification_for_mqtt: OPEN
  record_identity_collision_fail_closed: PASS_LOCAL_IMPLEMENTED
  record_identity_checksum_preservation: OPEN_PHYSICAL
  b1_accepted_unacked_instrumentation: PASS_LOCAL_PHYSICAL_EVIDENCE_OPEN
  b1_w1_implementation_matching: OPEN
  s3_restart_domain_separation: OPEN_NON_SCORED_VERIFICATION_REQUIRED
  evidence_capture_clock_alignment: OPEN
  deterministic_non_scored_analysis_reconstruction: PASS_LOCAL_AMENDED_SEMANTICS
  b2_local_semantics: PASS_3_OF_3
  b2_comparator_decision: PASS_QUALIFIED_COMPACT_S2_S3_ONLY
  b2_remote_runtime_path_restart_implementation: OPEN_NON_SCORED_VERIFICATION_REQUIRED
  consortium_p1_analysis_claim_amendments: PASS_FROZEN
  inter_run_washout_readiness_rule: PASS_FROZEN_PHYSICAL_ENFORCEMENT_OPEN
  pre_score_reproducibility_snapshot: OPEN_BLOCKED_UNTIL_IMPLEMENTATION_AND_EVIDENCE_GATES_CLOSE
  automated_powder_ssh_private_key_path: KNOWN_BAD_REPAIR_OR_BYPASS_REQUIRED

freeze_requirements:
  - Use frozen srslte-controlled-rf profile revision and verify live bindings every experiment
  - Preserve frozen Q0-Q3 values and mandatory Q0 user-plane readiness gate
  - Preserve H1 as valid adverse non-scored evidence; do not rerun or relabel it
  - Use t_rf_restore for primary-cohort freeze and t_service_ready as the fixed H_app anchor
  - Use H_app=300 seconds for every arm and scenario; never derive or re-estimate it from W1, Golden, or scored outcomes
  - Preserve T_service, T_app, and T_total as separate recovery clocks
  - Use deterministic run-unique MQTT publisher/receiver client identities and topic namespaces
  - Require fresh-run initial session_present=false and preserve session evidence
  - Reproduce pinned Paho 2.1.0 B1/W1 transport settings in remote runtime manifest
  - Verify payload traverses experimental cellular data path rather than POWDER control network
  - Verify record identity/checksum preservation and fail-closed collision semantics
  - Audit B1/W1 matching with corrected B1 accepted/unacknowledged instrumentation semantics
  - Verify S3 restart-domain separation non-scored before scored authorization
  - Verify B2 Java 1.2.5 persistent-client runtime path and restart semantics non-scored on POWDER before B2 scoring
  - Enforce inter-run washout/readiness before every scored run
  - Verify evidence capture and clock alignment
  - Verify analysis reconstructs completeness_300 from a non-scored pilot bundle
  - Create immutable pre-score reproducibility snapshot before scored authorization
  - Repair or bypass known-bad automated POWDER SSH private-key path before scored automation is trusted
  - Set scored_runs_authorized true only after all gates close
