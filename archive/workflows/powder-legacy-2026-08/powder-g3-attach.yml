name: POWDER G3 Attach to Manual Experiment

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: "POWDER experiment UUID created manually from srsLTE-SIM:9"
        required: true
        type: string
      execute:
        description: "Type G3ATTACH to authorize test + fail-safe teardown"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: powder-g3-attach
  cancel-in-progress: false

jobs:
  g3_attach:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      EXPECTED_AUTOMATION_FP: SHA256:jQGQvU86rtuEchT50N1HuB4Cmizpvbmp0zSBR4rowxY
      EXPECTED_PROFILE_ID: 80dda605-7e5f-11e9-8006-e4434b2381fc
      EXPECTED_HARDWARE: d430
      EXPECTED_IMAGE_FRAGMENT: PowderProfiles:gnuradio-srslte

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate authorization and secrets
        shell: bash
        env:
          INPUT_EXECUTE: ${{ github.event.inputs.execute }}
          INPUT_EXPERIMENT_ID: ${{ github.event.inputs.experiment_id }}
        run: |
          set -euo pipefail
          [[ "$INPUT_EXECUTE" == "G3ATTACH" ]] || { echo "Not authorized: type G3ATTACH."; exit 2; }
          [[ "$INPUT_EXPERIMENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Invalid experiment UUID format."; exit 2; }
          [[ -n "$PORTAL_TOKEN" ]] || { echo "Missing POWDER_API_TOKEN."; exit 2; }
          [[ -n "$POWDER_USERNAME" ]] || { echo "Missing POWDER_USERNAME."; exit 2; }
          [[ -n "$POWDER_SSH_PRIVATE_KEY" ]] || { echo "Missing POWDER_SSH_PRIVATE_KEY."; exit 2; }
          mkdir -p /tmp/powder-g3-attach evidence/powder/g3
          printf '%s\n' "$INPUT_EXPERIMENT_ID" > /tmp/powder-g3-attach/experiment_id
          echo "Attach-only G3 authorized. This workflow will NOT create POWDER resources."

      - name: Install Portal API client and preflight SSH automation key
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.flux.utah.edu/emulab/portal-api.git /tmp/portal-api
          python -m pip install --quiet '/tmp/portal-api[cli]'

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$POWDER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          timeout 5 ssh-keygen -y -P "" -f "$HOME/.ssh/id_ed25519" > /tmp/powder-g3-attach/automation.pub
          ACTUAL_FP="$(ssh-keygen -lf /tmp/powder-g3-attach/automation.pub | awk '{print $2}')"
          echo "Automation key fingerprint: $ACTUAL_FP"
          [[ "$ACTUAL_FP" == "$EXPECTED_AUTOMATION_FP" ]] || {
            echo "Automation SSH secret fingerprint mismatch. No POWDER mutation performed."
            exit 3
          }
          echo "$ACTUAL_FP" > /tmp/powder-g3-attach/automation-fingerprint.txt

      - name: Verify manually created target reaches READY
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          EXPID="$(cat /tmp/powder-g3-attach/experiment_id)"
          READY=0
          for i in $(seq 1 60); do
            set +e
            portal-cli experiment get --experiment-id "$EXPID" > /tmp/powder-g3-attach/status.json 2>/tmp/powder-g3-attach/status.err
            RC=$?
            set -e
            if [[ "$RC" -ne 0 ]]; then
              echo "Status query $i failed; retrying."
              sleep 20
              continue
            fi
            STATUS="$(jq -r '.status // "unknown"' /tmp/powder-g3-attach/status.json)"
            echo "POWDER status: $STATUS"
            if [[ "$STATUS" == "ready" ]]; then READY=1; break; fi
            if [[ "$STATUS" =~ ^(failed|error|terminated|destroyed)$ ]]; then
              echo "Terminal state: $STATUS"
              exit 5
            fi
            sleep 20
          done
          [[ "$READY" -eq 1 ]] || { echo "Experiment did not reach READY within 20 minutes."; exit 6; }

      - name: Retrieve manifest and validate target identity
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          EXPID="$(cat /tmp/powder-g3-attach/experiment_id)"
          portal-cli experiment manifests get --experiment-id "$EXPID" > /tmp/powder-g3-attach/manifests.json

          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path

          obj = json.loads(Path('/tmp/powder-g3-attach/manifests.json').read_text())
          xmls=[]
          def walk(x):
              if isinstance(x, dict):
                  for v in x.values(): walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
              elif isinstance(x, str) and '<' in x and 'rspec' in x.lower():
                  xmls.append(x)
          walk(obj)

          nodes=[]
          logins=[]
          for text in xmls:
              try:
                  root=ET.fromstring(text)
              except Exception:
                  continue
              for el in root.iter():
                  if el.tag.rsplit('}',1)[-1] != 'node':
                      continue
                  n={'client_id':el.attrib.get('client_id',''), 'component_id':el.attrib.get('component_id','')}
                  for ch in el.iter():
                      tag=ch.tag.rsplit('}',1)[-1]
                      if tag == 'hardware_type' and not n.get('hardware_type'):
                          n['hardware_type']=ch.attrib.get('name','')
                      elif tag == 'disk_image' and not n.get('disk_image'):
                          n['disk_image']=ch.attrib.get('name','')
                      elif tag == 'login' and ch.attrib.get('hostname'):
                          logins.append({
                              'username':ch.attrib.get('username',''),
                              'hostname':ch.attrib['hostname'],
                              'port':ch.attrib.get('port','22')
                          })
                  nodes.append(n)

          uniq=[]; seen=set()
          for x in logins:
              k=(x['username'],x['hostname'],x['port'])
              if k not in seen:
                  seen.add(k); uniq.append(x)
          summary={'nodes':nodes,'logins':uniq}
          Path('/tmp/powder-g3-attach/manifest-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          if uniq:
              Path('/tmp/powder-g3-attach/login.tsv').write_text(f"{uniq[0]['username']}\t{uniq[0]['hostname']}\t{uniq[0]['port']}\n")
          PY

          [[ -s /tmp/powder-g3-attach/login.tsv ]] || { echo "No SSH endpoint in manifest."; exit 7; }

          PROFILE_ID="$(jq -r '.profile_id // empty' /tmp/powder-g3-attach/status.json)"
          EXP_NAME="$(jq -r '.name // .experiment_name // empty' /tmp/powder-g3-attach/status.json)"
          EXP_PROJECT="$(jq -r '.project // .project_name // empty' /tmp/powder-g3-attach/status.json)"
          HARDWARE="$(jq -r '.nodes[0].hardware_type // empty' /tmp/powder-g3-attach/manifest-summary.json)"
          IMAGE="$(jq -r '.nodes[0].disk_image // empty' /tmp/powder-g3-attach/manifest-summary.json)"

          echo "Portal profile ID: $PROFILE_ID"
          echo "Portal experiment name: ${EXP_NAME:-not_exposed}"
          echo "Portal project: ${EXP_PROJECT:-not_exposed}"
          echo "Manifest hardware: $HARDWARE"
          echo "Manifest image: $IMAGE"

          [[ "$PROFILE_ID" == "$EXPECTED_PROFILE_ID" ]] || { echo "Wrong profile ID; refusing test and teardown."; exit 8; }
          [[ "$HARDWARE" == "$EXPECTED_HARDWARE" ]] || { echo "Unexpected hardware; refusing test and teardown."; exit 8; }
          [[ "$IMAGE" == *"$EXPECTED_IMAGE_FRAGMENT"* ]] || { echo "Unexpected disk image; refusing test and teardown."; exit 8; }
          if [[ -n "$EXP_PROJECT" && "$EXP_PROJECT" != "WellPulse" ]]; then
            echo "Experiment is not in project WellPulse; refusing test and teardown."
            exit 8
          fi
          if [[ -n "$EXP_NAME" && "$EXP_NAME" != WP-G3-SIMSTACK* ]]; then
            echo "Experiment name does not match WP-G3-SIMSTACK*; refusing test and teardown."
            exit 8
          fi

          printf '%s\n' "$EXP_NAME" > /tmp/powder-g3-attach/name
          touch /tmp/powder-g3-attach/target_validated
          echo "TARGET_VALIDATED=1"

      - name: Execute official srsLTE simulated send/receive example
        id: sim
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\t' read -r MANIFEST_USER HOST PORT < /tmp/powder-g3-attach/login.tsv
          USERNAME="${MANIFEST_USER:-$POWDER_USERNAME}"
          printf '%s\n' "$USERNAME" > /tmp/powder-g3-attach/ssh-user
          printf '%s\n' "$HOST" > /tmp/powder-g3-attach/ssh-host
          printf '%s\n' "$PORT" > /tmp/powder-g3-attach/ssh-port

          SSHOPTS=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -i "$HOME/.ssh/id_ed25519"
            -p "$PORT"
          )
          SCP_OPTS=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -i "$HOME/.ssh/id_ed25519"
            -P "$PORT"
          )

          SSH_READY=0
          for i in $(seq 1 18); do
            if ssh "${SSHOPTS[@]}" "$USERNAME@$HOST" 'hostname; whoami' > /tmp/powder-g3-attach/ssh-preflight.txt 2>/tmp/powder-g3-attach/ssh-preflight.err; then
              SSH_READY=1; break
            fi
            echo "SSH not ready yet ($i/18); retrying."
            sleep 10
          done
          [[ "$SSH_READY" -eq 1 ]] || { echo "SSH never became ready."; exit 9; }

          scp "${SCP_OPTS[@]}" powder/g3_simstack_remote.sh "$USERNAME@$HOST:/tmp/wellpulse_g3_simstack.sh"
          ssh "${SSHOPTS[@]}" "$USERNAME@$HOST" "chmod 700 /tmp/wellpulse_g3_simstack.sh && /tmp/wellpulse_g3_simstack.sh '$GITHUB_RUN_ID'" \
            > /tmp/powder-g3-attach/remote-run.out 2>/tmp/powder-g3-attach/remote-run.err
          scp -r "${SCP_OPTS[@]}" "$USERNAME@$HOST:/tmp/wellpulse-g3-$GITHUB_RUN_ID" /tmp/powder-g3-attach/

          RUNDIR="/tmp/powder-g3-attach/wellpulse-g3-$GITHUB_RUN_ID"
          [[ -f "$RUNDIR/result.env" ]] || { echo "Missing remote result.env."; exit 10; }
          # shellcheck disable=SC1090
          source "$RUNDIR/result.env"
          echo "TX_RC=$TX_RC RX_RC=$RX_RC IQ_BYTES=$IQ_BYTES PROCESS_GATE=$PROCESS_GATE"
          [[ "$PROCESS_GATE" == "PASS" && "$TX_RC" -eq 0 && "$RX_RC" -eq 0 && "$IQ_BYTES" -gt 0 ]] || exit 11

      - name: Build sanitized evidence before cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="evidence/powder/g3-simstack-latest.md"
          RUNDEST="evidence/powder/g3/${GITHUB_RUN_ID}"
          mkdir -p "$RUNDEST"

          EXPID="$(cat /tmp/powder-g3-attach/experiment_id 2>/dev/null || true)"
          EXPNAME="$(cat /tmp/powder-g3-attach/name 2>/dev/null || true)"
          STATUS="$(jq -r '.status // "unknown"' /tmp/powder-g3-attach/status.json 2>/dev/null || echo unknown)"
          PROFILE_ID="$(jq -r '.profile_id // "not_captured"' /tmp/powder-g3-attach/status.json 2>/dev/null || echo not_captured)"
          HOST="$(cat /tmp/powder-g3-attach/ssh-host 2>/dev/null || true)"
          PORT="$(cat /tmp/powder-g3-attach/ssh-port 2>/dev/null || true)"
          AUTOF="$(cat /tmp/powder-g3-attach/automation-fingerprint.txt 2>/dev/null || true)"
          RUNDIR="/tmp/powder-g3-attach/wellpulse-g3-$GITHUB_RUN_ID"

          TX_RC="not_run"; RX_RC="not_run"; IQ_BYTES="0"; IQ_SHA256=""; PROCESS_GATE="FAIL"
          if [[ -f "$RUNDIR/result.env" ]]; then
            # shellcheck disable=SC1090
            source "$RUNDIR/result.env"
            cp "$RUNDIR/result.env" "$RUNDEST/result.env"
            cp "$RUNDIR/remote-meta.txt" "$RUNDEST/remote-meta.txt"
            sed -E 's/\x1B\[[0-9;]*[mK]//g' "$RUNDIR/tx.log" > "$RUNDEST/tx.log" || true
            sed -E 's/\x1B\[[0-9;]*[mK]//g' "$RUNDIR/rx.log" > "$RUNDEST/rx.log" || true
          fi
          [[ -f /tmp/powder-g3-attach/manifest-summary.json ]] && cp /tmp/powder-g3-attach/manifest-summary.json "$RUNDEST/manifest-summary.json" || true
          [[ -f /tmp/powder-g3-attach/ssh-preflight.txt ]] && cp /tmp/powder-g3-attach/ssh-preflight.txt "$RUNDEST/ssh-preflight.txt" || true

          {
            echo "# POWDER G3 simulated-stack validation — latest"
            echo
            echo "- Checked UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- GitHub run ID: \`$GITHUB_RUN_ID\`"
            echo "- GitHub SHA: \`$GITHUB_SHA\`"
            echo "- Orchestration mode: **MANUAL_CREATE_PLUS_AUTOMATED_ATTACH**"
            echo "- Evidence class: **INFRASTRUCTURE_ONLY_NON_SCORED**"
            echo "- Experiment name: \`$EXPNAME\`"
            echo "- Experiment ID: \`$EXPID\`"
            echo "- Profile ID: \`$PROFILE_ID\`"
            echo "- SSH endpoint: \`$HOST:$PORT\`"
            echo "- Automation public-key fingerprint: \`$AUTOF\`"
            echo "- Transmitter exit code: \`$TX_RC\`"
            echo "- Receiver exit code: \`$RX_RC\`"
            echo "- Generated simulated waveform bytes: \`$IQ_BYTES\`"
            echo "- Generated simulated waveform SHA-256: \`$IQ_SHA256\`"
            echo "- Process gate: **$PROCESS_GATE**"
            echo "- SDR/RF used: **NO**"
            echo "- WellPulse/MQTT scientific workload used: **NO**"
            echo
            echo "## Evidence boundary"
            echo
            echo "This run validates only the profile-authoritative file-based pdsch_enodeb -> waveform file -> pdsch_ue simulated path on the manually provisioned POWDER experiment. It is not RF evidence and is not a scored WP-PWD01 run."
          } > "$OUT"

      - name: Fail-safe terminate validated manual experiment
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -f /tmp/powder-g3-attach/target_validated ]]; then
            echo "cleanup=NOT_ATTEMPTED_TARGET_NOT_VALIDATED" > /tmp/powder-g3-attach/cleanup.env
            echo "Target was not validated; refusing automated termination."
            exit 0
          fi

          EXPID="$(cat /tmp/powder-g3-attach/experiment_id)"
          set +e
          portal-cli experiment terminate --experiment-id "$EXPID" > /tmp/powder-g3-attach/terminate.out 2>/tmp/powder-g3-attach/terminate.err
          TERMRC=$?
          set -e
          echo "Termination request rc=$TERMRC"

          CLEAN=0
          for i in $(seq 1 30); do
            set +e
            portal-cli experiment get --experiment-id "$EXPID" > /tmp/powder-g3-attach/postterm.json 2>/tmp/powder-g3-attach/postterm.err
            GETRC=$?
            set -e
            if [[ "$GETRC" -ne 0 ]]; then CLEAN=1; break; fi
            ST="$(jq -r '.status // "unknown"' /tmp/powder-g3-attach/postterm.json)"
            echo "Post-terminate status: $ST"
            if [[ "$ST" =~ ^(terminated|destroyed)$ ]]; then CLEAN=1; break; fi
            sleep 10
          done
          if [[ "$CLEAN" -eq 1 ]]; then
            echo "cleanup=PASS" > /tmp/powder-g3-attach/cleanup.env
          else
            echo "cleanup=FAIL" > /tmp/powder-g3-attach/cleanup.env
            echo "CRITICAL: validated G3 experiment may still hold resources."
            exit 20
          fi

      - name: Append cleanup state and commit sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="evidence/powder/g3-simstack-latest.md"
          CLEANUP="UNKNOWN"
          if [[ -f /tmp/powder-g3-attach/cleanup.env ]]; then
            # shellcheck disable=SC1090
            source /tmp/powder-g3-attach/cleanup.env
            CLEANUP="$cleanup"
          fi
          [[ -f "$OUT" ]] || echo "# POWDER G3 simulated-stack validation — latest" > "$OUT"
          echo "- Cleanup gate: **$CLEANUP**" >> "$OUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/powder/g3-simstack-latest.md evidence/powder/g3/
          if ! git diff --cached --quiet; then
            git commit -m "Record POWDER G3 attach evidence"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Final G3 verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CLEANUP="UNKNOWN"
          [[ -f /tmp/powder-g3-attach/cleanup.env ]] && source /tmp/powder-g3-attach/cleanup.env && CLEANUP="$cleanup" || true
          PROCESS="FAIL"
          RUNDIR="/tmp/powder-g3-attach/wellpulse-g3-$GITHUB_RUN_ID"
          [[ -f "$RUNDIR/result.env" ]] && source "$RUNDIR/result.env" && PROCESS="$PROCESS_GATE" || true
          echo "G3 process gate: $PROCESS"
          echo "G3 cleanup gate: $CLEANUP"
          [[ "$PROCESS" == "PASS" && "$CLEANUP" == "PASS" ]] || exit 30
          echo "G3_SIMSTACK_PASS"
