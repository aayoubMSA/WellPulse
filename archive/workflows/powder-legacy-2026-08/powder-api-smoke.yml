name: POWDER API Smoke

on:
  push:
    paths:
      - ".powder-api-smoke-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: powder-api-smoke
  cancel-in-progress: false

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Portal API
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PORTAL_TOKEN" ]] || exit 2
          rm -rf /tmp/portal-api
          git clone --depth 1 https://gitlab.flux.utah.edu/emulab/portal-api.git /tmp/portal-api
          python -m pip install --quiet '/tmp/portal-api[cli]'
      - name: Search generic NUC5300 pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/powder /tmp/wp-res-search
          cat > /tmp/wp-res-search/body.json <<'JSON'
          {
            "project": "WellPulse",
            "nodetypes": {
              "nodetypes": [
                {"nodetype": "nuc5300", "count": 2, "urn": "urn:publicid:IDN+emulab.net+authority+cm"}
              ]
            }
          }
          JSON
          set +e
          portal-cli resgroup search_raw --duration 3 --body @/tmp/wp-res-search/body.json > /tmp/wp-res-search/search3.json 2>/tmp/wp-res-search/search3.err
          RC3=$?
          portal-cli resgroup search_raw --duration 2 --body @/tmp/wp-res-search/body.json > /tmp/wp-res-search/search2.json 2>/tmp/wp-res-search/search2.err
          RC2=$?
          portal-cli resgroup search_raw --duration 1 --body @/tmp/wp-res-search/body.json > /tmp/wp-res-search/search1.json 2>/tmp/wp-res-search/search1.err
          RC1=$?
          set -e
          python - "$RC3" "$RC2" "$RC1" <<'PY'
          import json, os, re, sys, datetime
          from pathlib import Path
          rcs=list(map(int,sys.argv[1:4]))
          def readj(p):
              try:return json.loads(Path(p).read_text())
              except:return None
          def err(p):
              t=Path(p).read_text(errors='replace') if Path(p).exists() else ''
              return re.sub(r'(?i)(token|authorization|bearer)\s*[:=]\s*\S+',r'\1=REDACTED',t)[-1000:]
          now=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          with Path('evidence/powder/api-smoke.md').open('w',encoding='utf-8') as f:
              f.write('# POWDER generic NUC5300 early-window search\n\n')
              f.write(f'- Checked UTC: {now}\n')
              f.write(f'- WellPulse SHA: {os.environ.get("GITHUB_SHA","unknown")}\n')
              f.write('- Request: `nuc5300 x2`, Emulab, project `WellPulse`\n')
              f.write('- Resource mutation attempted: **NONE**\n')
              f.write('- Existing 19:00–22:00 fallback reservation modified: **NO**\n')
              for hours,rc in zip((3,2,1),rcs):
                  f.write(f'\n## {hours}-hour result\n\n')
                  f.write(f'- Exit: `{rc}`\n\n```json\n{json.dumps(readj(f"/tmp/wp-res-search/search{hours}.json"),indent=2,sort_keys=True)}\n```\n')
                  if rc: f.write(f'\n```text\n{err(f"/tmp/wp-res-search/search{hours}.err")}\n```\n')
              f.write('\n- Token content recorded: **NO**\n')
          PY
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/powder/api-smoke.md
          git commit -m "Record generic NUC5300 early-window search" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
