name: FIT clean stale WellPulse experiments

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.fit-clean-stale-wp-trigger'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIT_IDENTIFIER: ${{ secrets.FIT_USERNAME }}
      FIT_PASSWORD: ${{ secrets.FIT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stop only verified stale WellPulse-owned experiments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check iotlabcli
          python - <<'PY'
          import base64,os
          from pathlib import Path
          from iotlabcli.rest import Api
          ident=os.environ['FIT_IDENTIFIER']; password=os.environ['FIT_PASSWORD']; p=Api(ident,password).method('user'); login=p.get('login')
          if login!='aayoub': raise SystemExit('Unexpected FIT login; refusing cleanup')
          q=Path.home()/'.iotlabrc'; q.write_text(login+':'+base64.b64encode(password.encode()).decode()); q.chmod(0o600)
          PY
          mkdir -p fit-cleanup
          iotlab-status --experiments-running > fit-cleanup/before.json
          python - <<'PY'
          import json,subprocess
          d=json.load(open('fit-cleanup/before.json'))
          allowed={448260:'WP-RT01-dry-',448262:'WP-RT01-prefinal-v2-'}
          found={}
          for x in d.get('items',[]):
              eid=x.get('id'); name=x.get('name',''); user=x.get('user','')
              if eid in allowed:
                  if user!='aayoub' or not name.startswith(allowed[eid]):
                      raise SystemExit('Refusing to stop %s: ownership/name mismatch'%eid)
                  found[eid]=name
          for eid in allowed:
              if eid in found:
                  subprocess.check_call(['iotlab-experiment','stop','-i',str(eid)])
                  print('stopped %s %s'%(eid,found[eid]))
              else:
                  print('already_not_running %s'%eid)
          PY
          sleep 2
          iotlab-status --experiments-running > fit-cleanup/after.json
          cat fit-cleanup/after.json
      - name: Cleanup auth
        if: always()
        run: rm -f "$HOME/.iotlabrc"
      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wellpulse-fit-cleanup-${{ github.run_id }}
          path: fit-cleanup/
          retention-days: 7
