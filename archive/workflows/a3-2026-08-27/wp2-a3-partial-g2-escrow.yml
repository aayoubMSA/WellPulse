name: WP2 A3 Partial G2 Evidence Escrow

on:
  push:
    branches: [main]
    paths:
      - 'powder/wp2-a3-partial-g2-escrow.trigger'

permissions:
  contents: read

jobs:
  escrow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
    steps:
      - name: Prepare SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh" /tmp/a3escrow
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path.home().joinpath('.ssh/id_powder').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_powder"
          cat >/tmp/a3escrow/askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/a3escrow/askpass
          export SSH_ASKPASS=/tmp/a3escrow/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          setsid -w ssh-add "$HOME/.ssh/id_powder" </dev/null >/dev/null

      - name: Escrow partial G2 evidence to project storage and Drive
        shell: bash
        run: |
          set -euo pipefail
          ssh -A -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new aayoub@nuc2.emulab.net 'bash -s' <<'REMOTE'
          set -euo pipefail
          RUN_ID='wp2-golden-a3-gh-33065615626-20260827T110427Z'
          EXP_ID='357f3275-403d-491a-906f-99677bdf454f'
          SRC="$HOME/wellpulse-powder-evidence/golden/$RUN_ID"
          DST="/proj/WellPulse/evidence-escrow/$EXP_ID/${RUN_ID}-partial-g2"
          REMOTE_DIR="gdrive:$EXP_ID/${RUN_ID}-partial-g2"

          test -d "$SRC"
          test -d /proj/WellPulse && test -w /proj/WellPulse
          export PATH="$HOME/.local/bin:$PATH"
          command -v rclone >/dev/null
          rclone lsf gdrive: >/dev/null

          if find "$SRC" -type f -printf '%P\n' | grep -Eiq '(^|/)([^/]*(private|secret|credential)[^/]*|[^/]*\.key)$'; then
            echo 'PARTIAL_ESCROW=FAIL_SENSITIVE_FILENAME'
            exit 31
          fi

          TMP_DST="${DST}.tmp.$$"
          rm -rf "$TMP_DST"
          mkdir -p "$TMP_DST"
          rsync -a "$SRC/" "$TMP_DST/"
          cat > "$TMP_DST/PARTIAL_FAIL_CLOSED_METADATA.txt" <<EOF
          run_id=$RUN_ID
          experiment_id=$EXP_ID
          scored_run=NO
          failure_gate=G2_Q0_TLS
          q0_icmp=5_of_5_zero_loss
          rf_golden_transition_executed=NO
          automatic_termination=PROHIBITED
          captured_utc=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          source=$SRC
          EOF
          find "$TMP_DST" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$TMP_DST/SHA256SUMS.txt"
          rm -rf "$DST"
          mv "$TMP_DST" "$DST"

          rclone copy "$DST" "$REMOTE_DIR" --checksum
          rclone check "$DST" "$REMOTE_DIR" --one-way --checksum
          test -s "$DST/SHA256SUMS.txt"
          echo 'PARTIAL_FAIL_CLOSED_ESCROW=PASS'
          echo "PERSISTENT_DIR=$DST"
          echo "DRIVE_DIR=$REMOTE_DIR"
          REMOTE
