name: WP2 A3 Core Readonly Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'powder/wp2-a3-core-readonly-diag.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}

    steps:
      - name: Prepare SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh" /tmp/a3diag
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path.home().joinpath('.ssh/id_powder').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_powder"
          cat >/tmp/a3diag/askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/a3diag/askpass
          export SSH_ASKPASS=/tmp/a3diag/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          setsid -w ssh-add "$HOME/.ssh/id_powder" </dev/null >/dev/null
          echo 'DIAG_SSH_READY=PASS'

      - name: Test nested manifest-host SSH from A3 UE
        shell: bash
        run: |
          set +e
          ssh -A -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new aayoub@nuc2.emulab.net 'bash -s' <<'REMOTE'
          set +e
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          echo "SOURCE_HOST=$(hostname)"
          for target in nuc1.emulab.net nuc2.emulab.net; do
            echo "--- TARGET=$target ---"
            getent hosts "$target" || true
            ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "aayoub@$target" 'printf "NESTED_SSH_HOST=%s\n" "$(hostname)"; true'
            echo "NESTED_SSH_RC=$?"
          done
          echo 'A3_MANIFEST_HOST_TOPOLOGY_DIAG=COMPLETE'
          REMOTE
          echo "OUTER_SSH_RC=$?"
          echo 'POWDER_MUTATION_EXECUTED=NO'
          echo 'GOLDEN_EXECUTED=NO'
          exit 0
