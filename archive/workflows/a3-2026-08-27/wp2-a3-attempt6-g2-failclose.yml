name: WP2 A3 Attempt6 G2 Targeted Failclose

on:
  push:
    branches: [main]
    paths:
      - 'powder/wp2-a3-attempt6-g2-failclose.trigger'

permissions:
  contents: read

jobs:
  failclose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
    steps:
      - name: Prepare SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh" /tmp/a3abort
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path.home().joinpath('.ssh/id_powder').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_powder"
          cat >/tmp/a3abort/askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/a3abort/askpass
          export SSH_ASKPASS=/tmp/a3abort/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          setsid -w ssh-add "$HOME/.ssh/id_powder" </dev/null >/dev/null

      - name: Fail-close only the hung G2 receiver launch
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID='wp2-golden-a3-gh-33067316888-20260827T112727Z'
          ssh -A -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new aayoub@nuc2.emulab.net "RUN_ID='$RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          # Refuse to intervene if G3 sender has started; this workflow is valid only for the observed G2 hang.
          if pgrep -af 'wp_pwd01_golden_sender.py' | grep -F -- "--run-id $RUN_ID" >/dev/null; then
            echo 'ABORT_REFUSED=G3_SENDER_ALREADY_PRESENT' >&2
            exit 41
          fi
          mapfile -t PIDS < <(ps -eo pid=,comm=,args= | awk -v r="$RUN_ID" '$2=="ssh" && index($0,"wp_pwd01_h_receiver.py") && index($0,r){print $1}')
          [[ "${#PIDS[@]}" -eq 1 ]] || { echo "ABORT_REFUSED=EXPECTED_ONE_HUNG_SSH_FOUND_${#PIDS[@]}" >&2; exit 42; }
          kill -TERM "${PIDS[0]}"
          for _ in $(seq 1 20); do kill -0 "${PIDS[0]}" 2>/dev/null || break; sleep 0.25; done
          ! kill -0 "${PIDS[0]}" 2>/dev/null || { echo 'ABORT_REFUSED=SSH_DID_NOT_EXIT' >&2; exit 43; }
          echo "G2_HUNG_SSH_TERMINATED_PID=${PIDS[0]}"
          echo 'RF_ATTENUATION_CHANGED=NO'
          echo 'G3_SENDER_STARTED=NO'
          REMOTE

          # Give the orchestrator a moment to take its existing fail(G2) path, then remove only
          # the current-run receiver/wrapper if they survived the SSH channel closure.
          sleep 3
          ssh -A -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new aayoub@nuc1.emulab.net "RUN_ID='$RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/wellpulse-powder-evidence/golden/${RUN_ID}-core/receiver"
          if [[ -s "$ROOT/receiver.pid" ]]; then
            pid=$(cat "$ROOT/receiver.pid")
            args=$(ps -o args= -p "$pid" 2>/dev/null || true)
            if [[ "$args" == *"wp_pwd01_h_receiver.py"* && "$args" == *"--run-id $RUN_ID"* ]]; then
              kill -TERM "$pid" 2>/dev/null || true
              sleep 1
              kill -KILL "$pid" 2>/dev/null || true
              echo "CURRENT_RUN_RECEIVER_CLEANED_PID=$pid"
            fi
          fi
          while read -r pid; do
            [[ -n "$pid" ]] || continue
            args=$(ps -o args= -p "$pid" 2>/dev/null || true)
            if [[ "$args" == *"$RUN_ID"* && "$args" == *"wp_pwd01_h_receiver.py"* ]]; then
              kill -TERM "$pid" 2>/dev/null || true
              sleep 0.2
              kill -KILL "$pid" 2>/dev/null || true
              echo "CURRENT_RUN_WRAPPER_CLEANED_PID=$pid"
            fi
          done < <(ps -eo pid=,comm=,args= | awk -v r="$RUN_ID" '$2=="bash" && index($0,"bash -c") && index($0,"wp_pwd01_h_receiver.py") && index($0,r){print $1}')
          echo 'ATTEMPT6_G2_FAILCLOSE_CLEANUP=PASS'
          echo 'RF_ATTENUATION_CHANGED=NO'
          REMOTE
