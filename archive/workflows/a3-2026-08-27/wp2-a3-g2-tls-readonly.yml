name: WP2 A3 G2 TLS Readonly Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'powder/wp2-a3-g2-tls-readonly.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
    steps:
      - name: Prepare SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh" /tmp/a3tls
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path.home().joinpath('.ssh/id_powder').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_powder"
          cat >/tmp/a3tls/askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/a3tls/askpass
          export SSH_ASKPASS=/tmp/a3tls/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          setsid -w ssh-add "$HOME/.ssh/id_powder" </dev/null >/dev/null

      - name: Inspect G2 TLS compatibility without mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh -A -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new aayoub@nuc1.emulab.net 'bash -s' <<'REMOTE'
          set +e
          W=/tmp/wellpulse-wp2-golden-broker
          PID=$(cat "$W/mosquitto.pid" 2>/dev/null || true)
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          echo "HOST=$(hostname)"
          echo "OPENSSL=$(openssl version -a 2>&1 | head -1)"
          echo '--- BROKER PROCESS / LINKAGE ---'
          ps -o user=,group=,pid=,ppid=,etime=,args= -p "$PID" 2>/dev/null || true
          ldd "$(command -v mosquitto)" 2>/dev/null | grep -E 'ssl|crypto' || true
          echo '--- CERT / KEY CONSISTENCY ---'
          openssl verify -CAfile "$W/ca.crt" "$W/server.crt" 2>&1 || true
          CERT_MOD=$(openssl x509 -noout -modulus -in "$W/server.crt" 2>/dev/null | sha256sum | awk '{print $1}')
          KEY_MOD=$(openssl rsa -noout -modulus -in "$W/server.key" 2>/dev/null | sha256sum | awk '{print $1}')
          echo "CERT_KEY_MODULUS_MATCH=$([[ "$CERT_MOD" == "$KEY_MOD" ]] && echo YES || echo NO)"
          echo '--- TLS PROTOCOL PROBES ---'
          probe(){
            local name="$1"; shift
            echo "=== PROBE=$name ==="
            timeout 6 openssl s_client -connect 127.0.0.1:8883 -CAfile "$W/ca.crt" -verify_return_error -verify_ip 172.16.0.1 "$@" </dev/null 2>&1 \
              | grep -E '^(CONNECTED|Protocol *:|Cipher *:|New,|Verification:|Verify return code:|no peer certificate|SSL handshake|write:|read:|[0-9A-F]+:error:)' \
              | head -30
            echo "PROBE_RC=${PIPESTATUS[0]}"
          }
          probe DEFAULT
          probe TLS12 -tls1_2
          probe TLS12_SEC0 -tls1_2 -cipher 'DEFAULT@SECLEVEL=0'
          probe TLS11 -tls1_1 -cipher 'DEFAULT@SECLEVEL=0'
          probe TLS10 -tls1 -cipher 'DEFAULT@SECLEVEL=0'
          echo '--- MOSQUITTO LOG TAIL AFTER PROBES ---'
          tail -n 80 "$W/mosquitto.log" 2>/dev/null || true
          echo 'POWDER_MUTATION_EXECUTED=NO'
          REMOTE
