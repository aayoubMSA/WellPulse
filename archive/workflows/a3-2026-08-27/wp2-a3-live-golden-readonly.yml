name: WP2 A3 Live Golden Readonly Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'powder/wp2-a3-live-golden-readonly.trigger'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
    steps:
      - name: Prepare SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh" /tmp/a3live
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path.home().joinpath('.ssh/id_powder').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_powder"
          cat >/tmp/a3live/askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/a3live/askpass
          export SSH_ASKPASS=/tmp/a3live/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          setsid -w ssh-add "$HOME/.ssh/id_powder" </dev/null >/dev/null

      - name: Snapshot A3 live state without mutation
        shell: bash
        run: |
          set -euo pipefail
          for host in nuc1.emulab.net nuc2.emulab.net; do
            echo "=== HOST=$host ==="
            ssh -A -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "aayoub@$host" 'bash -s' <<'REMOTE'
          set +e
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          echo "NODE=$(hostname)"
          echo '--- RELEVANT PROCESSES ---'
          ps -eo pid,ppid,etime,args | grep -E 'srsepc|srsenb|srsue|mosquitto|wp_pwd01|wp2_golden|reconstruct_wp2|rclone' | grep -v grep || true
          echo '--- TMUX ---'
          tmux ls 2>&1 || true
          echo '--- RECENT GOLDEN DIRS ---'
          ROOT="$HOME/wellpulse-powder-evidence/golden"
          find "$ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %TY-%Tm-%TdT%TH:%TM:%TSZ %p\n' 2>/dev/null | sort -nr | head -5 || true
          LATEST=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
          if [[ -n "$LATEST" && -d "$LATEST" ]]; then
            echo "LATEST_RUN_DIR=$LATEST"
            echo '--- LATEST FILE INVENTORY ---'
            find "$LATEST" -maxdepth 2 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %P %s bytes\n' 2>/dev/null \
              | grep -Eiv '(^|/)[^/]*(private|secret|credential)[^/]*|(^|/)[^/]*\.key$' \
              | sort | tail -120 || true
            echo '--- SAFE STATUS CONTENT ---'
            find "$LATEST" -maxdepth 2 -type f \( -name '*.txt' -o -name '*.json' -o -name '*.log' \) -size -200k -print0 2>/dev/null \
              | while IFS= read -r -d '' f; do
                  b=$(basename "$f")
                  echo "$b" | grep -Eiq 'private|secret|credential|\.key$' && continue
                  case "$b" in
                    *status*|*summary*|*ready*|*restore*|*runner*|*receiver*|*sender*|*manifest*|*metadata*|*probe*|*q0*|*q3*|*escrow*|*reconstruct*)
                      echo "### FILE=${f#$LATEST/}"
                      tail -n 80 "$f" 2>/dev/null || true
                      ;;
                  esac
                done
          fi
          echo '--- PROJECT ESCROW RECENT ---'
          find /proj/WellPulse/evidence-escrow -maxdepth 4 -type f -mmin -30 -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %p %s bytes\n' 2>/dev/null \
            | grep -Eiv 'private|secret|credential|\.key$' | sort | tail -80 || true
          echo 'POWDER_MUTATION_EXECUTED=NO'
          REMOTE
          done
