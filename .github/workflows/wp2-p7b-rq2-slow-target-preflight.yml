name: WP2 P7B-RQ2 Slow Target Preflight

on:
  push:
    paths:
      - '.wp2-p7b-rq2-slow-target-preflight-trigger'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      TARGET_EXPID: f6de95cb-a13a-421e-bd0e-766dfc1d3fb3
      TARGET_NAME: wp7brq2609012
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Freeze preflight-only authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-rq2-slow-target-preflight-trigger)" = $'AUTHORITY=P7B_RQ2_SLOW_TARGET_PREFLIGHT_ONLY\nEXPERIMENT_ID=f6de95cb-a13a-421e-bd0e-766dfc1d3fb3\nEXPERIMENT_NAME=wp7brq2609012\nINTER_NODE_GAP_SECONDS=15\nFINAL_QUIET_SECONDS=60\nSSH=YES_READ_ONLY_EXCEPT_TMP_STAGE\nRF=NO\nCELLS=NO\nRESTART=NO\nTEARDOWN=NO\nSCORED=NO'
          ! grep -Eq 'experiment[[:space:]]+(create|terminate)|tmcc|attenuator|bin/start.sh|wp2_p7b_c_node|mosquitto[[:space:]]+-c' .github/workflows/wp2-p7b-rq2-slow-target-preflight.yml
          echo 'RQ2_SLOW_PREFLIGHT_AUTHORITY=PASS'

      - name: Independent slow target-native preflight
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-rq2-preflight
          rm -rf "$TMP"; mkdir -p "$TMP"
          fail(){ echo "RQ2_SLOW_PREFLIGHT=BLOCKED:$1" >&2; exit "${2:-90}"; }

          bash scripts/wp2_portal_client_bootstrap.sh "$TMP/portal-api" | tee "$TMP/portal-pin.txt"
          grep -q '^PORTAL_API_PIN_GATE=PASS$' "$TMP/portal-pin.txt" || fail PORTAL_PIN
          sleep 15
          portal-cli experiment get --experiment-id "$TARGET_EXPID" > "$TMP/experiment.json" || fail PORTAL_GET
          python3 scripts/wp2_portal_record_guard.py --json "$TMP/experiment.json" --expected-experiment-id "$TARGET_EXPID" | tee "$TMP/portal-gate.txt"
          grep -q '^PORTAL_RECORD_GATE=PASS$' "$TMP/portal-gate.txt" || fail PORTAL_RECORD
          python3 -c 'import json,os; x=json.load(open("/tmp/wp2-rq2-preflight/experiment.json")); assert x.get("id")==os.environ["TARGET_EXPID"]; assert x.get("name")==os.environ["TARGET_NAME"]; assert x.get("project")=="WellPulse"; assert str(x.get("status","")).lower()=="ready"'
          sleep 15
          portal-cli experiment manifests get --experiment-id "$TARGET_EXPID" > "$TMP/manifest.json" || fail MANIFEST
          python3 -c 'import json,xml.etree.ElementTree as ET; obj=json.load(open("/tmp/wp2-rq2-preflight/manifest.json")); xmls=[]; w=lambda x: [w(v) for v in x.values()] if isinstance(x,dict) else [w(v) for v in x] if isinstance(x,list) else xmls.append(x) if isinstance(x,str) and "<node" in x else None; w(obj); out={}; [(lambda root: [(lambda n: out.setdefault(n.attrib.get("client_id",""), next(({"username":c.attrib.get("username","aayoub"),"hostname":c.attrib["hostname"],"port":int(c.attrib.get("port","22"))} for c in n.iter() if c.tag.rsplit("}",1)[-1]=="login" and c.attrib.get("hostname")),None)))(n) for n in root.iter() if n.tag.rsplit("}",1)[-1]=="node" and n.attrib.get("client_id") in {"enb1","rue1"}]) (ET.fromstring(t)) for t in xmls]; assert out.get("enb1") and out.get("rue1"); json.dump(out,open("/tmp/wp2-rq2-preflight/nodes.json","w"))'

          umask 077
          python3 -c 'import os,pathlib; raw=os.environ["POWDER_SSH_PRIVATE_KEY"].replace("\r\n","\n").replace("\r","\n").lstrip("\ufeff").strip()+"\n"; pathlib.Path("/tmp/wp2-rq2-preflight/private.key").write_text(raw,encoding="utf-8",newline="\n")'
          chmod 600 "$TMP/private.key"
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$POWDER_SSH_KEY_PASSPHRASE"\n' > "$TMP/askpass"
          chmod 700 "$TMP/askpass"
          export SSH_ASKPASS="$TMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$TMP/private.key" </dev/null >/dev/null || fail SSH_KEY_LOAD
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"; : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          SSH=(-o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          get_login(){ python3 -c 'import json,sys; x=json.load(open("/tmp/wp2-rq2-preflight/nodes.json"))[sys.argv[1]]; print("%s\t%s\t%s"%(x.get("username","aayoub"),x["hostname"],x.get("port",22)))' "$1"; }
          IFS=$'\t' read -r CORE_USER CORE_HOST CORE_PORT < <(get_login enb1)
          IFS=$'\t' read -r UE_USER UE_HOST UE_PORT < <(get_login rue1)

          echo 'PACED_PREFLIGHT=CORE'
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" 'set -eu; echo HOST=$(hostname); . /etc/os-release; echo OS="$NAME $VERSION_ID"; echo SYS_PY=$(python3 -V 2>&1); test "$(python3 -c "import sys; print(\"%d.%d\"%sys.version_info[:2])")" = 3.6; test -x "$HOME/.wp2-golden-venv/bin/python"; test "$("$HOME/.wp2-golden-venv/bin/python" -c "import sys; print(\"%d.%d.%d\"%sys.version_info[:3])")" = 3.11.13; test "$("$HOME/.wp2-golden-venv/bin/python" -c "import importlib.metadata as m; print(m.version(\"paho-mqtt\"))")" = 2.1.0; command -v mosquitto >/dev/null; ! command -v jq >/dev/null; command -v tar >/dev/null; command -v sha256sum >/dev/null; command -v rsync >/dev/null; test -w /proj/WellPulse; echo CORE_TARGET_PREFLIGHT=PASS' | tee "$TMP/core-preflight.txt" || fail CORE

          sleep 15
          echo 'PACED_PREFLIGHT=UE'
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" 'set -eu; echo HOST=$(hostname); . /etc/os-release; echo OS="$NAME $VERSION_ID"; echo SYS_PY=$(python3 -V 2>&1); test "$(python3 -c "import sys; print(\"%d.%d\"%sys.version_info[:2])")" = 3.6; test -x "$HOME/.wp2-golden-venv/bin/python"; test "$("$HOME/.wp2-golden-venv/bin/python" -c "import sys; print(\"%d.%d.%d\"%sys.version_info[:3])")" = 3.11.13; test "$("$HOME/.wp2-golden-venv/bin/python" -c "import importlib.metadata as m; print(m.version(\"paho-mqtt\"))")" = 2.1.0; java -version >/tmp/wp2-java-version.txt 2>&1; grep -q "11\.0\.19" /tmp/wp2-java-version.txt; ! command -v jq >/dev/null; command -v mosquitto_pub >/dev/null; command -v tar >/dev/null; command -v sha256sum >/dev/null; command -v rsync >/dev/null; test -w /proj/WellPulse; J="$HOME/WellPulse/experiments/WP-PWD01/lib/org.eclipse.paho.client.mqttv3-1.2.5.jar"; if test -f "$J"; then test "$(sha256sum "$J" | awk "{print \$1}")" = 59914287adac506a28d5e8172eed262a22605f3df4d426b9d92f41dae2448185; fi; echo UE_TARGET_PREFLIGHT=PASS' | tee "$TMP/ue-preflight.txt" || fail UE

          echo 'PACED_CONTROL=final-quiet:60s'
          sleep 60
          portal-cli experiment get --experiment-id "$TARGET_EXPID" > "$TMP/final.json" || fail FINAL_GET
          python3 -c 'import json; x=json.load(open("/tmp/wp2-rq2-preflight/final.json")); assert str(x.get("status","")).lower()=="ready"'
          printf 'RQ2_SLOW_TARGET_PREFLIGHT=PASS\nRF_AUTHORIZED=NO\nCELLS_AUTHORIZED=NO\nRESTART_AUTHORIZED=NO\nTEARDOWN_AUTHORIZED=NO\n' | tee "$TMP/verdict.txt"

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp2-p7b-rq2-slow-target-preflight-${{ github.run_id }}
          path: |
            /tmp/wp2-rq2-preflight/core-preflight.txt
            /tmp/wp2-rq2-preflight/ue-preflight.txt
            /tmp/wp2-rq2-preflight/portal-gate.txt
            /tmp/wp2-rq2-preflight/verdict.txt
          if-no-files-found: error
          retention-days: 90
