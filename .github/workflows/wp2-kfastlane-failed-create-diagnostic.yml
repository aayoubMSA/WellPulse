name: WP2 K-Fastlane Failed Reservation Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.wp2-kfastlane-failed-create-diagnostic-trigger'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      EXPERIMENT_ID: 02bc305d-5d84-48f9-b518-dbebd1728ee6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read exact failed experiment record only
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/wp2_portal_client_bootstrap.sh /tmp/portal-api >/tmp/portal-pin.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/portal-pin.txt
          set +e
          portal-cli experiment get --experiment-id "$EXPERIMENT_ID" >/tmp/get.json 2>/tmp/get.err
          GET_RC=$?
          portal-cli experiment list >/tmp/list.json 2>/tmp/list.err
          LIST_RC=$?
          set -e
          echo "GET_RC=$GET_RC"
          echo "LIST_RC=$LIST_RC"
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          exp='02bc305d-5d84-48f9-b518-dbebd1728ee6'
          deny=re.compile(r'(?i)(token|secret|credential|password|private|key)')
          def clean(x):
              if isinstance(x,dict): return {k:('[REDACTED]' if deny.search(str(k)) else clean(v)) for k,v in x.items()}
              if isinstance(x,list): return [clean(v) for v in x]
              return x
          for label,path in [('GET','/tmp/get.json'),('LIST','/tmp/list.json')]:
              p=Path(path)
              if not p.exists() or not p.stat().st_size: continue
              try: obj=json.loads(p.read_text())
              except Exception: continue
              if label=='LIST':
                  def find(x):
                      if isinstance(x,dict):
                          if x.get('id')==exp: return x
                          for v in x.values():
                              r=find(v)
                              if r is not None:return r
                      elif isinstance(x,list):
                          for v in x:
                              r=find(v)
                              if r is not None:return r
                      return None
                  obj=find(obj)
              if obj is not None:
                  print(f'{label}_EXPERIMENT_RECORD=' + json.dumps(clean(obj),sort_keys=True,separators=(',',':')))
          PY
          if [[ "$GET_RC" -ne 0 ]]; then echo "GET_ERROR=$(tail -n 3 /tmp/get.err | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"; fi
          echo 'POWDER_RESOURCE_MUTATION=NO'
          echo 'NEW_RESERVATION_CREATED=NO'
