name: FIT MQTT frontend certificate diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.fit-mqtt-frontend-diag-trigger'

permissions:
  contents: read

jobs:
  frontend-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIT_IDENTIFIER: ${{ secrets.FIT_USERNAME }}
      FIT_PASSWORD: ${{ secrets.FIT_PASSWORD }}
      RUN_DIR: fit-mqtt-frontend-diag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve FIT login and register ephemeral SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR" "$HOME/.ssh"
          python -m pip install --disable-pip-version-check iotlabcli
          python - <<'PY'
          import base64, os, re
          from pathlib import Path
          from iotlabcli.rest import Api
          ident=os.environ['FIT_IDENTIFIER']
          password=os.environ['FIT_PASSWORD']
          profile=Api(ident,password).method('user')
          login=profile.get('login') if isinstance(profile,dict) else None
          if not login or not re.fullmatch(r'[a-z][0-9a-z]{3,19}',login):
              raise SystemExit('No valid FIT login')
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              fh.write(f'FIT_LOGIN={login}\n')
          p=Path.home()/'.iotlabrc'
          p.write_text(login+':'+base64.b64encode(password.encode()).decode())
          p.chmod(0o600)
          PY
          chmod 700 "$HOME/.ssh"
          ssh-keygen -t rsa -b 3072 -N '' -f "$HOME/.ssh/id_rsa" -C "WellPulse-FIT-frontend-diag-${GITHUB_RUN_ID}" >/dev/null
          chmod 600 "$HOME/.ssh/id_rsa"
          chmod 644 "$HOME/.ssh/id_rsa.pub"
          iotlab-auth --add-ssh-key > "$RUN_DIR/add_ssh_key.log"

      - name: Inspect official CA and broker chain on FIT frontend
        shell: bash
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          FRONTEND="${FIT_LOGIN}@saclay.iot-lab.info"
          ssh "${SSH[@]}" "$FRONTEND" 'set -eu; echo "=== openssl ==="; openssl version -a; echo "=== mosquitto ==="; mosquitto_pub -h 2>&1 | head -n 4 || true; echo "=== CA certificates ==="; awk '\''/BEGIN CERTIFICATE/{n++} END{print "pem_cert_count=" n}'\'' /opt/iot-lab-ca.pem; csplit -s -f /tmp/wpca- -b "%02d.pem" /opt/iot-lab-ca.pem "/-----BEGIN CERTIFICATE-----/" "{*}" || true; for f in /tmp/wpca-*.pem; do grep -q "BEGIN CERTIFICATE" "$f" || continue; echo "--- $f ---"; openssl x509 -in "$f" -noout -subject -issuer -serial -dates -fingerprint -sha256 || true; done; rm -f /tmp/wpca-*.pem; echo "=== broker showcerts ==="; echo | openssl s_client -showcerts -connect mqtt4.iot-lab.info:8883 -servername mqtt4.iot-lab.info -CAfile /opt/iot-lab-ca.pem 2>&1; echo "=== frontend mqtt auth smoke ==="; mkdir -p ~/.config; umask 077; printf "%s\n%s\n" "-u '${FIT_LOGIN}'" "-P '${FIT_PASSWORD}'" > ~/.config/mosquitto_pub; cp ~/.config/mosquitto_pub ~/.config/mosquitto_sub; topic="iotlab/'${FIT_LOGIN}'/wellpulse/frontend-diag/'${GITHUB_RUN_ID}'"; payload="WP_FRONTEND_DIAG_'${GITHUB_RUN_ID}'"; rm -f /tmp/wp_frontend_msg; mosquitto_sub --cafile /opt/iot-lab-ca.pem -h mqtt4.iot-lab.info -p 8883 -C 1 -W 10 -t "$topic" > /tmp/wp_frontend_msg & pid=$!; sleep 2; mosquitto_pub --cafile /opt/iot-lab-ca.pem -h mqtt4.iot-lab.info -p 8883 -t "$topic" -m "$payload"; wait "$pid"; grep -Fx "$payload" /tmp/wp_frontend_msg; echo mqtt_frontend_authenticated=PASS; rm -f /tmp/wp_frontend_msg ~/.config/mosquitto_pub ~/.config/mosquitto_sub' 2>&1 | tee "$RUN_DIR/frontend_diag.log"

      - name: Cleanup ephemeral SSH key
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$HOME/.iotlabrc" ] && [ -f "$HOME/.ssh/id_rsa.pub" ]; then
            python - <<'PY'
          from pathlib import Path
          from iotlabcli import auth
          from iotlabcli.rest import Api
          keyfile=Path.home()/'.ssh'/'id_rsa.pub'
          if keyfile.exists():
              key=keyfile.read_text().strip()
              user,password=auth._read_password_file()
              if user and password:
                  api=Api(user,password)
                  obj=api.get_ssh_keys()
                  if key in obj.get('sshkeys',[]):
                      obj['sshkeys']=[k for k in obj['sshkeys'] if k != key]
                      api.set_ssh_keys(obj)
          PY
          fi
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/id_rsa.pub" "$HOME/.iotlabrc"

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wellpulse-fit-mqtt-frontend-diag-${{ github.run_id }}
          path: fit-mqtt-frontend-diag/
          retention-days: 30
