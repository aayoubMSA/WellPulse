name: WP2 P6 — Final Same-Run Evidence Escrow

on:
  push:
    branches: [main]
    paths:
      - '.wp2-p6-final-escrow-trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: wp2-p6-final-same-run-escrow
  cancel-in-progress: false

jobs:
  final-escrow:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      EXPID: 5579cf25-dbb1-4d04-87e3-ff558e3be2af
      RUN_ID: wp2-p6r-33099648133-20260827T174149Z
      UE_HOST: nuc2.emulab.net

    steps:
      - name: Checkout current evidence tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install controller dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync jq >/dev/null

      - name: Freeze evidence-only terminal contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(awk -F= '$1=="finalize" {print $2}' .wp2-p6-final-escrow-trigger | tail -1)" == WP2_P6_SAME_RUN_ESCROW_ONLY ]]
          [[ "$(awk -F= '$1=="run_id" {print $2}' .wp2-p6-final-escrow-trigger | tail -1)" == "$RUN_ID" ]]
          bash -n scripts/wp2_golden_evidence_escrow.sh
          bash -n scripts/wp2_controller_pull_persistent_escrow.sh
          bash -n scripts/wp2_controller_verify_artifact_roundtrip.sh
          echo 'SCIENTIFIC_RERUN=NO'
          echo 'RAW_EDIT=NO'
          echo 'RF_MUTATION=NO'
          echo 'SECOND_RESERVATION=NO'
          echo 'TEARDOWN_AUTHORIZED=NO'

      - name: Persist reconstructed immutable evidence and pull controller bundle
        id: persist
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-p6-final-escrow
          rm -rf "$TMP"; mkdir -p "$TMP" "$HOME/.ssh"
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path('/tmp/wp2-p6-final-escrow/private.key').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$TMP/private.key"
          cat > "$TMP/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$TMP/askpass"
          export SSH_ASKPASS="$TMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          setsid -w ssh-keygen -y -f "$TMP/private.key" > "$TMP/public.key" </dev/null
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$TMP/private.key" </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          USER="${POWDER_USERNAME:-aayoub}"; [[ -n "$USER" ]] || USER=aayoub
          SSH=(-A -o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${SSH[@]}" "$USER@$UE_HOST" true

          # Reconstructed output is already present from v3; prove exact run and
          # endpoint before persistence. Do not regenerate or edit raw evidence.
          ssh "${SSH[@]}" "$USER@$UE_HOST" "set -eu
            ROOT=\"\$HOME/wellpulse-powder-evidence/golden/$RUN_ID\"
            test -s \"\$ROOT/analysis/golden_reconstruction.json\"
            grep -q '\"reconstruction_gate\": \"PASS\"' \"\$ROOT/analysis/golden_reconstruction.json\"
            grep -q '\"primary_cohort_count\": 181' \"\$ROOT/analysis/golden_reconstruction.json\"
            grep -q '\"received_valid_by_horizon\": 181' \"\$ROOT/analysis/golden_reconstruction.json\"
            grep -q '\"completeness_300\": 1.0' \"\$ROOT/analysis/golden_reconstruction.json\"
            test -s \"\$ROOT/analysis/reconstruction_provenance.txt\"
            echo P6_FINAL_RECONSTRUCTION_GATE=PASS"

          # Supply current evidence plumbing as tools only; frozen node checkout
          # and raw measurement remain untouched.
          scp "${SSH[@]}" scripts/wp2_golden_evidence_escrow.sh experiments/WP-PWD01/evidence_inventory_golden_v1.txt "$USER@$UE_HOST:/tmp/" >/dev/null
          ssh "${SSH[@]}" "$USER@$UE_HOST" "set -eu
            ROOT=\"\$HOME/wellpulse-powder-evidence/golden/$RUN_ID\"
            WP_EVIDENCE_SRC=\"\$ROOT\" WP_RUN_ID='$RUN_ID' WP_EXPERIMENT_ID='$EXPID' WP_PERSIST_ROOT='/proj/WellPulse/evidence-escrow' WP_EVIDENCE_INVENTORY='/tmp/evidence_inventory_golden_v1.txt' bash /tmp/wp2_golden_evidence_escrow.sh
            test -s '/proj/WellPulse/evidence-escrow/$EXPID/$RUN_ID/escrow/PERSISTENT_ESCROW_GATE.PASS'
            test -s '/proj/WellPulse/evidence-escrow/$EXPID/$RUN_ID/escrow/CONTROLLER_OFFPOWDER_REQUIRED'
            echo P6_FINAL_PERSISTENT_ESCROW=PASS" | tee "$TMP/persistent.txt"
          grep -q '^P6_FINAL_PERSISTENT_ESCROW=PASS$' "$TMP/persistent.txt"

          PDIR="/proj/WellPulse/evidence-escrow/$EXPID/$RUN_ID"
          BUNDLE="$TMP/wp2-p6-final-$RUN_ID.tar"
          WP_PERSIST_HOST="$UE_HOST" WP_REMOTE_USER="$USER" WP_SSH_PORT=22 WP_PERSIST_REMOTE_DIR="$PDIR" \
          WP_CONTROLLER_LOCAL_DIR="$TMP/controller" WP_CONTROLLER_BUNDLE_OUT="$BUNDLE" WP_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts" \
            bash scripts/wp2_controller_pull_persistent_escrow.sh | tee "$TMP/controller-pull.txt"
          grep -q '^CONTROLLER_PULL_GATE=PASS$' "$TMP/controller-pull.txt"
          SHA="$(awk -F= '$1=="CONTROLLER_BUNDLE_SHA256" {print $2}' "$TMP/controller-pull.txt" | tail -1)"
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]; test -s "$BUNDLE"
          echo "bundle_path=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo 'P6_FINAL_CONTROLLER_PULL=PASS'

      - name: Upload final evidence bundle
        id: upload
        if: steps.persist.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp2-p6-final-${{ github.run_id }}
          path: ${{ steps.persist.outputs.bundle_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Independent final artifact read-back
        id: download
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wp2-p6-final-${{ github.run_id }}
          path: /tmp/wp2-p6-final-roundtrip

      - name: Verify final hashes then terminate exact experiment
        id: finalize
        if: steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.persist.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          ROUNDTRIP="$(find /tmp/wp2-p6-final-roundtrip -maxdepth 2 -type f -name '*.tar' | head -1)"
          test -s "$ROUNDTRIP"
          WP_ROUNDTRIP_TAR="$ROUNDTRIP" WP_EXPECTED_BUNDLE_SHA256="$EXPECTED_SHA" WP_VERIFY_DIR=/tmp/wp2-p6-final-verified \
            bash scripts/wp2_controller_verify_artifact_roundtrip.sh | tee /tmp/wp2-p6-final-verify.txt
          grep -q '^CONTROLLER_OFFPOWDER_GATE=PASS$' /tmp/wp2-p6-final-verify.txt
          grep -q '^EVIDENCE_ESCROW_GATE=PASS$' /tmp/wp2-p6-final-verify.txt
          grep -q '^TEARDOWN_AUTHORIZED=YES$' /tmp/wp2-p6-final-verify.txt
          echo P6_VERIFIED_ENDPOINT_BEGIN
          cat /tmp/wp2-p6-final-verified/analysis/golden_reconstruction.json
          echo P6_VERIFIED_ENDPOINT_END
          cat /tmp/wp2-p6-final-verified/analysis/reconstruction_provenance.txt

          bash scripts/wp2_portal_client_bootstrap.sh /tmp/portal-api-p6-terminal >/tmp/wp2-p6-final-portal-pin.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/wp2-p6-final-portal-pin.txt
          portal-cli experiment terminate --experiment-id "$EXPID" >/tmp/wp2-p6-final-terminate.json 2>/tmp/wp2-p6-final-terminate.err || true
          TERMINATED=0
          for i in $(seq 1 60); do
            set +e; portal-cli experiment get --experiment-id "$EXPID" >/tmp/wp2-p6-final-postterm.json 2>/dev/null; rc=$?; set -e
            if [[ "$rc" -ne 0 ]]; then TERMINATED=1; break; fi
            st="$(jq -r '.status // "unknown"' /tmp/wp2-p6-final-postterm.json)"
            echo "P6_TERMINATION_POLL_${i}=$st"
            if [[ "$st" =~ ^(terminated|destroyed)$ ]]; then TERMINATED=1; break; fi
            sleep 5
          done
          [[ "$TERMINATED" -eq 1 ]]
          echo 'P6_FINAL_ESCROW=PASS'
          echo 'EVIDENCE_ESCROW_GATE=PASS'
          echo 'TEARDOWN_AUTHORIZED=YES'
          echo 'TEARDOWN_CONFIRMED=YES'

      - name: Final fail-closed P6 verdict
        if: always()
        shell: bash
        env:
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -euo pipefail
          echo "PERSIST_OUTCOME=$PERSIST_OUTCOME"
          echo "FINALIZE_OUTCOME=$FINALIZE_OUTCOME"
          if [[ "$FINALIZE_OUTCOME" != success ]]; then
            echo 'WP2_P6_FINAL_ESCROW=FAIL_CLOSED'
            echo 'SCIENTIFIC_RERUN=NO'
            echo 'SCORED_RUN_AUTHORIZED=NO'
            exit 1
          fi
          echo 'WP2_P6_FINAL_ESCROW=PASS'
          echo 'SCIENTIFIC_RERUN=NO'
          echo 'SCORED_RUN_AUTHORIZED=NO'
