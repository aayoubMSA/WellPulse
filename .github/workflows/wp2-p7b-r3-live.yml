name: WP2 P7B-R3 One Replacement Requalification

on:
  push:
    branches: [main]
    paths:
      - '.wp2-p7b-r3-live-trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: wp2-p7b-r3-live-once
  cancel-in-progress: false

jobs:
  requalify:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}

    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: P7B-R3 live authority and premutation gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-r3-live-trigger)" = $'execute=WP2_P7B_R3_LIVE_ONCE\nauthority_id=P7B-RQ1\nreservation_limit=1\nautomatic_retry=NO\nsecond_replacement=NO\nscored=NO'
          python3 - <<'PY'
          import json
          c=json.load(open('experiments/WP-PWD01/p7b-requalification-r2-contract.json'))
          assert c['decision']=='GO_ONE_REPLACEMENT_NON_SCORED_QUALIFICATION'
          assert c['replacement_reservation']['authority_id']=='P7B-RQ1'
          assert c['replacement_reservation']['maximum_new_reservations']==1
          assert c['replacement_reservation']['automatic_retry'] is False
          assert c['replacement_reservation']['second_replacement_authorized'] is False
          assert c['scored_runs_authorized'] is False
          assert c['recommended_next_live_patch']['id']=='WP2-P7B-R3'
          PY
          grep -q 'WP2_P7B_R2=PASS_ONE_REPLACEMENT_CONTRACT_FREEZE' HANDOVER_CURRENT.md
          python3 scripts/wp2_p7b_r2_validate_controller.py --controller powder/wp2_p7b_r3_execute.sh | tee /tmp/r3-static-gate.txt
          grep -q '^P7B_R2_CONTROLLER_STATIC_GATE=PASS$' /tmp/r3-static-gate.txt
          ! grep -q 'scored_runs_authorized=true' powder/wp2_p7b_r3_execute.sh
          echo 'P7B_R3_PREMUTATION_GATE=PASS'
          echo '🟦🟦⬜⬜⬜⬜⬜⬜⬜⬜ 20% authority contract verified'

      - name: Install controller dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq openssh-client rsync curl >/dev/null

      - name: Execute one P7B-RQ1 reservation and persistent escrow
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash powder/wp2_p7b_r3_execute.sh prepare 2>&1 | tee /tmp/wp2-p7b-r3-controller.log

      - name: Upload immutable raw evidence bundle
        id: upload
        if: always() && steps.prepare.outputs.bundle_path != ''
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp2-p7b-r3-${{ github.run_id }}
          path: ${{ steps.prepare.outputs.bundle_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Independent GitHub artifact read-back
        id: download
        if: steps.prepare.outcome == 'success' && steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wp2-p7b-r3-${{ github.run_id }}
          path: /tmp/wp2-p7b-r3-roundtrip

      - name: Verify independent read-back and teardown
        id: finalize
        if: steps.prepare.outcome == 'success' && steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROUNDTRIP="$(find /tmp/wp2-p7b-r3-roundtrip -type f -name '*.tar' | head -1)"
          test -s "$ROUNDTRIP"
          bash powder/wp2_p7b_r3_execute.sh finalize "$ROUNDTRIP" '${{ steps.prepare.outputs.bundle_sha256 }}'

      - name: Publish colorful progress and first-cause status
        if: always()
        shell: bash
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          FINALIZE: ${{ steps.finalize.outcome }}
          NODE_RC: ${{ steps.prepare.outputs.node_rc }}
          EXPID: ${{ steps.prepare.outputs.experiment_id }}
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
          BUNDLE_SHA: ${{ steps.prepare.outputs.bundle_sha256 }}
        run: |
          set -u
          {
            echo '# WP2-P7B-R3 live progress'
            echo
            echo "- Authority: **P7B-RQ1 / NON-SCORED**"
            echo "- Experiment UUID: \`${EXPID:-not-created}\`"
            echo "- Run ID: \`${RUN_ID:-not-started}\`"
            echo "- Physical node RC: \`${NODE_RC:-unknown}\`"
            echo "- Bundle SHA-256: \`${BUNDLE_SHA:-unavailable}\`"
            echo
            if [[ "$FINALIZE" == success && "${NODE_RC:-1}" == 0 ]]; then
              echo '🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩 **100% — physical qualification + evidence survival + teardown PASS**'
            elif [[ "$PREPARE" == success ]]; then
              echo '🟦🟦🟦🟦🟦🟦🟦🟦⬜⬜ **80% — physical/escrow complete; artifact/read-back or teardown incomplete**'
            elif [[ -n "${EXPID:-}" ]]; then
              echo '🟧🟧🟧🟧🟧⬜⬜⬜⬜⬜ **50% — live attempt blocked; experiment intentionally left live if evidence gate did not pass**'
            else
              echo '🟥🟥⬜⬜⬜⬜⬜⬜⬜⬜ **20% — blocked before reservation or live execution**'
            fi
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| prepare / physical + /proj escrow | ${PREPARE:-skipped} |"
            echo "| artifact upload | ${UPLOAD:-skipped} |"
            echo "| independent artifact download | ${DOWNLOAD:-skipped} |"
            echo "| read-back + teardown | ${FINALIZE:-skipped} |"
            echo
            echo 'Scored authorization remains **BLOCKED**.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '===== FIRST-CAUSE CONTROLLER TAIL ====='
          tail -n 180 /tmp/wp2-p7b-r3-controller.log 2>/dev/null || true

      - name: Enforce R3 terminal verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.prepare.outcome }}' = success
          test '${{ steps.upload.outcome }}' = success
          test '${{ steps.download.outcome }}' = success
          test '${{ steps.finalize.outcome }}' = success
          test '${{ steps.prepare.outputs.node_rc }}' = 0
          echo 'WP2_P7B_R3_WORKFLOW=PASS'
