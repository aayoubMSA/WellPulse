name: WP2 POWDER SSH Environment Inventory

on:
  push:
    branches: [audit/powder-ssh-env-inventory-v3]
    paths:
      - '.wp2-powder-ssh-env-inventory-trigger'

permissions:
  contents: read

concurrency:
  group: wp2-powder-ssh-environment-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      TARGET_EXPID: 12b39276-af0f-4e34-8dfd-685b006dd6bd
      TARGET_NAME: wp7brq19810043

    steps:
      - name: Checkout inventory branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Freeze read-only SSH inventory authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-powder-ssh-env-inventory-trigger)" = $'execute=WP2_POWDER_SSH_ENV_INVENTORY_ONCE\nexperiment_id=12b39276-af0f-4e34-8dfd-685b006dd6bd\nexperiment_name=wp7brq19810043\nnew_reservation=NO\nrf_mutation=NO\ncells=NO\nrestart=NO\nteardown=NO\nscored=NO'
          ! grep -Eq 'portal-cli[[:space:]]+experiment[[:space:]]+(create|terminate)' .github/workflows/wp2-powder-ssh-environment-inventory.yml
          ! grep -Eq 'tmcc[[:space:]]+attenuator.*set|wp2_p7b_c_node|wp2_p7b_target_node_preflight|wp2_p7b_r3' scripts/wp2_powder_ssh_environment_inventory.sh
          bash -n scripts/wp2_powder_ssh_environment_inventory.sh
          echo 'SSH_ENV_INVENTORY_AUTHORITY=PASS'

      - name: Install controller-side read-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq openssh-client curl >/dev/null

      - name: Resolve current nodes and probe environment over SSH
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/wp2-powder-ssh-env-inventory
          rm -rf "$OUT"; mkdir -p "$OUT" "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Portal is used only to resolve the already-existing reservation's SSH endpoints.
          bash scripts/wp2_portal_client_bootstrap.sh "$OUT/portal-api" > "$OUT/portal-pin.txt"
          grep -q '^PORTAL_API_PIN_GATE=PASS$' "$OUT/portal-pin.txt"
          MOK=0
          for i in 1 2 3 4 5; do
            set +e
            portal-cli experiment manifests get --experiment-id "$TARGET_EXPID" > "$OUT/manifest.json" 2> "$OUT/manifest.err"
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then MOK=1; break; fi
            sleep 2
          done
          test "$MOK" = 1

          python3 - "$OUT/manifest.json" "$OUT/nodes.env" <<'PY'
          import json,sys,xml.etree.ElementTree as ET
          obj=json.load(open(sys.argv[1])); xmls=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str) and '<' in x and ('rspec' in x.lower() or '<node' in x.lower()): xmls.append(x)
          walk(obj); rows={}
          for text in xmls:
              try: root=ET.fromstring(text)
              except Exception: continue
              for node in root.iter():
                  if node.tag.rsplit('}',1)[-1] != 'node': continue
                  cid=node.attrib.get('client_id','')
                  if cid not in {'enb1','rue1'}: continue
                  for ch in node.iter():
                      if ch.tag.rsplit('}',1)[-1]=='login' and ch.attrib.get('hostname'):
                          rows[cid]=(ch.attrib.get('username','aayoub'),ch.attrib['hostname'],ch.attrib.get('port','22'))
                          break
          if set(rows) != {'enb1','rue1'}: raise SystemExit('missing SSH logins: '+repr(rows))
          with open(sys.argv[2],'w') as f:
              for cid,prefix in [('enb1','CORE'),('rue1','UE')]:
                  u,h,p=rows[cid]
                  f.write('%s_USER=%s\n%s_HOST=%s\n%s_PORT=%s\n'%(prefix,u,prefix,h,prefix,p))
          PY
          cat "$OUT/nodes.env"
          set -a; source "$OUT/nodes.env"; set +a

          # SSH key lifecycle and every SSH call are intentionally in this same step.
          python3 - <<'PY'
          import os,pathlib
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+'\n'
          pathlib.Path('/tmp/wp2-powder-inventory.key').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 /tmp/wp2-powder-inventory.key
          cat > /tmp/wp2-powder-askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/wp2-powder-askpass
          export SSH_ASKPASS=/tmp/wp2-powder-askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          setsid -w ssh-keygen -y -f /tmp/wp2-powder-inventory.key >/dev/null </dev/null
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add /tmp/wp2-powder-inventory.key </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

          export CORE_USER CORE_HOST CORE_PORT UE_USER UE_HOST UE_PORT
          bash scripts/wp2_powder_ssh_environment_inventory.sh "$OUT" | tee "$OUT/controller.log"
          grep -q '^WP2_POWDER_SSH_ENV_INVENTORY=PASS$' "$OUT/controller.log"
          echo "artifact_path=$OUT" >> "$GITHUB_OUTPUT"
          echo 'SSH_ENV_INVENTORY_COLLECTION=PASS'

      - name: Upload immutable environment inventory
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp2-powder-ssh-env-inventory-${{ github.run_id }}
          path: /tmp/wp2-powder-ssh-env-inventory
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish inventory summary
        if: always()
        shell: bash
        run: |
          set -u
          OUT=/tmp/wp2-powder-ssh-env-inventory
          {
            echo '# WP2 POWDER SSH environment inventory'
            echo
            echo '- Existing reservation only: **YES**'
            echo '- New reservation: **NO**'
            echo '- RF/cells/restarts/teardown: **NO**'
            echo '- Purpose: **observe actual POWDER runtime before contract audit**'
            echo
            if test -s "$OUT/inventory.json"; then
              echo '```json'
              jq '{schema,nodes:{core:{host:.nodes.core.host,os_id:.nodes.core.os_id,os_version:.nodes.core.os_version,repo_sha:.nodes.core.repo_sha,missing_cli:.nodes.core.missing_cli,python:{system:.nodes.core.python.system.version,pinned:.nodes.core.python.pinned.version},source_syntax_failures:.nodes.core.source_syntax_failures,jars:.nodes.core.jars},ue:{host:.nodes.ue.host,os_id:.nodes.ue.os_id,os_version:.nodes.ue.os_version,repo_sha:.nodes.ue.repo_sha,missing_cli:.nodes.ue.missing_cli,python:{system:.nodes.ue.python.system.version,pinned:.nodes.ue.python.pinned.version},source_syntax_failures:.nodes.ue.source_syntax_failures,jars:.nodes.ue.jars}}}' "$OUT/inventory.json" 2>/dev/null || true
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce collection completeness only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/wp2-powder-ssh-env-inventory/core.txt
          test -s /tmp/wp2-powder-ssh-env-inventory/ue.txt
          test -s /tmp/wp2-powder-ssh-env-inventory/inventory.json
          test -s /tmp/wp2-powder-ssh-env-inventory/wp2-powder-ssh-environment-inventory.tar
          echo 'WP2_POWDER_SSH_ENV_INVENTORY_WORKFLOW=PASS_COLLECTION_COMPLETE'
