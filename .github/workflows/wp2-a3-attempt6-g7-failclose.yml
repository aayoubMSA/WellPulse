name: WP2 A3 Attempt6 G7 Targeted Failclose

on:
  push:
    branches: [main]
    paths:
      - 'powder/wp2-a3-attempt6-g7-failclose.trigger'

permissions:
  contents: read

jobs:
  failclose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
    steps:
      - name: Prepare SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh" /tmp/a3g7close
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path.home().joinpath('.ssh/id_powder').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_powder"
          cat >/tmp/a3g7close/askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/a3g7close/askpass
          export SSH_ASKPASS=/tmp/a3g7close/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          setsid -w ssh-add "$HOME/.ssh/id_powder" </dev/null >/dev/null

      - name: Stop contaminated attempt only after RF/service restoration
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID='wp2-golden-a3-gh-33067316888-20260827T112727Z'
          ssh -A -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new aayoub@nuc2.emulab.net "RUN_ID='$RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          R="$HOME/wellpulse-powder-evidence/golden/$RUN_ID"
          test -f "$R/orchestration/gate_events.jsonl"
          grep -q '"gate":"G6","status":"PASS"' "$R/orchestration/gate_events.jsonl"
          ! grep -Eq '"gate":"G(8|9|10)"' "$R/orchestration/gate_events.jsonl"
          test -s "$R/sender/rf_restore.ready"
          test -s "$R/substrate/service_ready.marker"
          test -f "$R/sender/golden_manifest.json"
          python3 - "$R/sender/golden_manifest.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x.get('scored') is False
          assert x.get('evidence_class')=='NON_SCORED_WP2_GOLDEN_REHEARSAL'
          PY
          mapfile -t PIDS < <(ps -eo pid=,comm=,args= | awk -v r="$RUN_ID" '$2=="python" && index($0,"wp_pwd01_golden_sender.py") && index($0,r){print $1}')
          [[ "${#PIDS[@]}" -eq 1 ]] || { echo "FAILCLOSE_REFUSED=EXPECTED_ONE_SENDER_FOUND_${#PIDS[@]}" >&2; exit 51; }
          kill -TERM "${PIDS[0]}"
          echo "ATTEMPT6_G7_SENDER_TERM_PID=${PIDS[0]}"
          echo 'ATTEMPT6_CLASSIFICATION=DIAGNOSTIC_NONCANONICAL'
          echo 'SCORING=NO'
          echo 'G8_G9_G10_REACHED=NO_AT_INTERVENTION'
          REMOTE

          # The orchestrator's existing G7 failure path owns cleanup_runtime; verify it exits
          # and does not proceed to evidence/teardown gates.
          sleep 5
          ssh -A -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new aayoub@nuc2.emulab.net "RUN_ID='$RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          R="$HOME/wellpulse-powder-evidence/golden/$RUN_ID"
          ! ps -eo args= | grep -F 'wp_pwd01_golden_sender.py' | grep -F "$RUN_ID" | grep -v grep >/dev/null
          ! grep -Eq '"gate":"G(8|9|10)"' "$R/orchestration/gate_events.jsonl"
          grep -q '"gate":"G7","status":"FAIL"' "$R/orchestration/gate_events.jsonl"
          echo 'ATTEMPT6_G7_FAILCLOSE=PASS'
          echo 'AUTOMATIC_A3_TERMINATION_PATH_REACHED=NO'
          REMOTE
