name: WP2 H Calibration Preflight

on:
  push:
    paths:
      - ".wp2-h-preflight-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet 'paho-mqtt==2.1.0' 'PyYAML==6.0.2'
      - name: Run WP2 H preflight
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/local
          RC=0
          {
            echo "## Unit tests"
            PYTHONPATH=src python -m unittest discover -s tests -v || RC=$?
            echo
            echo "## Python script compile"
            python -m py_compile \
              scripts/wp_pwd01_h_sender.py \
              scripts/wp_pwd01_h_receiver.py \
              scripts/finalize_wp_pwd01_h_calibration.py || RC=$?
            echo
            echo "## Shell syntax"
            bash -n powder/wp2_h_epc_broker.sh || RC=$?
            echo
            echo "## Frozen-state, P0, P1 and B2 guards"
            PYTHONPATH=src python - <<'PY' || RC=$?
          import csv, yaml
          from pathlib import Path

          m = yaml.safe_load(Path('experiments/WP-PWD01/run-matrix.yaml').read_text(encoding='utf-8'))
          assert m['scored_runs_authorized'] is False
          assert m['controlled_rf_profile']['selected_profile'] == 'srslte-controlled-rf'
          assert m['controlled_rf_profile']['selected_profile_revision'] == 'a6da96560b6526dc6816761282722c996418fd8c'
          assert m['rf_states']['Q0']['numeric_setting_db'] == 0
          assert m['rf_states']['Q1']['numeric_setting_db'] == 40
          assert m['rf_states']['Q2']['numeric_setting_db'] == 52
          assert m['rf_states']['Q3']['numeric_setting_db'] == 55
          assert m['rf_states']['further_attenuation_hunting_authorized'] is False
          assert str(m['workload']['recovery_horizon_s']).startswith('TBD_')
          assert m['workload']['h_same_for_all_arms_and_scenarios'] == 'required'
          assert m['workload']['h_reestimation_after_scoring'] == 'prohibited'
          assert m['pre_score_gate_status']['recovery_horizon_H'] == 'OPEN_ACTIVE_GATE'
          assert m['pre_score_gate_status']['h_adverse_outcome_classification'] == 'PASS_LOCAL_IMPLEMENTED'
          assert m['pre_score_gate_status']['mqtt_run_session_isolation_implementation'] == 'PASS_LOCAL_PHYSICAL_VERIFICATION_OPEN'
          assert m['pre_score_gate_status']['record_identity_collision_fail_closed'] == 'PASS_LOCAL_IMPLEMENTED'
          assert m['pre_score_gate_status']['b1_accepted_unacked_instrumentation'] == 'PASS_LOCAL_PHYSICAL_EVIDENCE_OPEN'
          assert m['pre_score_gate_status']['s3_restart_domain_separation'] == 'OPEN_NON_SCORED_VERIFICATION_REQUIRED'
          assert m['pre_score_gate_status']['b2_local_semantics'] == 'PASS_3_OF_3'
          assert m['pre_score_gate_status']['b2_comparator_decision'] == 'PASS_QUALIFIED_COMPACT_S2_S3_ONLY'
          assert m['pre_score_gate_status']['b2_remote_runtime_path_restart_implementation'] == 'OPEN_NON_SCORED_VERIFICATION_REQUIRED'
          assert m['pre_score_gate_status']['consortium_p1_analysis_claim_amendments'] == 'PASS_FROZEN'
          assert m['precision_stopping_rule']['p1_resolution'] == 'completeness_only_confirmatory_precision_rule_retained'
          assert m['precision_stopping_rule']['confirmatory_recovery_advantage_claim'] == 'prohibited'
          assert m['planned_conducted_scored_runs']['b2_fixed_sensitivity'] == 6
          assert m['modes']['B2_MQTT_DURABLE_CLIENT']['status'] == 'LOCAL_SEMANTICS_PASS_REMOTE_IMPLEMENTATION_OPEN'
          assert m['modes']['B2_MQTT_DURABLE_CLIENT']['scope'] == 'exactly_3_S2_plus_3_S3_runs_only'
          assert m['pre_score_snapshot']['required_before_scored_runs_authorized_true'] is True
          assert m['scientific_interpretation']['cross_testbed_term'] == 'cross_testbed_consistency_or_triangulation'

          required = [
              'experiments/WP-PWD01/H_CALIBRATION_PLAN_v1.md',
              'experiments/WP-PWD01/PRE_SCORE_P0_AMENDMENT_2026-08-26.md',
              'experiments/WP-PWD01/PRE_SCORE_P1_AMENDMENT_2026-08-26.md',
              'experiments/WP-PWD01/B2_SEMANTICS_GATE_v1.md',
              'experiments/WP-PWD01/b2-sensitivity-plan.csv',
              'docs/CONSORTIUM_PRE_WP3_REVIEW_2026-08-26.md',
              'evidence/local/wp2-b2-semantics-latest.md',
          ]
          for p in required:
              assert Path(p).is_file(), p

          h_plan = Path('experiments/WP-PWD01/H_CALIBRATION_PLAN_v1.md').read_text(encoding='utf-8')
          assert 'TECHNICALLY_INVALID' in h_plan
          assert 'VALID_W1_RECOVERY_FAILURE' in h_plan
          assert 'VALID_W1_RECOVERY_SUCCESS' in h_plan

          b2_ev = Path('evidence/local/wp2-b2-semantics-latest.md').read_text(encoding='utf-8')
          assert 'Gate: **PASS**' in b2_ev
          assert '| 1 | 5 | 5 | 5 | 5 | 0 | 0 | PASS |' in b2_ev
          assert '| 2 | 5 | 5 | 5 | 5 | 0 | 0 | PASS |' in b2_ev
          assert '| 3 | 5 | 5 | 5 | 5 | 0 | 0 | PASS |' in b2_ev

          with Path('experiments/WP-PWD01/randomization-plan.csv').open(newline='', encoding='utf-8') as fh:
              rows = list(csv.DictReader(fh))
          s0p2 = next(r for r in rows if r['scenario']=='S0_HEALTHY' and r['pair_index']=='2')
          assert s0p2['run_order_1']=='W1_OFFLINE_FIRST'
          assert s0p2['run_order_2']=='B1_MQTT_QOS1'

          with Path('experiments/WP-PWD01/b2-sensitivity-plan.csv').open(newline='', encoding='utf-8') as fh:
              b2rows = list(csv.DictReader(fh))
          assert len(b2rows) == 6
          assert sum(r['scenario']=='S2_HARD_OUTAGE' for r in b2rows) == 3
          assert sum(r['scenario']=='S3_OUTAGE_RESTART' for r in b2rows) == 3
          print('frozen-state, P0, P1 and B2 guards: PASS')
          PY
          } > /tmp/wp2-h-preflight.log 2>&1

          PAHO_VERSION="$(python -c 'import importlib.metadata as m; print(m.version("paho-mqtt"))')"
          {
            echo "# WP2 H Calibration Preflight — latest"
            echo
            echo "- Checked UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Tested GitHub SHA: ${GITHUB_SHA}"
            echo "- Python: $(python --version 2>&1)"
            echo "- Paho MQTT: ${PAHO_VERSION}"
            echo "- Evidence class: **LOCAL PRE-SCORE IMPLEMENTATION QA ONLY**"
            echo "- POWDER resource interaction: **NONE**"
            echo "- Scored run interaction: **NONE**"
            if [[ "$RC" -eq 0 ]]; then
              echo "- Gate: **PASS**"
            else
              echo "- Gate: **FAIL**"
              echo "- Exit code: \`$RC\`"
            fi
            echo
            echo '```text'
            tail -n 280 /tmp/wp2-h-preflight.log
            echo '```'
          } > evidence/local/wp2-h-preflight-latest.md
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
      - name: Commit sanitized preflight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/local/wp2-h-preflight-latest.md
          [[ -f "$OUT" ]] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record WP2 H calibration preflight evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Enforce preflight result
        if: always()
        run: test "${{ steps.gate.outputs.rc }}" = "0"
