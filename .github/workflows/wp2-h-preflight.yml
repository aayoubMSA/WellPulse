name: WP2 H Calibration Preflight

on:
  push:
    paths:
      - ".wp2-h-preflight-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet 'paho-mqtt==2.1.0' 'PyYAML==6.0.2'
      - name: Run WP2 H preflight
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/local
          RC=0
          {
            echo "## Unit tests"
            PYTHONPATH=src python -m unittest discover -s tests -v || RC=$?
            echo
            echo "## Python script compile"
            python -m py_compile \
              scripts/wp_pwd01_h_sender.py \
              scripts/wp_pwd01_h_receiver.py \
              scripts/finalize_wp_pwd01_h_calibration.py || RC=$?
            echo
            echo "## Shell syntax"
            bash -n powder/wp2_h_epc_broker.sh || RC=$?
            echo
            echo "## Frozen-state guards"
            PYTHONPATH=src python - <<'PY' || RC=$?
          import yaml
          from pathlib import Path

          m = yaml.safe_load(Path('experiments/WP-PWD01/run-matrix.yaml').read_text(encoding='utf-8'))
          assert m['scored_runs_authorized'] is False
          assert m['controlled_rf_profile']['selected_profile'] == 'srslte-controlled-rf'
          assert m['controlled_rf_profile']['selected_profile_revision'] == 'a6da96560b6526dc6816761282722c996418fd8c'
          assert m['rf_states']['Q0']['numeric_setting_db'] == 0
          assert m['rf_states']['Q1']['numeric_setting_db'] == 40
          assert m['rf_states']['Q2']['numeric_setting_db'] == 52
          assert m['rf_states']['Q3']['numeric_setting_db'] == 55
          assert m['rf_states']['further_attenuation_hunting_authorized'] is False
          assert str(m['workload']['recovery_horizon_s']).startswith('TBD_')
          assert m['pre_score_gate_status']['recovery_horizon_H'] == 'OPEN_ACTIVE_GATE'
          assert Path('experiments/WP-PWD01/H_CALIBRATION_PLAN_v1.md').is_file()
          print('frozen-state guards: PASS')
          PY
          } > /tmp/wp2-h-preflight.log 2>&1

          {
            echo "# WP2 H Calibration Preflight — latest"
            echo
            echo "- Checked UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Tested GitHub SHA: ${GITHUB_SHA}"
            echo "- Python: $(python --version 2>&1)"
            echo "- Paho MQTT: $(python -c \"import importlib.metadata as m; print(m.version('paho-mqtt'))\")"
            echo "- Evidence class: **LOCAL PRE-SCORE IMPLEMENTATION QA ONLY**"
            echo "- POWDER resource interaction: **NONE**"
            echo "- Scored run interaction: **NONE**"
            if [[ "$RC" -eq 0 ]]; then
              echo "- Gate: **PASS**"
            else
              echo "- Gate: **FAIL**"
              echo "- Exit code: \`$RC\`"
            fi
            echo
            echo '```text'
            tail -n 220 /tmp/wp2-h-preflight.log
            echo '```'
          } > evidence/local/wp2-h-preflight-latest.md
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
      - name: Commit sanitized preflight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/local/wp2-h-preflight-latest.md
          [[ -f "$OUT" ]] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record WP2 H calibration preflight evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Enforce preflight result
        if: always()
        run: test "${{ steps.gate.outputs.rc }}" = "0"
