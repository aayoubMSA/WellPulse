name: WP2 A3 Core Readonly Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'powder/wp2-a3-core-readonly-diag.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}

    steps:
      - name: Prepare SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh" /tmp/a3diag
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path.home().joinpath('.ssh/id_powder').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_powder"
          cat >/tmp/a3diag/askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/a3diag/askpass
          export SSH_ASKPASS=/tmp/a3diag/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          setsid -w ssh-add "$HOME/.ssh/id_powder" </dev/null >/dev/null
          echo 'DIAG_SSH_READY=PASS'

      - name: Read existing A3 core failure evidence
        shell: bash
        run: |
          set +e
          ssh -A -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new aayoub@nuc1.emulab.net 'bash -s' <<'REMOTE'
          set +e
          echo '=== A3 CORE READONLY DIAGNOSTIC ==='
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          echo "HOST=$(hostname)"
          echo '--- saved CORE_START console ---'
          if test -f /tmp/wp2-a3-q0-core.console; then
            sed -n '1,220p' /tmp/wp2-a3-q0-core.console
          else
            echo 'CORE_CONSOLE=MISSING'
          fi
          echo '--- process state ---'
          pgrep -a srsepc || echo 'srsepc=absent'
          pgrep -a srsenb || echo 'srsenb=absent'
          pgrep -a srsue || echo 'srsue=absent'
          echo '--- tmux state ---'
          tmux ls 2>&1 || true
          echo '--- startup-script structural lines (redacted) ---'
          if test -f /local/repository/bin/start.sh; then
            grep -nE '(^|[^A-Za-z])(srsepc|srsenb|srsue|tmux|hostname|HOSTNAME|client_id|node_id|exit|return|sudo)([^A-Za-z]|$)' /local/repository/bin/start.sh 2>/dev/null \
              | sed -E 's/(token|secret|password|passwd|credential|apikey|api_key)[^ ]*/REDACTED/Ig' \
              | head -120
            echo "START_SH_SHA256=$(sha256sum /local/repository/bin/start.sh | awk '{print $1}')"
          else
            echo 'START_SH=MISSING'
          fi
          echo 'A3_CORE_READONLY_DIAG=COMPLETE'
          REMOTE
          RC=$?
          echo "DIAG_SSH_RC=$RC"
          echo 'POWDER_MUTATION_EXECUTED=NO'
          echo 'GOLDEN_EXECUTED=NO'
          exit 0
