name: WP2 A3 Core Readonly Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'powder/wp2-a3-core-readonly-diag.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}

    steps:
      - name: Prepare SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh" /tmp/a3diag
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path.home().joinpath('.ssh/id_powder').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_powder"
          cat >/tmp/a3diag/askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/a3diag/askpass
          export SSH_ASKPASS=/tmp/a3diag/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          setsid -w ssh-add "$HOME/.ssh/id_powder" </dev/null >/dev/null
          echo 'DIAG_SSH_READY=PASS'

      - name: Read existing A3 core and UE profile topology
        shell: bash
        run: |
          set +e
          for host in nuc1.emulab.net nuc2.emulab.net; do
            echo "=== READONLY HOST=$host ==="
            ssh -A -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "aayoub@$host" 'bash -s' <<'REMOTE'
          set +e
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          echo "HOST=$(hostname)"
          echo '--- saved Q0 console if present ---'
          for f in /tmp/wp2-a3-q0-core.console /tmp/wp2-a3-q0-ue.console; do
            if test -f "$f"; then echo "FILE=$f"; sed -n '1,180p' "$f"; fi
          done
          echo '--- process state ---'
          pgrep -a srsepc || echo 'srsepc=absent'
          pgrep -a srsenb || echo 'srsenb=absent'
          pgrep -a srsue || echo 'srsue=absent'
          echo '--- tmux state ---'
          tmux ls 2>&1 || true
          echo '--- exact tmux/start structural lines (redacted) ---'
          grep -R -nE 'tmux[[:space:]]+(new-session|kill-session|send-keys|attach-session)|srsepc|srsenb|srsue' /local/repository/bin 2>/dev/null \
            | sed -E 's/(token|secret|password|passwd|credential|apikey|api_key)[^ ]*/REDACTED/Ig' \
            | head -160
          echo "START_SH_SHA256=$(sha256sum /local/repository/bin/start.sh 2>/dev/null | awk '{print $1}')"
          echo 'HOST_READONLY_DIAG=COMPLETE'
          REMOTE
            echo "HOST_DIAG_RC=$?"
          done
          echo 'POWDER_MUTATION_EXECUTED=NO'
          echo 'GOLDEN_EXECUTED=NO'
          exit 0
