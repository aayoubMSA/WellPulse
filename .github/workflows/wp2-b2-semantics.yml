name: WP2 B2 Durable Client Semantics

on:
  push:
    paths:
      - ".wp2-b2-semantics-trigger"
      - "experiments/WP-PWD01/b2-semantics/P7BRemoteB2Gateway.java"
      - "scripts/wp2_p7b_b2_manifest.py"
      - ".github/workflows/wp2-b2-semantics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wp2-b2-semantics
  cancel-in-progress: false

jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install local broker and pinned Paho Java
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients >/dev/null
          mkdir -p /tmp/b2/lib /tmp/b2/classes
          curl -fsSL \
            https://repo.maven.apache.org/maven2/org/eclipse/paho/org.eclipse.paho.client.mqttv3/1.2.5/org.eclipse.paho.client.mqttv3-1.2.5.jar \
            -o /tmp/b2/lib/paho.jar
          javac -cp /tmp/b2/lib/paho.jar -d /tmp/b2/classes \
            experiments/WP-PWD01/b2-semantics/B2PersistentClientProbe.java \
            experiments/WP-PWD01/b2-semantics/P7BRemoteB2Gateway.java
          echo 'P7B_B2_REMOTE_ADAPTER_COMPILE=PASS'

      - name: Execute three independent process-restart semantics trials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b2 evidence/local
          cat >/tmp/b2/mosquitto.conf <<'EOF'
          listener 18883 127.0.0.1
          allow_anonymous true
          persistence false
          EOF

          wait_port() {
            python - <<'PY'
          import socket,time,sys
          for _ in range(100):
              s=socket.socket(); s.settimeout(.2)
              try:
                  s.connect(('127.0.0.1',18883)); s.close(); sys.exit(0)
              except OSError:
                  s.close(); time.sleep(.05)
          sys.exit(1)
          PY
          }

          wait_file() {
            local f="$1"
            for _ in $(seq 1 200); do
              [[ -f "$f" ]] && return 0
              sleep .05
            done
            return 1
          }

          : >/tmp/b2/results.tsv
          for t in 1 2 3; do
            TD="/tmp/b2/trial-${t}"
            mkdir -p "$TD/persist"
            CLIENT="wp-b2-sem-${t}"
            TOPIC="wellpulse/b2-semantics/trial-${t}"
            BROKER="tcp://127.0.0.1:18883"

            mosquitto -c /tmp/b2/mosquitto.conf >"$TD/broker1.log" 2>&1 &
            BPID=$!
            wait_port

            java -cp /tmp/b2/classes:/tmp/b2/lib/paho.jar B2PersistentClientProbe \
              outage "$BROKER" "$CLIENT" "$TOPIC" "$TD/persist" \
              "$TD/ready.flag" "$TD/go.flag" "$TD/buffered.flag" \
              >"$TD/phase1.log" 2>&1 &
            JPID=$!
            wait_file "$TD/ready.flag"

            kill "$BPID"
            wait "$BPID" 2>/dev/null || true
            touch "$TD/go.flag"
            wait_file "$TD/buffered.flag"
            wait "$JPID" 2>/dev/null || true

            BUFFERED=$(tr -dc '0-9' <"$TD/buffered.flag")
            PERSISTED_BEFORE=$(find "$TD/persist" -type f -name '*.msg' | wc -l | tr -d ' ')

            mosquitto -c /tmp/b2/mosquitto.conf >"$TD/broker2.log" 2>&1 &
            BPID2=$!
            wait_port
            timeout 30s mosquitto_sub -h 127.0.0.1 -p 18883 -t "$TOPIC" -q 1 -C 5 \
              >"$TD/received.txt" 2>"$TD/sub.err" &
            SPID=$!
            sleep .3

            java -cp /tmp/b2/classes:/tmp/b2/lib/paho.jar B2PersistentClientProbe \
              recover "$BROKER" "$CLIENT" "$TOPIC" "$TD/persist" \
              "$TD/recover.flag" "$TD/unused2" "$TD/unused3" \
              >"$TD/phase2.log" 2>&1
            wait "$SPID"

            kill "$BPID2"
            wait "$BPID2" 2>/dev/null || true

            TOTAL=$(wc -l <"$TD/received.txt" | tr -d ' ')
            UNIQUE=$(sort -u "$TD/received.txt" | wc -l | tr -d ' ')
            MISSING=0
            for i in 1 2 3 4 5; do
              RID=$(printf 'B2-R%04d' "$i")
              grep -Fxq "$RID" "$TD/received.txt" || MISSING=$((MISSING+1))
            done
            DUPLICATES=$((TOTAL-UNIQUE))
            AFTER=$(grep -E '^buffered_after_recovery=' "$TD/recover.flag" | cut -d= -f2)
            PASS=0
            if [[ "$BUFFERED" == "5" && "$PERSISTED_BEFORE" -ge 5 && "$TOTAL" == "5" && "$UNIQUE" == "5" && "$MISSING" == "0" && "$AFTER" == "0" ]]; then
              PASS=1
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$t" "$BUFFERED" "$PERSISTED_BEFORE" "$TOTAL" "$UNIQUE" "$DUPLICATES" "$MISSING" "$PASS" \
              >>/tmp/b2/results.tsv
          done

          python - <<'PY'
          import datetime,hashlib,json,os,platform
          from pathlib import Path
          rows=[]
          for line in Path('/tmp/b2/results.tsv').read_text().splitlines():
              t,b,p,total,unique,dups,missing,passed=line.split('\t')
              rows.append({
                  'trial':int(t),'buffered_before_process_exit':int(b),
                  'persistence_msg_files_before_recovery':int(p),
                  'received_total':int(total),'received_unique':int(unique),
                  'duplicates':int(dups),'missing':int(missing),'pass':passed=='1'
              })
          gate='PASS' if len(rows)==3 and all(r['pass'] for r in rows) else 'FAIL'
          jar=Path('/tmp/b2/lib/paho.jar').read_bytes()
          now=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          out=Path('evidence/local/wp2-b2-semantics-latest.md')
          with out.open('w',encoding='utf-8') as f:
              f.write('# WP2 B2 Durable MQTT Client Semantics — latest\n\n')
              f.write(f'- Checked UTC: {now}\n')
              f.write(f'- Tested GitHub SHA: {os.environ.get("GITHUB_SHA","unknown")}\n')
              f.write('- Evidence class: **LOCAL NON-SCORED PRE-SCORE COMPARATOR QUALIFICATION**\n')
              f.write('- POWDER interaction: **NONE**\n')
              f.write('- Scored run interaction: **NONE**\n')
              f.write('- Eclipse Paho Java: **1.2.5**\n')
              f.write('- MQTT: **v3.1.1 / QoS1 / cleanSession=false**\n')
              f.write('- File persistence: **MqttDefaultFilePersistence**\n')
              f.write('- Persistent disconnected buffer: **enabled, size 4096, delete-oldest=false**\n')
              f.write(f'- Paho JAR SHA-256: `{hashlib.sha256(jar).hexdigest()}`\n')
              f.write(f'- Gate: **{gate}**\n\n')
              f.write('## Trial results\n\n')
              f.write('| Trial | Offline buffered | Persisted .msg files | Received | Unique | Duplicates | Missing | Result |\n')
              f.write('|---:|---:|---:|---:|---:|---:|---:|---|\n')
              for r in rows:
                  f.write(f"| {r['trial']} | {r['buffered_before_process_exit']} | {r['persistence_msg_files_before_recovery']} | {r['received_total']} | {r['received_unique']} | {r['duplicates']} | {r['missing']} | {'PASS' if r['pass'] else 'FAIL'} |\n")
              f.write('\n## Interpretation\n\n')
              if gate=='PASS':
                  f.write('The candidate standard Paho Java client demonstrably preserved all five QoS1 records generated during broker unavailability across abrupt client-process destruction and delivered them after process and broker recovery in all three independent semantics trials. B2 is therefore semantically qualified for a compact pre-frozen sensitivity comparison; this is not a scientific B2-vs-W1 result.\n')
              else:
                  f.write('B2 semantics qualification failed. Do not include B2 in scored experiments until the failure is investigated and a new pre-score decision is frozen.\n')
          if gate!='PASS': raise SystemExit(20)
          PY

      - name: Commit sanitized B2 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/local/wp2-b2-semantics-latest.md
          [[ -f "$OUT" ]] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Record B2 durable-client semantics evidence" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
