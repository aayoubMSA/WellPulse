name: CloudLab Profile Static Gate

on:
  pull_request:
    paths:
      - "profile.py"
      - "cloudlab/**"
      - ".github/workflows/cloudlab-profile-static-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudlab-profile-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned CloudLab profile dependency
        run: python -m pip install --disable-pip-version-check "geni-lib==0.9.7.9"

      - name: Generate request RSpec offline
        run: |
          mkdir -p .ci/cloudlab
          python profile.py > .ci/cloudlab/request-rspec.xml

      - name: Validate CL-WP-01 structural contract
        run: python cloudlab/validate_profile.py .ci/cloudlab/request-rspec.xml

      - name: Hash static evidence
        run: sha256sum profile.py .ci/cloudlab/request-rspec.xml > .ci/cloudlab/SHA256SUMS.txt

      - name: Upload static-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudlab-clwp01-static-gate
          path: .ci/cloudlab/
          if-no-files-found: error
          retention-days: 30
