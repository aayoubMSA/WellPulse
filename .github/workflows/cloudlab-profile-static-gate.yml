name: CloudLab Profile Static Gate

on:
  pull_request:
    paths:
      - "profile.py"
      - "cloudlab/**"
      - ".github/workflows/cloudlab-profile-static-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudlab-profile-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fingerprint runner
        run: |
          mkdir -p .ci/cloudlab
          python3 --version | tee .ci/cloudlab/python-version.txt
          uname -a | tee .ci/cloudlab/runner-uname.txt

      - name: Compile profile source
        run: python3 -m py_compile profile.py cloudlab/validate_profile.py

      - name: Validate CL-WP-01 source contract offline
        run: python3 cloudlab/validate_profile.py profile.py | tee .ci/cloudlab/static-gate.txt

      - name: Freeze static evidence
        run: |
          cp profile.py .ci/cloudlab/profile.py
          sha256sum profile.py cloudlab/validate_profile.py > .ci/cloudlab/SHA256SUMS.txt

      - name: Upload static-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudlab-clwp01-static-gate
          path: .ci/cloudlab/
          if-no-files-found: error
          retention-days: 30
