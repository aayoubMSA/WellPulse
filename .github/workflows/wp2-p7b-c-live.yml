name: WP2 P7B-C Live Qualification

on:
  push:
    paths:
      - ".wp2-p7b-c-live-trigger"

permissions:
  contents: write

concurrency:
  group: wp2-p7b-c-live
  cancel-in-progress: false

jobs:
  p7b-c:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Premutation authority and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-c-live-trigger)" = $'execute=WP2_P7B_C_LIVE_ONCE\nscored=NO\nreservation_limit=1\ncells=P7B-B1-S3,P7B-W1-S3,P7B-B2-S3'
          ! grep -R --line-number --fixed-strings 'scored_runs_authorized=true' \
            powder/wp2_p7b_c_execute.sh scripts/wp2_p7b_c_node.py .github/workflows/wp2-p7b-c-live.yml
          ! grep -q --fixed-strings 'portal-cli experiment terminate' powder/wp2_p7b_c_execute.sh
          test "$(grep -c --fixed-strings 'portal-cli experiment create' powder/wp2_p7b_c_execute.sh)" = "1"
          bash -n powder/wp2_p7b_c_execute.sh
          python -m py_compile scripts/wp2_p7b_c_node.py scripts/wp2_p7b_python_gateway.py scripts/wp2_p7b_validate_readiness.py scripts/reconstruct_wp2_p7b.py
          echo 'P7B_C_PREMUTATION_AUTHORITY_GATE=PASS'

      - name: Install controller prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl git openssh-client >/dev/null

      - name: Execute one authorized P7B-C reservation
        id: execute
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash powder/wp2_p7b_c_execute.sh 2>&1 | tee /tmp/wp2-p7b-c-controller.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "P7B_C_CONTROLLER_RC=$RC"

      - name: Write sanitized canonical live status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/powder
          python - <<'PY'
          from pathlib import Path
          import datetime, json, os

          result = {}
          p = Path('/tmp/wp2-p7b-c/result.env')
          if p.exists():
              for line in p.read_text(encoding='utf-8', errors='replace').splitlines():
                  if '=' in line:
                      k, v = line.split('=', 1)
                      result[k] = v
          status = {}
          sp = Path('/tmp/wp2-p7b-c/p7b_c_status.json')
          if sp.exists():
              try:
                  status = json.loads(sp.read_text(encoding='utf-8'))
              except Exception:
                  status = {}
          controller_rc = '${{ steps.execute.outputs.rc }}' or 'not-run'
          gate = status.get('gate') or result.get('P7B_C_GATE') or ('CONTROLLER_BLOCKED' if controller_rc != '0' else 'UNKNOWN')
          failure = status.get('failure') or result.get('P7B_C_FAILURE') or result.get('FAILURE') or ''
          cells = status.get('completed_cells') or []
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          lines = [
              '# WP2-P7B-C Live Qualification — latest',
              '',
              f'- Checked UTC: {now}',
              f'- Source SHA: `{os.environ.get("GITHUB_SHA", "unknown")}`',
              f'- GitHub run: `{os.environ.get("GITHUB_RUN_ID", "unknown")}`',
              f'- Experiment UUID: `{result.get("EXPERIMENT_ID", "UNAVAILABLE")}`',
              f'- Experiment name: `{result.get("EXPERIMENT_NAME", "UNAVAILABLE")}`',
              f'- Node run ID: `{result.get("RUN_ID", status.get("run_id", "UNAVAILABLE"))}`',
              '- Evidence class: **NON-SCORED PRE-SCORE PHYSICAL QUALIFICATION**',
              f'- P7B-C gate: **{gate}**',
              f'- Completed cells: `{", ".join(cells) if cells else "NONE"}`',
              f'- Controller RC: `{controller_rc}`',
              '- Experiment teardown: **NOT AUTHORIZED / LEFT LIVE IF CREATED**',
              '- P7B-D: **NOT STARTED**',
              '- Scored authorization: **BLOCKED**',
              '- `scored_runs_authorized=false`',
          ]
          if failure:
              lines += ['', '## First actionable failure', '', f'`{failure}`']
          lines += [
              '',
              'Raw node evidence is intentionally not promoted by this P7B-C status record. Evidence survival, independent read-back, and teardown belong to P7B-D.',
              '',
          ]
          Path('evidence/powder/wp2-p7b-c-live-status.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
          cat evidence/powder/wp2-p7b-c-live-status.md

      - name: Commit sanitized live status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/powder/wp2-p7b-c-live-status.md
          git commit -m "Record P7B-C live qualification status" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Enforce P7B-C controller verdict
        if: always()
        shell: bash
        run: |
          test "${{ steps.execute.outputs.rc }}" = "0"
