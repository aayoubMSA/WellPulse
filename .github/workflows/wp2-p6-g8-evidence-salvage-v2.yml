name: WP2 P6 — Same-Run G8 Evidence Salvage v2

on:
  push:
    branches: [main]
    paths:
      - '.wp2-p6-g8-salvage-v2-trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: wp2-p6-g8-evidence-salvage-v2
  cancel-in-progress: false

jobs:
  salvage-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      EXPID: 5579cf25-dbb1-4d04-87e3-ff558e3be2af
      RUN_ID: wp2-p6r-33099648133-20260827T174149Z
      CORE_HOST: nuc1.emulab.net
      UE_HOST: nuc2.emulab.net

    steps:
      - name: Checkout recovery tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install controller dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync jq >/dev/null

      - name: Freeze salvage-only contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(awk -F= '$1=="salvage" {print $2}' .wp2-p6-g8-salvage-v2-trigger | tail -1)" == WP2_P6_G8_SAME_RUN_EVIDENCE_ONLY_V2 ]]
          [[ "$(awk -F= '$1=="run_id" {print $2}' .wp2-p6-g8-salvage-v2-trigger | tail -1)" == "$RUN_ID" ]]
          [[ -n "$POWDER_SSH_PRIVATE_KEY" ]]
          echo 'SCIENTIFIC_RERUN=NO'
          echo 'RF_MUTATION=NO'
          echo 'SECOND_RESERVATION=NO'
          echo 'TEARDOWN_AUTHORIZED=NO'

      - name: Recover exact completed-run evidence
        id: recover
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-p6-g8-v2
          rm -rf "$TMP"; mkdir -p "$TMP" "$HOME/.ssh"
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path('/tmp/wp2-p6-g8-v2/private.key').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$TMP/private.key"
          cat > "$TMP/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$TMP/askpass"
          export SSH_ASKPASS="$TMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          setsid -w ssh-keygen -y -f "$TMP/private.key" > "$TMP/public.key" </dev/null
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$TMP/private.key" </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          USER="${POWDER_USERNAME:-aayoub}"
          [[ -n "$USER" ]] || USER=aayoub
          SSH=(-A -o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${SSH[@]}" "$USER@$CORE_HOST" true
          ssh "${SSH[@]}" "$USER@$UE_HOST" true

          # The scientific measurement already ended at G7. Prove, do not rerun.
          ssh "${SSH[@]}" "$USER@$UE_HOST" "set -eu
            ROOT=\"\$HOME/wellpulse-powder-evidence/golden/$RUN_ID\"
            test -s \"\$ROOT/sender/sender_summary.json\"
            grep -q 'GOLDEN_FIXED_HORIZON_COMPLETE' \"\$ROOT/sender/sender_summary.json\"
            grep -q '\"gate\":\"G7\".*\"status\":\"PASS\"' \"\$ROOT/orchestration/gate_events.jsonl\"
            test -s \"\$ROOT/sender/telemetry_generated.csv\"
            echo P6_PROTECTED_MEASUREMENT_COMPLETE=PASS"

          # Copy only the already-recorded receiver files, using tar to avoid the
          # OpenSSH scp '/.' parser failure that caused G8.
          ssh "${SSH[@]}" "$USER@$CORE_HOST" "set -eu
            ROOT=\"\$HOME/wellpulse-powder-evidence/golden/$RUN_ID-core/receiver\"
            test -s \"\$ROOT/telemetry_received.csv\"; test -s \"\$ROOT/receiver_events.jsonl\"
            tar -C \"\$ROOT\" -cf - ." > "$TMP/receiver.tar"
          test -s "$TMP/receiver.tar"; tar -tf "$TMP/receiver.tar" >/dev/null
          scp "${SSH[@]}" "$TMP/receiver.tar" "$USER@$UE_HOST:/tmp/wp2-p6-receiver-v2.tar" >/dev/null
          ssh "${SSH[@]}" "$USER@$UE_HOST" "set -eu
            ROOT=\"\$HOME/wellpulse-powder-evidence/golden/$RUN_ID/receiver\"
            mkdir -p \"\$ROOT\"; tar -xf /tmp/wp2-p6-receiver-v2.tar -C \"\$ROOT\"; rm -f /tmp/wp2-p6-receiver-v2.tar
            test -s \"\$ROOT/telemetry_received.csv\"; test -s \"\$ROOT/receiver_events.jsonl\""
          echo 'P6_RECEIVER_TAR_SALVAGE=PASS'

          # Collect required diagnostic captures after the protected window.
          ssh "${SSH[@]}" "$USER@$CORE_HOST" "tmux list-panes -a -F '#S:#I.#P' 2>/dev/null | while read p; do echo '=== PANE ' \"\$p\" ' ==='; tmux capture-pane -p -S -3000 -t \"\$p\" 2>/dev/null || true; done" > "$TMP/core_tmux_capture.txt"
          ssh "${SSH[@]}" "$USER@$UE_HOST" "tmux list-panes -a -F '#S:#I.#P' 2>/dev/null | while read p; do echo '=== PANE ' \"\$p\" ' ==='; tmux capture-pane -p -S -3000 -t \"\$p\" 2>/dev/null || true; done" > "$TMP/ue_tmux_capture.txt"
          test -s "$TMP/core_tmux_capture.txt"; test -s "$TMP/ue_tmux_capture.txt"
          scp "${SSH[@]}" "$TMP/core_tmux_capture.txt" "$TMP/ue_tmux_capture.txt" "$USER@$UE_HOST:/tmp/" >/dev/null
          ssh "${SSH[@]}" "$USER@$UE_HOST" "set -eu
            ROOT=\"\$HOME/wellpulse-powder-evidence/golden/$RUN_ID/substrate\"
            install -m 600 /tmp/core_tmux_capture.txt \"\$ROOT/core_tmux_capture.txt\"
            install -m 600 /tmp/ue_tmux_capture.txt \"\$ROOT/ue_tmux_capture.txt\""

          # Reconstruct the same run and persist/hash it before any teardown.
          ssh "${SSH[@]}" "$USER@$UE_HOST" "set -eu
            cd \"\$HOME/WellPulse\"
            ROOT=\"\$HOME/wellpulse-powder-evidence/golden/$RUN_ID\"
            \"\$HOME/.wp2-golden-venv/bin/python\" scripts/reconstruct_wp2_golden.py --root \"\$ROOT\"
            echo P6_RECONSTRUCTION_JSON_BEGIN
            cat \"\$ROOT/analysis/golden_reconstruction.json\"
            echo P6_RECONSTRUCTION_JSON_END
            WP_EVIDENCE_SRC=\"\$ROOT\" WP_RUN_ID='$RUN_ID' WP_EXPERIMENT_ID='$EXPID' WP_PERSIST_ROOT='/proj/WellPulse/evidence-escrow' WP_EVIDENCE_INVENTORY=\"\$HOME/WellPulse/experiments/WP-PWD01/evidence_inventory_golden_v1.txt\" bash scripts/wp2_golden_evidence_escrow.sh
            test -s '/proj/WellPulse/evidence-escrow/$EXPID/$RUN_ID/escrow/PERSISTENT_ESCROW_GATE.PASS'
            echo P6_RECONSTRUCT_AND_PERSIST=PASS" | tee "$TMP/reconstruct-persist.txt"
          grep -q '^P6_RECONSTRUCT_AND_PERSIST=PASS$' "$TMP/reconstruct-persist.txt"

          PDIR="/proj/WellPulse/evidence-escrow/$EXPID/$RUN_ID"
          BUNDLE="$TMP/wp2-p6-g8-v2-$RUN_ID.tar"
          WP_PERSIST_HOST="$UE_HOST" WP_REMOTE_USER="$USER" WP_SSH_PORT=22 WP_PERSIST_REMOTE_DIR="$PDIR" \
          WP_CONTROLLER_LOCAL_DIR="$TMP/controller" WP_CONTROLLER_BUNDLE_OUT="$BUNDLE" WP_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts" \
            bash scripts/wp2_controller_pull_persistent_escrow.sh | tee "$TMP/controller-pull.txt"
          grep -q '^CONTROLLER_PULL_GATE=PASS$' "$TMP/controller-pull.txt"
          SHA="$(awk -F= '$1=="CONTROLLER_BUNDLE_SHA256" {print $2}' "$TMP/controller-pull.txt" | tail -1)"
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]; test -s "$BUNDLE"
          echo "bundle_path=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo 'P6_G8_SALVAGE_V2_EXECUTE=PASS'

      - name: Upload recovered same-run evidence
        id: upload
        if: steps.recover.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp2-p6-g8-v2-${{ github.run_id }}
          path: ${{ steps.recover.outputs.bundle_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Independent artifact read-back
        id: download
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wp2-p6-g8-v2-${{ github.run_id }}
          path: /tmp/wp2-p6-g8-v2-roundtrip

      - name: Verify hashes then terminate exact reservation
        id: finalize
        if: steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.recover.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          ROUNDTRIP="$(find /tmp/wp2-p6-g8-v2-roundtrip -maxdepth 2 -type f -name '*.tar' | head -1)"
          test -s "$ROUNDTRIP"
          WP_ROUNDTRIP_TAR="$ROUNDTRIP" WP_EXPECTED_BUNDLE_SHA256="$EXPECTED_SHA" WP_VERIFY_DIR=/tmp/wp2-p6-g8-v2-verified \
            bash scripts/wp2_controller_verify_artifact_roundtrip.sh | tee /tmp/wp2-p6-g8-v2-final.txt
          grep -q '^EVIDENCE_ESCROW_GATE=PASS$' /tmp/wp2-p6-g8-v2-final.txt
          grep -q '^TEARDOWN_AUTHORIZED=YES$' /tmp/wp2-p6-g8-v2-final.txt
          echo P6_VERIFIED_RECONSTRUCTION_BEGIN
          cat /tmp/wp2-p6-g8-v2-verified/analysis/golden_reconstruction.json
          echo P6_VERIFIED_RECONSTRUCTION_END

          bash scripts/wp2_portal_client_bootstrap.sh /tmp/portal-api-g8-v2-final >/tmp/wp2-p6-g8-v2-portal-pin.txt
          portal-cli experiment terminate --experiment-id "$EXPID" >/tmp/wp2-p6-g8-v2-terminate.json 2>/tmp/wp2-p6-g8-v2-terminate.err || true
          TERMINATED=0
          for i in $(seq 1 60); do
            set +e; portal-cli experiment get --experiment-id "$EXPID" >/tmp/wp2-p6-g8-v2-postterm.json 2>/dev/null; rc=$?; set -e
            if [[ "$rc" -ne 0 ]]; then TERMINATED=1; break; fi
            st="$(jq -r '.status // "unknown"' /tmp/wp2-p6-g8-v2-postterm.json)"
            echo "TERMINATION_POLL_${i}=$st"
            if [[ "$st" =~ ^(terminated|destroyed)$ ]]; then TERMINATED=1; break; fi
            sleep 5
          done
          [[ "$TERMINATED" -eq 1 ]]
          echo 'P6_G8_SALVAGE_V2=PASS'
          echo 'EVIDENCE_ESCROW_GATE=PASS'
          echo 'TEARDOWN_AUTHORIZED=YES'
          echo 'TEARDOWN_CONFIRMED=YES'

      - name: Final fail-closed verdict
        if: always()
        shell: bash
        env:
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -euo pipefail
          echo "RECOVER_OUTCOME=$RECOVER_OUTCOME"
          echo "FINALIZE_OUTCOME=$FINALIZE_OUTCOME"
          if [[ "$FINALIZE_OUTCOME" != success ]]; then
            echo 'WP2_P6_G8_SALVAGE_V2=FAIL_CLOSED'
            echo 'SCIENTIFIC_RERUN=NO'
            echo 'SCORED_RUN_AUTHORIZED=NO'
            exit 1
          fi
          echo 'WP2_P6_G8_SALVAGE_V2=PASS'
          echo 'SCIENTIFIC_RERUN=NO'
          echo 'SCORED_RUN_AUTHORIZED=NO'
