name: POWDER SSH Secret Presence Check

on:
  push:
    paths:
      - ".powder-ssh-secret-check-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
    steps:
      - name: Verify required SSH secrets are present
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$POWDER_SSH_PRIVATE_KEY" ]] || { echo "POWDER_SSH_PRIVATE_KEY=MISSING"; exit 2; }
          [[ -n "$POWDER_SSH_KEY_PASSPHRASE" ]] || { echo "POWDER_SSH_KEY_PASSPHRASE=MISSING"; exit 3; }
          echo "POWDER_SSH_PRIVATE_KEY=SET"
          echo "POWDER_SSH_KEY_PASSPHRASE=SET"
          echo "SECRET_PRESENCE_CHECK=PASS"
