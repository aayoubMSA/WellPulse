name: WP2 P7 — Offline Closure QA

on:
  push:
    branches: [main]
    paths:
      - '.wp2-p7-offline-closure-trigger'

permissions:
  contents: read

concurrency:
  group: wp2-p7-offline-closure-qa
  cancel-in-progress: false

jobs:
  p7-offline-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P7 hardening state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install bounded QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync >/dev/null
          python -m pip install --quiet 'paho-mqtt==2.1.0'

      - name: P7 static and syntax contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/wp2_golden_prepare_management_aliases.sh
          bash -n scripts/wp2_golden_orchestrator.sh
          bash -n scripts/wp2_golden_service_restore.sh
          bash -n scripts/wp2_golden_service_ready_probe.sh
          bash -n scripts/wp2_golden_evidence_escrow.sh
          bash -n scripts/wp2_controller_pull_persistent_escrow.sh
          bash -n scripts/wp2_controller_verify_artifact_roundtrip.sh
          bash -n scripts/wp2_golden_offline_qa.sh
          python -m py_compile scripts/reconstruct_wp2_golden.py scripts/wp2_golden_hci_emit.py scripts/wp_pwd01_golden_sender.py scripts/wp_pwd01_h_receiver.py
          test ! -e .github/workflows/wp2-p6-golden.yml
          test -z "$(find . -maxdepth 1 -type f -name '.wp2-p6*trigger' -print -quit)"
          echo 'P7_STATIC_SYNTAX=PASS'

      - name: Executable unit regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          echo 'P7_UNIT_REGRESSIONS=PASS'

      - name: Full Golden offline evidence/interlock QA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/wp2_golden_offline_qa.sh
          echo 'P7_GOLDEN_OFFLINE_QA=PASS'

      - name: Final P7 offline verdict
        shell: bash
        run: |
          set -euo pipefail
          echo 'WP2_P7_OFFLINE_CLOSURE_QA=PASS'
          echo 'POWDER_CONTACT=NO'
          echo 'POWDER_MUTATION=NO'
          echo 'SCIENTIFIC_RUN=NO'
          echo 'SCORED_RUN=NO'
