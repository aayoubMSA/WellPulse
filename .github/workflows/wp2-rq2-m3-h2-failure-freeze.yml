name: WP2 RQ2 M3 H2 Failure Freeze

on:
  push:
    paths:
      - '.github/diagnostics/wp2-rq2-m3-h2-failure-freeze.trigger'

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
          POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" "$RUNNER_TEMP/wp2-m3-h2-freeze/out"
          umask 077
          python3 - "$RUNNER_TEMP/wp2-m3-h2-freeze/private.key" <<'PY'
          import os,sys
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+'\n'
          Path(sys.argv[1]).write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$RUNNER_TEMP/wp2-m3-h2-freeze/private.key"
          cat > "$RUNNER_TEMP/wp2-m3-h2-freeze/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$RUNNER_TEMP/wp2-m3-h2-freeze/askpass"
          export SSH_ASKPASS="$RUNNER_TEMP/wp2-m3-h2-freeze/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$RUNNER_TEMP/wp2-m3-h2-freeze/private.key" </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Pull failed M3 root and node snapshots
        run: |
          set -euo pipefail
          RUN_ID='wp2-p7b-rq2-manual-fresh2-20260828T064758Z'
          UE_ROOT="/users/aayoub/wellpulse-powder-evidence/p7b/$RUN_ID"
          OUT="$RUNNER_TEMP/wp2-m3-h2-freeze/out"
          SSH=(-o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          ssh "${SSH[@]}" aayoub@nuc2.emulab.net "set -eu; test -d '$UE_ROOT'; tar -C '$UE_ROOT' -czf - ." > "$OUT/ue-m3-root.tgz"
          test -s "$OUT/ue-m3-root.tgz"
          sha256sum "$OUT/ue-m3-root.tgz" | tee "$OUT/OUTER_SHA256SUMS.txt"
          mkdir -p "$OUT/verify-ue"
          tar -C "$OUT/verify-ue" -xzf "$OUT/ue-m3-root.tgz"
          (cd "$OUT/verify-ue" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$OUT/UE_INTERNAL_SHA256SUMS.txt"

          ssh "${SSH[@]}" aayoub@nuc2.emulab.net "set +e; echo '=== UE ==='; hostname; pgrep -a srsue || true; ip link show tun_srsue 2>&1 || true; tmux list-sessions 2>&1 || true" > "$OUT/UE_POST_FAILURE_STATE.txt"
          ssh "${SSH[@]}" aayoub@nuc1.emulab.net "set +e; echo '=== CORE ==='; hostname; pgrep -a srsepc || true; pgrep -a srsenb || true; pgrep -a mosquitto || true; tmux list-sessions 2>&1 || true" > "$OUT/CORE_POST_FAILURE_STATE.txt"
          printf 'RUN_ID=%s\nGITHUB_RUN_ID=%s\nUE_SOURCE=%s\n' "$RUN_ID" "$GITHUB_RUN_ID" "$UE_ROOT" > "$OUT/PROVENANCE.txt"
          echo 'M3_H2_FAILURE_FREEZE_PULL=PASS'

      - name: Upload M3 H2 failure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp2-p7b-rq2-manual-fresh2-20260828T064758Z-m3-h2-failure-freeze
          path: ${{ runner.temp }}/wp2-m3-h2-freeze/out/
          if-no-files-found: error
          retention-days: 90
