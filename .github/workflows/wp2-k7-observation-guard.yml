name: WP2 K7 Observation Guard

on:
  push:
    branches: [main]
    paths:
      - '.wp2-k7-observation-guard-trigger'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce no unsafe RF observer invocation
        run: |
          set -euo pipefail
          python3 scripts/wp2_k7_active_workflow_guard.py
          echo 'HCI_CONTROL_ACTIONS_ENABLED=false'
          echo 'POWDER_CONTACT=NO'
          echo 'SCIENTIFIC_RUN=NO'
