name: WP2 P7B-RQ2 UE Discriminator
on:
  push:
    paths:
      - '.wp2-p7b-rq2-ue-discriminator-trigger'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      TARGET_EXPID: f6de95cb-a13a-421e-bd0e-766dfc1d3fb3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: UE-only read-only discriminator
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-ue-disc
          rm -rf "$TMP"; mkdir -p "$TMP" "$HOME/.ssh"
          bash scripts/wp2_portal_client_bootstrap.sh "$TMP/portal-api" >/dev/null
          sleep 15
          portal-cli experiment manifests get --experiment-id "$TARGET_EXPID" > "$TMP/manifest.json"
          python3 - "$TMP/manifest.json" "$TMP/ue.txt" <<'PY'
          import json,sys,xml.etree.ElementTree as ET
          obj=json.load(open(sys.argv[1])); xmls=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str) and '<node' in x: xmls.append(x)
          walk(obj)
          login=None
          for text in xmls:
              try: root=ET.fromstring(text)
              except Exception: continue
              for n in root.iter():
                  if n.tag.rsplit('}',1)[-1]=='node' and n.attrib.get('client_id')=='rue1':
                      for c in n.iter():
                          if c.tag.rsplit('}',1)[-1]=='login' and c.attrib.get('hostname'):
                              login=(c.attrib.get('username','aayoub'),c.attrib['hostname'],c.attrib.get('port','22'))
                              break
          assert login
          open(sys.argv[2],'w').write('\t'.join(login)+'\n')
          PY
          python3 - <<'PY'
          import os,pathlib
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+'\n'
          pathlib.Path('/tmp/wp2-ue-disc/private.key').write_text(raw)
          PY
          chmod 600 "$TMP/private.key"
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$POWDER_SSH_KEY_PASSPHRASE"\n' > "$TMP/askpass"
          chmod 700 "$TMP/askpass"
          export SSH_ASKPASS="$TMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$TMP/private.key" </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          IFS=$'\t' read -r U H P < "$TMP/ue.txt"
          ssh -o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$P" "$U@$H" '
            echo HOST=$(hostname)
            python3 -V 2>&1
            $HOME/.wp2-golden-venv/bin/python -V 2>&1 || true
            $HOME/.wp2-golden-venv/bin/python -c "import importlib.metadata as m; print(\"PAHO=\"+m.version(\"paho-mqtt\"))" 2>&1 || true
            java -version > /tmp/wp2-java-version-disc.txt 2>&1 || true
            tr "\n" " " < /tmp/wp2-java-version-disc.txt | sed "s/^/JAVA=/"; echo
            grep -q "11\.0\.19" /tmp/wp2-java-version-disc.txt && echo JAVA_11_0_19=PASS || echo JAVA_11_0_19=FAIL
            command -v jq >/dev/null && echo JQ_ABSENT=FAIL || echo JQ_ABSENT=PASS
            command -v mosquitto_pub >/dev/null && echo MOSQUITTO_PUB=PASS || echo MOSQUITTO_PUB=FAIL
            command -v tar >/dev/null && echo TAR=PASS || echo TAR=FAIL
            command -v sha256sum >/dev/null && echo SHA256SUM=PASS || echo SHA256SUM=FAIL
            command -v rsync >/dev/null && echo RSYNC=PASS || echo RSYNC=FAIL
            test -d /proj/WellPulse && echo PROJ_DIR=PASS || echo PROJ_DIR=FAIL
            test -w /proj/WellPulse && echo PROJ_WRITABLE=PASS || echo PROJ_WRITABLE=FAIL
            J="$HOME/WellPulse/experiments/WP-PWD01/lib/org.eclipse.paho.client.mqttv3-1.2.5.jar"
            if test -f "$J"; then
              echo B2_JAR_PRESENT=PASS
              H=$(sha256sum "$J" | awk "{print \$1}")
              echo B2_JAR_SHA256=$H
              test "$H" = 59914287adac506a28d5e8172eed262a22605f3df4d426b9d92f41dae2448185 && echo B2_JAR_HASH=PASS || echo B2_JAR_HASH=FAIL
            else
              echo B2_JAR_PRESENT=FAIL
              echo B2_JAR_HASH=NOT_TESTED
            fi
          '
