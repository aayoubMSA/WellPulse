name: WP2 P7B-R3F Existing Reservation Live Qualification

on:
  push:
    paths:
      - '.wp2-p7b-r3f-live-trigger'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      TARGET_EXPID: 12b39276-af0f-4e34-8dfd-685b006dd6bd
      TARGET_NAME: wp7brq19810043
      SCIENTIFIC_SOURCE_SHA: 13b34c8dc4b515c010a5b531eaaaf40cfcd00c49
      EXPECTED_PROFILE_REVISION: a6da96560b6526dc6816761282722c996418fd8c
      EXPECTED_HARDWARE: nuc5300
      EXPECTED_IMAGE: urn:publicid:IDN+emulab.net+image+PowderProfiles:U18LL-SRSLTE:1
    steps:
      - name: Checkout full provenance history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Freeze one-shot authority and reject reservation creation
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-r3f-live-trigger)" = $'AUTHORITY=R3F_ONE_NON_SCORED_EXISTING_RESERVATION\nEXPERIMENT_ID=12b39276-af0f-4e34-8dfd-685b006dd6bd\nEXPERIMENT_NAME=wp7brq19810043\nSCIENTIFIC_SOURCE_SHA=13b34c8dc4b515c010a5b531eaaaf40cfcd00c49\nNEW_RESERVATION=NO\nAUTOMATIC_RETRY=NO\nSCORED=NO\nTEARDOWN=ONLY_AFTER_EVIDENCE_READBACK'
          git cat-file -e "$SCIENTIFIC_SOURCE_SHA^{commit}"
          ! grep -Eq 'portal-cli[[:space:]]+experiment[[:space:]]+create' .github/workflows/wp2-p7b-r3f-existing-reservation-live.yml
          grep -q 'scripts/wp2_p7b_c_node_r2.py' <(git show "$SCIENTIFIC_SOURCE_SHA:scripts/wp2_p7b_c_node_r2.py")
          echo 'R3F_LIVE_AUTHORITY=PASS_ONE_EXISTING_RESERVATION_NON_SCORED'
          echo 'NEW_RESERVATION=NO'
          echo 'AUTOMATIC_RETRY=NO'
          echo 'SCORED=NO'

      - name: Execute one qualification and preserve raw evidence
        id: live
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-p7b-r3f
          rm -rf "$TMP"; mkdir -p "$TMP/controller"
          fail(){ echo "R3F_LIVE_BLOCKED=$1" >&2; exit "${2:-90}"; }

          bash scripts/wp2_portal_client_bootstrap.sh "$TMP/portal-api" | tee "$TMP/portal-pin.txt"
          grep -q '^PORTAL_API_PIN_GATE=PASS$' "$TMP/portal-pin.txt" || fail PORTAL_PIN
          portal-cli experiment get --experiment-id "$TARGET_EXPID" > "$TMP/experiment.json" || fail PORTAL_GET
          python3 scripts/wp2_portal_record_guard.py --json "$TMP/experiment.json" --expected-experiment-id "$TARGET_EXPID" | tee "$TMP/portal-gate.txt"
          grep -q '^PORTAL_RECORD_GATE=PASS$' "$TMP/portal-gate.txt" || fail PORTAL_RECORD
          EXPIRES="$(awk -F= '$1=="EXPIRES_UTC"{print $2}' "$TMP/portal-gate.txt" | tail -1)"
          python3 scripts/wp2_prelaunch_time_guard.py --expires-utc "$EXPIRES" --min-remaining-s 7200 | tee "$TMP/time-gate.txt"
          grep -q '^PRELAUNCH_TIME_GATE=PASS$' "$TMP/time-gate.txt" || fail TIME_BUDGET
          python3 - <<'PY'
          import json, os
          x=json.load(open('/tmp/wp2-p7b-r3f/experiment.json'))
          assert x.get('id')==os.environ['TARGET_EXPID']
          assert x.get('name')==os.environ['TARGET_NAME']
          assert x.get('project')=='WellPulse'
          assert x.get('status')=='ready'
          print('R3F_EXISTING_RESERVATION_IDENTITY=PASS')
          PY

          portal-cli experiment manifests get --experiment-id "$TARGET_EXPID" > "$TMP/manifests.json" || fail MANIFEST_FETCH
          python3 - "$TMP/manifests.json" "$TMP/nodes.json" "$EXPECTED_HARDWARE" "$EXPECTED_IMAGE" <<'PY'
          import json,sys,xml.etree.ElementTree as ET
          obj=json.load(open(sys.argv[1])); out={}; xmls=[]; expected_hw,expected_img=sys.argv[3],sys.argv[4]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str) and '<' in x and ('rspec' in x.lower() or '<node' in x.lower()): xmls.append(x)
          walk(obj)
          for text in xmls:
              try: root=ET.fromstring(text)
              except Exception: continue
              for node in root.iter():
                  if node.tag.rsplit('}',1)[-1]!='node': continue
                  cid=node.attrib.get('client_id','')
                  if cid not in {'enb1','rue1'}: continue
                  row={'client_id':cid,'component_id':node.attrib.get('component_id','')}
                  for ch in node.iter():
                      tag=ch.tag.rsplit('}',1)[-1]
                      if tag=='hardware_type' and 'hardware_type' not in row: row['hardware_type']=ch.attrib.get('name','')
                      if tag=='disk_image' and 'disk_image' not in row: row['disk_image']=ch.attrib.get('name','')
                      if tag=='login' and ch.attrib.get('hostname') and 'login' not in row:
                          row['login']={'username':ch.attrib.get('username',''),'hostname':ch.attrib['hostname'],'port':int(ch.attrib.get('port','22'))}
                  out[cid]=row
          for cid,node in (('enb1','nuc1'),('rue1','nuc2')):
              r=out.get(cid) or {}; assert r.get('login'),f'missing login {cid}'
              assert r.get('hardware_type')==expected_hw,(cid,r.get('hardware_type'))
              assert r.get('disk_image')==expected_img,(cid,r.get('disk_image'))
              assert r.get('component_id','').endswith('+'+node),(cid,r.get('component_id'))
          json.dump(out,open(sys.argv[2],'w'),indent=2,sort_keys=True)
          print('R3F_MANIFEST_IDENTITY=PASS')
          PY

          umask 077
          mkdir -p "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+'\n'
          Path('/tmp/wp2-p7b-r3f/private.key').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$TMP/private.key"
          cat > "$TMP/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$TMP/askpass"
          export SSH_ASKPASS="$TMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$TMP/private.key" </dev/null >/dev/null || fail SSH_KEY_LOAD
          : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          SSH=(-A -o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          get_login(){ python3 - "$TMP/nodes.json" "$1" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))[sys.argv[2]]['login']
          print(f"{x.get('username','aayoub')}\t{x['hostname']}\t{x.get('port',22)}")
          PY
          }
          IFS=$'\t' read -r CORE_USER CORE_EXT CORE_PORT < <(get_login enb1)
          IFS=$'\t' read -r UE_USER UE_EXT UE_PORT < <(get_login rue1)
          for spec in "CORE:$CORE_USER:$CORE_EXT:$CORE_PORT" "UE:$UE_USER:$UE_EXT:$UE_PORT"; do
            IFS=: read -r label user host port <<< "$spec"
            ok=0; for i in $(seq 1 12); do ssh "${SSH[@]}" -p "$port" "$user@$host" true >/dev/null 2>&1 && { ok=1; break; }; sleep 5; done
            test "$ok" = 1 || fail "${label}_SSH"
            echo "$label SSH=PASS"
          done

          git archive --format=tar "$SCIENTIFIC_SOURCE_SHA" | gzip -n > "$TMP/science.tgz"
          stage(){ local user=$1 host=$2 port=$3; scp "${SSH[@]}" -P "$port" "$TMP/science.tgz" "$user@$host:/tmp/wp2-r3f-science.tgz" >/dev/null; ssh "${SSH[@]}" -p "$port" "$user@$host" 'set -eu; rm -rf "$HOME/WellPulse"; mkdir -p "$HOME/WellPulse"; tar -xzf /tmp/wp2-r3f-science.tgz -C "$HOME/WellPulse"; rm -f /tmp/wp2-r3f-science.tgz'; }
          stage "$CORE_USER" "$CORE_EXT" "$CORE_PORT" || fail STAGE_CORE
          stage "$UE_USER" "$UE_EXT" "$UE_PORT" || fail STAGE_UE

          for spec in "CORE:$CORE_USER:$CORE_EXT:$CORE_PORT" "UE:$UE_USER:$UE_EXT:$UE_PORT"; do
            IFS=: read -r label user host port <<< "$spec"
            ssh "${SSH[@]}" -p "$port" "$user@$host" 'set -eu; cd "$HOME/WellPulse"; test "$(python3 --version 2>&1)" = "Python 3.6.9"; test -x "$HOME/.wp2-golden-venv/bin/python"; test "$("$HOME/.wp2-golden-venv/bin/python" -c "import sys;print(\".\".join(map(str,sys.version_info[:3])))")" = "3.11.13"; test "$("$HOME/.wp2-golden-venv/bin/python" -c "import importlib.metadata as m;print(m.version(\"paho-mqtt\"))")" = "2.1.0"; "$HOME/.wp2-golden-venv/bin/python" -m compileall -q scripts src; test -d /proj/WellPulse && test -w /proj/WellPulse; command -v tar >/dev/null; command -v sha256sum >/dev/null; command -v rsync >/dev/null; command -v mosquitto_pub >/dev/null; echo TARGET_NATIVE_RUNTIME=PASS'
          done
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_EXT" 'set -eu; command -v mosquitto >/dev/null; /local/repository/bin/start.sh --help >/dev/null 2>&1 || true; test "$(git -C /local/repository rev-parse HEAD)" = "a6da96560b6526dc6816761282722c996418fd8c"' || fail CORE_PROFILE
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_EXT" 'set -eu; java -version >/tmp/r3f-java.txt 2>&1; grep -q "11\.0\.19" /tmp/r3f-java.txt; test "$(git -C /local/repository rev-parse HEAD)" = "a6da96560b6526dc6816761282722c996418fd8c"' || fail UE_PROFILE
          echo 'R3F_TARGET_NATIVE_RECHECK=PASS'

          echo '[#########-----------] 45%  Establishing clean Q0 LTE user plane'
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_EXT" 'set -u; for s in ue srs-ue; do tmux kill-session -t "$s" >/dev/null 2>&1 || true; done; sudo killall srsue >/dev/null 2>&1 || true; sudo ip link del tun_srsue >/dev/null 2>&1 || true; for id in 1 33 2 34; do /usr/local/etc/emulab/tmcc attenuator "$id" 0; done; sleep 2' || fail PRE_Q0_UE_CLEAN
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_EXT" 'set -u; for s in enb srs-epc srs-enb; do tmux kill-session -t "$s" >/dev/null 2>&1 || true; done; sudo killall srsenb srsepc >/dev/null 2>&1 || true; cd /local/repository; set +e; bash bin/start.sh >/tmp/wp2-r3f-core-start.txt 2>&1; exit 0' || fail CORE_START
          ready=0; for i in $(seq 1 45); do ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_EXT" 'pgrep -x srsepc >/dev/null && pgrep -x srsenb >/dev/null' && { ready=1; break; }; sleep 2; done; test "$ready" = 1 || fail CORE_NOT_READY
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_EXT" 'cd /local/repository; set +e; bash bin/start.sh >/tmp/wp2-r3f-ue-start.txt 2>&1; exit 0' || fail UE_START
          ready=0; for i in $(seq 1 60); do ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_EXT" 'pgrep -x srsue >/dev/null && ip link show tun_srsue >/dev/null 2>&1 && ip -4 addr show dev tun_srsue | grep -q "inet "' && { ready=1; break; }; sleep 2; done; test "$ready" = 1 || fail UE_NOT_READY
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_EXT" 'set -eu; ip route get 172.16.0.1 | grep -q tun_srsue; ping -I tun_srsue -c 5 -W 2 172.16.0.1 | tee /tmp/wp2-r3f-q0-ping.txt; grep -q "0% packet loss" /tmp/wp2-r3f-q0-ping.txt' || fail Q0_USER_PLANE
          echo 'R3F_PRECELL_Q0=PASS'

          RUN_ID="wp2-p7b-r3f-${GITHUB_RUN_ID}-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo '[##########----------] 50%  Executing B1 -> W1 -> B2 once via R2 entrypoint'
          set +e
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_EXT" "cd \"\$HOME/WellPulse\" && WP_RUN_ID='$RUN_ID' WP_EXPERIMENT_ID='$TARGET_EXPID' WP_CORE_HOST='enb1' WP_UE_HOST='rue1' WP_REMOTE_USER='aayoub' WP_REPO_ROOT=\"\$HOME/WellPulse\" WP_PYTHON=\"\$HOME/.wp2-golden-venv/bin/python\" WP_HARD_EXPIRY_UTC='$EXPIRES' WP_CORE_MANAGEMENT_HOST='$CORE_EXT' WP_UE_MANAGEMENT_HOST='$UE_EXT' \"\$HOME/.wp2-golden-venv/bin/python\" scripts/wp2_p7b_c_node_r2.py" 2>&1 | tee "$TMP/node-console.txt"
          NODE_RC=${PIPESTATUS[0]}
          set -e
          echo "node_rc=$NODE_RC" >> "$GITHUB_OUTPUT"
          UE_HOME="$(ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_EXT" 'printf "%s" "$HOME"')"
          CORE_HOME="$(ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_EXT" 'printf "%s" "$HOME"')"
          UE_SRC="$UE_HOME/wellpulse-powder-evidence/p7b/$RUN_ID"
          CORE_SRC="$CORE_HOME/wellpulse-powder-evidence/p7b/$RUN_ID-core"
          PDIR="/proj/WellPulse/evidence-escrow/$TARGET_EXPID/$RUN_ID"

          preserve(){ local user=$1 host=$2 port=$3 src=$4 dst=$5; ssh "${SSH[@]}" -p "$port" "$user@$host" "set -euo pipefail; test -d '$src'; rm -rf '$dst'; mkdir -p '$dst/raw'; tar -C '$src' -cf - . | tar -C '$dst/raw' -xf -; cd '$dst/raw'; find . -type f -print0 | sort -z | xargs -0 sha256sum > '../SOURCE_SHA256SUMS'; sha256sum -c '../SOURCE_SHA256SUMS' >/dev/null; printf 'PRESERVATION_GATE=PASS\n' > '../GATE.PASS'"; }
          preserve "$UE_USER" "$UE_EXT" "$UE_PORT" "$UE_SRC" "$PDIR/ue" || fail UE_EVIDENCE_ESCROW 72
          preserve "$CORE_USER" "$CORE_EXT" "$CORE_PORT" "$CORE_SRC" "$PDIR/core" || fail CORE_EVIDENCE_ESCROW 72
          echo '[#################---] 85%  Pulling each evidence tree from its originating node'
          mkdir -p "$TMP/controller/ue" "$TMP/controller/core"
          rsync -a -e "ssh ${SSH[*]} -p $UE_PORT" "$UE_USER@$UE_EXT:$PDIR/ue/" "$TMP/controller/ue/" || fail UE_CONTROLLER_PULL 73
          rsync -a -e "ssh ${SSH[*]} -p $CORE_PORT" "$CORE_USER@$CORE_EXT:$PDIR/core/" "$TMP/controller/core/" || fail CORE_CONTROLLER_PULL 73
          (cd "$TMP/controller/ue/raw" && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null) || fail UE_CONTROLLER_HASH 74
          (cd "$TMP/controller/core/raw" && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null) || fail CORE_CONTROLLER_HASH 74
          cp "$TMP/node-console.txt" "$TMP/controller/node-console.txt"
          cp "$TMP/experiment.json" "$TMP/controller/experiment.json"
          cp "$TMP/portal-gate.txt" "$TMP/controller/portal-gate.txt"
          cp "$TMP/time-gate.txt" "$TMP/controller/time-gate.txt"
          printf 'NODE_RC=%s\nRUN_ID=%s\nSCIENTIFIC_SOURCE_SHA=%s\nEXPERIMENT_ID=%s\n' "$NODE_RC" "$RUN_ID" "$SCIENTIFIC_SOURCE_SHA" "$TARGET_EXPID" > "$TMP/controller/controller-summary.txt"
          SCI_PASS=NO
          python3 - "$TMP/controller/ue/raw/p7b_c_status.json" <<'PY' && SCI_PASS=YES || true
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x.get('gate')=='PASS_PHYSICAL_CELLS',x.get('gate')
          assert x.get('completed_cells')==['P7B-B1-S3','P7B-W1-S3','P7B-B2-S3'],x.get('completed_cells')
          assert x.get('scored') is False
          assert x.get('scored_runs_authorized') is False
          assert x.get('authoritative_node_entrypoint')=='scripts/wp2_p7b_c_node_r2.py'
          print('R3F_SCIENTIFIC_STATUS=PASS')
          PY
          if [[ "$NODE_RC" -ne 0 ]]; then SCI_PASS=NO; fi
          echo "scientific_pass=$SCI_PASS" >> "$GITHUB_OUTPUT"
          echo 'EVIDENCE_ESCROW_GATE=PASS'
          echo 'CONTROLLER_OFFPOWDER_GATE=PASS'

          BUNDLE="$TMP/wp2-p7b-r3f-bundle.tar"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$TMP/controller" -cf "$BUNDLE" .
          BUNDLE_SHA="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          echo "$BUNDLE_SHA  $(basename "$BUNDLE")" > "$TMP/wp2-p7b-r3f-bundle.sha256"
          echo "bundle_sha=$BUNDLE_SHA" >> "$GITHUB_OUTPUT"
          echo "bundle_path=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "sha_path=$TMP/wp2-p7b-r3f-bundle.sha256" >> "$GITHUB_OUTPUT"
          echo '[##################--] 90%  Evidence bundle ready for immutable artifact upload'

      - name: Upload immutable evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: wp2-p7b-r3f-${{ steps.live.outputs.run_id }}
          path: |
            ${{ steps.live.outputs.bundle_path }}
            ${{ steps.live.outputs.sha_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Independent artifact read-back and SHA verification
        id: readback
        uses: actions/download-artifact@v4
        with:
          name: wp2-p7b-r3f-${{ steps.live.outputs.run_id }}
          path: /tmp/wp2-p7b-r3f-readback

      - name: Enforce independent read-back before teardown
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wp2-p7b-r3f-readback
          test -s wp2-p7b-r3f-bundle.tar
          test -s wp2-p7b-r3f-bundle.sha256
          EXPECTED='${{ steps.live.outputs.bundle_sha }}'
          ACTUAL="$(sha256sum wp2-p7b-r3f-bundle.tar | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          sha256sum -c wp2-p7b-r3f-bundle.sha256
          tar -tf wp2-p7b-r3f-bundle.tar >/dev/null
          echo 'INDEPENDENT_ARTIFACT_READBACK=PASS'
          echo 'TEARDOWN_AUTHORIZED=YES'

      - name: Teardown exact existing reservation after evidence gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/wp2_portal_client_bootstrap.sh /tmp/wp2-p7b-r3f-teardown-portal | tee /tmp/teardown-pin.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/teardown-pin.txt
          portal-cli experiment get --experiment-id "$TARGET_EXPID" > /tmp/preterm.json
          python3 scripts/wp2_portal_record_guard.py --json /tmp/preterm.json --expected-experiment-id "$TARGET_EXPID" | tee /tmp/preterm-gate.txt
          grep -q '^PORTAL_RECORD_GATE=PASS$' /tmp/preterm-gate.txt
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/preterm.json'))
          assert x.get('id')==os.environ['TARGET_EXPID']
          assert x.get('name')==os.environ['TARGET_NAME']
          assert x.get('project')=='WellPulse'
          print('PRE_TEARDOWN_IDENTITY=PASS')
          PY
          portal-cli experiment terminate --experiment-id "$TARGET_EXPID"
          confirmed=0
          for i in $(seq 1 60); do
            set +e
            portal-cli experiment get --experiment-id "$TARGET_EXPID" > /tmp/postterm.json 2>/tmp/postterm.err
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              st="$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/postterm.json')); print(str(x.get('status','unknown')).lower())
          PY
          )"
              echo "TEARDOWN_POLL_${i}=$st"
              if [[ "$st" =~ ^(terminated|destroyed)$ ]]; then confirmed=1; break; fi
            else
              echo "TEARDOWN_POLL_${i}=GET_ERROR_NOT_ACCEPTED_AS_CONFIRMATION"
            fi
            sleep 5
          done
          test "$confirmed" = 1
          echo 'TEARDOWN_CONFIRMED=YES'

      - name: Publish final non-scored qualification verdict
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN_ID=${{ steps.live.outputs.run_id }}"
          echo "NODE_RC=${{ steps.live.outputs.node_rc }}"
          echo "SCIENTIFIC_PASS=${{ steps.live.outputs.scientific_pass }}"
          echo "BUNDLE_SHA256=${{ steps.live.outputs.bundle_sha }}"
          echo 'SCORED_AUTHORIZATION=BLOCKED'
          if [[ '${{ steps.live.outputs.scientific_pass }}' = YES ]]; then
            echo 'WP2_P7B_R3F=PASS_PHYSICAL_REQUALIFICATION_EVIDENCE_SURVIVAL'
          else
            echo 'WP2_P7B_R3F=BLOCKED_SCIENTIFIC_EVIDENCE_PRESERVED_NO_RETRY'
            exit 84
          fi
