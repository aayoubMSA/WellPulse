name: WP2 Off-POWDER Artifact Transport QA

on:
  push:
    branches: [main]
    paths:
      - '.wp2-offpowder-artifact-qa-trigger'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout audited state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build deterministic synthetic escrow bundle
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wp2-artifact-qa
          mkdir -p /tmp/wp2-artifact-qa/src/raw /tmp/wp2-artifact-qa/src/escrow /tmp/wp2-artifact-qa/upload
          printf 'wellpulse-k2-artifact-qa\n' > /tmp/wp2-artifact-qa/src/raw/a.txt
          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/wp2-artifact-qa/src/raw/b.bin').write_bytes(bytes(range(256))*4)
          PY
          (
            cd /tmp/wp2-artifact-qa/src
            find . -type f ! -path './escrow/SOURCE_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > escrow/SOURCE_SHA256SUMS.txt
            sha256sum -c escrow/SOURCE_SHA256SUMS.txt
          )
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C /tmp/wp2-artifact-qa/src -cf /tmp/wp2-artifact-qa/upload/wp2-offpowder-qa.tar .
          sha256sum /tmp/wp2-artifact-qa/upload/wp2-offpowder-qa.tar | tee /tmp/wp2-artifact-qa/source_tar.sha256
          echo "source_sha=$(cut -d' ' -f1 /tmp/wp2-artifact-qa/source_tar.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload off-POWDER QA artifact
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp2-offpowder-qa-${{ github.run_id }}
          path: /tmp/wp2-artifact-qa/upload/wp2-offpowder-qa.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Download artifact to independent path
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wp2-offpowder-qa-${{ github.run_id }}
          path: /tmp/wp2-artifact-qa/roundtrip

      - name: Verify round-trip bytes and internal raw hashes
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$SOURCE_SHA"
          ROUND=/tmp/wp2-artifact-qa/roundtrip/wp2-offpowder-qa.tar
          test -s "$ROUND"
          ACTUAL=$(sha256sum "$ROUND" | awk '{print $1}')
          test "$ACTUAL" = "$SOURCE_SHA"
          mkdir -p /tmp/wp2-artifact-qa/extracted
          tar -xf "$ROUND" -C /tmp/wp2-artifact-qa/extracted
          (
            cd /tmp/wp2-artifact-qa/extracted
            sha256sum -c escrow/SOURCE_SHA256SUMS.txt
          )
          echo "K2_ARTIFACT_TRANSPORT_QA=PASS"
          echo "OFF_POWDER_COPY=GITHUB_ACTIONS_ARTIFACT"
          echo "ROUNDTRIP_TAR_SHA256=$ACTUAL"
          echo "ARTIFACT_ID=$ARTIFACT_ID"
          echo "ARTIFACT_DIGEST=${ARTIFACT_DIGEST:-not_exposed}"
          echo "POWDER_CONTACT=NO"
          echo "DRIVE_CONTACT=NO"
          echo "SCIENTIFIC_RUN=NO"
