name: WP2 P7B-RQ2 Slow Reservation Only

on:
  push:
    paths:
      - '.wp2-p7b-rq2-slow-reservation-trigger'

permissions:
  contents: read

jobs:
  reserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      PROFILE_PROJECT: PowderProfiles
      PROFILE_NAME: srslte-controlled-rf
      BINDINGS: '{"enb_node":"nuc1","ue_node":"nuc2","ue_type":"srsue"}'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Freeze RQ2 slow reservation-only authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-rq2-slow-reservation-trigger)" = $'AUTHORITY=P7B_RQ2_SLOW_RESERVATION_ONLY\nNEW_RESERVATION=ONE\nDURATION_HOURS=4\nPOLL_SECONDS=60\nGET_ERROR_BACKOFF_SECONDS=90\nREADY_QUIET_SECONDS=120\nSSH=NO\nRF=NO\nCELLS=NO\nTEARDOWN=NO\nSCORED=NO\nAUTOMATIC_RETRY=NO'
          ! grep -Eq 'portal-cli[[:space:]]+experiment[[:space:]]+terminate' .github/workflows/wp2-p7b-rq2-slow-reservation.yml
          ! grep -Eq 'tmcc|attenuator|wp2_p7b_c_node|rsync|scp[[:space:]]' .github/workflows/wp2-p7b-rq2-slow-reservation.yml
          echo 'RQ2_SLOW_AUTHORITY=PASS'

      - name: Create one reservation slowly and stop at stable READY
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-rq2-slow
          rm -rf "$TMP"; mkdir -p "$TMP"
          fail(){ echo "RQ2_SLOW_RESERVATION=BLOCKED:$1" >&2; exit "${2:-90}"; }

          bash scripts/wp2_portal_client_bootstrap.sh "$TMP/portal-api" | tee "$TMP/portal-pin.txt"
          grep -q '^PORTAL_API_PIN_GATE=PASS$' "$TMP/portal-pin.txt" || fail PORTAL_PIN

          echo 'PACED_CONTROL=quiet-before-list:30s'
          sleep 30
          portal-cli experiment list > "$TMP/list-before.json" || fail PORTAL_LIST
          python3 -c 'import json; x=json.load(open("/tmp/wp2-rq2-slow/list-before.json")); xs=x if isinstance(x,list) else x.get("experiments",[]); terminal={"terminated","destroyed","failed","error"}; a=[{"id":r.get("id"),"name":str(r.get("name","")),"status":str(r.get("status","")).lower()} for r in xs if isinstance(r,dict) and r.get("project")=="WellPulse" and str(r.get("name","")).startswith("wp7b") and str(r.get("status","")).lower() not in terminal]; print("ACTIVE_P7B_CONFLICT="+(json.dumps(a,sort_keys=True,separators=(",",":")) if a else "NONE")); raise SystemExit(20 if a else 0)'

          echo 'PACED_CONTROL=quiet-before-create:30s'
          sleep 30

          umask 077
          python3 -c 'import os,pathlib; raw=os.environ["POWDER_SSH_PRIVATE_KEY"].replace("\r\n","\n").replace("\r","\n").lstrip("\ufeff").strip()+"\n"; pathlib.Path("/tmp/wp2-rq2-slow/private.key").write_text(raw,encoding="utf-8",newline="\n")'
          chmod 600 "$TMP/private.key"
          PUB="$(ssh-keygen -y -f "$TMP/private.key")"
          SUFFIX="${GITHUB_RUN_ID: -6}"
          EXP_NAME="wp7brq2${SUFFIX}"
          portal-cli experiment create --name "$EXP_NAME" --project WellPulse --profile-name "$PROFILE_NAME" --profile-project "$PROFILE_PROJECT" --duration 4 --bindings "$BINDINGS" --sshpubkey "$PUB" > "$TMP/create.json" || fail CREATE
          EXPID="$(python3 -c 'import json; print(json.load(open("/tmp/wp2-rq2-slow/create.json")).get("id",""))')"
          [[ "$EXPID" =~ ^[0-9A-Fa-f-]{36}$ ]] || fail CREATE_NO_UUID
          echo "EXPERIMENT_ID=$EXPID"
          echo "EXPERIMENT_NAME=$EXP_NAME"

          echo 'PACED_CONTROL=first-ready-check-after-60s'
          sleep 60
          READY=0
          for i in $(seq 1 20); do
            set +e
            portal-cli experiment get --experiment-id "$EXPID" > "$TMP/status.json" 2>"$TMP/status.err"
            rc=$?
            set -e
            if [[ "$rc" -ne 0 ]]; then
              echo "SLOW_POLL_${i}=GET_ERROR;backoff=90s"
              sleep 90
              continue
            fi
            STATUS="$(python3 -c 'import json; print(str(json.load(open("/tmp/wp2-rq2-slow/status.json")).get("status","unknown")).lower())')"
            echo "SLOW_POLL_${i}=$STATUS"
            if [[ "$STATUS" == ready ]]; then READY=1; break; fi
            [[ "$STATUS" =~ ^(failed|error|terminated|destroyed)$ ]] && fail "TERMINAL_$STATUS"
            sleep 60
          done
          [[ "$READY" -eq 1 ]] || fail READY_TIMEOUT

          python3 scripts/wp2_portal_record_guard.py --json "$TMP/status.json" --expected-experiment-id "$EXPID" | tee "$TMP/ready-gate.txt"
          grep -q '^PORTAL_RECORD_GATE=PASS$' "$TMP/ready-gate.txt" || fail READY_RECORD

          echo 'PACED_CONTROL=ready-quiet-period:120s'
          sleep 120

          portal-cli experiment get --experiment-id "$EXPID" > "$TMP/stable.json" || fail STABLE_GET
          python3 scripts/wp2_portal_record_guard.py --json "$TMP/stable.json" --expected-experiment-id "$EXPID" | tee "$TMP/stable-gate.txt"
          grep -q '^PORTAL_RECORD_GATE=PASS$' "$TMP/stable-gate.txt" || fail STABLE_RECORD
          portal-cli experiment manifests get --experiment-id "$EXPID" > "$TMP/manifest.json" || fail MANIFEST
          python3 -c 'import json; x=json.load(open("/tmp/wp2-rq2-slow/stable.json")); m=json.load(open("/tmp/wp2-rq2-slow/manifest.json")); t=json.dumps(m); assert x.get("project")=="WellPulse"; assert str(x.get("status","")).lower()=="ready"; assert "nuc1" in t and "nuc2" in t and "srsue" in t; print("RQ2_STABLE_READY_MANIFEST=PASS"); print("SSH_AUTHORIZED=NO"); print("RF_AUTHORIZED=NO"); print("CELLS_AUTHORIZED=NO"); print("TEARDOWN_AUTHORIZED=NO"); print("RQ2_SLOW_RESERVATION=PASS_READY_AND_STOP")'
