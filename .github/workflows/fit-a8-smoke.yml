name: FIT A8 capability smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.fit-smoke-trigger'

permissions:
  contents: read

concurrency:
  group: wellpulse-fit-a8-smoke
  cancel-in-progress: true

jobs:
  fit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIT_USERNAME: ${{ secrets.FIT_USERNAME }}
      FIT_PASSWORD: ${{ secrets.FIT_PASSWORD }}
      RUN_DIR: fit-smoke

    steps:
      - name: Checkout WellPulse trigger branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize evidence and FIT CLI
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUN_DIR"
          if [ -z "${FIT_USERNAME:-}" ] || [ -z "${FIT_PASSWORD:-}" ]; then
            echo "FIT Actions secrets are required." >&2
            exit 2
          fi
          {
            echo "evidence_class=EAS_A8M3_PLUMBING_NON_SCORED"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "workflow_git_commit=$GITHUB_SHA"
            echo "eas_source_commit=75e90de8d6ba72b834f84b0f2b58414550140672"
            echo "start_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$RUN_DIR/workflow_context.txt"
          python -m pip install --disable-pip-version-check iotlabcli
          iotlab-auth --version | tee "$RUN_DIR/iotlabcli_version.txt"
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path.home()/'.iotlabrc'
          p.write_text(os.environ['FIT_USERNAME']+':'+base64.b64encode(os.environ['FIT_PASSWORD'].encode()).decode())
          p.chmod(0o600)
          PY

      - name: Register ephemeral SSH key
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          ssh-keygen -t rsa -b 3072 -N '' -f "$HOME/.ssh/id_rsa" -C "EAS-FIT-${GITHUB_RUN_ID}" >/dev/null
          chmod 600 "$HOME/.ssh/id_rsa"; chmod 644 "$HOME/.ssh/id_rsa.pub"
          cp "$HOME/.ssh/id_rsa.pub" "$RUNNER_TEMP/eas_fit_key.pub"
          ssh-keygen -lf "$HOME/.ssh/id_rsa.pub" -E sha256 | tee "$RUN_DIR/ssh_key_fingerprint.txt"
          iotlab-auth --add-ssh-key | tee "$RUN_DIR/add_key.log"
          python - <<'PY'
          from pathlib import Path
          from iotlabcli import auth
          from iotlabcli.rest import Api
          key=(Path.home()/'.ssh'/'id_rsa.pub').read_text().strip()
          user,pw=auth._read_password_file(); keys=Api(user,pw).get_ssh_keys().get('sshkeys',[])
          print('key_visible_in_profile='+('PASS' if key in keys else 'FAIL'))
          if key not in keys: raise SystemExit(4)
          PY

      - name: Prove frontend SSH transport
        shell: bash
        run: |
          set -u
          ok=0
          for attempt in 1 2 3 4 5 6 7; do
            echo "frontend_ssh_attempt=$attempt" | tee -a "$RUN_DIR/frontend_ssh.log"
            if ssh -i "$HOME/.ssh/id_rsa" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o PubkeyAcceptedAlgorithms=+ssh-rsa "$FIT_USERNAME@saclay.iot-lab.info" 'echo frontend_ssh=PASS' 2>&1 | tee -a "$RUN_DIR/frontend_ssh.log"; then
              ok=1; break
            fi
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then echo "frontend_ssh=FAIL" | tee -a "$RUN_DIR/frontend_ssh.log"; exit 5; fi

      - name: Inventory and reserve one A8 node
        shell: bash
        run: |
          set -eu
          iotlab-status --nodes --archi a8 --state Alive > "$RUN_DIR/a8_alive.json"
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('fit-smoke/a8_alive.json').read_text()).get('items',[])
          seen=[]
          for item in items:
              addr=item.get('network_address',''); arch=item.get('archi') or 'a8:at86rf231'; parts=addr.split('.')
              if len(parts)>=2 and 'a8-' in parts[0] and (parts[1],arch) not in seen: seen.append((parts[1],arch))
          pref=['saclay','grenoble','paris','strasbourg']; seen.sort(key=lambda x:(pref.index(x[0]) if x[0] in pref else 99,x[0]))
          Path('fit-smoke/candidate_sites.txt').write_text(''.join(f'{s}|{a}\n' for s,a in seen))
          print('Alive A8 rows:',len(items)); print('Candidate sites:',', '.join(s for s,_ in seen))
          PY
          EXP_ID=''; SITE=''; ARCHI=''
          while IFS='|' read -r candidate_site candidate_archi; do
            [ -n "$candidate_site" ] || continue
            set +e
            out=$(iotlab-experiment submit -n "EAS-plumbing-${GITHUB_RUN_ID}-${candidate_site}" -d 10 -l "1,archi=${candidate_archi}+site=${candidate_site}" 2>&1); rc=$?
            set -e
            printf '%s\n' "$out" >> "$RUN_DIR/reservation_attempts.log"
            [ "$rc" -eq 0 ] || continue
            cid=$(printf '%s' "$out" | python -c 'import re,sys; m=re.search(r"\"id\"\s*:\s*(\d+)",sys.stdin.read()); print(m.group(1) if m else "")')
            [ -n "$cid" ] || continue
            set +e; iotlab-experiment wait -i "$cid" --timeout 120 --cancel-on-timeout >> "$RUN_DIR/reservation_attempts.log" 2>&1; wrc=$?; set -e
            if [ "$wrc" -eq 0 ]; then EXP_ID="$cid"; SITE="$candidate_site"; ARCHI="$candidate_archi"; break; fi
          done < "$RUN_DIR/candidate_sites.txt"
          [ -n "$EXP_ID" ] || { echo "No A8 reservation obtained." >&2; exit 6; }
          echo "EXP_ID=$EXP_ID" >> "$GITHUB_ENV"; echo "SITE=$SITE" >> "$GITHUB_ENV"; echo "ARCHI=$ARCHI" >> "$GITHUB_ENV"
          printf 'experiment_id=%s\nsite=%s\narchi=%s\n' "$EXP_ID" "$SITE" "$ARCHI" | tee "$RUN_DIR/selected_experiment.txt"

      - name: Resolve allocated A8 node
        shell: bash
        run: |
          set -eu
          iotlab-experiment get -i "$EXP_ID" -n > "$RUN_DIR/experiment_nodes.json"
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          item=json.loads(Path('fit-smoke/experiment_nodes.json').read_text())['items'][0]; addr=item['network_address']
          m=re.search(r'(?:node-)?a8-(\d+)\.',addr)
          if not m: raise SystemExit('Cannot parse '+addr)
          nid=m.group(1); site=os.environ['SITE']; node=f'node-a8-{nid}.{site}.iot-lab.info'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'NODE_ID={nid}\nNODE_ADDRESS={addr}\nNODE_SSH={node}\n')
          Path('fit-smoke/selected_node.txt').write_text(f'node_address={addr}\nnode_id={nid}\nnode_ssh={node}\n')
          PY

      - name: Configure explicit SSH proxy
        shell: bash
        run: |
          set -eu
          cat > "$HOME/.ssh/config" <<EOF
          Host fit-frontend
            HostName ${SITE}.iot-lab.info
            User ${FIT_USERNAME}
            IdentityFile ${HOME}/.ssh/id_rsa
            IdentitiesOnly yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            StrictHostKeyChecking accept-new
          Host fit-a8
            HostName ${NODE_SSH}
            User root
            IdentityFile ${HOME}/.ssh/id_rsa
            IdentitiesOnly yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyJump fit-frontend
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh fit-frontend 'echo selected_frontend_ssh=PASS' | tee "$RUN_DIR/selected_frontend_ssh.log"

      - name: Wait for A8 Linux boot over raw SSH
        shell: bash
        run: |
          set -u
          ok=0
          for attempt in $(seq 1 24); do
            echo "a8_boot_attempt=$attempt" | tee -a "$RUN_DIR/a8_boot.log"
            if ssh -o ConnectTimeout=8 fit-a8 'echo a8_ssh=PASS; uname -a' 2>&1 | tee -a "$RUN_DIR/a8_boot.log"; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo "a8_ssh=FAIL" | tee -a "$RUN_DIR/a8_boot.log"; exit 7; }

      - name: Prestage official firmware and probe through shared NFS
        shell: bash
        run: |
          set -euo pipefail
          ssh fit-frontend 'mkdir -p ~/shared/.iotlabsshcli && wget -q -O ~/shared/.iotlabsshcli/tutorial_a8_m3.elf https://iot-lab.github.io/assets/firmwares/tutorial_a8_m3.elf && test -s ~/shared/.iotlabsshcli/tutorial_a8_m3.elf && echo firmware_prestage=PASS' 2>&1 | tee "$RUN_DIR/prestage_firmware.log"
          scp scripts/fit_probe.sh fit-frontend:shared/.iotlabsshcli/fit_probe.sh 2>&1 | tee "$RUN_DIR/copy_probe.log"

      - name: Execute A8-M3 plumbing probe
        shell: bash
        run: |
          set -euo pipefail
          ssh fit-a8 'chmod +x "$HOME/shared/.iotlabsshcli/fit_probe.sh"; sh "$HOME/shared/.iotlabsshcli/fit_probe.sh" "$HOME/shared/.iotlabsshcli/fit_probe.log"; cat "$HOME/shared/.iotlabsshcli/fit_probe.log"; echo "--- probe sha256 ---"; cat "$HOME/shared/.iotlabsshcli/fit_probe.log.sha256"' 2>&1 | tee "$RUN_DIR/probe_remote.log"

      - name: Evaluate P2 evidence
        shell: bash
        run: |
          set -eu
          grep -E 'firmware_source=|firmware_fetch=|m3_flash=|uart_device=|uart_config=|uart_response_nonempty=|m3_a8_request_response=|plumbing_status=|plumbing_fail_code=' "$RUN_DIR/probe_remote.log" | tee "$RUN_DIR/plumbing_summary.txt" || true
          if grep -q '^plumbing_status=PASS$' "$RUN_DIR/probe_remote.log"; then echo 'P2_A8M3_SMOKE=PASS' | tee -a "$RUN_DIR/plumbing_summary.txt"; else echo 'P2_A8M3_SMOKE=FAIL' | tee -a "$RUN_DIR/plumbing_summary.txt"; exit 10; fi

      - name: Write metadata
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('fit-smoke').mkdir(exist_ok=True)
          out={k:os.getenv(k) for k in ['EXP_ID','SITE','ARCHI','NODE_ID','NODE_ADDRESS','NODE_SSH']}
          out.update({'evidence_class':'EAS_A8M3_PLUMBING_NON_SCORED','eas_source_commit':'75e90de8d6ba72b834f84b0f2b58414550140672','github_run_id':os.getenv('GITHUB_RUN_ID'),'end_utc':datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')})
          Path('fit-smoke/metadata.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Cleanup experiment and ephemeral key
        if: always()
        shell: bash
        run: |
          set +e
          [ -z "${EXP_ID:-}" ] || iotlab-experiment stop -i "$EXP_ID" >/dev/null 2>&1 || true
          if [ -f "$HOME/.iotlabrc" ] && [ -f "$RUNNER_TEMP/eas_fit_key.pub" ]; then
            python - <<'PY'
          from pathlib import Path
          from iotlabcli import auth
          from iotlabcli.rest import Api
          p=Path.home()/'.ssh'/'id_rsa.pub'
          if p.exists():
              key=p.read_text().strip(); user,pw=auth._read_password_file()
              if user and pw:
                  api=Api(user,pw); obj=api.get_ssh_keys(); keys=obj.get('sshkeys',[])
                  if key in keys: obj['sshkeys']=[k for k in keys if k!=key]; api.set_ssh_keys(obj)
          PY
          fi
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/id_rsa.pub" "$HOME/.ssh/config" "$RUNNER_TEMP/eas_fit_key.pub"
          if command -v shred >/dev/null 2>&1; then shred -u "$HOME/.iotlabrc" 2>/dev/null || rm -f "$HOME/.iotlabrc"; else rm -f "$HOME/.iotlabrc"; fi
          echo "end_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$RUN_DIR/workflow_context.txt" 2>/dev/null || true

      - name: Upload EAS plumbing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-a8m3-plumbing-${{ github.run_id }}
          path: fit-smoke/
          if-no-files-found: error
          retention-days: 30
