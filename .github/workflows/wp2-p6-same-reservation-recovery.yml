name: WP2 P6 — Same Reservation G0 Recovery

on:
  push:
    branches: [main]
    paths:
      - '.wp2-p6-recover-trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: wp2-p6-same-reservation-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      WP_P6_EXPERIMENT_ID: 5579cf25-dbb1-4d04-87e3-ff558e3be2af
      WP_P6_SOURCE_SHA: bd1b5e12f3d2eca27ec81ccadbeec5afaa2f2159
      WP_P6_RECOVERY_MIN_REMAINING_S: '1800'

    steps:
      - name: Checkout recovery control state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install bounded controller dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync jq curl >/dev/null

      - name: Freeze same-reservation recovery contract
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(awk -F= '$1=="recover" {print $2}' .wp2-p6-recover-trigger | tail -n1 | tr -d '\r')"
          EXP="$(awk -F= '$1=="experiment_id" {print $2}' .wp2-p6-recover-trigger | tail -n1 | tr -d '\r')"
          [[ "$AUTH" == "WP2_P6_SAME_RESERVATION_G0_FIX" ]]
          [[ "$EXP" == "$WP_P6_EXPERIMENT_ID" ]]
          [[ -n "$PORTAL_TOKEN" ]]
          [[ -n "$POWDER_SSH_PRIVATE_KEY" ]]
          bash -n powder/wp2_p6_recover_existing.sh
          ! grep -Eq 'portal-cli[[:space:]]+experiment[[:space:]]+create' powder/wp2_p6_recover_existing.sh
          grep -q 'P6_INTERNAL_MANAGEMENT_ALIAS_GATE=PASS' powder/wp2_p6_recover_existing.sh
          grep -q 'AUTOMATIC_TERMINATION=PROHIBITED' powder/wp2_p6_recover_existing.sh
          grep -q 'WP_PERSIST_ROOT=.*/proj/WellPulse/evidence-escrow' powder/wp2_p6_recover_existing.sh

          # Prospective recovery-only lifecycle amendment: first-time 2700 s
          # bound included provisioning/bootstrap. Existing reservation recovery
          # uses the frozen 1800 s bound from the amendment record.
          python3 - <<'PY'
          from pathlib import Path
          src=Path('powder/wp2_p6_recover_existing.sh').read_text()
          old='--min-remaining-s 2700'
          assert src.count(old)==1, src.count(old)
          out=src.replace(old,'--min-remaining-s 1800')
          Path('/tmp/wp2_p6_recover_existing_1800.sh').write_text(out)
          PY
          bash -n /tmp/wp2_p6_recover_existing_1800.sh
          grep -q -- '--min-remaining-s 1800' /tmp/wp2_p6_recover_existing_1800.sh
          ! grep -q -- '--min-remaining-s 2700' /tmp/wp2_p6_recover_existing_1800.sh
          echo 'P6_RECOVERY_CONTRACT_QA=PASS'
          echo 'SECOND_RESERVATION_AUTHORIZED=NO'
          echo 'P6_RECOVERY_MIN_REMAINING_S=1800'
          echo 'SCORED_RUN_AUTHORIZED=NO'

      - name: Execute exact existing-reservation recovery
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /tmp/wp2_p6_recover_existing_1800.sh
          set +e
          WP_P6_EXPERIMENT_ID="$WP_P6_EXPERIMENT_ID" \
          WP_P6_SOURCE_SHA="$WP_P6_SOURCE_SHA" \
          bash /tmp/wp2_p6_recover_existing_1800.sh 2>&1 | tee /tmp/wp2-p6-recovery-step.log
          RC=${PIPESTATUS[0]}
          set -e
          if [[ -f /tmp/wp2-p6-recover/result.env ]]; then
            set -a
            source /tmp/wp2-p6-recover/result.env
            set +a
          fi
          echo "experiment_id=${EXPERIMENT_ID:-$WP_P6_EXPERIMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "run_id=${RUN_ID:-}" >> "$GITHUB_OUTPUT"
          echo "hard_expiry_utc=${HARD_EXPIRY_UTC:-}" >> "$GITHUB_OUTPUT"
          echo "persistent_dir=${PERSISTENT_DIR:-}" >> "$GITHUB_OUTPUT"
          echo "bundle_path=${BUNDLE_PATH:-}" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=${BUNDLE_SHA256:-}" >> "$GITHUB_OUTPUT"
          echo "execute_rc=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Upload recovered Golden controller bundle
        id: upload
        if: steps.execute.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp2-p6-recovery-${{ github.run_id }}
          path: ${{ steps.execute.outputs.bundle_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Independent artifact read-back
        id: download
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wp2-p6-recovery-${{ github.run_id }}
          path: /tmp/wp2-p6-recovery-roundtrip

      - name: Verify evidence and terminate exact existing experiment
        id: finalize
        if: steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.execute.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          ROUNDTRIP="$(find /tmp/wp2-p6-recovery-roundtrip -maxdepth 2 -type f -name '*.tar' | head -1)"
          [[ -s "$ROUNDTRIP" ]]
          WP_ROUNDTRIP_TAR="$ROUNDTRIP" \
          WP_EXPECTED_BUNDLE_SHA256="$EXPECTED_SHA" \
          WP_VERIFY_DIR=/tmp/wp2-p6-recovery-verified \
          bash scripts/wp2_controller_verify_artifact_roundtrip.sh | tee /tmp/wp2-p6-recovery-finalization.txt
          grep -q '^CONTROLLER_OFFPOWDER_GATE=PASS$' /tmp/wp2-p6-recovery-finalization.txt
          grep -q '^EVIDENCE_ESCROW_GATE=PASS$' /tmp/wp2-p6-recovery-finalization.txt
          grep -q '^TEARDOWN_AUTHORIZED=YES$' /tmp/wp2-p6-recovery-finalization.txt

          bash scripts/wp2_portal_client_bootstrap.sh /tmp/portal-api-p6-final >/tmp/wp2-p6-portal-final-pin.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/wp2-p6-portal-final-pin.txt
          portal-cli experiment terminate --experiment-id "$WP_P6_EXPERIMENT_ID" > /tmp/wp2-p6-terminate.json 2>/tmp/wp2-p6-terminate.err || true
          TERMINATED=0
          for i in $(seq 1 60); do
            set +e
            portal-cli experiment get --experiment-id "$WP_P6_EXPERIMENT_ID" > /tmp/wp2-p6-postterm.json 2>/dev/null
            rc=$?
            set -e
            if [[ "$rc" -ne 0 ]]; then TERMINATED=1; break; fi
            st="$(jq -r '.status // "unknown"' /tmp/wp2-p6-postterm.json)"
            echo "P6_RECOVERY_TERMINATION_POLL_${i}=$st"
            if [[ "$st" =~ ^(terminated|destroyed)$ ]]; then TERMINATED=1; break; fi
            sleep 5
          done
          [[ "$TERMINATED" -eq 1 ]]
          echo 'P6_RECOVERY_ARTIFACT_ROUNDTRIP=PASS'
          echo 'EVIDENCE_ESCROW_GATE=PASS'
          echo 'TEARDOWN_AUTHORIZED=YES'
          echo 'TEARDOWN_CONFIRMED=YES'
          echo 'WP2_P6_RECOVERY=PASS'

      - name: Final fail-closed recovery verdict
        if: always()
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          EXPERIMENT_ID: ${{ steps.execute.outputs.experiment_id }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
        run: |
          set -euo pipefail
          echo "P6_RECOVERY_EXPERIMENT_ID=${EXPERIMENT_ID:-$WP_P6_EXPERIMENT_ID}"
          echo "P6_RECOVERY_RUN_ID=${RUN_ID:-not_started}"
          echo "P6_RECOVERY_EXECUTE_OUTCOME=${EXECUTE_OUTCOME}"
          echo "P6_RECOVERY_FINALIZE_OUTCOME=${FINALIZE_OUTCOME}"
          if [[ "$FINALIZE_OUTCOME" != success ]]; then
            echo 'WP2_P6_RECOVERY_WORKFLOW=FAIL_CLOSED'
            echo 'SECOND_RESERVATION_AUTHORIZED=NO'
            echo 'SCORED_RUN_AUTHORIZED=NO'
            exit 1
          fi
          echo 'WP2_P6_RECOVERY_WORKFLOW=PASS'
          echo 'SECOND_RESERVATION_AUTHORIZED=NO'
          echo 'SCORED_RUN_AUTHORIZED=NO'
