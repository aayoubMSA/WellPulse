name: WP2 A3 Hardened Offline QA

on:
  push:
    branches:
      - wp2-a3-adoption-hardening-20260827
    paths:
      - 'powder/wp2-a3-review1.trigger'

permissions:
  contents: read

concurrency:
  group: wp2-a3-hardened-offline-qa
  cancel-in-progress: false

jobs:
  hardened-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install QA-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync rclone

      - name: Bash syntax and forbidden-path gate
        shell: bash
        run: |
          set -euo pipefail
          bash -n powder/wp2_a3_adopt.sh
          bash -n powder/wp2_a3_prepare_q0.sh
          bash -n scripts/wp2_a3_runtime_bootstrap.sh
          bash -n scripts/wp2_golden_orchestrator.sh
          bash -n scripts/wp2_golden_service_restore.sh
          bash -n scripts/wp2_golden_service_ready_probe.sh
          bash -n scripts/wp2_golden_evidence_escrow.sh
          bash -n scripts/wp2_golden_offpowder_rclone.sh
          bash -n scripts/wp2_golden_teardown_guard_rclone.sh
          bash -n scripts/wp2_golden_offline_qa.sh
          ! grep -Eq 'portal-cli[[:space:]]+experiment[[:space:]]+create|experiment[[:space:]]+create' powder/wp2_a3_adopt.sh powder/wp2_a3_prepare_q0.sh
          ! grep -Eq 'tmcc[[:space:]]+attenuator' powder/wp2_a3_prepare_q0.sh
          grep -q '357f3275-403d-491a-906f-99677bdf454f' powder/wp2_a3_adopt.sh
          grep -q '357f3275-403d-491a-906f-99677bdf454f' powder/wp2_a3_prepare_q0.sh
          echo 'REVIEW2_STATIC_FORBIDDEN_PATHS=PASS'

      - name: Python compile gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/wp_pwd01_golden_sender.py
          python3 -m py_compile scripts/wp_pwd01_h_receiver.py
          python3 -m py_compile scripts/reconstruct_wp2_golden.py
          python3 -m py_compile scripts/wp2_golden_rclone_verify.py
          python3 -m py_compile src/wellpulse/transport.py
          echo 'REVIEW2_PYTHON_COMPILE=PASS'

      - name: Production-path offline contract QA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/wp2_golden_offline_qa.sh

      - name: Runtime and evidence contract assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'paho-mqtt==2.1.0' pyproject.toml
          grep -q 'PAHO_VERSION' scripts/wp2_golden_orchestrator.sh
          grep -q 'cleanup_runtime' scripts/wp2_golden_orchestrator.sh
          grep -q 'PERSISTENT_ESCROW_GATE.PASS' experiments/WP-PWD01/evidence_inventory_golden_v1.txt
          grep -q 'OFF_POWDER_RCLONE.PASS' experiments/WP-PWD01/evidence_inventory_golden_v1.txt
          ! grep -q 'OFF_POWDER_SHA256SUMS.txt' experiments/WP-PWD01/evidence_inventory_golden_v1.txt
          echo 'REVIEW2_RUNTIME_EVIDENCE_CONTRACT=PASS'

      - name: Review 2 verdict
        shell: bash
        run: |
          echo 'WP2_A3_REVIEW2_QA=PASS'
          echo 'POWDER_MUTATION_EXECUTED=NO'
          echo 'SCORED_RUN_EXECUTED=NO'
