name: G3 Fix SSH Secret Encoding

on:
  push:
    branches: [main]
    paths:
      - powder/g3-fix-key-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch only SSH secret normalization in valid G3 attach workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/powder-g3-attach.yml')
          text = p.read_text()
          old = '''          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\\n' "$POWDER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
'''
          new = '''          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          python - <<'PYKEY'
          import os
          from pathlib import Path
          s = os.environ['POWDER_SSH_PRIVATE_KEY']
          s = s.replace('\\r\\n', '\\n').replace('\\r', '\\n')
          if '\\\\n' in s and '\\n' not in s:
              s = s.replace('\\\\n', '\\n')
          if not s.endswith('\\n'):
              s += '\\n'
          Path.home().joinpath('.ssh/id_ed25519').write_text(s, encoding='utf-8')
          PYKEY
          chmod 600 "$HOME/.ssh/id_ed25519"
'''
          if old not in text:
              raise SystemExit('Expected SSH setup block not found; refusing broad edit')
          if text.count(old) != 1:
              raise SystemExit('Expected SSH setup block is not unique; refusing edit')
          p.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- .github/workflows/powder-g3-attach.yml

      - name: Commit narrow patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/powder-g3-attach.yml
          git diff --cached --quiet && { echo 'No change required.'; exit 0; }
          git commit -m 'Normalize G3 automation SSH secret encoding'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
