name: WellPulse R5 Stage-A — Scored FIT

on:
  workflow_dispatch:
    inputs:
      execution_authorization:
        description: "Explicit authorization required for the 3 scored Stage-A runs"
        required: true
        default: "DO_NOT_EXECUTE"
        type: choice
        options:
          - "DO_NOT_EXECUTE"
          - "EXECUTE_R5_STAGE_A"

permissions:
  contents: read

concurrency:
  group: wellpulse-r5-stage-a-scored
  cancel-in-progress: false

jobs:
  stage-a:
    name: R5 Stage-A — exactly R1/R2/R3
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      FIT_IDENTIFIER: ${{ secrets.FIT_USERNAME }}
      FIT_PASSWORD: ${{ secrets.FIT_PASSWORD }}
      FIT_SITE: grenoble
      R5_ROOT: r5-stage-a
      FROZEN_R5_COMMIT: c9fd8968f1408d9a2e3a57dd825df05c2f1d9147

    steps:
      - name: Authorization gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.execution_authorization }}" = "EXECUTE_R5_STAGE_A" || {
            echo "Scored execution not authorized."
            exit 2
          }

      - name: Check out frozen R5 Stage-A authority
        uses: actions/checkout@v4
        with:
          ref: c9fd8968f1408d9a2e3a57dd825df05c2f1d9147
          persist-credentials: false

      - name: Record frozen provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$R5_ROOT"
          git rev-parse HEAD | tee "$R5_ROOT/executed_git_commit.txt"
          test "$(git rev-parse HEAD)" = "$FROZEN_R5_COMMIT"
          git status --short | tee "$R5_ROOT/pre_run_git_status.txt"
          printf '%s\n' "R5_SCORED_STAGE_A" > "$R5_ROOT/evidence_class.txt"

      - name: Set up controller runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static preflight on frozen harness
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             scripts/analyze_r5_stage_a_run.py             scripts/adjudicate_r5_stage_a.py             tests/test_r5_stage_a.py
          python -m unittest tests/test_r5_stage_a.py
          bash -n scripts/run_fit_r5_stage_a_loop.sh
          test "$(grep -Ec '^run_t1 R[123]$' scripts/run_fit_r5_stage_a_loop.sh)" -eq 3
          ! grep -Eq '^run_t1 R[45]$' scripts/run_fit_r5_stage_a_loop.sh
          ! grep -F 'FIT_PASSWORD' scripts/run_fit_r5_stage_a_loop.sh

      - name: Install FIT IoT-LAB clients
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check iotlabcli iotlabsshcli

      - name: Verify FIT secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIT_IDENTIFIER" || { echo "FIT_USERNAME secret missing" >&2; exit 2; }
          test -n "$FIT_PASSWORD" || { echo "FIT_PASSWORD secret missing" >&2; exit 2; }
          echo "FIT credential presence: PASS"

      - name: Prepare trust anchor and Python-3.5 paho bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$R5_ROOT/bootstrap" "$HOME/.ssh"
          bash scripts/fetch_mqtt_trust_anchor.sh "$R5_ROOT/bootstrap/iot-lab-ca.pem"             > "$R5_ROOT/bootstrap/trust_anchor.txt"
          python -m pip download --no-deps paho-mqtt==1.6.1 -d "$R5_ROOT/bootstrap" >/dev/null
          python - "$R5_ROOT/bootstrap" <<'PY'
          import sys,tarfile,zipfile,shutil
          from pathlib import Path
          root=Path(sys.argv[1])
          src=next(root.glob('paho-mqtt-1.6.1*'))
          out=root/'paho_extract'
          out.mkdir(exist_ok=True)
          if src.suffix=='.whl':
              zipfile.ZipFile(src).extractall(out)
          else:
              tarfile.open(src).extractall(out)
          cand=[p for p in list(out.glob('**/src/paho'))+list(out.glob('**/paho')) if (p/'mqtt').is_dir()]
          if not cand:
              raise SystemExit('paho package missing')
          shutil.make_archive(str(root/'paho_py35'),'gztar',root_dir=str(cand[0].parent),base_dir='paho')
          PY

      - name: Resolve FIT login and register ephemeral SSH key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,os,re
          from pathlib import Path
          from iotlabcli.rest import Api
          ident=os.environ['FIT_IDENTIFIER']
          password=os.environ['FIT_PASSWORD']
          profile=Api(ident,password).method('user')
          login=profile.get('login') if isinstance(profile,dict) else None
          if not login or not re.fullmatch(r'[a-z][0-9a-z]{3,19}',login):
              raise SystemExit('No valid FIT login')
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              fh.write('FIT_LOGIN=%s\n'%login)
          p=Path.home()/'.iotlabrc'
          p.write_text(login+':'+base64.b64encode(password.encode()).decode())
          p.chmod(0o600)
          PY
          ssh-keygen -t rsa -b 3072 -N '' -f "$HOME/.ssh/id_rsa"             -C "WellPulse-R5-StageA-${GITHUB_RUN_ID}" >/dev/null
          chmod 600 "$HOME/.ssh/id_rsa"
          chmod 644 "$HOME/.ssh/id_rsa.pub"
          iotlab-auth --add-ssh-key > "$R5_ROOT/bootstrap/add_ssh_key.log"
          echo "SSH_KEY=$HOME/.ssh/id_rsa" >> "$GITHUB_ENV"

      - name: Reserve one Grenoble A8
        shell: bash
        run: |
          set -euo pipefail
          submit=$(iotlab-experiment submit             -n "WP-R5-StageA-${GITHUB_RUN_ID}"             -d 90             -l '1,archi=a8:at86rf231+site=grenoble')
          printf '%s\n' "$submit" | tee "$R5_ROOT/bootstrap/reservation_submit.json"
          EXP_ID=$(printf '%s' "$submit" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "EXP_ID=$EXP_ID" >> "$GITHUB_ENV"
          iotlab-experiment wait -i "$EXP_ID" --timeout 300 --cancel-on-timeout             > "$R5_ROOT/bootstrap/reservation_wait.txt"
          iotlab-experiment get -i "$EXP_ID" -n > "$R5_ROOT/bootstrap/experiment_nodes.json"
          python - <<'PY'
          import json,os,re
          p=os.environ['R5_ROOT']+'/bootstrap/experiment_nodes.json'
          items=json.load(open(p)).get('items',[])
          if not items:
              raise SystemExit('No A8 node allocated')
          addr=items[0]['network_address']
          m=re.search(r'(?:node-)?a8-(\d+)\.',addr)
          if not m:
              raise SystemExit('Cannot parse allocated A8 node: '+addr)
          node=m.group(1)
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              fh.write('SITE=grenoble\n')
              fh.write('LOC=grenoble,a8,%s\n'%node)
              fh.write('NODE_ID=%s\n'%node)
          PY

      - name: Boot gate and stage qualified package
        shell: bash
        run: |
          set -euo pipefail
          iotlab-ssh -i "$EXP_ID" wait-for-boot --max-wait 180 -l "$LOC"             > "$R5_ROOT/bootstrap/wait_for_boot.json"
          python - <<'PY'
          import json,os
          d=json.load(open(os.environ['R5_ROOT']+'/bootstrap/wait_for_boot.json'))
          if not d.get('wait-for-boot',{}).get('0',[]):
              raise SystemExit('A8 boot failed')
          PY

          SSH=(-i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          FRONTEND="${FIT_LOGIN}@${SITE}.iot-lab.info"
          REMOTE_BASE="shared/.wellpulse-r5-stage-a-${GITHUB_RUN_ID}"
          echo "REMOTE_BASE=$REMOTE_BASE" >> "$GITHUB_ENV"

          AUTH_JSON="$RUNNER_TEMP/r5_wp_auth.json"
          MOSQ_AUTH="$RUNNER_TEMP/r5_mosq_auth.conf"
          umask 077
          python - <<'PY' > "$AUTH_JSON"
          import json,os
          print(json.dumps({'username':os.environ['FIT_LOGIN'],'password':os.environ['FIT_PASSWORD']}))
          PY
          printf '%s\n%s\n' "-u $FIT_LOGIN" "-P $FIT_PASSWORD" > "$MOSQ_AUTH"

          ssh "${SSH[@]}" "$FRONTEND"             "mkdir -p ~/$REMOTE_BASE/common ~/$REMOTE_BASE/recv ~/$REMOTE_BASE/runs; chmod 700 ~/$REMOTE_BASE"
          scp "${SSH[@]}"             "$R5_ROOT/bootstrap/iot-lab-ca.pem"             "$R5_ROOT/bootstrap/paho_py35.tar.gz"             "$AUTH_JSON" "$MOSQ_AUTH"             experiments/WP-RT01/fit_runner_py35.py             experiments/WP-RT01/fit_runner_q0_instrumented_py35.py             scripts/fit_rt01_stamp_stream.py             "$FRONTEND:$REMOTE_BASE/common/"

          ssh "${SSH[@]}" "$FRONTEND"             "cd ~/$REMOTE_BASE/common; mv r5_wp_auth.json wp_auth.json; mv r5_mosq_auth.conf mosq_auth.conf; chmod 600 wp_auth.json mosq_auth.conf; mkdir -p vendor; tar -xzf paho_py35.tar.gz -C vendor"
          rm -f "$AUTH_JSON" "$MOSQ_AUTH"

          iotlab-ssh -i "$EXP_ID" run-cmd             "PYTHONPATH=\"\$HOME/$REMOTE_BASE/common/vendor\" python3 -c \"import paho.mqtt.client; print('paho_import=PASS')\""             -l "$LOC" > "$R5_ROOT/bootstrap/paho_import.json"
          grep -F '"0"' "$R5_ROOT/bootstrap/paho_import.json"

      - name: Execute exactly three scored Stage-A runs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_fit_r5_stage_a_loop.sh | tee "$R5_ROOT/workflow_console.log"

      - name: Publish Stage-A verdict
        if: always()
        shell: bash
        run: |
          {
            echo "## WellPulse R5 Stage-A"
            echo
            echo "**Scope:** exactly R1/R2/R3; no automatic Stage B."
            echo
            if [ -f "$R5_ROOT/STAGE_A_VERDICT.json" ]; then
              echo '~~~json'
              cat "$R5_ROOT/STAGE_A_VERDICT.json"
              echo '~~~'
            elif [ -f "$R5_ROOT/STAGE_A_ABORT.txt" ]; then
              cat "$R5_ROOT/STAGE_A_ABORT.txt"
              echo
              echo "Stage A incomplete because an objectively invalid run stopped execution."
            else
              echo "No Stage-A verdict produced; inspect the evidence package."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup FIT resources
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${FIT_LOGIN:-}" ] && [ -n "${SITE:-}" ] && [ -f "$HOME/.ssh/id_rsa" ]; then
            ssh -i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20               "${FIT_LOGIN}@${SITE}.iot-lab.info"               "pkill -f 'mosquitto_sub.*wellpulse/r5-stage-a' >/dev/null 2>&1 || true; [ -n '${REMOTE_BASE:-}' ] && rm -rf ~/${REMOTE_BASE:-nonexistent}; rm -f ~/.config/mosquitto_sub"               >/dev/null 2>&1 || true
          fi
          [ -n "${EXP_ID:-}" ] && iotlab-experiment stop -i "$EXP_ID" >/dev/null 2>&1 || true
          if [ -f "$HOME/.iotlabrc" ] && [ -f "$HOME/.ssh/id_rsa.pub" ]; then
            python - <<'PY' >/dev/null 2>&1 || true
          from pathlib import Path
          from iotlabcli import auth
          from iotlabcli.rest import Api
          k=Path.home()/'.ssh'/'id_rsa.pub'
          if k.exists():
              key=k.read_text().strip()
              user,password=auth._read_password_file()
              if user and password:
                  api=Api(user,password)
                  obj=api.get_ssh_keys()
                  if key in obj.get('sshkeys',[]):
                      obj['sshkeys']=[x for x in obj['sshkeys'] if x!=key]
                      api.set_ssh_keys(obj)
          PY
          fi
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/id_rsa.pub" "$HOME/.iotlabrc"

      - name: Upload immutable Stage-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wellpulse-r5-stage-a-${{ github.run_id }}
          path: r5-stage-a/
          if-no-files-found: error
          retention-days: 90
