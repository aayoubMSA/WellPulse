name: POWDER API Smoke

on:
  push:
    paths:
      - ".powder-api-smoke-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: powder-api-smoke
  cancel-in-progress: false

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}

    steps:
      - name: Checkout WellPulse
        uses: actions/checkout@v4

      - name: Validate API secret presence
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PORTAL_TOKEN" ]] || { echo "Missing POWDER_API_TOKEN secret"; exit 2; }
          echo "POWDER API token secret is configured."

      - name: Install official Portal API client
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.flux.utah.edu/emulab/portal-api.git /tmp/portal-api
          python -m pip install --quiet '/tmp/portal-api[cli]'
          portal-cli --help >/dev/null

      - name: Run read-only API checks
        id: smoke
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/powder

          set +e
          portal-cli experiment list >/tmp/powder-experiments.json 2>/tmp/powder-experiments.err
          EXP_RC=$?
          portal-cli profile list >/tmp/powder-profiles.json 2>/tmp/powder-profiles.err
          PROF_RC=$?
          set -e

          OUT=evidence/powder/api-smoke.md
          python - "$EXP_RC" "$PROF_RC" "$OUT" <<'PY'
          import json, os, sys, datetime
          exp_rc = int(sys.argv[1])
          prof_rc = int(sys.argv[2])
          out = sys.argv[3]

          def load(path):
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      return json.load(f)
              except Exception:
                  return None

          def items(obj, key):
              if isinstance(obj, list):
                  return obj
              if isinstance(obj, dict):
                  v = obj.get(key)
                  if isinstance(v, list):
                      return v
              return []

          ex_raw = load('/tmp/powder-experiments.json')
          pr_raw = load('/tmp/powder-profiles.json')
          exps = items(ex_raw, 'experiments')
          profs = items(pr_raw, 'profiles')
          wp_exps = [x for x in exps if isinstance(x, dict) and x.get('project') == 'WellPulse']
          matches = [x for x in profs if isinstance(x, dict) and x.get('name') == 'srs-rf-matrix' and x.get('project') == 'PowderTeam']

          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          with open(out, 'w', encoding='utf-8') as f:
              f.write('# POWDER Portal API smoke — latest\n\n')
              f.write(f'- Checked UTC: {now}\n')
              f.write(f'- WellPulse SHA: {os.environ.get("GITHUB_SHA", "unknown")}\n')
              f.write('- API actions: `experiment list`, `profile list` — read-only\n')
              f.write('- Resource action attempted: **NONE**\n')
              f.write(f'- Authentication gate: **{"POWDER_API_AUTH_PASS" if exp_rc == 0 else "POWDER_API_AUTH_FAIL"}**\n')
              f.write(f'- Experiment JSON shape: `{type(ex_raw).__name__ if ex_raw is not None else "unparsed"}`\n')
              f.write(f'- Visible experiment count: `{len(exps) if ex_raw is not None else "unknown"}`\n')
              f.write(f'- Visible WellPulse experiment count: `{len(wp_exps) if ex_raw is not None else "unknown"}`\n')
              f.write(f'- Profile-list gate: **{"PASS" if prof_rc == 0 else "FAIL"}**\n')
              f.write(f'- Profile JSON shape: `{type(pr_raw).__name__ if pr_raw is not None else "unparsed"}`\n')
              f.write(f'- Exact `PowderTeam/srs-rf-matrix` matches: `{len(matches) if pr_raw is not None else "unknown"}`\n')
              if matches:
                  p = matches[0]
                  f.write(f'- Matched profile ID: `{p.get("id", "not-exposed")}`\n')
              f.write('- Token content recorded: **NO**\n')
          PY

          [[ "$EXP_RC" -eq 0 ]] || exit "$EXP_RC"
          [[ "$PROF_RC" -eq 0 ]] || exit "$PROF_RC"

      - name: Commit sanitized API smoke evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f evidence/powder/api-smoke.md ]]; then
            echo "No API smoke evidence produced."
            exit 0
          fi
          if git diff --quiet -- evidence/powder/api-smoke.md && git ls-files --error-unmatch evidence/powder/api-smoke.md >/dev/null 2>&1; then
            echo "No evidence change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/powder/api-smoke.md
          git commit -m "Record POWDER API smoke evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
