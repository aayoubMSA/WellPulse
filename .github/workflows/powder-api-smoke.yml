name: POWDER API Smoke

on:
  push:
    paths:
      - ".powder-api-smoke-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: powder-api-smoke
  cancel-in-progress: false

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}

    steps:
      - name: Checkout WellPulse
        uses: actions/checkout@v4

      - name: Validate API secret presence
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PORTAL_TOKEN" ]] || { echo "Missing POWDER_API_TOKEN secret"; exit 2; }
          echo "POWDER API token secret is configured."

      - name: Install official Portal API client
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/portal-api
          git clone --depth 1 https://gitlab.flux.utah.edu/emulab/portal-api.git /tmp/portal-api
          python -m pip install --quiet '/tmp/portal-api[cli]'
          portal-cli --help >/tmp/portal-root-help.txt 2>&1
          portal-cli experiment create --help >/tmp/experiment-create-help.txt 2>&1 || true

      - name: Run authenticated read-only early-window capability checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/powder
          portal-cli experiment list >/tmp/powder-experiments.json
          portal-cli profile list >/tmp/powder-profiles.json

          python - <<'PY'
          import json, datetime, os, re
          from pathlib import Path

          def load(path, default):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return default

          def strip_ansi(text):
              return re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)

          ex_raw = load('/tmp/powder-experiments.json', [])
          exps = ex_raw if isinstance(ex_raw, list) else ex_raw.get('experiments', [])
          wp = []
          for x in exps:
              if isinstance(x, dict) and x.get('project') == 'WellPulse':
                  wp.append({k:x.get(k) for k in ['id','name','status','profile_name','profile_project','started_at','expires_at']})

          pr_raw = load('/tmp/powder-profiles.json', [])
          profs = pr_raw if isinstance(pr_raw, list) else pr_raw.get('profiles', [])
          matches = [p for p in profs if isinstance(p, dict)
                     and p.get('name') == 'srslte-controlled-rf'
                     and p.get('project') == 'PowderProfiles']

          create_help = strip_ansi(Path('/tmp/experiment-create-help.txt').read_text(errors='replace'))
          relevant_help = [line.rstrip() for line in create_help.splitlines()
                           if re.search(r'start|schedule|reserv|duration|profile|binding|project|name', line, re.I)]
          root_help = strip_ansi(Path('/tmp/portal-root-help.txt').read_text(errors='replace'))
          root_res_lines = [line.rstrip() for line in root_help.splitlines() if re.search(r'reserv|resgroup|schedule', line, re.I)]

          openapi = load('/tmp/portal-api/openapi.json', {})
          all_paths = openapi.get('paths') or {}
          relevant_paths = {}
          for path, spec in all_paths.items():
              if 'reserv' not in path.lower() and 'resgroup' not in path.lower():
                  continue
              ops = {}
              for method in ['get','post','put','patch','delete']:
                  op = spec.get(method) if isinstance(spec, dict) else None
                  if not isinstance(op, dict):
                      continue
                  params = []
                  for p in op.get('parameters') or []:
                      if isinstance(p, dict):
                          params.append({'name':p.get('name'),'in':p.get('in'),'required':p.get('required',False)})
                  body = op.get('requestBody') or {}
                  schemas = []
                  for media in (body.get('content') or {}).values():
                      if isinstance(media, dict) and isinstance(media.get('schema'), dict):
                          s = media['schema']
                          schemas.append({'ref':s.get('$ref'),'required':s.get('required'), 'properties':sorted((s.get('properties') or {}).keys())})
                  ops[method] = {'operationId':op.get('operationId'),'summary':op.get('summary'),'parameters':params,'body_schemas':schemas}
              relevant_paths[path] = ops

          schemas_out = {}
          schemas = ((openapi.get('components') or {}).get('schemas') or {})
          for name, s in schemas.items():
              if 'reserv' in name.lower() or 'resgroup' in name.lower():
                  props = {}
                  for pn, pv in (s.get('properties') or {}).items():
                      if isinstance(pv, dict):
                          props[pn] = {'type':pv.get('type'),'ref':pv.get('$ref'),'format':pv.get('format')}
                  schemas_out[name] = {'required':s.get('required') or [], 'properties':props}

          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          out = Path('evidence/powder/api-smoke.md')
          with out.open('w', encoding='utf-8') as f:
              f.write('# POWDER Portal API smoke — early-window probe\n\n')
              f.write(f'- Checked UTC: {now}\n')
              f.write(f'- WellPulse SHA: {os.environ.get("GITHUB_SHA", "unknown")}\n')
              f.write('- Authentication gate: **PASS**\n')
              f.write('- Resource mutation attempted: **NONE**\n')
              f.write(f'- Exact `PowderProfiles/srslte-controlled-rf` matches in profile-list response: **{len(matches)}**\n')
              f.write(f'- Visible WellPulse experiments: **{len(wp)}**\n')
              for x in wp:
                  f.write(f'  - `{x.get("name")}` | `{x.get("status")}` | `{x.get("profile_project")}/{x.get("profile_name")}` | start `{x.get("started_at")}` | expires `{x.get("expires_at")}`\n')
              f.write(f'- Reservation/resgroup API paths discovered: **{len(relevant_paths)}**\n')
              f.write('- Token content recorded: **NO**\n')

              f.write('\n## Experiment-create scheduling options\n\n```text\n')
              f.write('\n'.join(relevant_help[:120]))
              f.write('\n```\n')
              f.write('\n## Root reservation-related CLI lines\n\n```text\n')
              f.write('\n'.join(root_res_lines[:80]) or '(none exposed at root CLI)')
              f.write('\n```\n')
              f.write('\n## Reservation/resgroup OpenAPI operations\n\n```json\n')
              f.write(json.dumps(relevant_paths, indent=2, sort_keys=True))
              f.write('\n```\n')
              f.write('\n## Reservation/resgroup schema fields\n\n```json\n')
              f.write(json.dumps(schemas_out, indent=2, sort_keys=True))
              f.write('\n```\n')
          PY

      - name: Commit sanitized API smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/powder/api-smoke.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record POWDER reservation API schema probe"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
