name: POWDER API Smoke

on:
  push:
    paths:
      - ".powder-api-smoke-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: powder-api-smoke
  cancel-in-progress: false

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}

    steps:
      - name: Checkout WellPulse
        uses: actions/checkout@v4

      - name: Validate API secret presence
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PORTAL_TOKEN" ]] || { echo "Missing POWDER_API_TOKEN secret"; exit 2; }
          echo "POWDER API token secret is configured."

      - name: Install official Portal API client
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/portal-api
          git clone --depth 1 https://gitlab.flux.utah.edu/emulab/portal-api.git /tmp/portal-api
          python -m pip install --quiet '/tmp/portal-api[cli]'
          portal-cli --help >/tmp/portal-root-help.txt
          portal-cli experiment create --help >/tmp/experiment-create-help.txt 2>&1 || true

      - name: Run authenticated read-only early-window capability checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/powder
          portal-cli experiment list >/tmp/powder-experiments.json
          portal-cli profile list >/tmp/powder-profiles.json

          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('/tmp/powder-profiles.json').read_text())
          profiles = raw if isinstance(raw, list) else raw.get('profiles', [])
          matches = [p for p in profiles if isinstance(p, dict)
                     and p.get('name') == 'srslte-controlled-rf'
                     and p.get('project') == 'PowderProfiles']
          Path('/tmp/controlled-profile-match.json').write_text(json.dumps(matches, indent=2, sort_keys=True))
          if matches and matches[0].get('id'):
              Path('/tmp/profile-id').write_text(str(matches[0]['id']))
          PY

          if [[ -s /tmp/profile-id ]]; then
            portal-cli profile get --profile-id "$(cat /tmp/profile-id)" >/tmp/controlled-profile-full.json
          else
            printf '{}\n' >/tmp/controlled-profile-full.json
          fi

          python - <<'PY'
          import json, datetime, os, re
          from pathlib import Path

          def load(path, default):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return default

          ex_raw = load('/tmp/powder-experiments.json', [])
          exps = ex_raw if isinstance(ex_raw, list) else ex_raw.get('experiments', [])
          wp = []
          for x in exps:
              if not isinstance(x, dict) or x.get('project') != 'WellPulse':
                  continue
              wp.append({k:x.get(k) for k in ['id','name','status','profile_name','profile_project','started_at','expires_at']})

          matches = load('/tmp/controlled-profile-match.json', [])
          full = load('/tmp/controlled-profile-full.json', {})
          create_help = Path('/tmp/experiment-create-help.txt').read_text(errors='replace')
          openapi = load('/tmp/portal-api/openapi.json', {})
          paths = list((openapi.get('paths') or {}).keys())
          reservation_paths = [p for p in paths if 'reserv' in p.lower()]
          scheduling_paths = [p for p in paths if any(t in p.lower() for t in ['schedule','reservation','availability'])]

          safe_full = {}
          if isinstance(full, dict):
              for k in ['id','name','project','version','repo_hash','repo_refspec','created_at','updated_at','parameters','bindings']:
                  if k in full:
                      safe_full[k] = full.get(k)

          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          out = Path('evidence/powder/api-smoke.md')
          with out.open('w', encoding='utf-8') as f:
              f.write('# POWDER Portal API smoke — early-window probe\n\n')
              f.write(f'- Checked UTC: {now}\n')
              f.write(f'- WellPulse SHA: {os.environ.get("GITHUB_SHA", "unknown")}\n')
              f.write('- Authentication gate: **PASS**\n')
              f.write('- Resource mutation attempted: **NONE**\n')
              f.write(f'- Exact `PowderProfiles/srslte-controlled-rf` matches: **{len(matches)}**\n')
              if matches:
                  f.write(f'- Profile ID: `{matches[0].get("id", "not-exposed")}`\n')
              f.write(f'- Visible WellPulse experiments: **{len(wp)}**\n')
              for x in wp:
                  f.write(f'  - `{x.get("name")}` | `{x.get("status")}` | `{x.get("profile_project")}/{x.get("profile_name")}` | start `{x.get("started_at")}` | expires `{x.get("expires_at")}`\n')
              f.write(f'- OpenAPI reservation-like paths: **{len(reservation_paths)}**\n')
              for p in reservation_paths[:20]:
                  f.write(f'  - `{p}`\n')
              f.write(f'- OpenAPI scheduling/availability-like paths: **{len(scheduling_paths)}**\n')
              for p in scheduling_paths[:20]:
                  f.write(f'  - `{p}`\n')
              f.write('- `experiment create` exposes explicit scheduling option: **' + ('YES' if re.search(r'start|schedule|reservation', create_help, re.I) else 'NO') + '**\n')
              f.write('- Token content recorded: **NO**\n')
              f.write('\n## Sanitized controlled-profile metadata\n\n```json\n')
              f.write(json.dumps(safe_full, indent=2, sort_keys=True))
              f.write('\n```\n')
          PY

      - name: Commit sanitized API smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/powder/api-smoke.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record POWDER early-window API probe"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
