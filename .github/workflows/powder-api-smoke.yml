name: POWDER API Smoke

on:
  push:
    paths:
      - ".powder-api-smoke-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: powder-api-smoke
  cancel-in-progress: false

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}

    steps:
      - name: Checkout WellPulse
        uses: actions/checkout@v4

      - name: Validate API secret presence
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PORTAL_TOKEN" ]] || { echo "Missing POWDER_API_TOKEN secret"; exit 2; }

      - name: Install official Portal API client
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/portal-api
          git clone --depth 1 https://gitlab.flux.utah.edu/emulab/portal-api.git /tmp/portal-api
          python -m pip install --quiet '/tmp/portal-api[cli]'
          portal-cli experiment create --help >/tmp/experiment-create-help.txt 2>&1 || true
          portal-cli resgroup --help >/tmp/resgroup-help.txt 2>&1 || true

      - name: Run authenticated read-only reservation checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/powder
          portal-cli experiment list >/tmp/powder-experiments.json
          portal-cli resgroup list >/tmp/powder-resgroups.json

          python - <<'PY'
          import json, datetime, os, re
          from pathlib import Path

          def load(path, default):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return default

          def strip_ansi(text):
              return re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)

          ex_raw = load('/tmp/powder-experiments.json', [])
          exps = ex_raw if isinstance(ex_raw, list) else ex_raw.get('experiments', [])
          wp_exps = []
          for x in exps:
              if isinstance(x, dict) and x.get('project') == 'WellPulse':
                  wp_exps.append({k:x.get(k) for k in ['id','name','status','profile_name','profile_project','started_at','expires_at']})

          rg_raw = load('/tmp/powder-resgroups.json', [])
          rgs = rg_raw if isinstance(rg_raw, list) else rg_raw.get('resgroups', [])
          wp_rgs = []
          for rg in rgs:
              if not isinstance(rg, dict) or rg.get('project') != 'WellPulse':
                  continue
              safe = {k:rg.get(k) for k in ['id','project','group','creator','start_at','expires_at','reason']}
              safe['nodetypes'] = rg.get('nodetypes')
              safe['ranges'] = rg.get('ranges')
              safe['routes'] = rg.get('routes')
              safe['powder_zones'] = rg.get('powder_zones')
              wp_rgs.append(safe)

          help_text = strip_ansi(Path('/tmp/experiment-create-help.txt').read_text(errors='replace'))
          create_lines = [line.rstrip() for line in help_text.splitlines()
                          if re.search(r'start|stop|duration|profile|binding|project|name', line, re.I)]
          rg_help = strip_ansi(Path('/tmp/resgroup-help.txt').read_text(errors='replace'))

          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          out = Path('evidence/powder/api-smoke.md')
          with out.open('w', encoding='utf-8') as f:
              f.write('# POWDER Portal API smoke — current reservation state\n\n')
              f.write(f'- Checked UTC: {now}\n')
              f.write(f'- WellPulse SHA: {os.environ.get("GITHUB_SHA", "unknown")}\n')
              f.write('- Authentication gate: **PASS**\n')
              f.write('- Resource mutation attempted: **NONE**\n')
              f.write(f'- Visible WellPulse experiments: **{len(wp_exps)}**\n')
              f.write(f'- Visible WellPulse reservation groups: **{len(wp_rgs)}**\n')
              f.write('- Token content recorded: **NO**\n')
              f.write('\n## WellPulse reservation groups — sanitized\n\n```json\n')
              f.write(json.dumps(wp_rgs, indent=2, sort_keys=True))
              f.write('\n```\n')
              f.write('\n## Experiment scheduling options\n\n```text\n')
              f.write('\n'.join(create_lines[:100]))
              f.write('\n```\n')
              f.write('\n## Resgroup CLI\n\n```text\n')
              f.write('\n'.join(rg_help.splitlines()[:160]))
              f.write('\n```\n')
          PY

      - name: Commit sanitized API smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/powder/api-smoke.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record current WellPulse POWDER reservations"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
