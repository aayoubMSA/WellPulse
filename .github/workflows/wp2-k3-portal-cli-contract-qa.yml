name: WP2 K3 Portal CLI Contract QA

on:
  push:
    branches: [main]
    paths:
      - '.wp2-k3-portal-cli-contract-trigger'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout audited state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact frozen Portal client and capture lifecycle CLI
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/wp2_portal_client_bootstrap.sh /tmp/portal-api | tee /tmp/portal-bootstrap.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/portal-bootstrap.txt

          portal-cli experiment --help > /tmp/portal-experiment-help.txt
          portal-cli experiment create --help > /tmp/portal-create-help.txt
          portal-cli experiment get --help > /tmp/portal-get-help.txt
          portal-cli experiment terminate --help > /tmp/portal-terminate-help.txt

          grep -q 'create' /tmp/portal-experiment-help.txt
          grep -q 'get' /tmp/portal-experiment-help.txt
          grep -q 'terminate' /tmp/portal-experiment-help.txt

          echo '--- EXPERIMENT COMMANDS ---'
          cat /tmp/portal-experiment-help.txt
          echo '--- CREATE ---'
          cat /tmp/portal-create-help.txt
          echo '--- GET ---'
          cat /tmp/portal-get-help.txt
          echo '--- TERMINATE ---'
          cat /tmp/portal-terminate-help.txt
          echo 'K3_PORTAL_CLI_SURFACE_CAPTURE=PASS'
          echo 'POWDER_CONTACT=NO'
          echo 'SCIENTIFIC_RUN=NO'
