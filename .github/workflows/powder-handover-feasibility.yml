name: POWDER srsRAN Handover Feasibility

on:
  push:
    paths:
      - ".powder-handover-feasibility-trigger"
  workflow_dispatch:
    inputs:
      execute:
        description: "Type FEASIBILITY to authorize one non-scored profile feasibility run"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: powder-handover-feasibility
  cancel-in-progress: false

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_PROJECT: WellPulse
      PROFILE_NAME: srsran-handover
      PROFILE_PROJECT: PowderProfiles

    steps:
      - uses: actions/checkout@v4

      - name: Validate explicit feasibility authorization
        shell: bash
        env:
          INPUT_EXECUTE: ${{ github.event.inputs.execute }}
        run: |
          set -euo pipefail
          AUTH="${INPUT_EXECUTE:-}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            AUTH="$(awk -F= '$1=="execute" {print $2}' .powder-handover-feasibility-trigger | tail -n1 | tr -d '\r')"
          fi
          [[ "$AUTH" == "FEASIBILITY" ]] || { echo "Expected FEASIBILITY authorization."; exit 2; }
          [[ -n "$PORTAL_TOKEN" && -n "$POWDER_USERNAME" && -n "$POWDER_SSH_PRIVATE_KEY" ]] || { echo "Missing POWDER credential secret."; exit 2; }
          echo "Non-scored profile feasibility authorized."

      - name: Install official Portal API client and SSH key
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.flux.utah.edu/emulab/portal-api.git /tmp/portal-api
          python -m pip install --quiet '/tmp/portal-api[cli]'
          mkdir -p "$HOME/.ssh" /tmp/powder-feas evidence/powder
          chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$POWDER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create one-hour feasibility experiment
        id: create
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX="${GITHUB_RUN_ID: -7}"
          NAME="wphnd${SUFFIX}"
          [[ ${#NAME} -le 16 ]] || exit 2
          printf '%s\n' "$NAME" > /tmp/powder-feas/name
          set +e
          portal-cli experiment create \
            --name "$NAME" \
            --project "$POWDER_PROJECT" \
            --profile-name "$PROFILE_NAME" \
            --profile-project "$PROFILE_PROJECT" \
            --duration 1 \
            > /tmp/powder-feas/create.json 2>/tmp/powder-feas/create.err
          RC=$?
          set -e
          echo "$RC" > /tmp/powder-feas/create_rc
          [[ "$RC" -eq 0 ]] || { echo "Create call failed."; tail -n 30 /tmp/powder-feas/create.err; exit "$RC"; }
          ID="$(jq -r '.id // empty' /tmp/powder-feas/create.json)"
          [[ -n "$ID" ]] || { echo "No experiment ID returned."; exit 3; }
          printf '%s\n' "$ID" > /tmp/powder-feas/experiment_id
          echo "Experiment created; mandatory cleanup armed."

      - name: Wait for READY or terminal failure
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          ID="$(cat /tmp/powder-feas/experiment_id)"
          for i in $(seq 1 60); do
            set +e
            portal-cli experiment get --experiment-id "$ID" > /tmp/powder-feas/status.json 2>/tmp/powder-feas/status.err
            RC=$?
            set -e
            if [[ "$RC" -ne 0 ]]; then sleep 20; continue; fi
            STATUS="$(jq -r '.status // "unknown"' /tmp/powder-feas/status.json)"
            echo "status=$STATUS"
            printf '%s\n' "$STATUS" > /tmp/powder-feas/last_status
            if [[ "$STATUS" == "ready" ]]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$STATUS" =~ ^(failed|error|terminated)$ ]]; then
              echo "Terminal state $STATUS"
              exit 4
            fi
            sleep 20
          done
          echo "READY timeout"
          exit 5

      - name: Retrieve manifest and SSH endpoint
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          ID="$(cat /tmp/powder-feas/experiment_id)"
          portal-cli experiment manifests get --experiment-id "$ID" > /tmp/powder-feas/manifests.json
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          obj=json.loads(Path('/tmp/powder-feas/manifests.json').read_text())
          xmls=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str) and '<' in x and ('rspec' in x.lower() or '<node' in x.lower()): xmls.append(x)
          walk(obj)
          logins=[]; nodes=[]
          for text in xmls:
              try: root=ET.fromstring(text)
              except Exception: continue
              for el in root.iter():
                  tag=el.tag.rsplit('}',1)[-1]
                  if tag=='node' and el.attrib.get('client_id'): nodes.append(el.attrib['client_id'])
                  if tag=='login' and el.attrib.get('hostname'):
                      logins.append((el.attrib.get('username',''),el.attrib['hostname'],el.attrib.get('port','22')))
          logins=list(dict.fromkeys(logins)); nodes=list(dict.fromkeys(nodes))
          Path('/tmp/powder-feas/logins.tsv').write_text(''.join(f'{u}\t{h}\t{p}\n' for u,h,p in logins))
          Path('/tmp/powder-feas/nodes.txt').write_text('\n'.join(nodes)+('\n' if nodes else ''))
          print('nodes',nodes); print('login_count',len(logins))
          PY
          [[ -s /tmp/powder-feas/logins.tsv ]] || { echo "No SSH endpoints."; exit 6; }
          PASS=0
          while IFS=$'\t' read -r MU HOST PORT; do
            USERNAME="${MU:-$POWDER_USERNAME}"
            set +e
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USERNAME@$HOST" \
              'printf "REMOTE_HOST="; hostname; printf "REMOTE_USER="; whoami; printf "UTC="; date -u +%Y-%m-%dT%H:%M:%SZ; printf "KERNEL="; uname -srmo' \
              > /tmp/powder-feas/ssh.out 2>/tmp/powder-feas/ssh.err
            RC=$?
            set -e
            if [[ "$RC" -eq 0 ]]; then
              printf '%s\t%s\t%s\n' "$USERNAME" "$HOST" "$PORT" > /tmp/powder-feas/ssh-success.tsv
              PASS=1; break
            fi
          done < /tmp/powder-feas/logins.tsv
          [[ "$PASS" -eq 1 ]] || { tail -n 30 /tmp/powder-feas/ssh.err || true; exit 7; }
          echo "pass=true" >> "$GITHUB_OUTPUT"

      - name: Write sanitized feasibility evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/powder/handover-feasibility-latest.md
          ID="$(cat /tmp/powder-feas/experiment_id 2>/dev/null || true)"
          NAME="$(cat /tmp/powder-feas/name 2>/dev/null || true)"
          STATUS="$(cat /tmp/powder-feas/last_status 2>/dev/null || echo not_reached)"
          PROFILE_ID="$(jq -r '.profile_id // "not_captured"' /tmp/powder-feas/status.json 2>/dev/null || echo not_captured)"
          ACTUAL_PROFILE="$(jq -r '(.profile_project // "unknown") + "/" + (.profile_name // "unknown")' /tmp/powder-feas/status.json 2>/dev/null || echo unknown)"
          BINDINGS="$(jq -c '.bindings // {}' /tmp/powder-feas/status.json 2>/dev/null || echo '{}')"
          {
            echo "# POWDER srsRAN-handover feasibility — latest"
            echo
            echo "- Checked UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- GitHub SHA: ${GITHUB_SHA}"
            echo "- Evidence class: **INFRASTRUCTURE_ONLY_NON_SCORED**"
            echo "- Requested profile: \`$PROFILE_PROJECT/$PROFILE_NAME\`"
            echo "- Experiment name: \`$NAME\`"
            echo "- Experiment ID: \`$ID\`"
            echo "- Last observed state: \`$STATUS\`"
            echo "- Actual profile: \`$ACTUAL_PROFILE\`"
            echo "- Profile ID: \`$PROFILE_ID\`"
            echo "- Returned bindings/defaults: \`$BINDINGS\`"
            if [[ -s /tmp/powder-feas/nodes.txt ]]; then echo "- Logical nodes: \`$(paste -sd, /tmp/powder-feas/nodes.txt)\`"; fi
            if [[ -s /tmp/powder-feas/ssh-success.tsv ]]; then
              echo "- SSH gate: **PASS**"
              echo "- Successful endpoint: \`$(cut -f2 /tmp/powder-feas/ssh-success.tsv)\`"
            else
              echo "- SSH gate: **NOT_PASSING_YET**"
            fi
            echo "- RF manipulation attempted: **NO**"
            echo "- Scientific workload attempted: **NO**"
            echo "- Credentials recorded: **NO**"
            if [[ -s /tmp/powder-feas/ssh.out ]]; then
              echo; echo "## Read-only remote metadata"; echo '```text'; cat /tmp/powder-feas/ssh.out; echo '```'
            fi
          } > "$OUT"

      - name: Mandatory cleanup
        if: always()
        id: cleanup
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s /tmp/powder-feas/experiment_id ]]; then
            echo "state=not_created" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ID="$(cat /tmp/powder-feas/experiment_id)"
          portal-cli experiment terminate --experiment-id "$ID" >/tmp/powder-feas/terminate.out 2>/tmp/powder-feas/terminate.err || true
          ABSENT=0
          for i in $(seq 1 18); do
            set +e
            portal-cli experiment get --experiment-id "$ID" >/tmp/powder-feas/post.json 2>/tmp/powder-feas/post.err
            RC=$?
            set -e
            if [[ "$RC" -ne 0 ]]; then ABSENT=1; break; fi
            sleep 10
          done
          if [[ "$ABSENT" -eq 1 ]]; then echo "state=PASS_absent" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "state=FAIL_still_present" >> "$GITHUB_OUTPUT"; exit 20

      - name: Append cleanup state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/powder/handover-feasibility-latest.md
          [[ -f "$OUT" ]] || echo "# POWDER srsRAN-handover feasibility — latest" > "$OUT"
          echo "- Cleanup gate: **${{ steps.cleanup.outputs.state || 'UNKNOWN' }}**" >> "$OUT"

      - name: Commit sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/powder/handover-feasibility-latest.md
          [[ -f "$OUT" ]] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record POWDER srsRAN-handover feasibility evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
