name: Local Unit Tests

on:
  push:
    paths:
      - "src/wellpulse/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/local-unit-tests.yml"
  pull_request:
    paths:
      - "src/wellpulse/**"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: local-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned MQTT dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'paho-mqtt==2.1.0'
          python -c "import importlib.metadata as m; assert m.version('paho-mqtt') == '2.1.0'; print('paho-mqtt', m.version('paho-mqtt'))"
      - name: Run deterministic unit tests and publish run summary
        id: tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m unittest discover -s tests -v > /tmp/unit-tests.log 2>&1
          RC=$?
          set -e
          PAHO_VERSION="$(python -c 'import importlib.metadata as m; print(m.version("paho-mqtt"))')"
          {
            echo "# Local unit-test gate"
            echo
            echo "- Checked UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- GitHub SHA: ${GITHUB_SHA}"
            echo "- Python: $(python --version 2>&1)"
            echo "- Paho MQTT: ${PAHO_VERSION}"
            if [[ "$RC" -eq 0 ]]; then
              echo "- Gate: **PASS**"
            else
              echo "- Gate: **FAIL**"
              echo "- Exit code: \`$RC\`"
            fi
            echo
            echo '```text'
            tail -n 160 /tmp/unit-tests.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Enforce unit-test result
        if: always()
        shell: bash
        run: |
          test "${{ steps.tests.outputs.rc }}" = "0"
