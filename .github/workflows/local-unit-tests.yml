name: Local Unit Tests

on:
  push:
    paths:
      - "src/wellpulse/**"
      - "tests/**"
      - ".github/workflows/local-unit-tests.yml"
  pull_request:
    paths:
      - "src/wellpulse/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
