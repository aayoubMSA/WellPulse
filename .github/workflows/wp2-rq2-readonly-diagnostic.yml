name: WP2 RQ2 Read-Only Node Diagnostic

on:
  push:
    paths:
      - '.github/diagnostics/wp2-rq2-readonly.trigger'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read-only inventory on nuc1 CORE and nuc2 UE
        env:
          POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
          POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          TMP="/tmp/wp2-rq2-readonly-${GITHUB_RUN_ID}"
          mkdir -p "$TMP" "$HOME/.ssh"
          umask 077
          python3 - "$TMP/private.key" <<'PY'
          import os,sys
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+'\n'
          Path(sys.argv[1]).write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$TMP/private.key"
          cat > "$TMP/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$TMP/askpass"
          export SSH_ASKPASS="$TMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$TMP/private.key" </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          SSH_OPTS=(-o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          inventory='set +e
          echo "HOST=$(hostname)"
          date -u +"UTC=%Y-%m-%dT%H:%M:%SZ"
          grep -E "^(NAME|VERSION|VERSION_ID)=" /etc/os-release
          echo "PYTHON3=$(command -v python3 2>/dev/null)"; python3 --version 2>&1
          echo "CURL=$(command -v curl 2>/dev/null)"
          echo "WGET=$(command -v wget 2>/dev/null)"
          echo "GIT=$(command -v git 2>/dev/null)"; git --version 2>&1
          echo "GCC=$(command -v gcc 2>/dev/null)"; gcc --version 2>/dev/null | head -1
          echo "MAKE=$(command -v make 2>/dev/null)"; make --version 2>/dev/null | head -1
          echo "SUDO=$(command -v sudo 2>/dev/null)"
          echo "PIP3=$(command -v pip3 2>/dev/null)"; pip3 --version 2>&1
          df -h "$HOME"
          test -d "$HOME/WellPulse" && { echo "WELLPULSE=YES"; cd "$HOME/WellPulse"; pwd -P; } || echo "WELLPULSE=NO"
          test -x "$HOME/.wp2-golden-venv/bin/python" && "$HOME/.wp2-golden-venv/bin/python" --version || echo "PINNED_PYTHON=ABSENT"
          test -d /local/repository && { echo -n "PROFILE_REV="; git -C /local/repository rev-parse HEAD 2>&1; } || echo "PROFILE_REPO=ABSENT"
          echo "TMUX_SESSIONS:"; tmux ls 2>&1 || true
          echo "SERVICE_PROCESSES:"; pgrep -a -x srsue 2>/dev/null || true; pgrep -a -x srsenb 2>/dev/null || true; pgrep -a -x srsepc 2>/dev/null || true
          echo "TUN_SRSUE:"; ip link show tun_srsue 2>&1 || true'
          echo '=== nuc1 / CORE ==='
          ssh "${SSH_OPTS[@]}" aayoub@nuc1.emulab.net "$inventory"
          echo '=== END nuc1 / CORE ==='
          echo '=== nuc2 / UE ==='
          ssh "${SSH_OPTS[@]}" aayoub@nuc2.emulab.net "$inventory"
          echo '=== END nuc2 / UE ==='
          echo 'WP2_RQ2_READONLY_DIAGNOSTIC=PASS'
