name: WP2 P7B-R3 Evidence Salvage Only

on:
  push:
    branches: [main]
    paths:
      - '.wp2-p7b-r3-evidence-salvage-trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: wp2-p7b-r3-evidence-salvage
  cancel-in-progress: false

jobs:
  salvage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      TARGET_EXPID: 12b39276-af0f-4e34-8dfd-685b006dd6bd
      TARGET_NAME: wp7brq19810043
      NODE_RUN_ID: wp2-p7b-r3-33121695880-20260827T222035Z

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Freeze salvage-only authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-r3-evidence-salvage-trigger)" = $'execute=WP2_P7B_R3_EVIDENCE_SALVAGE_ONLY\nexperiment_id=12b39276-af0f-4e34-8dfd-685b006dd6bd\nrun_id=wp2-p7b-r3-33121695880-20260827T222035Z\nnew_reservation=NO\nrf_mutation=NO\ncell_execution=NO\nteardown=NO\nscored=NO'
          echo 'SALVAGE_AUTHORITY=PASS'
          echo 'NEW_RESERVATION=NO'
          echo 'RF_MUTATION=NO'
          echo 'CELL_EXECUTION=NO'
          echo 'TEARDOWN=NO'
          echo 'SCORED=NO'

      - name: Install controller prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq openssh-client >/dev/null
          bash scripts/wp2_portal_client_bootstrap.sh /tmp/wp2-p7b-r3-salvage-portal | tee /tmp/portal-pin.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/portal-pin.txt

      - name: Resolve same-reservation node logins
        id: nodes
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-p7b-r3-salvage
          rm -rf "$TMP"; mkdir -p "$TMP"
          MOK=0
          for i in 1 2 3 4; do
            set +e
            portal-cli experiment manifests get --experiment-id "$TARGET_EXPID" > "$TMP/manifests.json" 2> "$TMP/manifests.err"
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then MOK=1; break; fi
            echo "SALVAGE_MANIFEST_${i}=ERROR:rc=$rc"
            sleep 2
          done
          test "$MOK" = 1
          python3 - "$TMP/manifests.json" "$TMP/nodes.json" <<'PY'
import json,sys,xml.etree.ElementTree as ET
obj=json.load(open(sys.argv[1])); xmls=[]; out={}
def walk(x):
    if isinstance(x,dict):
        for v in x.values(): walk(v)
    elif isinstance(x,list):
        for v in x: walk(v)
    elif isinstance(x,str) and '<' in x and ('rspec' in x.lower() or '<node' in x.lower()): xmls.append(x)
walk(obj)
for text in xmls:
    try: root=ET.fromstring(text)
    except Exception: continue
    for node in root.iter():
        if node.tag.rsplit('}',1)[-1] != 'node': continue
        cid=node.attrib.get('client_id','')
        if cid not in {'enb1','rue1'}: continue
        for ch in node.iter():
            if ch.tag.rsplit('}',1)[-1]=='login' and ch.attrib.get('hostname'):
                out[cid]={'username':ch.attrib.get('username',''),'hostname':ch.attrib['hostname'],'port':int(ch.attrib.get('port','22'))}
                break
assert set(out)=={'enb1','rue1'}, out
json.dump(out,open(sys.argv[2],'w'),indent=2,sort_keys=True)
PY
          cat "$TMP/nodes.json"
          echo "core_user=$(jq -r '.enb1.username' "$TMP/nodes.json")" >> "$GITHUB_OUTPUT"
          echo "core_host=$(jq -r '.enb1.hostname' "$TMP/nodes.json")" >> "$GITHUB_OUTPUT"
          echo "core_port=$(jq -r '.enb1.port' "$TMP/nodes.json")" >> "$GITHUB_OUTPUT"
          echo "ue_user=$(jq -r '.rue1.username' "$TMP/nodes.json")" >> "$GITHUB_OUTPUT"
          echo "ue_host=$(jq -r '.rue1.hostname' "$TMP/nodes.json")" >> "$GITHUB_OUTPUT"
          echo "ue_port=$(jq -r '.rue1.port' "$TMP/nodes.json")" >> "$GITHUB_OUTPUT"
          echo 'SALVAGE_MANIFEST_IDENTITY=PASS'

      - name: Initialize SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/wp2-p7b-r3-salvage "$HOME/.ssh"
          python3 - <<'PY'
import os
from pathlib import Path
raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
Path('/tmp/wp2-p7b-r3-salvage/private.key').write_text(raw,encoding='utf-8',newline='\n')
PY
          chmod 600 /tmp/wp2-p7b-r3-salvage/private.key
          cat > /tmp/wp2-p7b-r3-salvage/askpass <<'EOF'
#!/usr/bin/env bash
printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
EOF
          chmod 700 /tmp/wp2-p7b-r3-salvage/askpass
          export SSH_ASKPASS=/tmp/wp2-p7b-r3-salvage/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add /tmp/wp2-p7b-r3-salvage/private.key </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"

      - name: Shell-only copy raw trees to persistent project escrow
        id: escrow
        shell: bash
        env:
          CORE_USER: ${{ steps.nodes.outputs.core_user }}
          CORE_HOST: ${{ steps.nodes.outputs.core_host }}
          CORE_PORT: ${{ steps.nodes.outputs.core_port }}
          UE_USER: ${{ steps.nodes.outputs.ue_user }}
          UE_HOST: ${{ steps.nodes.outputs.ue_host }}
          UE_PORT: ${{ steps.nodes.outputs.ue_port }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ESCROW="/proj/WellPulse/evidence-escrow/p7b-r3/${NODE_RUN_ID}"
          UE_SRC="/users/${POWDER_USERNAME}/wellpulse-powder-evidence/p7b/${NODE_RUN_ID}"
          CORE_SRC="/users/${POWDER_USERNAME}/wellpulse-powder-evidence/p7b/${NODE_RUN_ID}-core"

          ssh "${SSH_OPTS[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" "set -eu; test -d '$UE_SRC'; mkdir -p '$ESCROW'; tar -C '/users/${POWDER_USERNAME}/wellpulse-powder-evidence/p7b' -cf '$ESCROW/ue.raw.tar' '${NODE_RUN_ID}'; sha256sum '$ESCROW/ue.raw.tar' > '$ESCROW/ue.raw.tar.sha256'; find '$UE_SRC' -type f -print | LC_ALL=C sort > '$ESCROW/ue.file-list.txt'; echo UE_ESCROW=PASS"
          ssh "${SSH_OPTS[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" "set -eu; test -d '$CORE_SRC'; mkdir -p '$ESCROW'; tar -C '/users/${POWDER_USERNAME}/wellpulse-powder-evidence/p7b' -cf '$ESCROW/core.raw.tar' '${NODE_RUN_ID}-core'; sha256sum '$ESCROW/core.raw.tar' > '$ESCROW/core.raw.tar.sha256'; find '$CORE_SRC' -type f -print | LC_ALL=C sort > '$ESCROW/core.file-list.txt'; echo CORE_ESCROW=PASS"

          mkdir -p /tmp/wp2-p7b-r3-salvage/bundle
          scp "${SSH_OPTS[@]}" -P "$CORE_PORT" "$CORE_USER@$CORE_HOST:$ESCROW/ue.raw.tar" /tmp/wp2-p7b-r3-salvage/bundle/
          scp "${SSH_OPTS[@]}" -P "$CORE_PORT" "$CORE_USER@$CORE_HOST:$ESCROW/ue.raw.tar.sha256" /tmp/wp2-p7b-r3-salvage/bundle/
          scp "${SSH_OPTS[@]}" -P "$CORE_PORT" "$CORE_USER@$CORE_HOST:$ESCROW/core.raw.tar" /tmp/wp2-p7b-r3-salvage/bundle/
          scp "${SSH_OPTS[@]}" -P "$CORE_PORT" "$CORE_USER@$CORE_HOST:$ESCROW/core.raw.tar.sha256" /tmp/wp2-p7b-r3-salvage/bundle/
          scp "${SSH_OPTS[@]}" -P "$CORE_PORT" "$CORE_USER@$CORE_HOST:$ESCROW/ue.file-list.txt" /tmp/wp2-p7b-r3-salvage/bundle/
          scp "${SSH_OPTS[@]}" -P "$CORE_PORT" "$CORE_USER@$CORE_HOST:$ESCROW/core.file-list.txt" /tmp/wp2-p7b-r3-salvage/bundle/

          cd /tmp/wp2-p7b-r3-salvage/bundle
          sed -E 's#  /proj/WellPulse/evidence-escrow/p7b-r3/[^/]+/#  #' ue.raw.tar.sha256 > ue.expected.sha256
          sed -E 's#  /proj/WellPulse/evidence-escrow/p7b-r3/[^/]+/#  #' core.raw.tar.sha256 > core.expected.sha256
          sha256sum -c ue.expected.sha256
          sha256sum -c core.expected.sha256
          sha256sum ue.raw.tar core.raw.tar | tee controller-bundle-sha256.txt
          echo 'PERSISTENT_ESCROW_AND_CONTROLLER_PULL=PASS'
          echo "bundle_dir=/tmp/wp2-p7b-r3-salvage/bundle" >> "$GITHUB_OUTPUT"

      - name: Upload immutable salvage artifact
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp2-p7b-r3-evidence-salvage-${{ github.run_id }}
          path: /tmp/wp2-p7b-r3-salvage/bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Independent artifact read-back
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wp2-p7b-r3-evidence-salvage-${{ github.run_id }}
          path: /tmp/wp2-p7b-r3-salvage/readback

      - name: Verify independent read-back
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wp2-p7b-r3-salvage/readback
          sha256sum -c ue.expected.sha256
          sha256sum -c core.expected.sha256
          test -s ue.file-list.txt
          test -s core.file-list.txt
          mkdir -p /tmp/wp2-p7b-r3-salvage/ue-check /tmp/wp2-p7b-r3-salvage/core-check
          tar -C /tmp/wp2-p7b-r3-salvage/ue-check -xf ue.raw.tar
          tar -C /tmp/wp2-p7b-r3-salvage/core-check -xf core.raw.tar
          test -s "/tmp/wp2-p7b-r3-salvage/ue-check/${NODE_RUN_ID}/p7b_c_status.json"
          test -s "/tmp/wp2-p7b-r3-salvage/core-check/${NODE_RUN_ID}-core/cells/P7B-B1-S3/receiver/receiver_events.jsonl"
          echo 'INDEPENDENT_READBACK_GATE=PASS'
          echo 'TEARDOWN_EXECUTED=NO'
          echo 'SCORED_AUTHORIZATION=BLOCKED'
