name: FIT A8 capability smoke v3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.fit-smoke-v3-trigger'

permissions:
  contents: read

concurrency:
  group: wellpulse-fit-a8-smoke
  cancel-in-progress: false

jobs:
  fit-smoke-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIT_IDENTIFIER: ${{ secrets.FIT_USERNAME }}
      FIT_PASSWORD: ${{ secrets.FIT_PASSWORD }}
      RUN_DIR: fit-smoke-v3

    steps:
      - name: Checkout WellPulse
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require FIT secrets
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUN_DIR"
          test -n "${FIT_IDENTIFIER:-}"
          test -n "${FIT_PASSWORD:-}"
          echo "evidence_class=CAPABILITY_SMOKE_NOT_FINAL_EXPERIMENT" > "$RUN_DIR/workflow_context.txt"
          echo "github_run_id=$GITHUB_RUN_ID" >> "$RUN_DIR/workflow_context.txt"
          echo "git_commit=$GITHUB_SHA" >> "$RUN_DIR/workflow_context.txt"
          echo "start_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$RUN_DIR/workflow_context.txt"

      - name: Install official FIT CLI tools
        shell: bash
        run: |
          set -eu
          python -m pip install --disable-pip-version-check iotlabcli iotlabsshcli
          iotlab-auth --version | tee "$RUN_DIR/iotlabcli_version.txt"
          iotlab-ssh --version | tee "$RUN_DIR/iotlabsshcli_version.txt"

      - name: Resolve FIT-generated login securely
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          import base64, os, re
          from pathlib import Path
          from iotlabcli.rest import Api

          ident = os.environ['FIT_IDENTIFIER']
          password = os.environ['FIT_PASSWORD']
          profile = Api(ident, password).method('user')
          login = profile.get('login') if isinstance(profile, dict) else None
          if not login or not re.fullmatch(r'[a-z][0-9a-z]{3,19}', login):
              raise SystemExit('FIT account profile did not provide a valid generated login')
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'FIT_LOGIN={login}\n')
          p = Path.home() / '.iotlabrc'
          p.write_text(login + ':' + base64.b64encode(password.encode()).decode())
          p.chmod(0o600)
          print('FIT generated login resolved without disclosure.')
          PY

      - name: Generate and register ephemeral SSH key
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keygen -t rsa -b 3072 -N '' -f "$HOME/.ssh/id_rsa" -C "WellPulse-FIT-smoke-v3-${GITHUB_RUN_ID}" >/dev/null
          chmod 600 "$HOME/.ssh/id_rsa"
          chmod 644 "$HOME/.ssh/id_rsa.pub"
          cp "$HOME/.ssh/id_rsa.pub" "$RUNNER_TEMP/fit_smoke_key.pub"
          ssh-keygen -lf "$HOME/.ssh/id_rsa.pub" -E sha256 | tee "$RUN_DIR/ssh_key_fingerprint.txt"
          iotlab-auth --add-ssh-key | tee "$RUN_DIR/add_ssh_key.log"

      - name: Capture live A8 inventory
        shell: bash
        run: |
          set -eu
          iotlab-status --nodes --archi a8 --state Alive > "$RUN_DIR/a8_alive.json"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('fit-smoke-v3/a8_alive.json').read_text())
          print('alive_a8_rows=' + str(len(data.get('items', []))))
          PY

      - name: Reserve one Saclay A8
        shell: bash
        run: |
          set -euo pipefail
          name="WP-RT01-smoke-v3-${GITHUB_RUN_ID}"
          submit_out=$(iotlab-experiment submit -n "$name" -d 15 -l '1,archi=a8:at86rf231+site=saclay')
          printf '%s\n' "$submit_out" | tee "$RUN_DIR/reservation_submit.json"
          EXP_ID=$(printf '%s' "$submit_out" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "EXP_ID=$EXP_ID" >> "$GITHUB_ENV"
          iotlab-experiment wait -i "$EXP_ID" --timeout 180 --cancel-on-timeout | tee "$RUN_DIR/reservation_wait.txt"
          iotlab-experiment get -i "$EXP_ID" -n > "$RUN_DIR/experiment_nodes.json"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          data=json.loads(Path('fit-smoke-v3/experiment_nodes.json').read_text())
          items=data.get('items', [])
          if not items:
              raise SystemExit('No A8 node allocated')
          addr=items[0]['network_address']
          m=re.search(r'(?:node-)?a8-(\d+)\.', addr)
          if not m:
              raise SystemExit('Cannot parse A8 node id')
          node_id=m.group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'SITE=saclay\nNODE_ID={node_id}\nNODE_ADDRESS={addr}\nLOC=saclay,a8,{node_id}\n')
          Path('fit-smoke-v3/selected_node.txt').write_text(f'node_address={addr}\nnode_id={node_id}\nloc=saclay,a8,{node_id}\n')
          PY

      - name: Require successful A8 Linux boot
        shell: bash
        run: |
          set -eu
          iotlab-ssh wait-for-boot --max-wait 180 -l "$LOC" > "$RUN_DIR/wait_for_boot.json"
          cat "$RUN_DIR/wait_for_boot.json"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('fit-smoke-v3/wait_for_boot.json').read_text())
          ok=data.get('wait-for-boot', {}).get('0', [])
          if not ok:
              raise SystemExit('Allocated A8 did not complete Linux boot successfully')
          PY

      - name: Copy and execute capability probe
        shell: bash
        run: |
          set -euo pipefail
          iotlab-ssh copy-file scripts/fit_probe.sh > "$RUN_DIR/copy_probe.json"
          cat "$RUN_DIR/copy_probe.json"
          iotlab-ssh --verbose run-cmd 'set -eu; OUT=/tmp/wellpulse_fit_probe.log; sh ~/shared/.iotlabsshcli/fit_probe.sh "$OUT"; cat "$OUT"; echo "--- probe sha256 ---"; cat "$OUT.sha256" 2>/dev/null || true' -l "$LOC" 2>&1 | tee "$RUN_DIR/probe_remote.log"
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('fit-smoke-v3/probe_remote.log').read_text(errors='replace')
          if not re.search(r'"run-cmd"\s*:\s*\{\s*"0"\s*:', text, re.S):
              raise SystemExit('Remote capability probe did not return run-cmd code 0')
          PY

      - name: Authenticated MQTT smoke from A8
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          AUTH_FILE="$RUNNER_TEMP/mqtt_auth.conf"
          umask 077
          printf '%s\n%s\n' "-u $FIT_LOGIN" "-P $FIT_PASSWORD" > "$AUTH_FILE"
          iotlab-ssh copy-file "$AUTH_FILE" > "$RUN_DIR/copy_mqtt_auth.json"
          TOPIC="iotlab/${FIT_LOGIN}/wellpulse/smoke/${GITHUB_RUN_ID}"
          PAYLOAD="WP_SMOKE_${GITHUB_RUN_ID}"
          CMD='set -eu; if ! command -v mosquitto_pub >/dev/null 2>&1 || ! command -v mosquitto_sub >/dev/null 2>&1; then echo mqtt_authenticated=CLIENTS_NOT_AVAILABLE; exit 4; fi; mkdir -p "$HOME/.config"; cp ~/shared/.iotlabsshcli/mqtt_auth.conf "$HOME/.config/mosquitto_pub"; cp ~/shared/.iotlabsshcli/mqtt_auth.conf "$HOME/.config/mosquitto_sub"; chmod 600 "$HOME/.config/mosquitto_pub" "$HOME/.config/mosquitto_sub"; topic='"'"$TOPIC"'"'; payload='"'"$PAYLOAD"'"'; rm -f /tmp/wellpulse_mqtt_msg; mosquitto_sub --cafile /opt/iot-lab-ca.pem -h mqtt4.iot-lab.info -p 8883 -C 1 -W 12 -t "$topic" > /tmp/wellpulse_mqtt_msg & subpid=$!; sleep 2; mosquitto_pub --cafile /opt/iot-lab-ca.pem -h mqtt4.iot-lab.info -p 8883 -t "$topic" -m "$payload"; wait "$subpid"; if grep -Fx "$payload" /tmp/wellpulse_mqtt_msg >/dev/null 2>&1; then echo mqtt_authenticated=PASS; else echo mqtt_authenticated=FAIL; exit 5; fi; rm -f /tmp/wellpulse_mqtt_msg "$HOME/.config/mosquitto_pub" "$HOME/.config/mosquitto_sub"'
          set +e
          iotlab-ssh --verbose run-cmd "$CMD" -l "$LOC" 2>&1 | tee "$RUN_DIR/mqtt_authenticated.log"
          rc=${PIPESTATUS[0]}
          set -e
          rm -f "$AUTH_FILE"
          exit "$rc"

      - name: Write smoke metadata
        if: always()
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          out={
            'evidence_class':'CAPABILITY_SMOKE_NOT_FINAL_EXPERIMENT',
            'github_run_id':os.getenv('GITHUB_RUN_ID'),
            'git_commit':os.getenv('GITHUB_SHA'),
            'experiment_id':os.getenv('EXP_ID'),
            'site':os.getenv('SITE'),
            'node_id':os.getenv('NODE_ID'),
            'node_address':os.getenv('NODE_ADDRESS'),
            'end_utc':datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
          }
          Path('fit-smoke-v3').mkdir(exist_ok=True)
          Path('fit-smoke-v3/metadata.json').write_text(json.dumps(out, indent=2)+'\n')
          PY

      - name: Stop experiment and remove ephemeral SSH key
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${EXP_ID:-}" ] && [ -f "$HOME/.iotlabrc" ]; then
            iotlab-experiment stop -i "$EXP_ID" >/dev/null 2>&1 || true
          fi
          if [ -f "$HOME/.iotlabrc" ] && [ -f "$HOME/.ssh/id_rsa.pub" ]; then
            python - <<'PY'
          from pathlib import Path
          from iotlabcli import auth
          from iotlabcli.rest import Api
          key_file=Path.home()/'.ssh'/'id_rsa.pub'
          if key_file.exists():
              key=key_file.read_text().strip()
              user,password=auth._read_password_file()
              if user and password:
                  api=Api(user,password)
                  obj=api.get_ssh_keys()
                  keys=obj.get('sshkeys',[])
                  if key in keys:
                      obj['sshkeys']=[k for k in keys if k != key]
                      api.set_ssh_keys(obj)
          PY
          fi
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/id_rsa.pub" "$RUNNER_TEMP/fit_smoke_key.pub" "$RUNNER_TEMP/mqtt_auth.conf"
          if command -v shred >/dev/null 2>&1; then
            shred -u "$HOME/.iotlabrc" 2>/dev/null || rm -f "$HOME/.iotlabrc"
          else
            rm -f "$HOME/.iotlabrc"
          fi

      - name: Upload smoke evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wellpulse-fit-a8-smoke-v3-${{ github.run_id }}
          path: fit-smoke-v3/
          if-no-files-found: warn
          retention-days: 30
