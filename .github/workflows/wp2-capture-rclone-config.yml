name: WP2 Capture Existing POWDER Drive Config

on:
  push:
    branches: [main]
    paths:
      - "powder/wp2-capture-rclone-config.trigger"

permissions:
  contents: write

concurrency:
  group: wp2-capture-rclone-config
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare authenticated POWDER read path
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PORTAL_TOKEN" && -n "$POWDER_SSH_PRIVATE_KEY" ]] || { echo 'CAPTURE_BLOCKED=POWDER_SECRET_MISSING'; exit 10; }
          umask 077
          mkdir -p "$HOME/.ssh" /tmp/wp2capture
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path.home().joinpath('.ssh/id_powder').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_powder"
          cat >/tmp/wp2capture/askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/wp2capture/askpass
          export SSH_ASKPASS=/tmp/wp2capture/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          setsid -w ssh-keygen -y -f "$HOME/.ssh/id_powder" >/tmp/wp2capture/pub </dev/null
          test -s /tmp/wp2capture/pub || { echo 'CAPTURE_BLOCKED=SSH_PUBLIC_KEY_DERIVATION'; exit 11; }
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          setsid -w ssh-add "$HOME/.ssh/id_powder" </dev/null >/dev/null
          git clone --depth 1 https://gitlab.flux.utah.edu/emulab/portal-api.git /tmp/portal-api >/dev/null 2>&1
          python -m pip install --quiet '/tmp/portal-api[cli]'
          echo 'POWDER_READ_PATH=PASS'

      - name: Discover live WellPulse nodes and capture working rclone config
        shell: bash
        run: |
          set -euo pipefail
          portal-cli experiment list >/tmp/wp2capture/list.json
          python3 - <<'PY' >/tmp/wp2capture/ids
          import json
          raw=json.load(open('/tmp/wp2capture/list.json'))
          xs=raw if isinstance(raw,list) else raw.get('experiments',[])
          terminal={'terminated','destroyed','failed','error'}
          for x in xs:
              if not isinstance(x,dict) or x.get('project')!='WellPulse': continue
              st=str(x.get('status','')).lower()
              if st in terminal: continue
              i=x.get('id')
              if i: print(i)
          PY
          [[ -s /tmp/wp2capture/ids ]] || { echo 'CAPTURE_BLOCKED=NO_LIVE_WELLPULSE_EXPERIMENT'; exit 20; }

          FOUND=0
          while IFS= read -r EXPID; do
            echo "DISCOVERING_EXPERIMENT=$EXPID"
            if ! portal-cli experiment manifests get --experiment-id "$EXPID" >/tmp/wp2capture/manifest.json 2>/dev/null; then continue; fi
            python3 - <<'PY' >/tmp/wp2capture/logins.tsv
          import json,xml.etree.ElementTree as ET
          obj=json.load(open('/tmp/wp2capture/manifest.json'))
          xmls=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str) and '<' in x and 'rspec' in x.lower(): xmls.append(x)
          walk(obj)
          seen=set()
          for text in xmls:
              try: root=ET.fromstring(text)
              except Exception: continue
              for node in root.iter():
                  if node.tag.rsplit('}',1)[-1] != 'node': continue
                  cid=node.attrib.get('client_id','')
                  for ch in node.iter():
                      if ch.tag.rsplit('}',1)[-1]=='login' and ch.attrib.get('hostname'):
                          row=(cid,ch.attrib.get('username','aayoub'),ch.attrib['hostname'],ch.attrib.get('port','22'))
                          if row not in seen:
                              seen.add(row); print('\t'.join(row))
          PY
            while IFS=$'\t' read -r CID USER HOST PORT; do
              [[ -n "$HOST" ]] || continue
              echo "PROBING_NODE=${CID:-unknown}"
              SSH=(-A -o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -p "$PORT")
              if ssh "${SSH[@]}" "$USER@$HOST" 'test -s "$HOME/.config/rclone/rclone.conf" && command -v rclone >/dev/null && rclone lsf gdrive: >/dev/null 2>&1'; then
                scp -q -o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -P "$PORT" "$USER@$HOST:.config/rclone/rclone.conf" /tmp/wp2capture/rclone.conf
                chmod 600 /tmp/wp2capture/rclone.conf
                FOUND=1
                printf '%s\n' "$EXPID" >/tmp/wp2capture/source-experiment
                printf '%s\n' "${CID:-unknown}" >/tmp/wp2capture/source-node
                break 2
              fi
            done </tmp/wp2capture/logins.tsv
          done </tmp/wp2capture/ids
          [[ "$FOUND" -eq 1 ]] || { echo 'CAPTURE_BLOCKED=NO_LIVE_NODE_WITH_WORKING_GDRIVE_CONFIG'; exit 21; }
          echo 'RCLONE_SOURCE_CAPTURE=PASS'

      - name: Verify captured config without exposing it
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone --config /tmp/wp2capture/rclone.conf lsf gdrive: >/dev/null
          echo 'CAPTURED_GDRIVE_CONFIG=VERIFIED'

      - name: Encrypt config with existing GitHub-held POWDER secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p powder/secure
          ENC_PASS="$(printf '%s' "$POWDER_SSH_PRIVATE_KEY" | sha256sum | awk '{print $1}')"
          export ENC_PASS
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/wp2capture/rclone.conf \
            -out powder/secure/wp_rclone_config.enc \
            -pass env:ENC_PASS
          unset ENC_PASS
          rm -f /tmp/wp2capture/rclone.conf
          test -s powder/secure/wp_rclone_config.enc
          cat > powder/secure/wp_rclone_config.meta <<EOF
          format=openssl-aes-256-cbc-pbkdf2
          plaintext_committed=false
          source_experiment=$(cat /tmp/wp2capture/source-experiment)
          source_node=$(cat /tmp/wp2capture/source-node)
          verified_gdrive_read=true
          captured_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          echo 'ENCRYPTED_CONFIG_READY=PASS'

      - name: Commit ciphertext only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add powder/secure/wp_rclone_config.enc powder/secure/wp_rclone_config.meta
          git commit -m 'Store encrypted verified POWDER Drive transport config'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'ENCRYPTED_CONFIG_COMMITTED=PASS'

      - name: Final capture verdict
        shell: bash
        run: |
          set -euo pipefail
          echo 'RCLONE_CONFIG_CAPTURE=PASS'
          echo 'PLAINTEXT_RCLONE_CONFIG_COMMITTED=false'
          echo 'POWDER_MUTATION_EXECUTED=NO'
