name: WP2 P7B-RQ2 CR2 Recovery Pre-RF

on:
  push:
    paths:
      - '.github/workflows/wp2-p7b-rq2-cr2-recovery-preflight.yml'

permissions:
  contents: read

jobs:
  cr2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      TARGET_EXPID: f6de95cb-a13a-421e-bd0e-766dfc1d3fb3
      TARGET_NAME: wp7brq2609012
      SCIENTIFIC_SOURCE_SHA: 13b34c8dc4b515c010a5b531eaaaf40cfcd00c49
      B2_JAR_SHA256: 59914287adac506a28d5e8172eed262a22605f3df4d426b9d92f41dae2448185
      B2_JAR_URL: https://repo.maven.apache.org/maven2/org/eclipse/paho/org.eclipse.paho.client.mqttv3/1.2.5/org.eclipse.paho.client.mqttv3-1.2.5.jar

    steps:
      - name: Checkout full provenance
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: P0 freeze recovered contract and authority
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SCIENTIFIC_SOURCE_SHA^{commit}"
          test "$(git rev-parse "$SCIENTIFIC_SOURCE_SHA:scripts/wp2_a3_runtime_bootstrap.sh")" = d2d8f48f99b2fb7af2e5955ce26180c71f3cca91
          git cat-file -e "$SCIENTIFIC_SOURCE_SHA:scripts/wp2_p7b_target_node_preflight.sh"
          git cat-file -e "$SCIENTIFIC_SOURCE_SHA:experiments/WP-PWD01/p7b-target-runtime-contract-v2.json"
          ! grep -Eq 'portal-cli[[:space:]]+experiment[[:space:]]+(create|terminate)|/usr/local/etc/emulab/tmcc[[:space:]]+attenuator|bin/start\.sh|mosquitto[[:space:]]+-c' .github/workflows/wp2-p7b-rq2-cr2-recovery-preflight.yml
          echo 'CR2_P0_CONTRACT_FREEZE=PASS'
          echo 'RF=NO CELLS=NO RESTART=NO TEARDOWN=NO SCORED=NO'

      - name: P1-P5 recovered provisioning and authoritative preflight
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-rq2-cr2
          rm -rf "$TMP"; mkdir -p "$TMP"
          fail(){ echo "WP2_P7B_RQ2_CR2=BLOCKED:$1" >&2; exit "${2:-90}"; }

          bash scripts/wp2_portal_client_bootstrap.sh "$TMP/portal-api" | tee "$TMP/portal-pin.txt"
          grep -q '^PORTAL_API_PIN_GATE=PASS$' "$TMP/portal-pin.txt" || fail PORTAL_PIN
          portal-cli experiment get --experiment-id "$TARGET_EXPID" > "$TMP/experiment.json" || fail PORTAL_GET
          python3 scripts/wp2_portal_record_guard.py --json "$TMP/experiment.json" --expected-experiment-id "$TARGET_EXPID" | tee "$TMP/portal-gate.txt"
          grep -q '^PORTAL_RECORD_GATE=PASS$' "$TMP/portal-gate.txt" || fail PORTAL_RECORD
          python3 - <<'PY' || fail RESERVATION_IDENTITY
          import json,os
          x=json.load(open('/tmp/wp2-rq2-cr2/experiment.json'))
          assert x.get('id')==os.environ['TARGET_EXPID']
          assert x.get('name')==os.environ['TARGET_NAME']
          assert x.get('project')=='WellPulse'
          assert str(x.get('status','')).lower()=='ready'
          print('CR2_P1_RESERVATION_READY=PASS')
          PY
          portal-cli experiment manifests get --experiment-id "$TARGET_EXPID" > "$TMP/manifest.json" || fail MANIFEST
          python3 - <<'PY' || fail MANIFEST_IDENTITY
          import json,xml.etree.ElementTree as ET
          obj=json.load(open('/tmp/wp2-rq2-cr2/manifest.json')); xmls=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str) and '<node' in x: xmls.append(x)
          walk(obj); out={}
          for text in xmls:
              try: root=ET.fromstring(text)
              except Exception: continue
              for n in root.iter():
                  if n.tag.rsplit('}',1)[-1]!='node': continue
                  cid=n.attrib.get('client_id','')
                  if cid not in {'enb1','rue1'}: continue
                  row={'component_id':n.attrib.get('component_id','')}
                  for c in n.iter():
                      tag=c.tag.rsplit('}',1)[-1]
                      if tag=='hardware_type': row.setdefault('hardware_type',c.attrib.get('name',''))
                      if tag=='disk_image': row.setdefault('disk_image',c.attrib.get('name',''))
                      if tag=='login' and c.attrib.get('hostname') and 'login' not in row:
                          row['login']={'username':c.attrib.get('username','aayoub'),'hostname':c.attrib['hostname'],'port':int(c.attrib.get('port','22'))}
                  out[cid]=row
          for cid,node in [('enb1','nuc1'),('rue1','nuc2')]:
              r=out[cid]
              assert r['hardware_type']=='nuc5300'
              assert r['disk_image']=='urn:publicid:IDN+emulab.net+image+PowderProfiles:U18LL-SRSLTE:1'
              assert r['component_id'].endswith('+'+node)
              assert r.get('login')
          json.dump(out,open('/tmp/wp2-rq2-cr2/nodes.json','w'),indent=2,sort_keys=True)
          print('CR2_P1_MANIFEST_IDENTITY=PASS')
          PY

          umask 077
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          python3 - <<'PY'
          import os,pathlib
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+'\n'
          pathlib.Path('/tmp/wp2-rq2-cr2/private.key').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$TMP/private.key"
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$POWDER_SSH_KEY_PASSPHRASE"\n' > "$TMP/askpass"; chmod 700 "$TMP/askpass"
          export SSH_ASKPASS="$TMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$TMP/private.key" </dev/null >/dev/null || fail SSH_KEY_LOAD
          : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          SSH=(-o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          get_login(){ python3 -c 'import json,sys; x=json.load(open("/tmp/wp2-rq2-cr2/nodes.json"))[sys.argv[1]]["login"]; print("%s\t%s\t%s"%(x.get("username","aayoub"),x["hostname"],x.get("port",22)))' "$1"; }
          IFS=$'\t' read -r CORE_USER CORE_HOST CORE_PORT < <(get_login enb1)
          IFS=$'\t' read -r UE_USER UE_HOST UE_PORT < <(get_login rue1)
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" true || fail CORE_SSH
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" true || fail UE_SSH

          git archive --format=tar "$SCIENTIFIC_SOURCE_SHA" | gzip -n > "$TMP/science.tgz"
          sha256sum "$TMP/science.tgz" | tee "$TMP/science.sha256"
          stage(){ local user=$1 host=$2 port=$3; scp "${SSH[@]}" -P "$port" "$TMP/science.tgz" "$user@$host:/tmp/wp2-cr2-science.tgz" >/dev/null; ssh "${SSH[@]}" -p "$port" "$user@$host" 'set -eu; rm -rf "$HOME/WellPulse"; mkdir -p "$HOME/WellPulse"; tar -xzf /tmp/wp2-cr2-science.tgz -C "$HOME/WellPulse"; rm -f /tmp/wp2-cr2-science.tgz'; }
          stage "$CORE_USER" "$CORE_HOST" "$CORE_PORT" || fail CORE_STAGE
          stage "$UE_USER" "$UE_HOST" "$UE_PORT" || fail UE_STAGE

          bootstrap_system(){
            local role=$1 user=$2 host=$3 port=$4 packages=$5
            echo "CR2_P2_SYSTEM_BOOTSTRAP=$role"
            ssh "${SSH[@]}" -p "$port" "$user@$host" "set -eu; trap 'sudo rm -f /usr/sbin/policy-rc.d' EXIT; printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null; sudo chmod 755 /usr/sbin/policy-rc.d; sudo apt-get update -qq; sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $packages >/dev/null; sudo rm -f /usr/sbin/policy-rc.d; trap - EXIT" || fail "${role}_SYSTEM_BOOTSTRAP"
          }
          bootstrap_system CORE "$CORE_USER" "$CORE_HOST" "$CORE_PORT" 'mosquitto mosquitto-clients rsync tmux curl unzip openssl'
          bootstrap_system UE "$UE_USER" "$UE_HOST" "$UE_PORT" 'mosquitto-clients rsync tmux curl unzip openssl default-jdk-headless'
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" 'set -eu; command -v mosquitto; command -v mosquitto_pub; command -v rsync; command -v tmux; command -v curl; command -v unzip; command -v openssl; ! pgrep -x mosquitto >/dev/null 2>&1; echo CR2_CORE_SYSTEM_CONTRACT=PASS' | tee "$TMP/core-system.txt" || fail CORE_SYSTEM_VERIFY
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" 'set -eu; command -v mosquitto_pub; command -v rsync; command -v tmux; command -v curl; command -v unzip; command -v openssl; command -v java; command -v javac; ! pgrep -x mosquitto >/dev/null 2>&1; echo CR2_UE_SYSTEM_CONTRACT=PASS' | tee "$TMP/ue-system.txt" || fail UE_SYSTEM_VERIFY

          runtime(){ local role=$1 user=$2 host=$3 port=$4; echo "CR2_P3_RUNTIME=$role"; ssh "${SSH[@]}" -p "$port" "$user@$host" 'set -eu; cd "$HOME/WellPulse"; WP_REPO_ROOT="$HOME/WellPulse" WP_A3_VENV="$HOME/.wp2-golden-venv" WP_A3_PYTHON_VERSION=3.11.13 bash scripts/wp2_a3_runtime_bootstrap.sh' | tee "$TMP/${role,,}-runtime.txt"; }
          runtime CORE "$CORE_USER" "$CORE_HOST" "$CORE_PORT" || fail CORE_RUNTIME_BOOTSTRAP
          runtime UE "$UE_USER" "$UE_HOST" "$UE_PORT" || fail UE_RUNTIME_BOOTSTRAP
          grep -q '^A3_RUNTIME_BOOTSTRAP=PASS$' "$TMP/core-runtime.txt" || fail CORE_RUNTIME_CONTRACT
          grep -q '^A3_RUNTIME_BOOTSTRAP=PASS$' "$TMP/ue-runtime.txt" || fail UE_RUNTIME_CONTRACT

          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" "set -eu; D=\"\$HOME/wellpulse-powder-evidence/p7b/cr2-runtime\"; mkdir -p \"\$D/b2-classes\"; curl -fsSL '$B2_JAR_URL' -o \"\$D/paho.jar\"; test \"\$(sha256sum \"\$D/paho.jar\" | awk '{print \$1}')\" = '$B2_JAR_SHA256'; javac -cp \"\$D/paho.jar\" -d \"\$D/b2-classes\" \"\$HOME/WellPulse/experiments/WP-PWD01/b2-semantics/P7BRemoteB2Gateway.java\"; echo B2_JAR_PATH=\"\$D/paho.jar\"; echo CR2_P4_B2_RUNTIME=PASS" | tee "$TMP/b2-runtime.txt" || fail B2_RUNTIME

          echo 'CR2_PACING=pre-authoritative-preflight-quiet:90s'
          sleep 90

          echo 'CR2_P5_AUTHORITATIVE_PREFLIGHT=CORE'
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" 'set -euo pipefail; PY="$HOME/.wp2-golden-venv/bin/python"; WP_REPO_ROOT="$HOME/WellPulse" WP_PYTHON="$PY" bash "$HOME/WellPulse/scripts/wp2_p7b_target_node_preflight.sh" core' 2>&1 | tee "$TMP/core-preflight.txt" || fail AUTHORITATIVE_CORE
          echo 'CR2_P5_AUTHORITATIVE_PREFLIGHT=UE'
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" 'set -euo pipefail; PY="$HOME/.wp2-golden-venv/bin/python"; JAR="$HOME/wellpulse-powder-evidence/p7b/cr2-runtime/paho.jar"; WP_REPO_ROOT="$HOME/WellPulse" WP_PYTHON="$PY" WP_B2_JAR_PATH="$JAR" bash "$HOME/WellPulse/scripts/wp2_p7b_target_node_preflight.sh" ue' 2>&1 | tee "$TMP/ue-preflight.txt" || fail AUTHORITATIVE_UE
          grep -q '^WP2_P7B_TARGET_NODE_PREFLIGHT=PASS$' "$TMP/core-preflight.txt" || fail CORE_MARKER
          grep -q '^WP2_P7B_TARGET_NODE_PREFLIGHT=PASS$' "$TMP/ue-preflight.txt" || fail UE_MARKER
          grep -q '^EFCC_RUNTIME_BINDING=PASS$' "$TMP/core-preflight.txt" || fail CORE_EFCC_MARKER
          grep -q '^EFCC_RUNTIME_BINDING=PASS$' "$TMP/ue-preflight.txt" || fail UE_EFCC_MARKER

          portal-cli experiment get --experiment-id "$TARGET_EXPID" > "$TMP/final.json" || fail FINAL_PORTAL_GET
          python3 -c 'import json; x=json.load(open("/tmp/wp2-rq2-cr2/final.json")); assert str(x.get("status","")).lower()=="ready"' || fail FINAL_READY
          printf 'WP2_P7B_RQ2_CR2=PASS_RECOVERED_PRE_RF_ENVIRONMENT\nRF_AUTHORIZED=NO\nCELLS_AUTHORIZED=NO\nRESTART_AUTHORIZED=NO\nTEARDOWN_AUTHORIZED=NO\nSCORED_AUTHORIZATION=BLOCKED\n' | tee "$TMP/verdict.txt"

          tar -C "$TMP" --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf "$TMP/cr2-evidence.tar" portal-gate.txt science.sha256 core-system.txt ue-system.txt core-runtime.txt ue-runtime.txt b2-runtime.txt core-preflight.txt ue-preflight.txt verdict.txt
          sha256sum "$TMP/cr2-evidence.tar" | tee "$TMP/cr2-evidence.sha256"
          tar -tf "$TMP/cr2-evidence.tar" > "$TMP/cr2-evidence-members.txt"
          test "$(wc -l < "$TMP/cr2-evidence-members.txt")" -eq 10 || fail EVIDENCE_MEMBER_COUNT
          sha256sum -c "$TMP/cr2-evidence.sha256" || fail EVIDENCE_SHA_READBACK
          echo 'CR2_P6_CONTROLLER_READBACK=PASS'

      - name: P6 upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp2-p7b-rq2-cr2-recovery-preflight-${{ github.run_id }}
          path: |
            /tmp/wp2-rq2-cr2/portal-gate.txt
            /tmp/wp2-rq2-cr2/science.sha256
            /tmp/wp2-rq2-cr2/core-system.txt
            /tmp/wp2-rq2-cr2/ue-system.txt
            /tmp/wp2-rq2-cr2/core-runtime.txt
            /tmp/wp2-rq2-cr2/ue-runtime.txt
            /tmp/wp2-rq2-cr2/b2-runtime.txt
            /tmp/wp2-rq2-cr2/core-preflight.txt
            /tmp/wp2-rq2-cr2/ue-preflight.txt
            /tmp/wp2-rq2-cr2/verdict.txt
            /tmp/wp2-rq2-cr2/cr2-evidence.tar
            /tmp/wp2-rq2-cr2/cr2-evidence.sha256
            /tmp/wp2-rq2-cr2/cr2-evidence-members.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

      - name: Enforce pre-RF stop
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^WP2_P7B_RQ2_CR2=PASS_RECOVERED_PRE_RF_ENVIRONMENT$' /tmp/wp2-rq2-cr2/verdict.txt
          echo 'CR2_STOP=PASS_BEFORE_RF'
          echo 'NEXT_LIVE_STAGE_NOT_AUTHORIZED_BY_CR2'
