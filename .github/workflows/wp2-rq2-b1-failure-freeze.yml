name: WP2 RQ2 B1 Failure Freeze

on:
  push:
    paths:
      - '.github/diagnostics/wp2-rq2-b1-failure-freeze.trigger'

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare SSH
        env:
          POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
          POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" "$RUNNER_TEMP/wp2-b1-freeze"
          umask 077
          python3 - "$RUNNER_TEMP/wp2-b1-freeze/private.key" <<'PY'
          import os,sys
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+'\n'
          Path(sys.argv[1]).write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$RUNNER_TEMP/wp2-b1-freeze/private.key"
          cat > "$RUNNER_TEMP/wp2-b1-freeze/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$RUNNER_TEMP/wp2-b1-freeze/askpass"
          export SSH_ASKPASS="$RUNNER_TEMP/wp2-b1-freeze/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$RUNNER_TEMP/wp2-b1-freeze/private.key" </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Pull both node roots and hash
        run: |
          set -euo pipefail
          RUN_ID='wp2-p7b-rq2-manual-20260828T060000Z'
          UE_ROOT="/users/aayoub/wellpulse-powder-evidence/p7b/$RUN_ID"
          CORE_ROOT="/users/aayoub/wellpulse-powder-evidence/p7b/${RUN_ID}-core"
          OUT="$RUNNER_TEMP/wp2-b1-freeze/out"
          mkdir -p "$OUT/verify-ue" "$OUT/verify-core"
          SSH=(-o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          ssh "${SSH[@]}" aayoub@nuc2.emulab.net "set -eu; test -d '$UE_ROOT'; tar -C '$UE_ROOT' -czf - ." > "$OUT/ue-root.tgz"
          ssh "${SSH[@]}" aayoub@nuc1.emulab.net "set -eu; test -d '$CORE_ROOT'; tar -C '$CORE_ROOT' -czf - ." > "$OUT/core-root.tgz"
          test -s "$OUT/ue-root.tgz"
          test -s "$OUT/core-root.tgz"

          sha256sum "$OUT/ue-root.tgz" "$OUT/core-root.tgz" | tee "$OUT/OUTER_SHA256SUMS.txt"
          tar -C "$OUT/verify-ue" -xzf "$OUT/ue-root.tgz"
          tar -C "$OUT/verify-core" -xzf "$OUT/core-root.tgz"
          (cd "$OUT/verify-ue" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$OUT/UE_INTERNAL_SHA256SUMS.txt"
          (cd "$OUT/verify-core" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$OUT/CORE_INTERNAL_SHA256SUMS.txt"
          printf 'RUN_ID=%s\nGITHUB_RUN_ID=%s\nUE_SOURCE=%s\nCORE_SOURCE=%s\n' "$RUN_ID" "$GITHUB_RUN_ID" "$UE_ROOT" "$CORE_ROOT" > "$OUT/PROVENANCE.txt"
          echo 'B1_FAILURE_NODE_PULL_GATE=PASS'
          echo 'B1_FAILURE_HASH_GATE=PASS'

      - name: Bounded failure classification evidence
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/wp2-b1-freeze/out"
          UE="$OUT/verify-ue"
          CORE="$OUT/verify-core"
          CELL='P7B-B1-S3'
          {
            echo '=== STATUS ==='
            cat "$UE/p7b_c_status.json" 2>/dev/null || true
            echo '=== UE CELL FILES ==='
            find "$UE/cells/$CELL" -maxdepth 2 -type f -printf '%P\n' 2>/dev/null | sort || true
            echo '=== CORE RECEIVER FILES ==='
            find "$CORE/cells/$CELL/receiver" -maxdepth 1 -type f -printf '%P\n' 2>/dev/null | sort || true
            echo '=== CORE RECEIVER CONSOLE ==='
            tail -n 160 "$CORE/cells/$CELL/receiver/console.txt" 2>/dev/null || true
            echo '=== CORE RECEIVER EVENTS ==='
            tail -n 160 "$CORE/cells/$CELL/receiver/receiver_events.jsonl" 2>/dev/null || true
            echo '=== UE TLS PROBE ==='
            cat "$UE/cells/$CELL/tls_mqtt_probe.txt" 2>/dev/null || true
            echo '=== UE Q0 PROBES ==='
            cat "$UE/cells/$CELL/q0_user_plane_probes.txt" 2>/dev/null || true
            echo '=== UE READINESS ==='
            cat "$UE/cells/$CELL/readiness_verdict.json" 2>/dev/null || true
            echo '=== SCIENTIFIC FRONTIER ==='
            if test -f "$UE/cells/$CELL/attenuator_q3_set.txt"; then echo 'Q3_STARTED=YES'; else echo 'Q3_STARTED=NO'; fi
            if test -f "$UE/cells/$CELL/telemetry_generated.csv"; then echo 'GENERATOR_STARTED=YES'; else echo 'GENERATOR_STARTED=NO'; fi
            if test -f "$UE/cells/$CELL/runtime_manifest.json"; then echo 'GATEWAY_RUNTIME_MANIFEST=YES'; else echo 'GATEWAY_RUNTIME_MANIFEST=NO'; fi
          } | tee "$OUT/BOUNDED_DIAGNOSTICS.txt"

      - name: Upload frozen B1 failure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp2-p7b-rq2-manual-20260828T060000Z-b1-failure-freeze
          path: ${{ runner.temp }}/wp2-b1-freeze/out/
          if-no-files-found: error
          retention-days: 90
