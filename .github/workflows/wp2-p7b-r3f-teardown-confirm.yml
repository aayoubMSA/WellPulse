name: WP2 P7B-R3F Teardown Confirmation

on:
  push:
    paths:
      - '.wp2-p7b-r3f-teardown-confirm-trigger'

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      TARGET_EXPID: 12b39276-af0f-4e34-8dfd-685b006dd6bd
      TARGET_NAME: wp7brq19810043
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Read-only exact teardown corroboration
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-r3f-teardown-confirm-trigger)" = 'AUTHORITY=R3F_TEARDOWN_CONFIRM_READ_ONLY'
          ! grep -Eq 'portal-cli[[:space:]]+experiment[[:space:]]+(create|extend|modify|terminate)' .github/workflows/wp2-p7b-r3f-teardown-confirm.yml
          bash scripts/wp2_portal_client_bootstrap.sh /tmp/portal-api | tee /tmp/portal-pin.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/portal-pin.txt
          set +e
          portal-cli experiment get --experiment-id "$TARGET_EXPID" > /tmp/get.json 2>/tmp/get.err
          GRC=$?
          portal-cli experiment list > /tmp/list.json 2>/tmp/list.err
          LRC=$?
          set -e
          echo "GET_RC=$GRC"
          echo "LIST_RC=$LRC"
          if [[ "$GRC" -eq 0 ]]; then
            python3 - <<'PY'
import json,os
x=json.load(open('/tmp/get.json'))
assert x.get('id')==os.environ['TARGET_EXPID']
assert x.get('name')==os.environ['TARGET_NAME']
st=str(x.get('status','unknown')).lower()
print('GET_STATUS='+st)
if st in {'terminated','destroyed'}:
    print('R3F_TEARDOWN_CONFIRM=PASS_TERMINAL_STATE')
    raise SystemExit(0)
print('R3F_TEARDOWN_CONFIRM=BLOCKED_NONTERMINAL:'+st)
raise SystemExit(20)
PY
          fi
          if [[ "$LRC" -ne 0 ]]; then
            echo 'R3F_TEARDOWN_CONFIRM=UNKNOWN_GET_AND_LIST_ERROR'
            sed -n '1,40p' /tmp/get.err || true
            sed -n '1,40p' /tmp/list.err || true
            exit 21
          fi
          python3 - <<'PY'
import json,os
obj=json.load(open('/tmp/list.json'))
xs=obj if isinstance(obj,list) else obj.get('experiments',[])
hits=[x for x in xs if isinstance(x,dict) and (x.get('id')==os.environ['TARGET_EXPID'] or x.get('name')==os.environ['TARGET_NAME'])]
print('LIST_MATCH_COUNT='+str(len(hits)))
if not hits:
    print('R3F_TEARDOWN_CONFIRM=PASS_ABSENT_FROM_AUTHORITATIVE_LIST_AFTER_TERMINATE')
    raise SystemExit(0)
for x in hits:
    print('LIST_MATCH='+json.dumps({'id':x.get('id'),'name':x.get('name'),'status':x.get('status')},sort_keys=True))
states={str(x.get('status','unknown')).lower() for x in hits}
if states and states <= {'terminated','destroyed'}:
    print('R3F_TEARDOWN_CONFIRM=PASS_TERMINAL_LIST_STATE')
    raise SystemExit(0)
print('R3F_TEARDOWN_CONFIRM=BLOCKED_LIST_MATCH_NONTERMINAL')
raise SystemExit(22)
PY
