name: WP2 K-Fastlane Live Compatibility Gate

on:
  push:
    branches: [main]
    paths:
      - '.wp2-kfastlane-live-compat-trigger'

permissions:
  contents: read

concurrency:
  group: wp2-kfastlane-live-compat
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      POWDER_PROJECT: WellPulse
      PROFILE_PROJECT: PowderProfiles
      PROFILE_NAME: srslte-controlled-rf
      EXPECTED_HARDWARE: nuc5300
      EXPECTED_IMAGE: urn:publicid:IDN+emulab.net+image+PowderProfiles:U18LL-SRSLTE:1

    steps:
      - name: Checkout audited controller state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate bounded compatibility authorization
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(awk -F= '$1=="execute" {print $2}' .wp2-kfastlane-live-compat-trigger | tail -n1 | tr -d '\r')"
          [[ "$AUTH" == "KFASTLANE_COMPAT" ]]
          [[ -n "$PORTAL_TOKEN" ]]
          [[ -n "$POWDER_USERNAME" ]]
          [[ -n "$POWDER_SSH_PRIVATE_KEY" ]]
          echo 'COMPATIBILITY_ONLY=YES'
          echo 'GOLDEN_WORKLOAD_AUTHORIZED=NO'
          echo 'H_CALIBRATION_AUTHORIZED=NO'
          echo 'SCORED_RUN_AUTHORIZED=NO'

      - name: Install frozen Portal client and prepare SSH identity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/wp2_portal_client_bootstrap.sh /tmp/portal-api | tee /tmp/portal-pin.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/portal-pin.txt

          umask 077
          mkdir -p "$HOME/.ssh" /tmp/kcompat
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path.home().joinpath('.ssh/id_powder').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_powder"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat >/tmp/kcompat/askpass <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/kcompat/askpass
          export SSH_ASKPASS=/tmp/kcompat/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          setsid -w ssh-add "$HOME/.ssh/id_powder" </dev/null >/dev/null
          echo 'KFASTLANE_SSH_IDENTITY=PASS'

      - name: Create exactly one one-hour compatibility reservation
        id: create
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX="${GITHUB_RUN_ID: -7}"
          NAME="wpkc${SUFFIX}"
          [[ ${#NAME} -le 16 ]]
          printf '%s\n' "$NAME" > /tmp/kcompat/name
          portal-cli experiment create \
            --name "$NAME" \
            --project "$POWDER_PROJECT" \
            --profile-name "$PROFILE_NAME" \
            --profile-project "$PROFILE_PROJECT" \
            --duration 1 \
            > /tmp/kcompat/create.json
          EXPID="$(jq -r '.id // empty' /tmp/kcompat/create.json)"
          [[ "$EXPID" =~ ^[0-9a-fA-F-]{36}$ ]]
          printf '%s\n' "$EXPID" > /tmp/kcompat/experiment_id
          echo "experiment_id=$EXPID" >> "$GITHUB_OUTPUT"
          echo "KFASTLANE_COMPAT_CREATED=$EXPID"

      - name: Wait READY and bind exact Portal status/expiry
        id: portal
        shell: bash
        run: |
          set -euo pipefail
          EXPID="$(cat /tmp/kcompat/experiment_id)"
          READY=0
          for i in $(seq 1 60); do
            set +e
            portal-cli experiment get --experiment-id "$EXPID" > /tmp/kcompat/status.json 2>/tmp/kcompat/status.err
            rc=$?
            set -e
            if [[ "$rc" -ne 0 ]]; then sleep 20; continue; fi
            STATUS="$(jq -r '.status // "unknown"' /tmp/kcompat/status.json)"
            echo "PORTAL_POLL_${i}=$STATUS"
            if [[ "$STATUS" == ready ]]; then READY=1; break; fi
            if [[ "$STATUS" =~ ^(failed|error|terminated)$ ]]; then exit 21; fi
            sleep 20
          done
          [[ "$READY" -eq 1 ]]

          python3 scripts/wp2_portal_record_guard.py \
            --json /tmp/kcompat/status.json \
            --expected-experiment-id "$EXPID" | tee /tmp/kcompat/portal-record-gate.txt
          grep -q '^PORTAL_RECORD_GATE=PASS$' /tmp/kcompat/portal-record-gate.txt
          EXPIRES="$(awk -F= '$1=="EXPIRES_UTC" {print $2}' /tmp/kcompat/portal-record-gate.txt | tail -1)"
          [[ -n "$EXPIRES" ]]
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/wp2_prelaunch_time_guard.py \
            --now-utc "$NOW" --expires-utc "$EXPIRES" --min-remaining-s 2700 | tee /tmp/kcompat/time-gate.txt
          grep -q '^PRELAUNCH_TIME_GATE=PASS$' /tmp/kcompat/time-gate.txt
          echo "expires_utc=$EXPIRES" >> "$GITHUB_OUTPUT"
          echo 'K3_LIVE_PORTAL_BINDING=PASS'
          echo 'K5_LIVE_TIME_BINDING=PASS'

      - name: Retrieve manifest and freeze hardware/image/endpoints
        shell: bash
        run: |
          set -euo pipefail
          EXPID="$(cat /tmp/kcompat/experiment_id)"
          portal-cli experiment manifests get --experiment-id "$EXPID" > /tmp/kcompat/manifests.json
          python3 - <<'PY'
          import json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          obj=json.loads(Path('/tmp/kcompat/manifests.json').read_text())
          xmls=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str) and '<' in x and ('rspec' in x.lower() or '<node' in x.lower()): xmls.append(x)
          walk(obj)
          out={}
          for text in xmls:
              try: root=ET.fromstring(text)
              except Exception: continue
              for node in root.iter():
                  if node.tag.rsplit('}',1)[-1] != 'node': continue
                  cid=node.attrib.get('client_id','')
                  if cid not in {'enb1','rue1'}: continue
                  row={'client_id':cid,'component_id':node.attrib.get('component_id','')}
                  for ch in node.iter():
                      tag=ch.tag.rsplit('}',1)[-1]
                      if tag=='hardware_type' and 'hardware_type' not in row: row['hardware_type']=ch.attrib.get('name','')
                      if tag=='disk_image' and 'disk_image' not in row: row['disk_image']=ch.attrib.get('name','')
                      if tag=='login' and ch.attrib.get('hostname') and 'login' not in row:
                          row['login']={'username':ch.attrib.get('username',''),'hostname':ch.attrib['hostname'],'port':int(ch.attrib.get('port','22'))}
                  out[cid]=row
          Path('/tmp/kcompat/nodes.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          expected_hw=os.environ['EXPECTED_HARDWARE']; expected_image=os.environ['EXPECTED_IMAGE']
          for cid in ('enb1','rue1'):
              r=out.get(cid) or {}
              assert r.get('login'), f'missing login {cid}'
              assert r.get('hardware_type')==expected_hw, (cid,r.get('hardware_type'))
              assert r.get('disk_image')==expected_image, (cid,r.get('disk_image'))
          print('KFASTLANE_MANIFEST_IDENTITY=PASS')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Verify controller SSH topology and runtime/profile fingerprints
        id: nodes
        shell: bash
        run: |
          set -euo pipefail
          login(){ jq -r --arg n "$1" '.[$n].login | [.username,.hostname,(.port|tostring)] | @tsv' /tmp/kcompat/nodes.json; }
          IFS=$'\t' read -r CORE_USER CORE_HOST CORE_PORT < <(login enb1)
          IFS=$'\t' read -r UE_USER UE_HOST UE_PORT < <(login rue1)
          CORE_USER="${CORE_USER:-$POWDER_USERNAME}"; UE_USER="${UE_USER:-$POWDER_USERNAME}"
          printf '%s\t%s\t%s\n' "$CORE_USER" "$CORE_HOST" "$CORE_PORT" > /tmp/kcompat/core-login.tsv
          printf '%s\t%s\t%s\n' "$UE_USER" "$UE_HOST" "$UE_PORT" > /tmp/kcompat/ue-login.tsv
          echo "core_host=$CORE_HOST" >> "$GITHUB_OUTPUT"
          echo "ue_host=$UE_HOST" >> "$GITHUB_OUTPUT"

          probe(){
            local role="$1" user="$2" host="$3" port="$4"
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$port" "$user@$host" 'set -eu
              echo "HOST=$(hostname)"
              echo "USER=$(whoami)"
              echo "KERNEL=$(uname -srmo)"
              echo "PYTHON3=$(python3 --version 2>&1)"
              echo "OPENSSL=$(openssl version 2>&1)"
              echo "MOSQUITTO=$(mosquitto -h 2>&1 | head -1 || true)"
              test -x /local/repository/bin/start.sh
              echo "START_SH_SHA256=$(sha256sum /local/repository/bin/start.sh | awk '\''{print $1}'\'')"
              for f in /local/repository/bin/start-enb.sh /local/repository/bin/start-ue.sh; do if test -f "$f"; then echo "SCRIPT_SHA256=$(basename "$f"):$(sha256sum "$f" | awk '\''{print $1}'\'')"; fi; done
              if git -C /local/repository rev-parse HEAD >/dev/null 2>&1; then echo "PROFILE_REPO_SHA=$(git -C /local/repository rev-parse HEAD)"; else echo "PROFILE_REPO_SHA=UNAVAILABLE"; fi
              test -d /proj/WellPulse
              test -w /proj/WellPulse
              echo "PROJ_WELLpulse_WRITABLE=PASS"' | tee "/tmp/kcompat/${role}-fingerprint.txt"
          }
          probe core "$CORE_USER" "$CORE_HOST" "$CORE_PORT"
          probe ue "$UE_USER" "$UE_HOST" "$UE_PORT"
          echo 'KFASTLANE_CONTROLLER_SSH=PASS'
          echo 'KFASTLANE_RUNTIME_FINGERPRINT=PASS'

      - name: K4 prove bounded detached SSH process return
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\t' read -r USER HOST PORT < /tmp/kcompat/core-login.tsv
          T0=$(date +%s)
          timeout 15s ssh -n -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" \
            "rm -f /tmp/wp2-k4-compat.ready /tmp/wp2-k4-compat.pid; nohup sh -c 'echo ready > /tmp/wp2-k4-compat.ready; sleep 30' </dev/null >/tmp/wp2-k4-compat.log 2>&1 & pid=\$!; echo \$pid >/tmp/wp2-k4-compat.pid; echo receiver_pid=\$pid"
          ELAPSED=$(( $(date +%s)-T0 ))
          [[ "$ELAPSED" -le 15 ]]
          sleep 2
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" \
            'test -s /tmp/wp2-k4-compat.ready; pid=$(cat /tmp/wp2-k4-compat.pid); kill -0 "$pid"; kill "$pid" || true'
          echo "K4_LIVE_DETACH_ELAPSED_S=$ELAPSED"
          echo 'K4_LIVE_DETACH_GATE=PASS'

      - name: K6 prove cross-node /proj persistence and build controller bundle
        id: pull
        shell: bash
        run: |
          set -euo pipefail
          EXPID="$(cat /tmp/kcompat/experiment_id)"
          IFS=$'\t' read -r UE_USER UE_HOST UE_PORT < /tmp/kcompat/ue-login.tsv
          IFS=$'\t' read -r CORE_USER CORE_HOST CORE_PORT < /tmp/kcompat/core-login.tsv
          PDIR="/proj/WellPulse/kfastlane-compat/$EXPID"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$UE_PORT" "$UE_USER@$UE_HOST" \
            "set -eu; rm -rf '$PDIR'; mkdir -p '$PDIR/raw' '$PDIR/escrow'; printf 'wellpulse-k6-compat:%s\\n' '$EXPID' > '$PDIR/raw/persistence_probe.txt'; cd '$PDIR'; sha256sum raw/persistence_probe.txt > escrow/SOURCE_SHA256SUMS.txt; sha256sum -c escrow/SOURCE_SHA256SUMS.txt; printf 'pass\\n' > escrow/PERSISTENT_ESCROW_GATE.PASS; printf 'compatibility_only=true\\n' > escrow/CONTROLLER_OFFPOWDER_REQUIRED"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" \
            "set -eu; cd '$PDIR'; sha256sum -c escrow/SOURCE_SHA256SUMS.txt; test -s escrow/PERSISTENT_ESCROW_GATE.PASS"
          echo 'K6_CROSS_NODE_PROJ_GATE=PASS'

          export WP_PERSIST_HOST="$UE_HOST" WP_REMOTE_USER="$UE_USER" WP_SSH_PORT="$UE_PORT"
          export WP_PERSIST_REMOTE_DIR="$PDIR" WP_CONTROLLER_LOCAL_DIR=/tmp/kcompat-pulled
          export WP_CONTROLLER_BUNDLE_OUT=/tmp/kcompat-controller.tar WP_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"
          bash scripts/wp2_controller_pull_persistent_escrow.sh | tee /tmp/kcompat/controller-pull.txt
          grep -q '^CONTROLLER_PULL_GATE=PASS$' /tmp/kcompat/controller-pull.txt
          SHA="$(awk -F= '$1=="CONTROLLER_BUNDLE_SHA256" {print $2}' /tmp/kcompat/controller-pull.txt | tail -1)"
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]
          echo "bundle_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "persistent_dir=$PDIR" >> "$GITHUB_OUTPUT"

      - name: Upload actual /proj compatibility bundle off POWDER
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp2-kcompat-${{ github.run_id }}
          path: /tmp/kcompat-controller.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Download actual bundle to independent controller path
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wp2-kcompat-${{ github.run_id }}
          path: /tmp/kcompat-roundtrip

      - name: Verify actual off-POWDER artifact and close K2/K6 transport chain
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.pull.outputs.bundle_sha }}
        run: |
          set -euo pipefail
          WP_ROUNDTRIP_TAR=/tmp/kcompat-roundtrip/kcompat-controller.tar \
          WP_EXPECTED_BUNDLE_SHA256="$EXPECTED_SHA" \
          WP_VERIFY_DIR=/tmp/kcompat-verified \
            bash scripts/wp2_controller_verify_artifact_roundtrip.sh | tee /tmp/kcompat/controller-finalizer.txt
          grep -q '^CONTROLLER_OFFPOWDER_GATE=PASS$' /tmp/kcompat/controller-finalizer.txt
          grep -q '^EVIDENCE_ESCROW_GATE=PASS$' /tmp/kcompat/controller-finalizer.txt
          grep -q '^TEARDOWN_AUTHORIZED=YES$' /tmp/kcompat/controller-finalizer.txt
          echo 'K2_LIVE_CONTROLLER_TRANSPORT=PASS'
          echo 'K6_LIVE_PERSISTENCE_AND_PULL=PASS'
          echo 'K7_RF_OBSERVATION_COMMAND_EXECUTED=NO'
          echo 'K8_LIVE_COMPATIBILITY_PROOFS=PASS'

      - name: Mandatory cleanup of compatibility reservation
        if: always()
        id: cleanup
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s /tmp/kcompat/experiment_id ]]; then
            echo 'COMPAT_CLEANUP=NOT_CREATED'
            exit 0
          fi
          EXPID="$(cat /tmp/kcompat/experiment_id)"
          set +e
          portal-cli experiment terminate --experiment-id "$EXPID" >/tmp/kcompat/terminate.out 2>/tmp/kcompat/terminate.err
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo 'COMPAT_CLEANUP=TERMINATE_REQUESTED'
            exit 0
          fi
          set +e
          portal-cli experiment get --experiment-id "$EXPID" >/tmp/kcompat/postterm.json 2>/tmp/kcompat/postterm.err
          grc=$?
          set -e
          if [[ "$grc" -ne 0 ]]; then
            echo 'COMPAT_CLEANUP=ALREADY_ABSENT'
            exit 0
          fi
          echo 'COMPAT_CLEANUP=FAIL_EXPERIMENT_STILL_RESOLVES'
          exit 90
