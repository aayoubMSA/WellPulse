name: POWDER G3 SSH Secret Format Diagnostic

on:
  push:
    branches: [main]
    paths:
      - powder/g3-key-diag-trigger.json

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify secret without revealing material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/powder
          python3 - <<'PY'
          import os, json, base64
          from pathlib import Path
          s=os.environ.get('POWDER_SSH_PRIVATE_KEY','')
          normalized=s.replace('\r\n','\n').replace('\r','\n')
          escaped_normalized=normalized
          if '\\n' in escaped_normalized and '\n' not in escaped_normalized:
              escaped_normalized=escaped_normalized.replace('\\n','\n')
          def starts_private(x):
              return x.startswith('-----BEGIN OPENSSH PRIVATE KEY-----') or x.startswith('-----BEGIN RSA PRIVATE KEY-----') or x.startswith('-----BEGIN PRIVATE KEY-----')
          def starts_public(x):
              return x.startswith('ssh-ed25519 ') or x.startswith('ssh-rsa ') or x.startswith('ecdsa-sha2-')
          def starts_putty(x):
              return x.startswith('PuTTY-User-Key-File-')
          decoded=''; b64_ok=False
          compact=''.join(s.split())
          try:
              raw=base64.b64decode(compact, validate=True)
              decoded=raw.decode('utf-8','replace')
              b64_ok=True
          except Exception:
              pass
          info={
              'secret_present': bool(s),
              'length_chars': len(s),
              'actual_newline_count': s.count('\n'),
              'contains_cr': '\r' in s,
              'contains_literal_backslash_n': '\\n' in s,
              'raw_starts_private_header': starts_private(s),
              'raw_starts_public_key': starts_public(s),
              'raw_starts_putty_key': starts_putty(s),
              'normalized_starts_private_header': starts_private(escaped_normalized),
              'normalized_starts_public_key': starts_public(escaped_normalized),
              'normalized_starts_putty_key': starts_putty(escaped_normalized),
              'whole_secret_is_strict_base64': b64_ok,
              'base64_decoded_starts_private_header': starts_private(decoded) if b64_ok else False,
              'base64_decoded_starts_public_key': starts_public(decoded) if b64_ok else False,
              'base64_decoded_starts_putty_key': starts_putty(decoded) if b64_ok else False,
          }
          Path('evidence/powder/g3-key-format-diag.json').write_text(json.dumps(info,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/powder/g3-key-format-diag.json
          git commit -m 'Record sanitized POWDER SSH key format diagnostic'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
