name: WP2 RQ2 M3 Evidence Pull

on:
  push:
    paths:
      - '.github/diagnostics/wp2-rq2-m3-evidence-pull.trigger'

permissions:
  contents: read
  actions: read

jobs:
  pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
          POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" "$RUNNER_TEMP/wp2-m3-pull"
          umask 077
          python3 - "$RUNNER_TEMP/wp2-m3-pull/private.key" <<'PY'
          import os,sys
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+'\n'
          Path(sys.argv[1]).write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$RUNNER_TEMP/wp2-m3-pull/private.key"
          cat > "$RUNNER_TEMP/wp2-m3-pull/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$RUNNER_TEMP/wp2-m3-pull/askpass"
          export SSH_ASKPASS="$RUNNER_TEMP/wp2-m3-pull/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$RUNNER_TEMP/wp2-m3-pull/private.key" </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Pull M3 Q0 escrow and verify
        run: |
          set -euo pipefail
          RUN_ID='wp2-p7b-rq2-manual-20260828T060000Z'
          EXPID='41d64b85-e743-4d06-a81d-687c28c58e52'
          ESC="/proj/WellPulse/evidence-escrow/$EXPID/$RUN_ID/m3-q0"
          OUT="$RUNNER_TEMP/wp2-m3-pull/out"
          mkdir -p "$OUT"
          SSH=(-o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          ssh "${SSH[@]}" aayoub@nuc2.emulab.net "set -eu; test -d '$ESC'; test -n \"\$(find '$ESC' -type f -print -quit)\"; tar -C '$ESC' -czf - ." > "$OUT/m3-q0-escrow.tgz"
          test -s "$OUT/m3-q0-escrow.tgz"
          tar -tzf "$OUT/m3-q0-escrow.tgz" > "$OUT/TAR_CONTENTS.txt"
          sha256sum "$OUT/m3-q0-escrow.tgz" | tee "$OUT/m3-q0-escrow.tgz.sha256"
          printf 'RUN_ID=%s\nEXPERIMENT_ID=%s\nSOURCE=/proj escrow\nGITHUB_RUN_ID=%s\n' "$RUN_ID" "$EXPID" "$GITHUB_RUN_ID" > "$OUT/PROVENANCE.txt"
          grep -q 'core_q0_precheck.txt' "$OUT/TAR_CONTENTS.txt"
          grep -q 'ue_q0_precheck.txt' "$OUT/TAR_CONTENTS.txt"
          grep -q 'attenuator_q0_set.txt' "$OUT/TAR_CONTENTS.txt"
          grep -q 'broker_start.txt' "$OUT/TAR_CONTENTS.txt"
          grep -q 'q0_user_plane_probes.txt' "$OUT/TAR_CONTENTS.txt"
          grep -q 'tls_mqtt_probe.txt' "$OUT/TAR_CONTENTS.txt"
          echo 'M3_ESCROW_PULL_GATE=PASS'
          echo 'M3_INTERNAL_CONTENT_GATE=PASS'

      - name: Upload M3 Q0 raw evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp2-p7b-rq2-manual-20260828T060000Z-m3-q0-escrow
          path: ${{ runner.temp }}/wp2-m3-pull/out/
          if-no-files-found: error
          retention-days: 90
