name: WellPulse R7f-R3 Reproducibility Surface QA

on:
  pull_request:
    paths:
      - ".github/workflows/r7fr3-repro-surface-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact R7f-R3 authority
        uses: actions/checkout@v4
        with:
          ref: 4160640ee6deb834b2258727e682a9b3ec76d37f
          fetch-depth: 0
          persist-credentials: false

      - name: Static science-lock reproducibility gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          old=Path("manuscript/revival_2026-09-22/WellPulse_Revival_R7fR2_EvidenceFraming_20260922.tex").read_text(encoding="utf-8")
          new=Path("manuscript/revival_2026-09-22/WellPulse_Revival_R7fR3_ReproSurface_20260922.tex").read_text(encoding="utf-8")

          # Title/abstract/introduction/related work locked.
          assert old[:old.index("\\section{Recovery Observables and Experimental Protocol}")] == new[:new.index("\\section{Recovery Observables and Experimental Protocol}")]

          # Historical FIT onward through Results remains byte-identical; only config subsection inserted before historical FIT.
          h="\\subsection{Historical FIT campaign}"
          r="\\section{Results}"
          assert old[old.index(h):old.index(r)] == new[new.index(h):new.index(r)]

          # Results + Discussion + Threats locked through Repro section.
          rp="\\section{Reproducibility and Data Availability}"
          assert old[old.index(r):old.index(rp)] == new[new.index(r):new.index(rp)]

          # Conclusion + declarations + bibliography locked.
          c="\\section{Conclusion}"
          assert old[old.index(c):] == new[new.index(c):]

          active="\n".join(line.split("%",1)[0] for line in new.splitlines())
          low=active.lower()

          required=[
            "execution configuration and code authority",
            "paho mqtt 1.6.1",
            "32628193889",
            "448265/448266/448269",
            "35653569079",
            "449953",
            "python 3.12.14",
            "python-3.5-compatible",
            "iptables output reject",
            "records 3001--5000",
            "c2 exec restart after record 4000",
            "synchronous=full",
            "exact receiver",
            "version was not preserved",
            "pre-final amendment documented an intended",
            "executed frozen runner requests",
            "no scientific claim in this paper is attributed to journal-mode choice",
            "supplement\\_r7fr3",
            "127 entries",
            "6,881,643-byte archive",
          ]
          for x in required:
              assert x in low, x

          # Frozen evidence anchors remain.
          for x in [
            "68.785--70.264","69.217","74.798--76.308","75.438",
            "0/3","3/3 unresolved","10,000/10,000",
          ]:
              assert x.lower() in low, x

          # No private IDs/secrets.
          for x in [
            "1jdv2kw0uquexft6dfnd1lrzglyyi-kkc",
            "1hxr_b7fyieggyj4cb0ijvuhhbwdu7qws",
            "1qs-_vvDcrkx6nooxxenfo3fzGuto6Ebw".lower(),
            "fit_password=",
            "begin openssh private key",
          ]:
              assert x not in low, x

          # Claim firewall.
          for x in [
            "novel recovery architecture",
            "68 s receiver completion",
            "68 s end-to-end recovery",
            "endpoint misclassification was repeatedly demonstrated",
            "to our knowledge",
          ]:
              assert x not in low, x

          print("R7FR3_SCIENCE_LOCK=PASS")
          print("R7FR3_CONFIG_SURFACE=PASS")
          print("R7FR3_PRIVACY_GATE=PASS")
          PY

      - name: Run sanitized supplement self-check
        shell: bash
        run: |
          set -euo pipefail
          python3 manuscript/revival_2026-09-22/supplement_r7fr3/r7fr3_selfcheck.py

      - name: Install LaTeX and package tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-publishers latexmk poppler-utils >/dev/null

      - name: Compile exact R7f-R3 source
        shell: bash
        working-directory: manuscript/revival_2026-09-22
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error WellPulse_Revival_R7fR3_ReproSurface_20260922.tex
          test -s WellPulse_Revival_R7fR3_ReproSurface_20260922.pdf
          ! grep -q "Undefined control sequence" WellPulse_Revival_R7fR3_ReproSurface_20260922.log
          ! grep -q "LaTeX Error" WellPulse_Revival_R7fR3_ReproSurface_20260922.log
          ! grep -q "Citation .* undefined" WellPulse_Revival_R7fR3_ReproSurface_20260922.log
          ! grep -q "There were undefined references" WellPulse_Revival_R7fR3_ReproSurface_20260922.log
          ! grep -Fq 'Overfull \hbox' WellPulse_Revival_R7fR3_ReproSurface_20260922.log
          pdfinfo WellPulse_Revival_R7fR3_ReproSurface_20260922.pdf | tee R7fR3_pdfinfo.txt

      - name: Build sanitized reviewer supplement package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="manuscript/revival_2026-09-22"
          OUT="$ROOT/R7fR3_sanitized_package"
          rm -rf "$OUT"
          mkdir -p "$OUT/supplement" "$OUT/code"
          cp "$ROOT/supplement_r7fr3/"* "$OUT/supplement/"
          cp experiments/WP-RT01/fit_runner_py35.py "$OUT/code/"
          cp experiments/WP-RT01/fit_runner_q0_instrumented_py35.py "$OUT/code/"
          cp scripts/fit_rt01_stamp_stream.py "$OUT/code/"
          cp scripts/run_fit_r5_stage_a_loop.sh "$OUT/code/"
          cp scripts/analyze_r5_stage_a_run.py "$OUT/code/"
          cp scripts/adjudicate_r5_stage_a.py "$OUT/code/"
          cp tests/test_r5_stage_a.py "$OUT/code/"
          cp experiments/WP-RT01/EXPERIMENT_CONTRACT.md "$OUT/code/"
          cp experiments/WP-RT01/AMENDMENT_001_FIT_EXECUTION.md "$OUT/code/"
          cp experiments/WP-RT01/AMENDMENT_002_PREFINAL_CORRECTIONS.md "$OUT/code/"
          cp experiments/WP-RT01/FINAL_RESULTS_2026-08-23.md "$OUT/code/"
          cp experiments/WP-RT01/Q0_REVIVAL_STATUS.md "$OUT/code/"
          cp experiments/WP-RT01/R5_STAGE_A_STATUS.md "$OUT/code/"
          cp experiments/WP-RT01/R5_RAW_EVIDENCE_PRESERVATION.md "$OUT/code/"

          ! grep -R -E "(FIT_PASSWORD=|BEGIN OPENSSH PRIVATE KEY|1jDv2kw0uqUExfT6dfnd1LrZglyyi-KKC|1HxR_B7fyiEGgYj4CB0iJVuhHbWDU7QWs|1qS-_vvDcRkx6nOOxxEnfo3FzGuTo6Ebw)" "$OUT"

          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/R7fR3_PACKAGE_SHA256SUMS.txt"
          tar -czf "$ROOT/WellPulse_R7fR3_Sanitized_Reproducibility_20260922.tar.gz" -C "$ROOT" R7fR3_sanitized_package
          sha256sum             "$ROOT/WellPulse_Revival_R7fR3_ReproSurface_20260922.tex"             "$ROOT/WellPulse_Revival_R7fR3_ReproSurface_20260922.pdf"             "$ROOT/WellPulse_R7fR3_Sanitized_Reproducibility_20260922.tar.gz"             | tee "$ROOT/R7fR3_BUILD_SHA256SUMS.txt"

      - name: Upload R7f-R3 QA package
        uses: actions/upload-artifact@v4
        with:
          name: wellpulse-r7fr3-repro-qa-${{ github.run_id }}
          path: |
            manuscript/revival_2026-09-22/WellPulse_Revival_R7fR3_ReproSurface_20260922.tex
            manuscript/revival_2026-09-22/WellPulse_Revival_R7fR3_ReproSurface_20260922.pdf
            manuscript/revival_2026-09-22/WellPulse_R7fR3_Sanitized_Reproducibility_20260922.tar.gz
            manuscript/revival_2026-09-22/R7fR3_PACKAGE_SHA256SUMS.txt
            manuscript/revival_2026-09-22/R7fR3_BUILD_SHA256SUMS.txt
            manuscript/revival_2026-09-22/R7fR3_pdfinfo.txt
          retention-days: 30

      - name: Summarize
        run: |
          echo "R7FR3_MACHINE_QA=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact authority: 4160640ee6deb834b2258727e682a9b3ec76d37f" >> "$GITHUB_STEP_SUMMARY"
          echo "Sanitized supplement built; private raw archives and credentials excluded." >> "$GITHUB_STEP_SUMMARY"
