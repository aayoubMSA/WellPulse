name: WP2 Golden Offline QA
# AUDIT-R1 reconciled offline-only acceptance gate: 2026-08-27
# WP2-P5 extends this same offline gate with passive HCI contract QA.
# WP2-P7 adds management-alias, receiver-transfer and reconstruction hardening.

on:
  push:
    paths:
      - 'powder/wp2_a3_adopt.sh'
      - 'powder/wp2_a3_prepare_q0.sh'
      - 'scripts/wp2_a3_runtime_bootstrap.sh'
      - 'scripts/wp2_golden_*'
      - 'scripts/wp2_controller_*'
      - 'scripts/reconstruct_wp2_golden.py'
      - 'scripts/wp_pwd01_golden_sender.py'
      - 'scripts/wp_pwd01_h_receiver.py'
      - 'experiments/WP-PWD01/evidence_inventory_golden_v1.txt'
      - '.github/workflows/wp2-golden-offline-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp2-golden-offline-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QA dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync
      - name: Bash syntax and A3 safety QA
        shell: bash
        run: |
          set -euo pipefail
          bash -n powder/wp2_a3_adopt.sh
          bash -n powder/wp2_a3_prepare_q0.sh
          bash -n scripts/wp2_a3_runtime_bootstrap.sh
          bash -n scripts/wp2_golden_prepare_management_aliases.sh
          bash -n scripts/wp2_golden_orchestrator.sh
          bash -n scripts/wp2_golden_service_restore.sh
          bash -n scripts/wp2_golden_service_ready_probe.sh
          bash -n scripts/wp2_golden_evidence_escrow.sh
          bash -n scripts/wp2_controller_pull_persistent_escrow.sh
          bash -n scripts/wp2_controller_verify_artifact_roundtrip.sh
          bash -n scripts/wp2_golden_teardown_guard.sh
          bash -n scripts/wp2_golden_offline_qa.sh
          ! grep -Eq 'portal-cli[[:space:]]+experiment[[:space:]]+create|experiment[[:space:]]+create' powder/wp2_a3_adopt.sh powder/wp2_a3_prepare_q0.sh
          ! grep -Eq 'tmcc[[:space:]]+attenuator' powder/wp2_a3_prepare_q0.sh
          grep -q '357f3275-403d-491a-906f-99677bdf454f' powder/wp2_a3_adopt.sh
          grep -q '357f3275-403d-491a-906f-99677bdf454f' powder/wp2_a3_prepare_q0.sh
          grep -q 'TEARDOWN_AUTHORIZED=YES' powder/wp2_a3_adopt.sh
          grep -q 'A3_TERMINATION_NOT_CONFIRMED' powder/wp2_a3_adopt.sh
          echo 'A3_STATIC_SAFETY_QA=PASS'
      - name: Python compile QA
        run: |
          python3 -m py_compile scripts/reconstruct_wp2_golden.py
          python3 -m py_compile scripts/wp2_golden_hci_emit.py
          python3 -m py_compile scripts/wp_pwd01_golden_sender.py
          python3 -m py_compile scripts/wp_pwd01_h_receiver.py
          python3 -m py_compile src/wellpulse/transport.py
      - name: Passive HCI, reconstruction, controller escrow, and fail-closed interlock QA
        run: bash scripts/wp2_golden_offline_qa.sh
      - name: Canonical QA verdict
        run: |
          echo 'WP2_GOLDEN_CANONICAL_QA=PASS'
          echo 'P7_GOLDEN_HARDENING_STATIC_QA=PASS'
          echo 'PASSIVE_HCI_EVENT_QA=PASS'
          echo 'HCI_CONTROL_ACTIONS_ENABLED=false'
          echo 'EVIDENCE_AUTHORITY=CONTROLLER_GITHUB_ARTIFACT_ROUNDTRIP'
          echo 'POWDER_CONTACT=NO'
          echo 'DRIVE_CONTACT=NO'
          echo 'POWDER_MUTATION_EXECUTED=NO'
          echo 'SCORED_RUN_EXECUTED=NO'
