name: WP2 K-Fastlane Provision Failure Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.wp2-kfastlane-provision-failure-diagnose-trigger'

permissions:
  contents: read

concurrency:
  group: wp2-kfastlane-provision-failure-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      TARGET_EXPERIMENT_ID: 02bc305d-5d84-48f9-b518-dbebd1728ee6
      TARGET_EXPERIMENT_NAME: wpkc84240768

    steps:
      - name: Checkout audited controller state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install frozen Portal client
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PORTAL_TOKEN" ]]
          bash scripts/wp2_portal_client_bootstrap.sh /tmp/portal-api | tee /tmp/portal-pin.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/portal-pin.txt
          echo 'DIAGNOSIS_SCOPE=READ_ONLY_EXISTING_EXPERIMENT'
          echo 'NEW_RESERVATION_CREATED=NO'
          echo 'SCIENTIFIC_RUN=NO'

      - name: Query failed experiment without mutation
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/kdiag

          set +e
          portal-cli experiment get --experiment-id "$TARGET_EXPERIMENT_ID" > /tmp/kdiag/get.json 2> /tmp/kdiag/get.err
          GET_RC=$?
          portal-cli --elaborate experiment get --experiment-id "$TARGET_EXPERIMENT_ID" > /tmp/kdiag/get-elaborate.json 2> /tmp/kdiag/get-elaborate.err
          ELAB_RC=$?
          portal-cli experiment list > /tmp/kdiag/list.json 2> /tmp/kdiag/list.err
          LIST_RC=$?
          set -e

          printf 'GET_RC=%s\nELABORATE_GET_RC=%s\nLIST_RC=%s\n' "$GET_RC" "$ELAB_RC" "$LIST_RC"

          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          target=os.environ['TARGET_EXPERIMENT_ID']
          name=os.environ['TARGET_EXPERIMENT_NAME']
          interesting=re.compile(r'(status|state|error|fail|reason|message|provision|reservation|resource|node|profile|project|created|updated|started|ended|expires|id|name)', re.I)
          secretish=re.compile(r'(token|secret|password|key|credential|authorization)', re.I)

          def load(path):
              p=Path(path)
              if not p.exists() or p.stat().st_size == 0:
                  return None
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  return None

          def walk(x, path='$'):
              if isinstance(x, dict):
                  for k,v in x.items():
                      p=f'{path}.{k}'
                      if interesting.search(str(k)) and not secretish.search(str(k)) and isinstance(v,(str,int,float,bool,type(None))):
                          yield p,v
                      yield from walk(v,p)
              elif isinstance(x,list):
                  for i,v in enumerate(x):
                      yield from walk(v,f'{path}[{i}]')

          def contains_target(x):
              if isinstance(x,dict):
                  return any(contains_target(v) for v in x.values())
              if isinstance(x,list):
                  return any(contains_target(v) for v in x)
              return isinstance(x,str) and (x == target or x == name)

          standard=load('/tmp/kdiag/get.json')
          elaborate=load('/tmp/kdiag/get-elaborate.json')
          listing=load('/tmp/kdiag/list.json')

          print('--- AUTHORITATIVE_GET_SELECTED_FIELDS ---')
          if standard is None:
              print('GET_JSON=UNAVAILABLE')
          else:
              for p,v in walk(standard):
                  print(f'{p}={v}')

          print('--- AUTHORITATIVE_ELABORATE_SELECTED_FIELDS ---')
          if elaborate is None:
              print('ELABORATE_JSON=UNAVAILABLE')
          else:
              for p,v in walk(elaborate):
                  print(f'{p}={v}')

          print('--- LIST_TARGET_SELECTED_FIELDS ---')
          found=False
          def scan(x,path='$'):
              nonlocal_dummy=None
              if isinstance(x,list):
                  for i,v in enumerate(x):
                      yield from scan(v,f'{path}[{i}]')
              elif isinstance(x,dict):
                  if contains_target(x):
                      yield path,x
                  else:
                      for k,v in x.items():
                          if isinstance(v,(dict,list)):
                              yield from scan(v,f'{path}.{k}')
          if listing is not None:
              for p,obj in scan(listing):
                  found=True
                  print(f'LIST_MATCH_PATH={p}')
                  for fp,fv in walk(obj,p):
                      print(f'{fp}={fv}')
          print('LIST_TARGET_FOUND=' + ('YES' if found else 'NO'))
          PY

          echo '--- SANITIZED_GET_ERROR_HINTS ---'
          cat /tmp/kdiag/get.err /tmp/kdiag/get-elaborate.err /tmp/kdiag/list.err 2>/dev/null \
            | grep -Ei 'no such|not found|failed|failure|error|provision|resource|reservation|experiment|permission|quota|hardware|node' \
            | sed -E 's/(Bearer|token)[ =:]+[^[:space:]]+/\1=[REDACTED]/Ig' \
            | head -80 || true

          echo 'PROVISION_FAILURE_DIAGNOSIS_QUERY=COMPLETE'
          echo 'NEW_RESERVATION_CREATED=NO'
          echo 'POWDER_MUTATION=NO'
