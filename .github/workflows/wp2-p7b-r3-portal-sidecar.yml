name: WP2 P7B-R3 Portal Sidecar Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.wp2-p7b-r3-portal-sidecar-trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      TARGET_NAME: wp7brq19810043

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Freeze Portal-only authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-r3-portal-sidecar-trigger)" = $'execute=WP2_P7B_R3_PORTAL_SIDECAR_ONCE\nexperiment_name=wp7brq19810043\nreservation_create=NO\nssh=NO\ntestbed_mutation=NO\nteardown=NO\nscored=NO'
          ! grep -q 'experiment create' .github/workflows/wp2-p7b-r3-portal-sidecar.yml
          ! grep -q 'experiment terminate' .github/workflows/wp2-p7b-r3-portal-sidecar.yml
          echo 'PORTAL_SIDECAR_AUTHORITY=PASS'

      - name: Probe Portal state independently
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-p7b-r3-portal-sidecar
          rm -rf "$TMP"; mkdir -p "$TMP"
          bash scripts/wp2_portal_client_bootstrap.sh "$TMP/portal-api" | tee "$TMP/portal-pin.txt"
          grep -q '^PORTAL_API_PIN_GATE=PASS$' "$TMP/portal-pin.txt"
          portal-cli experiment list > "$TMP/list.json"
          python3 - "$TMP/list.json" "$TARGET_NAME" > "$TMP/target.env" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1])); name=sys.argv[2]
          xs=obj if isinstance(obj,list) else obj.get('experiments',[])
          rows=[x for x in xs if isinstance(x,dict) and x.get('project')=='WellPulse' and str(x.get('name',''))==name]
          if len(rows)!=1:
              print(f'TARGET_MATCH_COUNT={len(rows)}'); raise SystemExit(20)
          x=rows[0]
          print('TARGET_MATCH_COUNT=1')
          print('EXPID='+str(x.get('id','')))
          print('LIST_STATUS='+str(x.get('status','unknown')))
          PY
          cat "$TMP/target.env"
          EXPID="$(awk -F= '$1=="EXPID"{print substr($0,index($0,"=")+1)}' "$TMP/target.env")"
          LIST_STATUS="$(awk -F= '$1=="LIST_STATUS"{print substr($0,index($0,"=")+1)}' "$TMP/target.env")"
          echo "experiment_id=$EXPID" >> "$GITHUB_OUTPUT"
          echo "list_status=$LIST_STATUS" >> "$GITHUB_OUTPUT"

          OK=0; ERR=0; READY=0
          for i in $(seq 1 10); do
            set +e
            portal-cli experiment get --experiment-id "$EXPID" > "$TMP/get-$i.json" 2> "$TMP/get-$i.err"
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              OK=$((OK+1))
              st="$(jq -r '.status // "unknown"' "$TMP/get-$i.json")"
              echo "PORTAL_SIDECAR_GET_${i}=PASS:$st"
              [[ "$st" == ready ]] && READY=1
            else
              ERR=$((ERR+1))
              echo "PORTAL_SIDECAR_GET_${i}=ERROR:rc=$rc"
              tail -c 500 "$TMP/get-$i.err" 2>/dev/null || true
              echo
            fi
            sleep 2
          done
          echo "get_ok=$OK" >> "$GITHUB_OUTPUT"
          echo "get_error=$ERR" >> "$GITHUB_OUTPUT"
          echo "ready_seen=$READY" >> "$GITHUB_OUTPUT"

          MOK=0
          for i in 1 2 3; do
            set +e
            portal-cli experiment manifests get --experiment-id "$EXPID" > "$TMP/manifest.json" 2> "$TMP/manifest.err"
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then MOK=1; echo "PORTAL_SIDECAR_MANIFEST_${i}=PASS"; break; fi
            echo "PORTAL_SIDECAR_MANIFEST_${i}=ERROR:rc=$rc"
            sleep 2
          done
          echo "manifest_ok=$MOK" >> "$GITHUB_OUTPUT"

          if [[ "$ERR" -gt 0 && "$OK" -gt 0 ]]; then CLASS=INTERMITTENT_DEGRADED; elif [[ "$ERR" -gt 0 ]]; then CLASS=PERSISTENT_GET_FAILURE; else CLASS=HEALTHY; fi
          echo "class=$CLASS" >> "$GITHUB_OUTPUT"
          echo "PORTAL_GET_CLASS=$CLASS"

      - name: Publish sidecar result
        if: always()
        shell: bash
        run: |
          {
            echo '# P7B-R3 Portal-only sidecar'
            echo
            echo '- Same reservation: **YES**'
            echo '- New reservation: **NO**'
            echo '- SSH/testbed mutation: **NO**'
            echo '- Teardown: **NO**'
            echo
            echo '| Signal | Result |'
            echo '|---|---|'
            echo '| list status | `${{ steps.probe.outputs.list_status }}` |'
            echo '| get successes | `${{ steps.probe.outputs.get_ok }}` |'
            echo '| get errors | `${{ steps.probe.outputs.get_error }}` |'
            echo '| ready seen via get | `${{ steps.probe.outputs.ready_seen }}` |'
            echo '| manifest probe | `${{ steps.probe.outputs.manifest_ok }}` |'
            echo '| classification | `${{ steps.probe.outputs.class }}` |'
          } | tee -a "$GITHUB_STEP_SUMMARY"
