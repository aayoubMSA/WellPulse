name: WP2 P7B-D Evidence Survival

on:
  push:
    branches: [main]
    paths:
      - '.wp2-p7b-d-trigger'

permissions:
  contents: write
  actions: read

concurrency:
  group: wp2-p7b-d-evidence-survival
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      EXPID: 26b6f315-459d-4a56-9167-69228e339f24
      RUN_ID: wp2-p7b-c-33113016138-20260827T203140Z

    steps:
      - name: Checkout exact preservation tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Freeze P7B-D authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-d-trigger)" = $'execute=WP2_P7B_D_EVIDENCE_SURVIVAL_ONLY\nexperiment_id=26b6f315-459d-4a56-9167-69228e339f24\nrun_id=wp2-p7b-c-33113016138-20260827T203140Z\nscientific_rerun=NO\nnew_reservation=NO\nscored=NO'
          test -s evidence/powder/wp2-p7b-c-live-status.md
          grep -q 'P7B-C gate: \*\*CONTROLLER_BLOCKED\*\*' evidence/powder/wp2-p7b-c-live-status.md
          grep -q 'Completed cells: `NONE`' evidence/powder/wp2-p7b-c-live-status.md
          echo 'P7B_D_AUTHORITY_GATE=PASS'
          echo 'SCIENTIFIC_RERUN=NO'
          echo 'NEW_RESERVATION=NO'
          echo 'SCORED_RUN=NO'

      - name: Install controller dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq openssh-client >/dev/null

      - name: Persist raw evidence to shared project escrow and pull controller bundle
        id: persist
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-p7b-d
          rm -rf "$TMP"; mkdir -p "$TMP" "$HOME/.ssh"
          umask 077

          bash scripts/wp2_portal_client_bootstrap.sh "$TMP/portal-api" | tee "$TMP/portal-pin.txt"
          grep -q '^PORTAL_API_PIN_GATE=PASS$' "$TMP/portal-pin.txt"
          portal-cli experiment get --experiment-id "$EXPID" > "$TMP/status.json"
          test "$(jq -r '.id // empty' "$TMP/status.json")" = "$EXPID"
          STATE="$(jq -r '.status // "unknown"' "$TMP/status.json")"
          echo "P7B_D_PRE_PRESERVATION_PORTAL_STATE=$STATE"
          [[ "$STATE" =~ ^(ready|provisioned)$ ]]
          portal-cli experiment manifests get --experiment-id "$EXPID" > "$TMP/manifests.json"

          python3 - "$TMP/manifests.json" "$TMP/nodes.json" <<'PY'
          import json,sys,xml.etree.ElementTree as ET
          obj=json.load(open(sys.argv[1])); xmls=[]; out={}
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str) and '<' in x and '<node' in x.lower(): xmls.append(x)
          walk(obj)
          for text in xmls:
              try: root=ET.fromstring(text)
              except Exception: continue
              for node in root.iter():
                  if node.tag.rsplit('}',1)[-1] != 'node': continue
                  cid=node.attrib.get('client_id','')
                  if cid not in {'enb1','rue1'}: continue
                  for ch in node.iter():
                      if ch.tag.rsplit('}',1)[-1]=='login' and ch.attrib.get('hostname'):
                          out[cid]={'username':ch.attrib.get('username',''),'hostname':ch.attrib['hostname'],'port':int(ch.attrib.get('port','22'))}
                          break
          assert set(out)=={'enb1','rue1'}, out
          json.dump(out,open(sys.argv[2],'w'),indent=2,sort_keys=True)
          print('P7B_D_ENDPOINT_RESOLUTION=PASS')
          PY

          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path('/tmp/wp2-p7b-d/private.key').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$TMP/private.key"
          cat > "$TMP/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$TMP/askpass"
          export SSH_ASKPASS="$TMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          setsid -w ssh-keygen -y -f "$TMP/private.key" >/dev/null </dev/null
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$TMP/private.key" </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          SSH=(-A -o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          login(){ jq -r --arg n "$1" '.[$n] | [.username,.hostname,(.port|tostring)] | @tsv' "$TMP/nodes.json"; }
          IFS=$'\t' read -r CORE_USER CORE_HOST CORE_PORT < <(login enb1)
          IFS=$'\t' read -r UE_USER UE_HOST UE_PORT < <(login rue1)
          CORE_USER="${CORE_USER:-${POWDER_USERNAME:-aayoub}}"
          UE_USER="${UE_USER:-${POWDER_USERNAME:-aayoub}}"
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" true
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" true
          echo 'P7B_D_SSH_GATE=PASS'

          echo '===== P7B-D DIAGNOSTIC VISIBILITY: UE ====='
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" "set +e
            ROOT=\"\$HOME/wellpulse-powder-evidence/p7b/$RUN_ID\"
            echo ROOT=\"\$ROOT\"; find \"\$ROOT\" -maxdepth 4 -type f -printf '%P %s bytes\n' | sort | head -200
            echo '--- p7b status ---'; cat \"\$ROOT/p7b_c_status.json\" 2>/dev/null || true
            echo '--- orchestration tail ---'; tail -100 \"\$ROOT/orchestration/p7b_c_events.jsonl\" 2>/dev/null || true
            echo '--- B1 route ---'; cat \"\$ROOT/cells/P7B-B1-S3/route_output.txt\" 2>/dev/null || true
            echo '--- B1 probes ---'; cat \"\$ROOT/cells/P7B-B1-S3/q0_user_plane_probes.txt\" 2>/dev/null || true
            echo '--- B1 TLS probe ---'; cat \"\$ROOT/cells/P7B-B1-S3/tls_mqtt_probe.txt\" 2>/dev/null || true"

          echo '===== P7B-D DIAGNOSTIC VISIBILITY: CORE RECEIVER/BROKER ====='
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" "set +e
            ROOT=\"\$HOME/wellpulse-powder-evidence/p7b/$RUN_ID-core\"
            echo ROOT=\"\$ROOT\"; find \"\$ROOT\" -maxdepth 5 -type f -printf '%P %s bytes\n' | sort | head -200
            echo '--- receiver console ---'; cat \"\$ROOT/cells/P7B-B1-S3/receiver/console.txt\" 2>/dev/null || true
            echo '--- receiver events ---'; cat \"\$ROOT/cells/P7B-B1-S3/receiver/receiver_events.jsonl\" 2>/dev/null || true
            echo '--- broker log tail ---'; tail -120 /tmp/wellpulse-p7b-broker/mosquitto.log 2>/dev/null || true"

          PDIR="/proj/WellPulse/evidence-escrow/$EXPID/$RUN_ID"
          persist_one(){
            local user=$1 host=$2 port=$3 src=$4 arm=$5
            ssh "${SSH[@]}" -p "$port" "$user@$host" "set -euo pipefail
              SRC='$src'; DST='$PDIR/$arm'
              test -d \"\$SRC\"
              test -n \"\$(find \"\$SRC\" -type f -print -quit)\"
              mkdir -p \"\$DST/raw\"
              rm -rf \"\$DST/raw\" \"\$DST/SOURCE_SHA256SUMS\" \"\$DST/SOURCE_NONREGULAR_FILES.txt\"
              mkdir -p \"\$DST/raw\"
              (cd \"\$SRC\" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > \"\$DST/SOURCE_SHA256SUMS\"
              (cd \"\$SRC\" && find . ! -type f ! -type d -printf '%y %p -> %l\n' | sort) > \"\$DST/SOURCE_NONREGULAR_FILES.txt\"
              rsync -a --no-specials --no-devices \"\$SRC/\" \"\$DST/raw/\"
              (cd \"\$DST/raw\" && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
              printf 'source=%s\narm=%s\nexperiment_id=%s\nrun_id=%s\n' \"\$SRC\" '$arm' '$EXPID' '$RUN_ID' > \"\$DST/ESCROW_METADATA.txt\"
              echo PERSIST_${arm}=PASS"
          }
          persist_one "$UE_USER" "$UE_HOST" "$UE_PORT" "\$HOME/wellpulse-powder-evidence/p7b/$RUN_ID" ue | tee "$TMP/ue-persist.txt"
          persist_one "$CORE_USER" "$CORE_HOST" "$CORE_PORT" "\$HOME/wellpulse-powder-evidence/p7b/$RUN_ID-core" core | tee "$TMP/core-persist.txt"
          grep -q '^PERSIST_ue=PASS$' "$TMP/ue-persist.txt"
          grep -q '^PERSIST_core=PASS$' "$TMP/core-persist.txt"

          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" "set -euo pipefail
            test -s '$PDIR/ue/SOURCE_SHA256SUMS'; test -s '$PDIR/core/SOURCE_SHA256SUMS'
            (cd '$PDIR/ue/raw' && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
            (cd '$PDIR/core/raw' && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
            printf 'EVIDENCE_ESCROW_GATE=PASS\nTEARDOWN_AUTHORIZED=PENDING_OFFPOWDER_READBACK\n' > '$PDIR/PERSISTENT_ESCROW_GATE.PASS'
            tar -C '$PDIR' -cf - ." > "$TMP/persistent-stream.tar"
          mkdir -p "$TMP/controller"
          tar -C "$TMP/controller" -xf "$TMP/persistent-stream.tar"
          (cd "$TMP/controller/ue/raw" && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
          (cd "$TMP/controller/core/raw" && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
          echo 'P7B_D_CONTROLLER_PULL_GATE=PASS'

          BUNDLE="$TMP/wp2-p7b-d-$RUN_ID.tar"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$TMP/controller" -cf "$BUNDLE" .
          SHA="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          BYTES="$(stat -c%s "$BUNDLE")"
          test -s "$BUNDLE"; [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]
          echo "bundle_path=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "bundle_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "core_host=$CORE_HOST" >> "$GITHUB_OUTPUT"
          echo "ue_host=$UE_HOST" >> "$GITHUB_OUTPUT"
          echo "P7B_D_BUNDLE_SHA256=$SHA"
          echo "P7B_D_BUNDLE_BYTES=$BYTES"

      - name: Upload immutable P7B-D evidence bundle
        id: upload
        if: steps.persist.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp2-p7b-d-${{ github.run_id }}
          path: ${{ steps.persist.outputs.bundle_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Independent artifact download
        id: download
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wp2-p7b-d-${{ github.run_id }}
          path: /tmp/wp2-p7b-d-roundtrip

      - name: Verify round-trip hashes and terminate exact reservation
        id: finalize
        if: steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.persist.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          ROUNDTRIP="$(find /tmp/wp2-p7b-d-roundtrip -maxdepth 2 -type f -name '*.tar' | head -1)"
          test -s "$ROUNDTRIP"
          ACTUAL_SHA="$(sha256sum "$ROUNDTRIP" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          rm -rf /tmp/wp2-p7b-d-verified; mkdir -p /tmp/wp2-p7b-d-verified
          tar -C /tmp/wp2-p7b-d-verified -xf "$ROUNDTRIP"
          (cd /tmp/wp2-p7b-d-verified/ue/raw && sha256sum -c ../SOURCE_SHA256SUMS)
          (cd /tmp/wp2-p7b-d-verified/core/raw && sha256sum -c ../SOURCE_SHA256SUMS)
          test -s /tmp/wp2-p7b-d-verified/PERSISTENT_ESCROW_GATE.PASS
          echo 'CONTROLLER_OFFPOWDER_GATE=PASS'
          echo 'EVIDENCE_ESCROW_GATE=PASS'
          echo 'TEARDOWN_AUTHORIZED=YES'

          echo '===== VERIFIED RECEIVER FAILURE EVIDENCE ====='
          cat /tmp/wp2-p7b-d-verified/core/raw/cells/P7B-B1-S3/receiver/console.txt 2>/dev/null || true
          cat /tmp/wp2-p7b-d-verified/core/raw/cells/P7B-B1-S3/receiver/receiver_events.jsonl 2>/dev/null || true

          bash scripts/wp2_portal_client_bootstrap.sh /tmp/wp2-p7b-d-portal >/tmp/wp2-p7b-d-portal-pin.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/wp2-p7b-d-portal-pin.txt
          portal-cli experiment terminate --experiment-id "$EXPID" >/tmp/wp2-p7b-d-terminate.json 2>/tmp/wp2-p7b-d-terminate.err || true
          TERMINATED=0
          for i in $(seq 1 60); do
            set +e
            portal-cli experiment get --experiment-id "$EXPID" >/tmp/wp2-p7b-d-postterm.json 2>/dev/null
            rc=$?
            set -e
            if [[ "$rc" -ne 0 ]]; then TERMINATED=1; echo "P7B_D_TERMINATION_POLL_${i}=NOT_FOUND"; break; fi
            st="$(jq -r '.status // "unknown"' /tmp/wp2-p7b-d-postterm.json)"
            echo "P7B_D_TERMINATION_POLL_${i}=$st"
            if [[ "$st" =~ ^(terminated|destroyed)$ ]]; then TERMINATED=1; break; fi
            sleep 5
          done
          test "$TERMINATED" = 1
          echo 'TEARDOWN_CONFIRMED=YES'
          echo 'WP2_P7B_D=PASS_EVIDENCE_SURVIVAL_READBACK_TEARDOWN'
          echo 'gate=PASS_EVIDENCE_SURVIVAL_READBACK_TEARDOWN' >> "$GITHUB_OUTPUT"

      - name: Record sanitized P7B-D status
        if: always()
        shell: bash
        env:
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          BUNDLE_SHA: ${{ steps.persist.outputs.bundle_sha256 }}
          BUNDLE_BYTES: ${{ steps.persist.outputs.bundle_bytes }}
        run: |
          set -euo pipefail
          mkdir -p evidence/powder
          if [[ "$FINALIZE_OUTCOME" == success ]]; then VERDICT=PASS_EVIDENCE_SURVIVAL_READBACK_TEARDOWN; TEARDOWN=YES; else VERDICT=BLOCKED; TEARDOWN=NO_OR_UNCONFIRMED; fi
          cat > evidence/powder/wp2-p7b-d-live-status.md <<EOF
          # WP2-P7B-D Evidence Survival — latest

          - Checked UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Source SHA: \`$GITHUB_SHA\`
          - GitHub run: \`$GITHUB_RUN_ID\`
          - Experiment UUID: \`$EXPID\`
          - P7B-C run ID: \`$RUN_ID\`
          - Evidence class: **NON-SCORED PRE-SCORE PHYSICAL QUALIFICATION**
          - P7B-C retained verdict: **BLOCKED: RECEIVER_CONNECT_TIMEOUT**
          - P7B-D verdict: **$VERDICT**
          - Persistent escrow outcome: **$PERSIST_OUTCOME**
          - GitHub artifact upload outcome: **$UPLOAD_OUTCOME**
          - Independent artifact download outcome: **$DOWNLOAD_OUTCOME**
          - Round-trip + teardown outcome: **$FINALIZE_OUTCOME**
          - Outer TAR SHA-256: \`${BUNDLE_SHA:-UNAVAILABLE}\`
          - Outer TAR bytes: \`${BUNDLE_BYTES:-UNAVAILABLE}\`
          - Teardown confirmed: **$TEARDOWN**
          - P7B-E: **NOT STARTED**
          - Scored authorization: **BLOCKED**
          - \`scored_runs_authorized=false\`
          EOF
          cat evidence/powder/wp2-p7b-d-live-status.md

      - name: Commit sanitized P7B-D status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/powder/wp2-p7b-d-live-status.md
          git commit -m "Record P7B-D evidence survival status" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Enforce bounded P7B-D verdict
        if: always()
        shell: bash
        env:
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -euo pipefail
          echo "FINALIZE_OUTCOME=$FINALIZE_OUTCOME"
          test "$FINALIZE_OUTCOME" = success
          echo 'WP2_P7B_D=PASS_EVIDENCE_SURVIVAL_READBACK_TEARDOWN'
          echo 'P7B_E=NOT_STARTED'
          echo 'SCORED_AUTHORIZATION=BLOCKED'
