name: WP2 P7B-RQ2 Slow SSH Residue Cleanup

on:
  push:
    paths:
      - '.wp2-p7b-rq2-slow-ssh-cleanup-trigger'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      TARGET_EXPID: f6de95cb-a13a-421e-bd0e-766dfc1d3fb3
      TARGET_NAME: wp7brq2609012
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Freeze cleanup-only authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-rq2-slow-ssh-cleanup-trigger)" = $'AUTHORITY=P7B_RQ2_SLOW_SSH_RESIDUE_CLEANUP_ONLY\nEXPERIMENT_ID=f6de95cb-a13a-421e-bd0e-766dfc1d3fb3\nEXPERIMENT_NAME=wp7brq2609012\nSSH=YES_BOUNDED\nRESIDUE_CLEANUP=EXACT_SIGNATURES_ONLY\nINTER_NODE_GAP_SECONDS=15\nPOST_CLEANUP_QUIET_SECONDS=90\nRF=NO\nCELLS=NO\nRESTART=NO\nTEARDOWN=NO\nSCORED=NO\nAUTOMATIC_SCIENTIFIC_RETRY=NO'
          ! grep -Eq 'experiment[[:space:]]+(create|terminate)|tmcc|attenuator|bin/start.sh|srsue|srsenb|srsepc|wp2_p7b_c_node_r2.py' .github/workflows/wp2-p7b-rq2-slow-ssh-cleanup.yml
          echo 'RQ2_SLOW_CLEANUP_AUTHORITY=PASS'

      - name: Slow SSH health and exact residue cleanup
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-rq2-cleanup
          rm -rf "$TMP"; mkdir -p "$TMP"
          fail(){ echo "RQ2_SLOW_CLEANUP=BLOCKED:$1" >&2; exit "${2:-90}"; }

          bash scripts/wp2_portal_client_bootstrap.sh "$TMP/portal-api" | tee "$TMP/portal-pin.txt"
          grep -q '^PORTAL_API_PIN_GATE=PASS$' "$TMP/portal-pin.txt" || fail PORTAL_PIN
          sleep 15
          portal-cli experiment get --experiment-id "$TARGET_EXPID" > "$TMP/experiment.json" || fail PORTAL_GET
          python3 scripts/wp2_portal_record_guard.py --json "$TMP/experiment.json" --expected-experiment-id "$TARGET_EXPID" | tee "$TMP/portal-gate.txt"
          grep -q '^PORTAL_RECORD_GATE=PASS$' "$TMP/portal-gate.txt" || fail PORTAL_RECORD
          python3 -c 'import json,os; x=json.load(open("/tmp/wp2-rq2-cleanup/experiment.json")); assert x.get("id")==os.environ["TARGET_EXPID"]; assert x.get("name")==os.environ["TARGET_NAME"]; assert x.get("project")=="WellPulse"; assert str(x.get("status","")).lower()=="ready"; print("RQ2_EXISTING_RESERVATION_READY=PASS")'
          sleep 15
          portal-cli experiment manifests get --experiment-id "$TARGET_EXPID" > "$TMP/manifest.json" || fail MANIFEST
          python3 -c 'import json,xml.etree.ElementTree as ET; obj=json.load(open("/tmp/wp2-rq2-cleanup/manifest.json")); xmls=[]; w=lambda x: [w(v) for v in x.values()] if isinstance(x,dict) else [w(v) for v in x] if isinstance(x,list) else xmls.append(x) if isinstance(x,str) and "<node" in x else None; w(obj); out={}; [(lambda root: [(lambda n: out.setdefault(n.attrib.get("client_id",""), next(({"username":c.attrib.get("username","aayoub"),"hostname":c.attrib["hostname"],"port":int(c.attrib.get("port","22"))} for c in n.iter() if c.tag.rsplit("}",1)[-1]=="login" and c.attrib.get("hostname")),None)))(n) for n in root.iter() if n.tag.rsplit("}",1)[-1]=="node" and n.attrib.get("client_id") in {"enb1","rue1"}]) (ET.fromstring(t)) for t in xmls]; assert out.get("enb1") and out.get("rue1"); json.dump(out,open("/tmp/wp2-rq2-cleanup/nodes.json","w")); print("RQ2_MANIFEST_LOGIN=PASS")'

          umask 077
          python3 -c 'import os,pathlib; raw=os.environ["POWDER_SSH_PRIVATE_KEY"].replace("\r\n","\n").replace("\r","\n").lstrip("\ufeff").strip()+"\n"; pathlib.Path("/tmp/wp2-rq2-cleanup/private.key").write_text(raw,encoding="utf-8",newline="\n")'
          chmod 600 "$TMP/private.key"
          cat > "$TMP/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$TMP/askpass"
          export SSH_ASKPASS="$TMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$TMP/private.key" </dev/null >/dev/null || fail SSH_KEY_LOAD
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          SSH=(-o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          get_login(){ python3 -c 'import json,sys; x=json.load(open("/tmp/wp2-rq2-cleanup/nodes.json"))[sys.argv[1]]; print("%s\t%s\t%s"%(x.get("username","aayoub"),x["hostname"],x.get("port",22)))' "$1"; }
          IFS=$'\t' read -r CORE_USER CORE_HOST CORE_PORT < <(get_login enb1)
          IFS=$'\t' read -r UE_USER UE_HOST UE_PORT < <(get_login rue1)

          echo 'PACED_SSH=CORE_INITIAL_HEALTH'
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" 'printf "HOST=%s\n" "$(hostname)"; uptime; pgrep -af "[w]p_pwd01_h_receiver.py" || true; if test -f /tmp/wellpulse-p7b-broker/mosquitto.pid; then p=$(cat /tmp/wellpulse-p7b-broker/mosquitto.pid 2>/dev/null || true); test -n "$p" && ps -p "$p" -o pid=,args= || true; fi' | tee "$TMP/core-before.txt" || fail CORE_INITIAL_SSH
          sleep 15
          echo 'PACED_SSH=UE_INITIAL_HEALTH'
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" 'printf "HOST=%s\n" "$(hostname)"; uptime; pgrep -af "[w]p2_p7b_python_gateway.py|[w]p2_p7b_generator.py|[P]7BRemoteB2Gateway" || true' | tee "$TMP/ue-before.txt" || fail UE_INITIAL_SSH

          sleep 15
          echo 'PACED_SSH=CORE_EXACT_CLEANUP'
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" 'set -eu; pids=$(pgrep -f "[w]p_pwd01_h_receiver.py" || true); for p in $pids; do kill -TERM "$p" 2>/dev/null || true; done; if test -f /tmp/wellpulse-p7b-broker/mosquitto.pid; then b=$(cat /tmp/wellpulse-p7b-broker/mosquitto.pid 2>/dev/null || true); if test -n "$b" && ps -p "$b" -o args= 2>/dev/null | grep -q "mosquitto.*wellpulse-p7b-broker"; then kill -TERM "$b" 2>/dev/null || true; fi; fi; sleep 10; for p in $pids; do if kill -0 "$p" 2>/dev/null; then kill -KILL "$p"; fi; done; echo CORE_RESIDUE_CLEANUP=PASS' || fail CORE_CLEANUP
          sleep 15
          echo 'PACED_SSH=UE_EXACT_CLEANUP'
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" 'set -eu; pids=$(pgrep -f "[w]p2_p7b_python_gateway.py|[w]p2_p7b_generator.py|[P]7BRemoteB2Gateway" || true); for p in $pids; do kill -TERM "$p" 2>/dev/null || true; done; sleep 10; for p in $pids; do if kill -0 "$p" 2>/dev/null; then kill -KILL "$p"; fi; done; echo UE_RESIDUE_CLEANUP=PASS' || fail UE_CLEANUP

          echo 'PACED_CONTROL=post-cleanup-quiet:90s'
          sleep 90

          echo 'PACED_SSH=CORE_FINAL_HEALTH'
          ssh "${SSH[@]}" -p "$CORE_PORT" "$CORE_USER@$CORE_HOST" 'set -eu; test -z "$(pgrep -f "[w]p_pwd01_h_receiver.py" || true)"; if test -f /tmp/wellpulse-p7b-broker/mosquitto.pid; then b=$(cat /tmp/wellpulse-p7b-broker/mosquitto.pid 2>/dev/null || true); if test -n "$b" && kill -0 "$b" 2>/dev/null && ps -p "$b" -o args= | grep -q "mosquitto.*wellpulse-p7b-broker"; then exit 21; fi; fi; echo CORE_FINAL_RESIDUE=NONE' | tee "$TMP/core-after.txt" || fail CORE_FINAL
          sleep 15
          echo 'PACED_SSH=UE_FINAL_HEALTH'
          ssh "${SSH[@]}" -p "$UE_PORT" "$UE_USER@$UE_HOST" 'set -eu; test -z "$(pgrep -f "[w]p2_p7b_python_gateway.py|[w]p2_p7b_generator.py|[P]7BRemoteB2Gateway" || true)"; echo UE_FINAL_RESIDUE=NONE' | tee "$TMP/ue-after.txt" || fail UE_FINAL

          printf 'RQ2_SLOW_SSH_CLEANUP=PASS\nRF_AUTHORIZED=NO\nCELLS_AUTHORIZED=NO\nRESTART_AUTHORIZED=NO\nTEARDOWN_AUTHORIZED=NO\n' | tee "$TMP/verdict.txt"

      - name: Upload cleanup evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp2-p7b-rq2-slow-ssh-cleanup-${{ github.run_id }}
          path: |
            /tmp/wp2-rq2-cleanup/core-before.txt
            /tmp/wp2-rq2-cleanup/ue-before.txt
            /tmp/wp2-rq2-cleanup/core-after.txt
            /tmp/wp2-rq2-cleanup/ue-after.txt
            /tmp/wp2-rq2-cleanup/portal-gate.txt
            /tmp/wp2-rq2-cleanup/verdict.txt
          if-no-files-found: error
          retention-days: 90
