name: WP2 A3 Existing Experiment Adopter

on:
  push:
    branches:
      - main
      - wp2-a3-adoption-hardening-20260827
    paths:
      - 'powder/wp2-a3-adopt-request.json'

permissions:
  contents: write

concurrency:
  group: wp2-a3-existing-experiment-adopter
  cancel-in-progress: false

jobs:
  adopt-a3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: aayoub
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}

    steps:
      - name: Checkout exact audited state
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Parse bounded A3 request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST='powder/wp2-a3-adopt-request.json'
          test -f "$REQUEST"
          jq -e '
            ((.mode == "PRECHECK") or (.mode == "RUN")) and
            (.experiment_id == "357f3275-403d-491a-906f-99677bdf454f") and
            (.experiment_name == "WP-GOLDEN-A3") and
            (.scored == false)
          ' "$REQUEST" >/dev/null
          MODE="$(jq -r '.mode' "$REQUEST")"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "A3_REQUEST_GATE=PASS"

      - name: Static no-create no-scored and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          bash -n powder/wp2_a3_adopt.sh
          bash -n powder/wp2_a3_prepare_q0.sh
          bash -n scripts/wp2_a3_runtime_bootstrap.sh
          bash -n scripts/wp2_golden_orchestrator.sh
          bash -n scripts/wp2_golden_service_restore.sh
          bash -n scripts/wp2_golden_service_ready_probe.sh
          bash -n scripts/wp2_golden_evidence_escrow.sh
          bash -n scripts/wp2_golden_offpowder_rclone.sh
          bash -n scripts/wp2_golden_teardown_guard_rclone.sh
          bash -n powder/wp2_h_epc_broker.sh
          python3 -m py_compile scripts/wp_pwd01_golden_sender.py scripts/wp_pwd01_h_receiver.py scripts/reconstruct_wp2_golden.py scripts/wp2_golden_rclone_verify.py
          ! grep -Eq 'portal-cli[[:space:]]+experiment[[:space:]]+create|experiment[[:space:]]+create' powder/wp2_a3_adopt.sh powder/wp2_a3_prepare_q0.sh
          ! grep -Eq 'tmcc[[:space:]]+attenuator' powder/wp2_a3_prepare_q0.sh
          grep -q '357f3275-403d-491a-906f-99677bdf454f' powder/wp2_a3_adopt.sh
          grep -q '357f3275-403d-491a-906f-99677bdf454f' powder/wp2_a3_prepare_q0.sh
          grep -q 'WP-GOLDEN-A3' powder/wp2_a3_adopt.sh
          grep -q '^cafile ' <(sed -n '/cat > "$WORKDIR\/mosquitto.conf" <<EOF/,/^EOF$/p' powder/wp2_h_epc_broker.sh)
          grep -q '^tls_version tlsv1.2$' powder/wp2_h_epc_broker.sh
          printf '{"scored":false}\n' | jq -e '.scored == false' >/dev/null
          if printf '{"scored":true}\n' | jq -e '.scored == false' >/dev/null; then
            echo 'BOOLEAN_REGRESSION_GATE=FAIL'
            exit 91
          fi
          echo 'BOOLEAN_REGRESSION_GATE=PASS'
          echo 'A3_STATIC_NO_CREATE_NO_SCORED_GATE=PASS'

      - name: Verify encrypted Drive transport before any A3 mutation
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$POWDER_SSH_PRIVATE_KEY" ]]
          test -s powder/secure/wp_rclone_config.enc
          umask 077
          ENC_PASS="$(printf '%s' "$POWDER_SSH_PRIVATE_KEY" | sha256sum | awk '{print $1}')"
          export ENC_PASS
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in powder/secure/wp_rclone_config.enc \
            -out /tmp/wp2-a3-rclone.conf \
            -pass env:ENC_PASS
          unset ENC_PASS
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone --config /tmp/wp2-a3-rclone.conf lsf gdrive: >/dev/null
          if [[ "${{ steps.request.outputs.mode }}" == RUN ]]; then
            B64="$(base64 -w0 /tmp/wp2-a3-rclone.conf)"
            echo "::add-mask::$B64"
            echo "RCLONE_CONFIG_B64=$B64" >> "$GITHUB_ENV"
          fi
          rm -f /tmp/wp2-a3-rclone.conf
          echo 'A3_DRIVE_PREMUTATION_GATE=PASS'

      - name: Establish clean pre-science Q0 baseline
        if: steps.request.outputs.mode == 'RUN'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x powder/wp2_a3_prepare_q0.sh
          bash powder/wp2_a3_prepare_q0.sh

      - name: Execute A3-only adopter
        id: adopter
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chmod +x powder/wp2_a3_adopt.sh scripts/wp2_a3_runtime_bootstrap.sh
          bash powder/wp2_a3_adopt.sh '${{ steps.request.outputs.mode }}'

      - name: Commit sanitized A3 checkpoint when produced
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CHECKPOINT='evidence/powder/wp2-a3-adoption-latest.md'
          TMP_CHECKPOINT='/tmp/wp2-a3-adoption-latest.md'
          if [[ ! -f "$CHECKPOINT" ]]; then
            echo 'NO_A3_CHECKPOINT_TO_COMMIT=1'
            exit 0
          fi
          cp "$CHECKPOINT" "$TMP_CHECKPOINT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          AUTH_REMOTE="https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git fetch "$AUTH_REMOTE" "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            git clean -fdx
            mkdir -p "$(dirname "$CHECKPOINT")"
            cp "$TMP_CHECKPOINT" "$CHECKPOINT"
            git add "$CHECKPOINT"
            if git diff --cached --quiet; then
              echo 'A3_CHECKPOINT_ALREADY_CURRENT=1'
              exit 0
            fi
            git commit -m 'Record A3 Golden adoption checkpoint'
            if git push "$AUTH_REMOTE" HEAD:"${GITHUB_REF_NAME}"; then
              echo 'A3_CHECKPOINT_PUSH=PASS'
              exit 0
            fi
            echo "A3_CHECKPOINT_PUSH_RETRY=$attempt"
          done
          echo 'A3_CHECKPOINT_PUSH=FAIL' >&2
          exit 92

      - name: Final workflow verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.adopter.outcome }}" != success ]]; then
            echo 'WP2_A3_ADOPTER_WORKFLOW=FAIL_CLOSED'
            exit 1
          fi
          echo 'WP2_A3_ADOPTER_WORKFLOW=PASS'
