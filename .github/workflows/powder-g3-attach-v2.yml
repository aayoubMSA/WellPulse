name: POWDER G3 Attach v2

on:
  push:
    branches: [main]
    paths:
      - powder/g3-trigger-v2.json

permissions:
  contents: write

concurrency:
  group: powder-g3-attach-v2
  cancel-in-progress: false

jobs:
  g3_attach:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      EXPECTED_AUTOMATION_FP: SHA256:jQGQvU86rtuEchT50N1HuB4Cmizpvbmp0zSBR4rowxY
      EXPECTED_PROFILE_ID: 80dda605-7e5f-11e9-8006-e4434b2381fc
      EXPECTED_HARDWARE: d430
      EXPECTED_IMAGE_FRAGMENT: PowderProfiles:gnuradio-srslte

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate attach-only request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=powder/g3-trigger-v2.json
          EXPID="$(jq -r '.experiment_id // empty' "$REQUEST")"
          EXECUTE="$(jq -r '.execute // empty' "$REQUEST")"
          MODE="$(jq -r '.mode // empty' "$REQUEST")"
          [[ "$EXPID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Invalid experiment UUID."; exit 2; }
          [[ "$EXECUTE" == "G3ATTACH" ]] || { echo "Missing G3ATTACH authorization."; exit 2; }
          [[ "$MODE" == "ATTACH_ONLY_NO_RESOURCE_CREATE" ]] || { echo "Wrong execution mode."; exit 2; }
          [[ -n "$PORTAL_TOKEN" && -n "$POWDER_USERNAME" && -n "$POWDER_SSH_PRIVATE_KEY" ]] || { echo "Required secret missing."; exit 2; }
          mkdir -p /tmp/powder-g3-v2 evidence/powder/g3
          printf '%s\n' "$EXPID" > /tmp/powder-g3-v2/experiment_id
          echo "Attach-only G3 authorized; no POWDER resource creation is present in this workflow."

      - name: Install Portal API client
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.flux.utah.edu/emulab/portal-api.git /tmp/portal-api
          python -m pip install --quiet '/tmp/portal-api[cli]'

      - name: Normalize and verify automation SSH key before POWDER mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077

          python - <<'PY'
          import os
          from pathlib import Path
          s = os.environ['POWDER_SSH_PRIVATE_KEY']
          if '\\n' in s and '\n' not in s:
              s = s.replace('\\n', '\n')
          s = s.replace('\r\n', '\n').replace('\r', '\n')
          if not s.endswith('\n'):
              s += '\n'
          Path.home().joinpath('.ssh/id_ed25519').write_text(s, encoding='utf-8', newline='\n')
          PY
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          timeout 5 ssh-keygen -y -P "" -f "$HOME/.ssh/id_ed25519" > /tmp/powder-g3-v2/automation.pub
          ACTUAL_FP="$(ssh-keygen -lf /tmp/powder-g3-v2/automation.pub | awk '{print $2}')"
          echo "Automation public-key fingerprint: $ACTUAL_FP"
          [[ "$ACTUAL_FP" == "$EXPECTED_AUTOMATION_FP" ]] || { echo "Automation key fingerprint mismatch; no POWDER mutation performed."; exit 3; }
          printf '%s\n' "$ACTUAL_FP" > /tmp/powder-g3-v2/automation-fingerprint.txt

      - name: Verify manual experiment is READY
        shell: bash
        run: |
          set -euo pipefail
          EXPID="$(cat /tmp/powder-g3-v2/experiment_id)"
          READY=0
          for i in $(seq 1 30); do
            set +e
            portal-cli experiment get --experiment-id "$EXPID" > /tmp/powder-g3-v2/status.json 2>/tmp/powder-g3-v2/status.err
            RC=$?
            set -e
            if [[ "$RC" -eq 0 ]]; then
              STATUS="$(jq -r '.status // "unknown"' /tmp/powder-g3-v2/status.json)"
              echo "POWDER status: $STATUS"
              if [[ "$STATUS" == "ready" ]]; then READY=1; break; fi
              [[ "$STATUS" =~ ^(failed|error|terminated|destroyed)$ ]] && { echo "Terminal experiment state: $STATUS"; exit 5; }
            fi
            sleep 10
          done
          [[ "$READY" -eq 1 ]] || { echo "Experiment did not reach/remain READY."; exit 6; }

      - name: Retrieve manifest and validate target identity
        shell: bash
        run: |
          set -euo pipefail
          EXPID="$(cat /tmp/powder-g3-v2/experiment_id)"
          portal-cli experiment manifests get --experiment-id "$EXPID" > /tmp/powder-g3-v2/manifests.json

          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          obj=json.loads(Path('/tmp/powder-g3-v2/manifests.json').read_text())
          xmls=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str) and '<' in x and 'rspec' in x.lower(): xmls.append(x)
          walk(obj)
          nodes=[]; logins=[]
          for text in xmls:
              try: root=ET.fromstring(text)
              except Exception: continue
              for el in root.iter():
                  if el.tag.rsplit('}',1)[-1] != 'node': continue
                  n={'client_id':el.attrib.get('client_id',''),'component_id':el.attrib.get('component_id','')}
                  for ch in el.iter():
                      tag=ch.tag.rsplit('}',1)[-1]
                      if tag=='hardware_type' and not n.get('hardware_type'): n['hardware_type']=ch.attrib.get('name','')
                      elif tag=='disk_image' and not n.get('disk_image'): n['disk_image']=ch.attrib.get('name','')
                      elif tag=='login' and ch.attrib.get('hostname'):
                          logins.append({'username':ch.attrib.get('username',''),'hostname':ch.attrib['hostname'],'port':ch.attrib.get('port','22')})
                  nodes.append(n)
          uniq=[]; seen=set()
          for x in logins:
              k=(x['username'],x['hostname'],x['port'])
              if k not in seen: seen.add(k); uniq.append(x)
          summary={'nodes':nodes,'logins':uniq}
          Path('/tmp/powder-g3-v2/manifest-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          if uniq: Path('/tmp/powder-g3-v2/login.tsv').write_text(f"{uniq[0]['username']}\t{uniq[0]['hostname']}\t{uniq[0]['port']}\n")
          PY

          [[ -s /tmp/powder-g3-v2/login.tsv ]] || { echo "No SSH endpoint in manifest."; exit 7; }
          PROFILE_ID="$(jq -r '.profile_id // empty' /tmp/powder-g3-v2/status.json)"
          EXP_NAME="$(jq -r '.name // .experiment_name // empty' /tmp/powder-g3-v2/status.json)"
          EXP_PROJECT="$(jq -r '.project // .project_name // empty' /tmp/powder-g3-v2/status.json)"
          HARDWARE="$(jq -r '.nodes[0].hardware_type // empty' /tmp/powder-g3-v2/manifest-summary.json)"
          IMAGE="$(jq -r '.nodes[0].disk_image // empty' /tmp/powder-g3-v2/manifest-summary.json)"
          echo "Profile ID: ${PROFILE_ID:-not_exposed}"
          echo "Experiment: ${EXP_NAME:-not_exposed}"
          echo "Project: ${EXP_PROJECT:-not_exposed}"
          echo "Hardware: $HARDWARE"
          echo "Image: $IMAGE"

          [[ "$PROFILE_ID" == "$EXPECTED_PROFILE_ID" ]] || { echo "Wrong/missing profile UUID; refusing test and teardown."; exit 8; }
          [[ "$HARDWARE" == "$EXPECTED_HARDWARE" ]] || { echo "Unexpected hardware; refusing test and teardown."; exit 8; }
          [[ "$IMAGE" == *"$EXPECTED_IMAGE_FRAGMENT"* ]] || { echo "Unexpected image; refusing test and teardown."; exit 8; }
          [[ -z "$EXP_PROJECT" || "$EXP_PROJECT" == "WellPulse" ]] || { echo "Wrong project; refusing test and teardown."; exit 8; }
          [[ -z "$EXP_NAME" || "$EXP_NAME" == WP-G3-SIMSTACK* ]] || { echo "Wrong experiment name; refusing test and teardown."; exit 8; }
          printf '%s\n' "$EXP_NAME" > /tmp/powder-g3-v2/name
          touch /tmp/powder-g3-v2/target_validated

      - name: Execute profile-authoritative simulated stack
        id: sim
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\t' read -r MANIFEST_USER HOST PORT < /tmp/powder-g3-v2/login.tsv
          USERNAME="${MANIFEST_USER:-$POWDER_USERNAME}"
          printf '%s\n' "$HOST" > /tmp/powder-g3-v2/ssh-host
          printf '%s\n' "$PORT" > /tmp/powder-g3-v2/ssh-port
          SSHOPTS=(-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_ed25519" -p "$PORT")
          SCPOPTS=(-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_ed25519" -P "$PORT")
          SSH_READY=0
          for i in $(seq 1 18); do
            if ssh "${SSHOPTS[@]}" "$USERNAME@$HOST" 'hostname; whoami' > /tmp/powder-g3-v2/ssh-preflight.txt 2>/tmp/powder-g3-v2/ssh-preflight.err; then SSH_READY=1; break; fi
            sleep 10
          done
          [[ "$SSH_READY" -eq 1 ]] || { echo "SSH never became ready."; exit 9; }
          scp "${SCPOPTS[@]}" powder/g3_simstack_remote.sh "$USERNAME@$HOST:/tmp/wellpulse_g3_simstack.sh"
          ssh "${SSHOPTS[@]}" "$USERNAME@$HOST" "chmod 700 /tmp/wellpulse_g3_simstack.sh && /tmp/wellpulse_g3_simstack.sh '$GITHUB_RUN_ID'" > /tmp/powder-g3-v2/remote-run.out 2>/tmp/powder-g3-v2/remote-run.err
          scp -r "${SCPOPTS[@]}" "$USERNAME@$HOST:/tmp/wellpulse-g3-$GITHUB_RUN_ID" /tmp/powder-g3-v2/
          RUNDIR="/tmp/powder-g3-v2/wellpulse-g3-$GITHUB_RUN_ID"
          [[ -f "$RUNDIR/result.env" ]] || { echo "Missing result.env."; exit 10; }
          source "$RUNDIR/result.env"
          echo "TX_RC=$TX_RC RX_RC=$RX_RC IQ_BYTES=$IQ_BYTES PROCESS_GATE=$PROCESS_GATE"
          [[ "$PROCESS_GATE" == "PASS" && "$TX_RC" -eq 0 && "$RX_RC" -eq 0 && "$IQ_BYTES" -gt 0 ]] || exit 11

      - name: Build sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/powder/g3-simstack-latest.md
          RUNDEST="evidence/powder/g3/${GITHUB_RUN_ID}"
          mkdir -p "$RUNDEST"
          EXPID="$(cat /tmp/powder-g3-v2/experiment_id 2>/dev/null || true)"
          EXPNAME="$(cat /tmp/powder-g3-v2/name 2>/dev/null || true)"
          STATUS="$(jq -r '.status // "unknown"' /tmp/powder-g3-v2/status.json 2>/dev/null || echo unknown)"
          PROFILE_ID="$(jq -r '.profile_id // "not_captured"' /tmp/powder-g3-v2/status.json 2>/dev/null || echo not_captured)"
          HOST="$(cat /tmp/powder-g3-v2/ssh-host 2>/dev/null || true)"; PORT="$(cat /tmp/powder-g3-v2/ssh-port 2>/dev/null || true)"
          AUTOF="$(cat /tmp/powder-g3-v2/automation-fingerprint.txt 2>/dev/null || true)"
          RUNDIR="/tmp/powder-g3-v2/wellpulse-g3-$GITHUB_RUN_ID"
          TX_RC=not_run; RX_RC=not_run; IQ_BYTES=0; IQ_SHA256=""; PROCESS_GATE=FAIL
          if [[ -f "$RUNDIR/result.env" ]]; then
            source "$RUNDIR/result.env"
            cp "$RUNDIR/result.env" "$RUNDEST/result.env"; cp "$RUNDIR/remote-meta.txt" "$RUNDEST/remote-meta.txt"
            sed -E 's/\x1B\[[0-9;]*[mK]//g' "$RUNDIR/tx.log" > "$RUNDEST/tx.log" || true
            sed -E 's/\x1B\[[0-9;]*[mK]//g' "$RUNDIR/rx.log" > "$RUNDEST/rx.log" || true
          fi
          [[ -f /tmp/powder-g3-v2/manifest-summary.json ]] && cp /tmp/powder-g3-v2/manifest-summary.json "$RUNDEST/manifest-summary.json" || true
          [[ -f /tmp/powder-g3-v2/ssh-preflight.txt ]] && cp /tmp/powder-g3-v2/ssh-preflight.txt "$RUNDEST/ssh-preflight.txt" || true
          cat > "$OUT" <<EOF
# POWDER G3 simulated-stack validation — latest

- Checked UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
- GitHub run ID: \`$GITHUB_RUN_ID\`
- GitHub SHA: \`$GITHUB_SHA\`
- Orchestration mode: **MANUAL_CREATE_PLUS_AUTOMATED_ATTACH_V2**
- Evidence class: **INFRASTRUCTURE_ONLY_NON_SCORED**
- Experiment name: \`$EXPNAME\`
- Experiment ID: \`$EXPID\`
- Last observed status: \`$STATUS\`
- Profile ID: \`$PROFILE_ID\`
- SSH endpoint: \`$HOST:$PORT\`
- Automation public-key fingerprint: \`$AUTOF\`
- Transmitter exit code: \`$TX_RC\`
- Receiver exit code: \`$RX_RC\`
- Generated simulated waveform bytes: \`$IQ_BYTES\`
- Generated simulated waveform SHA-256: \`$IQ_SHA256\`
- Process gate: **$PROCESS_GATE**
- SDR/RF used: **NO**
- WellPulse/MQTT scientific workload used: **NO**

## Evidence boundary

This run validates only the profile-authoritative file-based simulated eNodeB-to-file-to-UE path on the manually provisioned POWDER experiment. It is not RF evidence and is not a scored WP-PWD01 run.
EOF

      - name: Fail-safe terminate validated experiment
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -f /tmp/powder-g3-v2/target_validated ]]; then
            echo 'cleanup=NOT_ATTEMPTED_TARGET_NOT_VALIDATED' > /tmp/powder-g3-v2/cleanup.env
            exit 0
          fi
          EXPID="$(cat /tmp/powder-g3-v2/experiment_id)"
          set +e
          portal-cli experiment terminate --experiment-id "$EXPID" >/tmp/powder-g3-v2/terminate.out 2>/tmp/powder-g3-v2/terminate.err
          TERMRC=$?
          set -e
          echo "Termination request rc=$TERMRC"
          CLEAN=0
          for i in $(seq 1 30); do
            set +e
            portal-cli experiment get --experiment-id "$EXPID" >/tmp/powder-g3-v2/postterm.json 2>/tmp/powder-g3-v2/postterm.err
            GETRC=$?
            set -e
            if [[ "$GETRC" -ne 0 ]]; then CLEAN=1; break; fi
            ST="$(jq -r '.status // "unknown"' /tmp/powder-g3-v2/postterm.json)"
            echo "Post-terminate status: $ST"
            [[ "$ST" =~ ^(terminated|destroyed)$ ]] && { CLEAN=1; break; }
            sleep 10
          done
          [[ "$CLEAN" -eq 1 ]] && echo 'cleanup=PASS' > /tmp/powder-g3-v2/cleanup.env || { echo 'cleanup=FAIL' > /tmp/powder-g3-v2/cleanup.env; exit 20; }

      - name: Commit sanitized evidence and final verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=evidence/powder/g3-simstack-latest.md
          CLEANUP=UNKNOWN
          [[ -f /tmp/powder-g3-v2/cleanup.env ]] && source /tmp/powder-g3-v2/cleanup.env && CLEANUP="$cleanup" || true
          [[ -f "$OUT" ]] || echo '# POWDER G3 simulated-stack validation — latest' > "$OUT"
          echo "- Cleanup gate: **$CLEANUP**" >> "$OUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/powder/g3-simstack-latest.md evidence/powder/g3/
          if ! git diff --cached --quiet; then
            git commit -m 'Record POWDER G3 attach v2 evidence'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          PROCESS=FAIL
          RUNDIR="/tmp/powder-g3-v2/wellpulse-g3-$GITHUB_RUN_ID"
          [[ -f "$RUNDIR/result.env" ]] && source "$RUNDIR/result.env" && PROCESS="$PROCESS_GATE" || true
          echo "G3 process gate: $PROCESS"
          echo "G3 cleanup gate: $CLEANUP"
          [[ "$PROCESS" == PASS && "$CLEANUP" == PASS ]] || exit 30
          echo G3_SIMSTACK_PASS
