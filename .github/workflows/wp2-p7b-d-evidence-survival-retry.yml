name: WP2 P7B-D Evidence Survival Retry

on:
  push:
    branches: [main]
    paths:
      - '.wp2-p7b-d-retry-trigger'

permissions:
  contents: write
  actions: read

concurrency:
  group: wp2-p7b-d-evidence-survival
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PORTAL_HTTP: https://boss.emulab.net:43794
      PORTAL_TOKEN: ${{ secrets.POWDER_API_TOKEN }}
      POWDER_USERNAME: ${{ secrets.POWDER_USERNAME }}
      POWDER_SSH_PRIVATE_KEY: ${{ secrets.POWDER_SSH_PRIVATE_KEY }}
      POWDER_SSH_KEY_PASSPHRASE: ${{ secrets.POWDER_SSH_KEY_PASSPHRASE }}
      EXPID: 26b6f315-459d-4a56-9167-69228e339f24
      RUN_ID: wp2-p7b-c-33113016138-20260827T203140Z
      CORE_HOST: nuc1.emulab.net
      UE_HOST: nuc2.emulab.net

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Freeze same-reservation salvage authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .wp2-p7b-d-retry-trigger)" = $'execute=WP2_P7B_D_EVIDENCE_SURVIVAL_RETRY_SAME_RESERVATION\nexperiment_id=26b6f315-459d-4a56-9167-69228e339f24\nrun_id=wp2-p7b-c-33113016138-20260827T203140Z\nscientific_rerun=NO\nnew_reservation=NO\nscored=NO'
          grep -q 'P7B-D verdict: \*\*BLOCKED\*\*' evidence/powder/wp2-p7b-d-live-status.md
          echo 'P7B_D_RETRY_AUTHORITY=PASS'
          echo 'SAME_RESERVATION=YES'
          echo 'SCIENTIFIC_RERUN=NO'
          echo 'NEW_RESERVATION=NO'
          echo 'SCORED_RUN=NO'

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq openssh-client >/dev/null

      - name: Preserve all available evidence and controller pull
        id: persist
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/wp2-p7b-d2
          rm -rf "$TMP"; mkdir -p "$TMP" "$HOME/.ssh"
          umask 077
          bash scripts/wp2_portal_client_bootstrap.sh "$TMP/portal-api" | tee "$TMP/portal-pin.txt"
          grep -q '^PORTAL_API_PIN_GATE=PASS$' "$TMP/portal-pin.txt"
          portal-cli experiment get --experiment-id "$EXPID" > "$TMP/status.json"
          test "$(jq -r '.id // empty' "$TMP/status.json")" = "$EXPID"
          STATE="$(jq -r '.status // "unknown"' "$TMP/status.json")"
          echo "P7B_D_RETRY_PORTAL_STATE=$STATE"
          [[ "$STATE" =~ ^(ready|provisioned)$ ]]

          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ['POWDER_SSH_PRIVATE_KEY'].replace('\r\n','\n').replace('\r','\n').lstrip('\ufeff').strip()+"\n"
          Path('/tmp/wp2-p7b-d2/private.key').write_text(raw,encoding='utf-8',newline='\n')
          PY
          chmod 600 "$TMP/private.key"
          cat > "$TMP/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$POWDER_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$TMP/askpass"
          export SSH_ASKPASS="$TMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          setsid -w ssh-keygen -y -f "$TMP/private.key" >/dev/null </dev/null
          eval "$(ssh-agent -s)" >/dev/null
          setsid -w ssh-add "$TMP/private.key" </dev/null >/dev/null
          : > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          USER="${POWDER_USERNAME:-aayoub}"; [[ -n "$USER" ]] || USER=aayoub
          SSH=(-A -o BatchMode=yes -o IdentitiesOnly=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${SSH[@]}" "$USER@$CORE_HOST" true
          ssh "${SSH[@]}" "$USER@$UE_HOST" true
          echo 'P7B_D_RETRY_SSH_GATE=PASS'

          echo '===== ROOT-CAUSE EVIDENCE: misplaced receiver output ====='
          ssh "${SSH[@]}" "$USER@$CORE_HOST" "set +e
            BAD=\"\$HOME/WellPulse/\$HOME/wellpulse-powder-evidence/p7b/$RUN_ID-core\"
            echo MISPLACED_ROOT=\"\$BAD\"
            if test -d \"\$BAD\"; then
              find \"\$BAD\" -type f -printf '%P %s bytes\n' | sort
              echo '--- misplaced receiver events ---'
              cat \"\$BAD/cells/P7B-B1-S3/receiver/receiver_events.jsonl\" 2>/dev/null || true
              echo '--- misplaced telemetry ledger ---'
              head -20 \"\$BAD/cells/P7B-B1-S3/receiver/telemetry_received.csv\" 2>/dev/null || true
            else
              echo MISPLACED_ROOT_NOT_FOUND
            fi
            echo '--- broker proof ---'
            tail -80 /tmp/wellpulse-p7b-broker/mosquitto.log 2>/dev/null || true"

          PDIR="/proj/WellPulse/evidence-escrow/$EXPID/$RUN_ID"
          persist_required(){
            local host=$1 rel=$2 arm=$3
            ssh "${SSH[@]}" "$USER@$host" "set -euo pipefail
              SRC=\"\$HOME/$rel\"; DST='$PDIR/$arm'
              test -d \"\$SRC\"; test -n \"\$(find \"\$SRC\" -type f -print -quit)\"
              rm -rf \"\$DST\"; mkdir -p \"\$DST/raw\"
              (cd \"\$SRC\" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > \"\$DST/SOURCE_SHA256SUMS\"
              (cd \"\$SRC\" && find . ! -type f ! -type d -printf '%y %p -> %l\n' | sort) > \"\$DST/SOURCE_NONREGULAR_FILES.txt\"
              rsync -a --no-specials --no-devices \"\$SRC/\" \"\$DST/raw/\"
              (cd \"\$DST/raw\" && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
              printf 'source=%s\narm=%s\nexperiment_id=%s\nrun_id=%s\n' \"\$SRC\" '$arm' '$EXPID' '$RUN_ID' > \"\$DST/ESCROW_METADATA.txt\"
              echo PERSIST_${arm}=PASS"
          }
          persist_required "$UE_HOST" "wellpulse-powder-evidence/p7b/$RUN_ID" ue | tee "$TMP/ue.txt"
          persist_required "$CORE_HOST" "wellpulse-powder-evidence/p7b/$RUN_ID-core" core | tee "$TMP/core.txt"
          grep -q '^PERSIST_ue=PASS$' "$TMP/ue.txt"
          grep -q '^PERSIST_core=PASS$' "$TMP/core.txt"

          # Preserve the receiver's accidentally literal-$HOME output if present.
          ssh "${SSH[@]}" "$USER@$CORE_HOST" "set -euo pipefail
            SRC=\"\$HOME/WellPulse/\$HOME/wellpulse-powder-evidence/p7b/$RUN_ID-core\"
            DST='$PDIR/core_misplaced_receiver'
            rm -rf \"\$DST\"
            if test -d \"\$SRC\" && test -n \"\$(find \"\$SRC\" -type f -print -quit)\"; then
              mkdir -p \"\$DST/raw\"
              (cd \"\$SRC\" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > \"\$DST/SOURCE_SHA256SUMS\"
              rsync -a --no-specials --no-devices \"\$SRC/\" \"\$DST/raw/\"
              (cd \"\$DST/raw\" && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
              echo PRESENT > \"\$DST/STATUS\"
              echo PERSIST_core_misplaced_receiver=PASS
            else
              mkdir -p \"\$DST\"; echo ABSENT > \"\$DST/STATUS\"; echo PERSIST_core_misplaced_receiver=ABSENT
            fi" | tee "$TMP/misplaced.txt"

          ssh "${SSH[@]}" "$USER@$UE_HOST" "set -euo pipefail
            (cd '$PDIR/ue/raw' && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
            (cd '$PDIR/core/raw' && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
            if test -s '$PDIR/core_misplaced_receiver/SOURCE_SHA256SUMS'; then (cd '$PDIR/core_misplaced_receiver/raw' && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null); fi
            printf 'EVIDENCE_ESCROW_GATE=PASS\nTEARDOWN_AUTHORIZED=PENDING_OFFPOWDER_READBACK\n' > '$PDIR/PERSISTENT_ESCROW_GATE.PASS'
            tar -C '$PDIR' -cf - ." > "$TMP/persistent-stream.tar"

          mkdir -p "$TMP/controller"
          tar -C "$TMP/controller" -xf "$TMP/persistent-stream.tar"
          (cd "$TMP/controller/ue/raw" && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
          (cd "$TMP/controller/core/raw" && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null)
          if test -s "$TMP/controller/core_misplaced_receiver/SOURCE_SHA256SUMS"; then (cd "$TMP/controller/core_misplaced_receiver/raw" && sha256sum -c ../SOURCE_SHA256SUMS >/dev/null); fi
          echo 'P7B_D_CONTROLLER_PULL_GATE=PASS'

          BUNDLE="$TMP/wp2-p7b-d-$RUN_ID.tar"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$TMP/controller" -cf "$BUNDLE" .
          SHA="$(sha256sum "$BUNDLE" | awk '{print $1}')"; BYTES="$(stat -c%s "$BUNDLE")"
          test -s "$BUNDLE"; [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]
          echo "bundle_path=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "bundle_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "P7B_D_BUNDLE_SHA256=$SHA"
          echo "P7B_D_BUNDLE_BYTES=$BYTES"

      - name: Upload immutable evidence bundle
        id: upload
        if: steps.persist.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp2-p7b-d-${{ github.run_id }}
          path: ${{ steps.persist.outputs.bundle_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Independent download
        id: download
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wp2-p7b-d-${{ github.run_id }}
          path: /tmp/wp2-p7b-d2-roundtrip

      - name: Verify round-trip and teardown exact reservation
        id: finalize
        if: steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.persist.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          ROUNDTRIP="$(find /tmp/wp2-p7b-d2-roundtrip -type f -name '*.tar' | head -1)"
          test -s "$ROUNDTRIP"
          test "$(sha256sum "$ROUNDTRIP" | awk '{print $1}')" = "$EXPECTED_SHA"
          rm -rf /tmp/wp2-p7b-d2-verified; mkdir -p /tmp/wp2-p7b-d2-verified
          tar -C /tmp/wp2-p7b-d2-verified -xf "$ROUNDTRIP"
          (cd /tmp/wp2-p7b-d2-verified/ue/raw && sha256sum -c ../SOURCE_SHA256SUMS)
          (cd /tmp/wp2-p7b-d2-verified/core/raw && sha256sum -c ../SOURCE_SHA256SUMS)
          if test -s /tmp/wp2-p7b-d2-verified/core_misplaced_receiver/SOURCE_SHA256SUMS; then (cd /tmp/wp2-p7b-d2-verified/core_misplaced_receiver/raw && sha256sum -c ../SOURCE_SHA256SUMS); fi
          test -s /tmp/wp2-p7b-d2-verified/PERSISTENT_ESCROW_GATE.PASS
          echo 'CONTROLLER_OFFPOWDER_GATE=PASS'
          echo 'EVIDENCE_ESCROW_GATE=PASS'
          echo 'TEARDOWN_AUTHORIZED=YES'
          echo '===== INDEPENDENT READ-BACK: receiver evidence ====='
          cat /tmp/wp2-p7b-d2-verified/core_misplaced_receiver/raw/cells/P7B-B1-S3/receiver/receiver_events.jsonl 2>/dev/null || true

          bash scripts/wp2_portal_client_bootstrap.sh /tmp/wp2-p7b-d2-portal >/tmp/wp2-p7b-d2-portal-pin.txt
          grep -q '^PORTAL_API_PIN_GATE=PASS$' /tmp/wp2-p7b-d2-portal-pin.txt
          portal-cli experiment terminate --experiment-id "$EXPID" >/tmp/wp2-p7b-d2-terminate.json 2>/tmp/wp2-p7b-d2-terminate.err || true
          TERMINATED=0
          for i in $(seq 1 60); do
            set +e; portal-cli experiment get --experiment-id "$EXPID" >/tmp/wp2-p7b-d2-postterm.json 2>/dev/null; rc=$?; set -e
            if [[ "$rc" -ne 0 ]]; then TERMINATED=1; echo "P7B_D_TERMINATION_POLL_${i}=NOT_FOUND"; break; fi
            st="$(jq -r '.status // "unknown"' /tmp/wp2-p7b-d2-postterm.json)"; echo "P7B_D_TERMINATION_POLL_${i}=$st"
            if [[ "$st" =~ ^(terminated|destroyed)$ ]]; then TERMINATED=1; break; fi
            sleep 5
          done
          test "$TERMINATED" = 1
          echo 'TEARDOWN_CONFIRMED=YES'
          echo 'WP2_P7B_D=PASS_EVIDENCE_SURVIVAL_READBACK_TEARDOWN'

      - name: Record sanitized status
        if: always()
        shell: bash
        env:
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          BUNDLE_SHA: ${{ steps.persist.outputs.bundle_sha256 }}
          BUNDLE_BYTES: ${{ steps.persist.outputs.bundle_bytes }}
        run: |
          set -euo pipefail
          if [[ "$FINALIZE_OUTCOME" == success ]]; then VERDICT=PASS_EVIDENCE_SURVIVAL_READBACK_TEARDOWN; TEARDOWN=YES; else VERDICT=BLOCKED; TEARDOWN=NO_OR_UNCONFIRMED; fi
          cat > evidence/powder/wp2-p7b-d-live-status.md <<EOF
          # WP2-P7B-D Evidence Survival — latest

          - Checked UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Source SHA: \`$GITHUB_SHA\`
          - GitHub run: \`$GITHUB_RUN_ID\`
          - Experiment UUID: \`$EXPID\`
          - P7B-C run ID: \`$RUN_ID\`
          - Evidence class: **NON-SCORED PRE-SCORE PHYSICAL QUALIFICATION**
          - P7B-C retained verdict: **BLOCKED: RECEIVER_CONNECT_TIMEOUT**
          - Root cause classification: **orchestration path quoting defect; broker proves receiver connected/subscribed while wait loop watched a different path**
          - P7B-D verdict: **$VERDICT**
          - Persistent escrow outcome: **$PERSIST_OUTCOME**
          - GitHub artifact upload outcome: **$UPLOAD_OUTCOME**
          - Independent artifact download outcome: **$DOWNLOAD_OUTCOME**
          - Round-trip + teardown outcome: **$FINALIZE_OUTCOME**
          - Outer TAR SHA-256: \`${BUNDLE_SHA:-UNAVAILABLE}\`
          - Outer TAR bytes: \`${BUNDLE_BYTES:-UNAVAILABLE}\`
          - Teardown confirmed: **$TEARDOWN**
          - P7B-E: **NOT STARTED**
          - Scored authorization: **BLOCKED**
          - \`scored_runs_authorized=false\`
          EOF
          cat evidence/powder/wp2-p7b-d-live-status.md

      - name: Commit sanitized status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/powder/wp2-p7b-d-live-status.md
          git commit -m "Record P7B-D evidence survival retry status" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Enforce P7B-D verdict
        if: always()
        shell: bash
        env:
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -euo pipefail
          test "$FINALIZE_OUTCOME" = success
          echo 'WP2_P7B_D=PASS_EVIDENCE_SURVIVAL_READBACK_TEARDOWN'
          echo 'P7B_E=NOT_STARTED'
          echo 'SCORED_AUTHORIZATION=BLOCKED'
