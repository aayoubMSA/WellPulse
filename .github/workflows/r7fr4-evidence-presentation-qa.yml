name: WellPulse R7f-R4 Evidence Presentation QA

on:
  pull_request:
    paths:
      - ".github/workflows/r7fr4-evidence-presentation-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact R7f-R4 authority
        uses: actions/checkout@v4
        with:
          ref: ef2902e545668516ad30e1cd95751aecad314281
          persist-credentials: false

      - name: Static science-lock and evidence-presentation gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import math,re
          from pathlib import Path

          old=Path("manuscript/revival_2026-09-22/WellPulse_Revival_R7fR3_ReproSurface_20260922.tex").read_text(encoding="utf-8")
          new=Path("manuscript/revival_2026-09-22/WellPulse_Revival_R7fR4_EvidencePresentation_20260922.tex").read_text(encoding="utf-8")

          # Scientific prose before Methods and from Discussion onward remains byte-locked.
          begin="\\begin{document}"
          proto="\\section{Recovery Observables and Experimental Protocol}"
          discussion="\\section{Discussion}"
          assert old[old.index(begin):old.index(proto)] == new[new.index(begin):new.index(proto)], "front matter/introduction changed"
          assert old[old.index(discussion):] == new[new.index(discussion):], "Discussion onward changed"

          # Existing method content from execution configuration through Results remains byte-identical.
          exec_anchor="\\subsection{Execution configuration and code authority}"
          results="\\section{Results}"
          assert old[old.index(exec_anchor):old.index(results)] == new[new.index(exec_anchor):new.index(results)], "existing Methods content changed"

          low=new.lower()

          # Coverage matrix.
          required_coverage=[
            "campaign-by-observable coverage",
            "m0--m5 observability across the three evidence classes",
            "no dedicated post-restoration user-plane probe",
            "publisher reconnect/session-restoration duration",
            "retrospectively reclassified as broker-hop rather than receiver completion",
            "end state only; 10,000/10,000 reconciliation",
            "relation to m2 unresolved in 3/3 runs",
            "no historical fit ordering claim retained",
            "no stale-arrival event and no causal witness in 3/3",
            "seq251--255 before seq231",
          ]
          for x in required_coverage:
              assert x in low, x

          # Historical C1/C2 split; derive means from the frozen per-run values.
          c1=[68.992,69.466,68.944]
          c2=[68.785,70.264,68.852]
          assert math.isclose(sum(c1)/3,69.134,abs_tol=0.0005)
          assert math.isclose(sum(c2)/3,69.30033333333334,abs_tol=1e-12)
          for v in c1+c2:
              assert f"{v:.3f}" in new
          for token in [
            "C1 & 68.992, 69.466, 68.944 & 69.134 & 68.944--69.466",
            "C2 & 68.785, 70.264, 68.852 & 69.300 & 68.785--70.264",
            "publisher reconnect means were 1.317~s for C1 and 1.345~s for C2",
            "Means are descriptive; C1 and C2 are not pooled for condition-level inference",
          ]:
              assert token in new, token

          # Figure must encode known source order and unresolved M2/M3 evidence.
          fig_required=[
            "\\begin{figure*}[t]",
            "Frozen W1 source-side execution order",
            "M4 = source-generation gap seq5000$\\rightarrow$seq5001",
            "Observed M4: historical C1 mean 69.134~s; C2 mean 69.300~s; prospective C1 74.798--76.308~s",
            "Prospective $D_{23}=M3-M2$ adjudication",
            "-5.038/4.801",
            "-4.857/4.932",
            "-4.858/4.815",
            "3/3 intervals cross zero",
            "0/3 causal witnesses",
            "M3 is deliberately not placed after M2 on the source timeline",
            "does not encode an unsupported M2-before-M3 ordering",
          ]
          for x in fig_required:
              assert x in new, x

          # Frozen quantitative anchors remain.
          for x in [
            "68.785--70.264","69.217",
            "74.798--76.308","75.438",
            "0/3","3/3 unresolved",
            "10,000/10,000",
            "$[-5.038,\\,+4.801]$",
            "$[-4.857,\\,+4.932]$",
            "$[-4.858,\\,+4.815]$",
          ]:
              assert x.lower() in low, x

          # Bibliography unchanged at 14 items.
          old_bibs=re.findall(r"\\bibitem\{([^}]*)\}",old)
          new_bibs=re.findall(r"\\bibitem\{([^}]*)\}",new)
          assert old_bibs == new_bibs and len(new_bibs)==14

          # Claim firewall.
          for x in [
            "novel recovery architecture",
            "68 s receiver completion",
            "68 s end-to-end recovery",
            "endpoint misclassification was repeatedly demonstrated",
            "to our knowledge",
          ]:
              assert x not in low, x

          assert "\\usepackage{tikz}" in new
          assert new.count("\\begin{figure") >= 1
          assert new.count("\\begin{table") >= old.count("\\begin{table") + 2

          print("R7FR4_COVERAGE_MATRIX=PASS")
          print("R7FR4_C1_C2_SPLIT=PASS")
          print("R7FR4_EVIDENCE_FIGURE=PASS")
          print("R7FR4_SCIENCE_LOCK=PASS")
          PY

      - name: Install LaTeX and inspection tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-publishers latexmk poppler-utils >/dev/null

      - name: Compile exact R7f-R4 source
        shell: bash
        working-directory: manuscript/revival_2026-09-22
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error WellPulse_Revival_R7fR4_EvidencePresentation_20260922.tex
          test -s WellPulse_Revival_R7fR4_EvidencePresentation_20260922.pdf
          ! grep -q "Undefined control sequence" WellPulse_Revival_R7fR4_EvidencePresentation_20260922.log
          ! grep -q "LaTeX Error" WellPulse_Revival_R7fR4_EvidencePresentation_20260922.log
          ! grep -q "Citation .* undefined" WellPulse_Revival_R7fR4_EvidencePresentation_20260922.log
          ! grep -q "There were undefined references" WellPulse_Revival_R7fR4_EvidencePresentation_20260922.log
          if grep -Fq 'Overfull \hbox' WellPulse_Revival_R7fR4_EvidencePresentation_20260922.log; then
            echo "overfull box detected" >&2
            grep -F 'Overfull \hbox' WellPulse_Revival_R7fR4_EvidencePresentation_20260922.log
            exit 4
          fi
          pdfinfo WellPulse_Revival_R7fR4_EvidencePresentation_20260922.pdf | tee R7fR4_pdfinfo.txt
          pdftotext WellPulse_Revival_R7fR4_EvidencePresentation_20260922.pdf R7fR4_rendered.txt
          python3 - <<'PY'
          from pathlib import Path
          text=" ".join(Path("R7fR4_rendered.txt").read_text(errors="replace").split())
          for phrase in [
              "Campaign-by-observable coverage",
              "69.134",
              "69.300",
              "74.798",
              "76.308",
              "3/3 UNRESOLVED",
          ]:
              assert phrase in text, phrase
          print("R7FR4_RENDERED_TEXT=PASS")
          PY

      - name: Hash accepted build
        shell: bash
        run: |
          set -euo pipefail
          cd manuscript/revival_2026-09-22
          sha256sum             WellPulse_Revival_R7fR4_EvidencePresentation_20260922.tex             WellPulse_Revival_R7fR4_EvidencePresentation_20260922.pdf             | tee R7fR4_BUILD_SHA256SUMS.txt

      - name: Upload R7f-R4 QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wellpulse-r7fr4-evidence-qa-${{ github.run_id }}
          path: |
            manuscript/revival_2026-09-22/WellPulse_Revival_R7fR4_EvidencePresentation_20260922.tex
            manuscript/revival_2026-09-22/WellPulse_Revival_R7fR4_EvidencePresentation_20260922.pdf
            manuscript/revival_2026-09-22/R7fR4_BUILD_SHA256SUMS.txt
            manuscript/revival_2026-09-22/R7fR4_pdfinfo.txt
          retention-days: 30

      - name: Summarize
        run: |
          echo "R7FR4_MACHINE_QA=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact authority: ef2902e545668516ad30e1cd95751aecad314281" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage matrix + split C1/C2 summary + evidence-faithful vector figure passed." >> "$GITHUB_STEP_SUMMARY"
